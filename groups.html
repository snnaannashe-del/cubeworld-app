<!--
  ГРУППЫ.

  Два списка: «Все группы» (/groups) и «Мои группы» (/groups/my). Поиск
  по всем — /groups/search. Внутри группы — переписка
  (/groups/{id}/messages).

  Картинку группы тянем запросом с ключом и показываем из памяти
  браузера: к адресу /groups/{id}/avatar браузер сам ключ не приложит,
  и в <img src> она бы просто не открылась.

  Кнопка справа у каждой строки честно показывает, что будет: «Открыть»
  для своих, «Войти» для чужих. Нажатие на чужую группу сперва вступает
  (POST /groups/{id}/join), и только потом открывает — иначе человек
  попадал бы в переписку, не состоя в группе, и первое же сообщение
  отлетало бы с отказом.
-->
<style>
/* ── шапка ───────────────────────────────────────────────────────────
   Шапка раздела и кругляши — общие, они в оболочке, и у групп своих
   правил для них больше нет.

   Было два расхождения с чатами, и оба лезли в глаза. Первое: отступ
   под шапкой стоял 4 точки — список начинался почти вплотную к
   заголовку, тогда как в чатах там дышит 18. Второе: кругляши в шапке
   групп были 34 вместо 32 «потому что рядом ＋». Из-за этих двух точек
   шапка была выше чатовской, и всё под ней — поле поиска, карточка
   списка — стояло не на тех строках, что в чатах.

   Теперь ни одного своего правила: кругляши 32, отступ 18 — всё из
   оболочки, ровно как в чатах. Проверку на совпадение держит
   списки_тест.py. */

/* ── вкладки ─────────────────────────────────────────────────────── */
/* Черты под вкладками нет нарочно: она делила окно пополам там, где
   делить нечего, — список и так начинается ниже. */
.вкладки-групп{ gap:10px; }
.вкладки-групп .вк-ряд{
  margin-inline-start:auto; display:flex; align-items:center; gap:18px;
}
.вкладка-г{
  background:none; border:none; cursor:pointer; padding:7px 2px;
  font-size:0.9333rem; color:var(--текст3); position:relative;
}
.вкладка-г:hover{ color:var(--текст2); }
.вкладка-г.тут{ color:var(--синий); font-weight:600; }
.вкладка-г.тут::after{
  content:''; position:absolute; left:0; right:0; bottom:0; height:2px;
  background:var(--синий); border-radius:2px;
}

/* Разделитель «Ещё на площадке»: ниже него то, чего не было в списке,
   а нашёл сервер. Без подписи человек решил бы, что он уже состоит в
   этих группах. */
/* Теперь этот разделитель стоит внутри карточки списка, а не между
   двумя кусками окна, — значит и выглядеть он должен полосой внутри
   неё, с теми же отступами, что у строк. */
.раздел-поиска{
  margin:0; padding:9px 16px; font-size:0.8rem; font-weight:700;
  text-transform:uppercase; letter-spacing:.07em; color:var(--текст3);
  background:var(--поле); border-bottom:1px solid var(--край);
}

/* ── поиск ───────────────────────────────────────────────────────────
   Своей строки поиска у групп больше нет, и правил для неё здесь тоже
   нет. Была — и в ней стояли свои отступы: 16 сверху, 4 снизу. Когда
   поиск открывался, над полем зияло вчетверо больше, чем под ним, —
   это Анна и увидела. Плюс это был второй набор правил для того же
   самого поля: в чатах оно уже есть и называется «.поиск-строка» в
   оболочке. Теперь группы берут его целиком, вместе с отступом 18
   сверху и снизу. */

/* ── СПИСОК ГРУПП — ТА ЖЕ КАРТОЧКА, ЧТО В ЧАТАХ ───────────────────

   Было: строки шли прямо по окну, разделённые чертой, и кружок группы
   был на треть крупнее, чем лицо человека в чатах. Два списка одного
   вида выглядели как из разных программ.

   Стало: ровно те же мерки, что у «.переписки» и «.переписка» в
   chats.html — рамка вокруг всего списка, скругление 14, строка в
   70 точек (14 сверху + 42 кружок + 14 снизу) и кружок в 42 точки со
   значком в 17. Правило простое и прежнее: лента, чаты и группы — одно
   и то же, разное только содержимое. */
.список-групп{
  border:1px solid var(--край); border-radius:14px;
  overflow:hidden; background:var(--окно);
}
/* Пусто — это надпись посреди пустого места, а не пустая карточка с
   рамкой. Так же сделано в чатах. */
/* Пустая надпись стоит посреди свободного места, а не жмётся к
   верхнему краю: пустой список - это не строка списка, это сообщение
   на весь отведённый лист. Та же мера и в чатах. */
.список-групп.пусто{
  border:none; background:none;
  flex:1 1 auto; display:flex; align-items:center; justify-content:center;
  min-height:48vh;
}

.группа{
  display:flex; align-items:center; gap:13px; width:100%;
  padding:14px 16px; border-bottom:1px solid var(--край);
}
.группа:last-child{ border-bottom:none; }
.группа:hover{ background:var(--поле); }
.группа .картинка{
  width:42px; height:42px; flex:0 0 42px; border-radius:50%;
  /* Та же краска, что у всех заглушек программы (shared/style.css,
     --лицо-заливка и --лицо-краска). Свой тёмно-синий сход здесь и
     делал кружок группы единственным, который не поменял цвет. */
  background:var(--лицо-заливка); color:var(--лицо-краска);
  display:flex; align-items:center; justify-content:center;
  font-size:1.0667rem; overflow:hidden;
}
.группа .картинка img{ width:100%; height:100%; object-fit:cover; display:block; }
/* Наш знак вместо смайла: размер задаём здесь, чтобы он не зависел от
   font-size кружка, который стоит ради смайлов без нашей пары. */
.группа .картинка svg{ width:17px; height:17px; }
.группа .про{ flex:1; min-width:0; }
.группа .имя{ font-size:0.9667rem; font-weight:600; }
.группа .под{
  display:flex; align-items:center; gap:6px;
  margin-top:3px; font-size:0.8667rem; color:var(--текст3);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.группа .под svg{ width:13px; height:13px; flex:0 0 13px; }
.группа .справа{ flex:0 0 auto; text-align:end; }
/* Правый столбец должен уложиться в те же 42 точки, что и кружок, —
   иначе строка вырастает выше чатовской, и два списка снова разные.
   Считается так: 12 (число участников) + 3 (отступ) + 25 (кнопка) = 40. */
.группа .сколько{ font-size:0.7667rem; color:var(--текст3); margin-bottom:3px;
  line-height:1.1; }
.кн-открыть{
  cursor:pointer; white-space:nowrap; font-size:0.8rem; font-weight:600;
  border-radius:9px; padding:5px 13px; line-height:1.2;
  border:1px solid rgba(52,211,153,.45); background:rgba(52,211,153,.08);
  color:var(--зелёный);
}
.кн-открыть:hover{ border-color:var(--зелёный); color:#fff; }
.кн-открыть.войти{
  border-color:rgba(74,158,255,.45); background:rgba(0,153,255,.1); color:#9ec9ff;
}
.кн-открыть:disabled{ opacity:.5; cursor:default; }

/* ── переписка группы ────────────────────────────────────────────────
   Окно переписки, лента пузырей и менюшка ввода переехали в оболочку:
   они одинаковые у групп, чатов и избранного. */

/* ── окно создания ─────────────────────────────────────────────────
   Само окно, подложка и поля живут в оболочке: они общие трём экранам.
   Здесь только то, что нужно одним группам. */
.окно{ max-width:460px; }
.знаки{ display:flex; gap:8px; flex-wrap:wrap; }
.знаки button{
  width:42px; height:42px; border-radius:11px; cursor:pointer; font-size:1.2667rem;
  border:1px solid var(--край); background:var(--фон);
}
.знаки button.выбран{ border-color:var(--синий); background:rgba(0,153,255,.12); }
.окно .кнопки{ display:flex; gap:10px; margin-top:20px; }
.окно .кнопки .кнопка{ flex:1; padding:13px; }
</style>

<script>
'use strict';

CW.оболочка('groups').then(function (место) {

var С = { все: [], мои: [], нашлось: [], вкладка: 'мои', ищем: '', искать: false };

var две = document.createElement('div');
две.className = 'две-колонки';
место.appendChild(две);

var левая = document.createElement('div');
/* Содержимое раздела стоит в скруглённой рамке — той же, что у
   колонки ленты. Разница одна и нарочная: у ленты внутри чёрное, там
   ждут ролик, а здесь фон тот же, что у окна: это список, а не экран
   показа. */
левая.className = 'левая в-рамке';
две.appendChild(левая);

var правая = document.createElement('div');
правая.className = 'правая';
две.appendChild(правая);
правая.appendChild(CW.полка());

/* Своих окон у групп больше нет: создание переехало в modals/,
   переписка — в windows/group.html. Здесь остался только список. */

CW.ждём(левая);
загрузить();

/* ═══════════════════════════════════════════════════════════════════════
   ЗАГРУЗКА
   ═══════════════════════════════════════════════════════════════════════ */
function загрузить() {
  Promise.all([
    CW.спросить('/groups',    { сроком: 20000 }),
    CW.спросить('/groups/my', { тихо: true })
  ]).then(function (о) {
    С.все = список(о[0]);
    С.мои = список(о[1]);
    /* Если своих нет, показывать пустую вкладку незачем — открываем все. */
    if (!С.мои.length) С.вкладка = 'все';
    показатьСписок();
  }).catch(function (е) {
    левая.innerHTML = '';
    var б = document.createElement('div');
    б.className = 'беда';
    б.textContent = е.сеть ? Т('Нет связи с сервером') : (е.message || Т('Не вышло получить группы'));
    левая.appendChild(б);
  });
}

function список(о) {
  if (!о) return [];
  if (Array.isArray(о)) return о;
  return о.items || о.groups || [];
}

function кусок(класс, внутри) { return CW.кусок(класс, внутри); }

/* ═══════════════════════════════════════════════════════════════════════
   СПИСОК
   ═══════════════════════════════════════════════════════════════════════ */
function показатьСписок() {
  левая.innerHTML = '';

  /* Одна строка на всё: слева название и плюс, справа — «Все группы»,
     «Мои группы» и лупа. Отдельная полоса под заголовком занимала
     высоту ради трёх кнопок, которые прекрасно помещаются рядом с
     названием. Черты под ними тоже нет: выбранную вкладку видно по
     цвету и по синей чёрточке под самим словом. */
  var шапка = кусок('раздел-верх вкладки-групп',
      '<h1>' + CW.безопасно(Т('Группы')) + '</h1>'
    + '<button class="кругляш" id="кн-новая" title="' + CW.безопасно(Т('Создать группу')) + '">'
    +   CW.значок('плюс') + '</button>'
    + '<span class="вк-ряд">'
    +   '<button class="вкладка-г" data-в="все">' + CW.безопасно(Т('Все группы')) + '</button>'
    +   '<button class="вкладка-г" data-в="мои">' + CW.безопасно(Т('Мои группы')) + '</button>'
    +   '<button class="кругляш лупа" id="кн-искать" title="' + CW.безопасно(Т('Поиск')) + '">'
    +     CW.значок('лупа') + '</button>'
    + '</span>');
  шапка.querySelector('#кн-новая').onclick = function(){ CW.открыть('create-group', { потом: function(){ С.вкладка='мои'; загрузить(); } }); };
  левая.appendChild(шапка);

  var вкладки = шапка;
  вкладки.querySelectorAll('[data-в]').forEach(function (б) {
    var имя = б.getAttribute('data-в');
    б.classList.toggle('тут', С.вкладка === имя);
    б.onclick = function () { С.вкладка = имя; показатьСписок(); };
  });
  вкладки.querySelector('#кн-искать').onclick = function () {
    С.искать = !С.искать;
    показатьСписок();
    if (С.искать) { var п = document.getElementById('поиск-групп'); if (п) п.focus(); }
  };

  /* Поле поиска общее со всей программой: его собирает
     CW.строкаПоиска, вид лежит один раз в shell.css. Своей разметки
     здесь нет нарочно — иначе поиск в группах однажды станет не таким,
     как в чатах. */
  var где = кусок('список-групп');
  где.id = 'список-групп';

  var поиск = CW.строкаПоиска({
    подпись: Т('Название группы…'),
    значение: С.ищем,
    спрятан: !С.искать,
    стереть: true,
    искать: function (текст) {
      С.ищем = текст;
      нарисовать(где);
      clearTimeout(часыПоиска);
      if (С.ищем.length < 2) { С.нашлось = []; return; }
      часыПоиска = setTimeout(спроситьСервер, 300);
    }
  });
  поиск.поле.id = 'поиск-групп';
  левая.appendChild(поиск);
  левая.appendChild(где);

  нарисовать(где);
}

/* ═══════════════════════════════════════════════════════════════════════
   ПОИСК: СНАЧАЛА СВОИ, ПОТОМ ВСЕ ОСТАЛЬНЫЕ

   Строка отбирает то, что уже на экране, — это мгновенно и без сети.
   Но на экране лежит одна страница списка, а групп на площадке больше.
   Поэтому через треть секунды тишины тот же запрос уходит на сервер,
   и то, чего в списке не было, встаёт ниже отдельным разделом.

   Прежде здесь был только отбор по загруженному. В начале файла при
   этом написано «Поиск по всем — /groups/search», и это была неправда:
   группу, не попавшую в первую страницу, найти было нельзя вообще.
   ═══════════════════════════════════════════════════════════════════════ */
var часыПоиска = null;

function спроситьСервер() {
  var что = С.ищем;
  CW.спросить('/groups/search?q=' + encodeURIComponent(что), { тихо: true })
    .then(function (д) {
      if (что !== С.ищем) return;          /* человек успел дописать */
      С.нашлось = список(д);
      var где = document.getElementById('список-групп');
      if (где) нарисовать(где);
    })
    .catch(function () { /* нет ответа — остаётся отбор по своему списку */ });
}

function нарисовать(где) {
  var ряды = (С.вкладка === 'мои' ? С.мои : С.все);
  var свои = [];

  if (С.ищем) {
    var что = CW.ровно(С.ищем);
    свои = ряды.filter(function (г) {
      return CW.ровно(г.name).indexOf(что) >= 0
          || CW.ровно(г.description).indexOf(что) >= 0;
    });
  } else {
    свои = ряды;
  }

  /* Чего не было в списке — то с сервера. Повторы убираем по номеру:
     одна и та же группа не должна стоять в обоих разделах. */
  var чужие = [];
  if (С.ищем) {
    var уже = {};
    свои.forEach(function (г) { уже[г.id] = 1; });
    чужие = (С.нашлось || []).filter(function (г) { return !уже[г.id]; });
  }

  где.innerHTML = '';
  где.classList.remove('пусто');
  if (!свои.length && !чужие.length) {
    где.classList.add('пусто');
    /* Одна короткая строка посреди пустого места. Длинное объяснение
       «Загляни во Все группы или создай свою» человек читает один раз,
       а видит каждый раз, когда групп нет; а что делать - написано на
       кнопке ＋ прямо над списком. */
    где.appendChild(кусок('пусто-строка',
      Т(С.ищем ? 'Ничего не нашлось' : 'Групп нет')));
    return;
  }

  свои.forEach(function (г) { где.appendChild(строка(г)); });

  if (чужие.length) {
    где.appendChild(кусок('раздел-поиска', Т('Ещё на площадке')));
    чужие.forEach(function (г) { где.appendChild(строка(г)); });
  }
}

/* Лицо группы — тот значок, который выбрал хозяин, и в его цвете.
   Своим знаком линиями смайл больше не подменяем: человек выбирал
   яблоко, а в списке оказывалась коробка. Красим фильтром — цветной
   смайл это картинка в шрифте, и «color» ей не указ. */
function лицоГруппы(г) {
  var з = г.icon || '👥';
  var ц = г.icon_color || '';
  return '<span' + (ц && CW.тонЗнака ? ' style="filter:' + CW.тонЗнака(ц) + '"' : '')
       + '>' + CW.безопасно(з) + '</span>';
}

function строка(г) {
  var свой = !!(г.is_member || С.вкладка === 'мои');
  var сколько = Number(г.member_count || 0);

  var у = кусок('группа',
      '<span class="картинка">' + лицоГруппы(г) + '</span>'
    + '<span class="про">'
    +   '<div class="имя">' + CW.безопасно(г.name || Т('Без названия')) + '</div>'
    +   '<div class="под">' + CW.значок('люди') + '<span>'
    +     (г.description ? CW.безопасно(г.description)
                         : (сколько + ' ' + склонение(сколько))) + '</span></div>'
    + '</span>'
    + '<span class="справа">'
    +   '<div class="сколько">' + Т.с('{н} уч.', { н: сколько }) + '</div>'
    +   '<button class="кн-открыть' + (свой ? '' : ' войти') + '">'
    +     CW.безопасно(Т(свой ? 'Открыть' : 'Войти')) + '</button>'
    + '</span>');

  if (CW.лица) CW.лица.группа(у.querySelector('.картинка'), г.id, г.avatar_ver);

  у.querySelector('button').onclick = function (е) {
    войтиИлиОткрыть(г, е.currentTarget);
  };
  return у;
}

function склонение(н) {
  return CW.склонение(н, 'участник', 'участника', 'участников');
}

/* Картинку группы ставит общий склад лиц (shared/лица.js) — тот же,
   что ставит лица людей. Своего загрузчика здесь больше нет: он тянул
   картинку запросом с ключом, складывал её в blob и терял эту память
   при каждом возврате на страницу, поэтому значки групп появлялись
   заново и с опозданием. Теперь это обычный <img> с нашего сервера:
   браузер держит его сутки и показывает мгновенно. */

/* ═══════════════════════════════════════════════════════════════════════
   ВХОД В ГРУППУ
   ═══════════════════════════════════════════════════════════════════════ */
function войтиИлиОткрыть(г, кнопка) {
  var свой = !!(г.is_member || С.вкладка === 'мои');
  if (свой) { открыть(г); return; }

  кнопка.disabled = true;
  кнопка.textContent = Т('Вхожу…');
  CW.спросить('/groups/' + г.id + '/join', { способ: 'POST', сроком: 20000 })
    .then(function () {
      г.is_member = 1;
      С.мои.push(г);
      открыть(г);
    })
    .catch(function (е) {
      кнопка.disabled = false;
      кнопка.textContent = Т('Войти');
      CW.сказать(е.сеть ? Т('Нет связи с сервером') : (е.message || Т('Не вышло войти')));
    });
}

/* ═══════════════════════════════════════════════════════════════════════
   ПЕРЕПИСКА ГРУППЫ
   ═══════════════════════════════════════════════════════════════════════ */
/* ═══════════════════════════════════════════════════════════════════════
   ОТКРЫТЬ ГРУППУ

   Переписка группы — отдельное окно со своим адресом
   (windows/group.html). Раньше она жила здесь, в левой колонке, и это
   стоило двух неприятностей: перезагрузка возвращала в список вместо
   разговора, а на группу нельзя было дать ссылку.
   ═══════════════════════════════════════════════════════════════════════ */
function открыть(г) {
  CW.уйти(CW.окно('group') + '?id=' + (г && г.id != null ? г.id : г));
}

/* Создание группы — общая модалка (modals/create-group.js). Жило
   здесь и потому открывалось только отсюда; а создать группу хочется
   и из поиска, когда её там не нашлось. */
});
</script>
