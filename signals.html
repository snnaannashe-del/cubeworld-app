<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>Сигналы · CubeWorld</title>

<!--
  СИГНАЛЫ КУБА.

  Список: /cubes/{id}/signals. Публикация: POST туда же. Закрытие:
  /signals/{id}/close — его разрешено нажимать только автору, сервер
  это и проверяет.

  Чего здесь нарочно нет: своей цены входа. Её ставит сервер по
  котировке в момент публикации, и подставлять свою нельзя — иначе
  человек напишет вход, которого не было, а процент посчитается от него.
  Поэтому в окне публикации поля «вход» нет вовсе: есть пара,
  направление, цель, стоп и срок.

  Проценты: «сейчас» у открытого сигнала считает сервер от живой
  котировки (поле pnl), у закрытого — результат (result_pct). Если
  котировок нет, сервер присылает null, и мы показываем прочерк, а не
  ноль: ноль означал бы «не изменилось», а это неправда.
-->
<style>
/* ── шапка со вкладками ──────────────────────────────────────────── */
.верх-сигналов{ display:flex; align-items:center; gap:12px; margin-bottom:14px; }
.верх-сигналов h1{ margin:0; font-size:1.4rem; font-weight:700; letter-spacing:-.02em; }
/* Своего вида у кругляша здесь больше нет: он описан один раз в
   shell.css и на всех страницах одинаковый — без рамки, с подложкой
   под рукой. Осталась только мерка: в этой шапке кнопки чуть крупнее
   соседних, 34 вместо 32, потому что ряд стоит рядом с заголовком в
   1,4 кегля. */
.кругляш{
  width:34px; height:34px; flex:0 0 34px; border-radius:11px;
}
/* Горит, пока строка поиска раскрыта: видно, что список отобран. */
.кругляш.горит{ color:var(--синий); background:rgba(74,158,255,.16); }
.кругляш svg{ width:17px; height:17px; }
.кругляш.правее{ margin-left:auto; }

.вкладки{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }

/* ── поиск по сигналам ────────────────────────────────────────────── */
.поиск-угол{ margin-left:auto; display:flex; align-items:center; gap:8px; }
.поиск-сигналов{ position:relative; display:none; margin:0; width:240px; }
.поиск-сигналов.видно{ display:block; }
.поиск-сигналов input{
  width:100%; box-sizing:border-box;
  background:var(--поле); border:none; border-radius:var(--радиус-круг);
  color:var(--текст); font:inherit; font-size:0.8333rem;
  padding:7px 12px 7px 32px; outline:none;
}
.поиск-сигналов input:hover{ background:var(--край); }
.поиск-сигналов input:focus{ box-shadow:0 0 0 2px rgba(var(--синий-ргб),.45); }
.поиск-сигналов .зн{
  position:absolute; left:11px; top:50%; transform:translateY(-50%);
  color:var(--текст3); pointer-events:none; display:flex;
}
.поиск-сигналов .зн svg{ width:16px; height:16px; }
/* Отборы без подложки в покое: шесть серых плашек в ряд читались как
   шесть кнопок, хотя выбран всегда один. Теперь в покое это просто
   слова, под рукой появляется подложка, а выбранный горит синим — и
   видно сразу, какой отбор стоит. */
.вкладка{
  display:flex; align-items:center; gap:7px; cursor:pointer;
  border:1px solid transparent; background:none; color:var(--текст3);
  border-radius:11px; padding:9px 17px; font-size:0.9333rem;
  transition:background .13s ease, color .13s ease, transform .1s ease;
}
.вкладка:hover{ background:var(--поле); color:var(--текст); }
.вкладка:active{ transform:scale(.97); }
.вкладка.тут{ color:var(--текст); background:rgba(var(--синий-ргб), .18); }
.вкладка svg{ width:15px; height:15px; }
.вкладка.лонг svg{ color:var(--зелёный); }
.вкладка.шорт svg{ color:var(--красный); }
.вкладка.авторы svg{ color:var(--сирень); }

/* ── карточка сигнала ──────────────────────────────────────────────
   Карточка была светлее площадки (--окно) и лежала серым налётом на
   чёрном фоне, а внутри гуляло пустое место: поля по 20, отступы между
   строками по 16. Берём общий фон и сжимаем отступы — сигнал читается
   одним взглядом, и их помещается на экран несколько, а не один. */
.сигнал{
  background:var(--фон); border:1px solid var(--край);
  border-radius:13px; padding:12px 14px; margin-bottom:9px;
}
/* Верхний ряд держится одной строкой: перенос ставил дату с итогом
   вторым этажом, и карточка снова вырастала. Жмётся тот, кого не жалко
   — строка опыта. */
.сигнал .ряд{ display:flex; align-items:center; gap:8px; flex-wrap:nowrap; }

.бирка-дв{
  display:flex; align-items:center; gap:6px; font-size:0.7667rem; font-weight:700;
  letter-spacing:.06em; border-radius:var(--радиус-круг); padding:4px 11px;
}
.бирка-дв svg{ width:13px; height:13px; }
.бирка-дв.long{ color:var(--зелёный); background:rgba(52,211,153,.12);
  border:1px solid rgba(52,211,153,.35); }
.бирка-дв.short{ color:var(--красный); background:rgba(248,113,113,.12);
  border:1px solid rgba(248,113,113,.35); }

.пара{ font-family:ui-monospace,Menlo,monospace; font-size:0.9333rem;
  font-weight:700; white-space:nowrap; }

/* Бирка состояния без кольца: цвет слова и лёгкая подложка того же
   цвета. Кольцо вокруг каждой бирки в ряду с LONG и чипами делало из
   верхней строки карточки забор. */
.бирка-сост{
  font-size:0.7rem; padding:3px 10px; border-radius:var(--радиус-круг);
  border:none; background:rgba(255,255,255,.06);
}
.бирка-сост.открыт{ color:var(--синий); }
.бирка-сост.закрыт{ color:var(--текст3); }
.бирка-сост.платный{ color:var(--жёлтый); }

/* Когда опубликован — в верхнем ряду, мелким, слева от итога. */
.процент{ margin-left:auto; text-align:right; flex:0 0 auto; }
.процент .знач{
  font-family:ui-monospace,Menlo,monospace; font-size:1rem; font-weight:700;
  font-variant-numeric:tabular-nums;
}
.процент .знач.плюс{ color:var(--зелёный); }
.процент .знач.минус{ color:var(--красный); }
.процент .знач.никак{ color:var(--текст3); }
/* Под итогом — когда выложен и сколько ему осталось. Прежнее
   «СЕЙЧАС / ИТОГ» повторяло бирку «открыт / закрыт» слева. */
.процент .когда{ font-size:0.6667rem; color:var(--текст3); margin-top:1px;
  white-space:nowrap; }



.чип{
  font-size:0.6667rem; padding:3px 10px; border-radius:var(--радиус-круг);
  border:none; background:var(--поле); color:var(--текст3);
}
.чип.ты{ color:var(--синий); background:rgba(74,158,255,.16); }
/* Кто выложил — прямо в верхнем ряду, между парой и сроком: сперва
   опыт (по нему и судят), затем имя и чипы. Нажимается: за ней окно
   автора со всеми его числами и его сигналами. */
.кто{ display:flex; align-items:center; gap:7px; margin-left:10px; min-width:0;
  cursor:pointer; border-radius:9px; padding:3px 6px; margin-right:-6px; }
.кто:hover{ background:rgba(var(--синий-ргб),.1); }
.кто:hover .имя{ color:var(--синий); }
/* Автор без номера (старый сигнал) не притворяется кнопкой. */
.кто.нежмётся{ cursor:default; }
.кто.нежмётся:hover{ background:none; }
.кто.нежмётся:hover .имя{ color:inherit; }
/* Жмётся только опыт: имя и чипы режуться не должны — их обрезок
   выглядит поломкой, а не экономией места. */
.кто .опыт{ font-size:0.7333rem; color:var(--текст3); white-space:nowrap;
  flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; }
.кто .имя, .кто .чип{ flex:0 0 auto; }
.кто .имя{ font-family:ui-monospace,Menlo,monospace; font-size:0.8333rem;
  font-weight:700; }

.цены{ display:grid; gap:7px; grid-template-columns:repeat(3,minmax(0,1fr));
  margin-top:9px; }
/* Подпись и число — в одну строку: два этажа на ячейку давали
   карточке лишние полсантиметра пустоты на каждой из трёх. */
.цена{
  background:rgba(255,255,255,.04); border:none;
  border-radius:9px; padding:7px 10px;
  display:flex; align-items:baseline; gap:8px; min-width:0;
}
.цена .над{
  font-size:0.6333rem; letter-spacing:.09em; text-transform:uppercase;
  color:var(--текст3); white-space:nowrap;
}
.цена .знач{
  margin-left:auto; font-family:ui-monospace,Menlo,monospace;
  font-size:0.9333rem; font-weight:700; font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
.цена.цель .знач{ color:var(--зелёный); }
.цена.стоп .знач{ color:var(--красный); }
@media (max-width:620px){
  /* ── ТРИ ЦЕНЫ ОДНОЙ ПЛАШКОЙ С РАЗДЕЛИТЕЛЯМИ ──
     Столбиком три отдельные плашки читались как три разные вещи, а
     это одна: вход, цель и стоп одного сигнала. Собираем их в одну
     плашку, а между строками проводим черту - ровно так Анна и
     нарисовала на снимке 23 ноября. */
  .цены{
    grid-template-columns:1fr; gap:0;
    background:rgba(255,255,255,.04); border-radius:9px; overflow:hidden;
  }
  .цена{ background:none; border-radius:0; padding:8px 10px; }
  .цена + .цена{ border-top:1px solid var(--край); }

  .сигнал .ряд{ flex-wrap:wrap; }
  .кто{ margin-left:0; }

  /* ── ШЕСТЬ ОТБОРОВ В ОДИН РЯД ──
     «Все, Открытые, Лонг, Шорт, Мои, Авторы» переносились вторым
     этажом, и шапка занимала два ряда из трёх видимых. Ужимаем поля,
     буквы и зазор, а значки у трёх отборов прячем: в покое они всё
     равно серые, а выбранный виден подложкой. На 390 точках ряд
     складывается в 318 - с запасом. */
  .вкладки{ flex-wrap:nowrap; gap:3px; margin-bottom:10px; }
  .вкладка{
    padding:7px 9px; font-size:0.8rem; border-radius:9px;
    white-space:nowrap; gap:0;
  }
  .вкладка svg{ display:none; }

  /* Плюс и восклицательный знак стояли в двенадцати точках друг от
     друга - на телефоне это выглядело как две случайные кнопки по
     разным углам. Ставим их рядом, а воздух оставляем только после
     заголовка. */
  .верх-сигналов{ gap:2px; }
  .верх-сигналов h1{ margin-right:6px; font-size:1.25rem; }

  /* ── ЛУПА УЕЗЖАЛА ЗА КРАЙ ──
     Строка поиска была шириной ровно 240 точек. На телефоне шапка
     всего 358: заголовок, плюс, восклицательный знак и эти 240 в
     строку не помещались, и сама кнопка-лупа оказывалась за правым
     краем экрана - замер показал её на 398..432 при ширине окна 390.

     Теперь уголок с поиском тянется по свободному месту, а строка
     внутри него сжимается: 240 остаётся её ЖЕЛАНИЕМ, а не законом.
     min-width:0 обязателен - без него поле отказывается сжиматься
     меньше своего содержимого, и всё остаётся как было. */
  .верх-сигналов .поиск-угол{ flex:1 1 auto; min-width:0; }
  .верх-сигналов .поиск-сигналов{ flex:1 1 auto; min-width:0; max-width:240px; }
}

/* Низ карточки: заметка слева, кнопка справа, одной строкой. На
   узком экране заметка переносит кнопку под себя — резать заметку
   ради одной строки нельзя, её пишет автор. */
.сигнал .низ{
  display:flex; align-items:center; gap:10px; margin-top:9px; flex-wrap:wrap;
}
.сигнал .слова{
  margin:0; flex:1 1 auto; min-width:0;
  font-size:0.8667rem; line-height:1.5; word-break:break-word;
}
/* Кнопка по мерке работающей программы: поля 5 на 12, буквы 11 точек
   (корень страницы 12.5, отсюда 0.88rem). Была 9 на 18 и держала этаж
   высотой с ячейку цены ради двух слов. */
.кн-закрыть{
  margin-left:auto; cursor:pointer; white-space:nowrap; flex:0 0 auto;
  border:1px solid rgba(248,113,113,.4); background:rgba(248,113,113,.08);
  color:#fca5a5; border-radius:8px; padding:5px 12px;
  font-size:0.88rem; font-weight:700;
}
.кн-закрыть:hover{ border-color:var(--красный); color:#fff; }
.кн-закрыть:disabled{ opacity:.5; cursor:default; }

.замок-строка{
  margin-top:14px; display:flex; align-items:center; gap:10px;
  font-size:0.9rem; color:var(--текст2);
}
.замок-строка svg{ width:16px; height:16px; color:var(--жёлтый); }

/* ── окно публикации ───────────────────────────────────────────────
   Окно, подложка, поля и пара-строка живут в оболочке: они общие трём
   экранам. Здесь только переключатель «лонг / шорт». */
.переключатель{ display:flex; gap:9px; }
.переключатель button{
  flex:1; cursor:pointer; border-radius:var(--радиус-мал); padding:12px;
  font-size:0.9333rem; font-weight:600;
  border:1px solid var(--край); background:var(--фон); color:var(--текст2);
}
.переключатель button.выбран.long{
  color:var(--зелёный); border-color:rgba(52,211,153,.5); background:rgba(52,211,153,.1); }
.переключатель button.выбран.short{
  color:var(--красный); border-color:rgba(248,113,113,.5); background:rgba(248,113,113,.1); }
.окно .кнопки{ display:flex; gap:10px; margin-top:20px; }
.окно .кнопки .кнопка{ flex:1; padding:13px; }
</style>
</head>

<script>
'use strict';

CW.оболочка('signals').then(function (место) {

var куб = CW.какойКуб();

var С = { все: [], отбор: 'все', пары: [], направление: 'LONG', ищем: '' };

/* ── шапка ── */
var шапка = document.createElement('div');
шапка.className = 'верх-сигналов';
шапка.innerHTML =
    '<h1>' + CW.безопасно(Т('Сигналы')) + '</h1>'
  + '<button class="кругляш" id="кн-новый" title="' + CW.безопасно(Т('Новый сигнал')) + '">＋</button>'
  + '<button class="кругляш" id="кн-правила" title="' + CW.безопасно(Т('О сигналах')) + '">'
  +   CW.значок('внимание') + '</button>'
  + '<div class="поиск-угол">'
  +   '<button class="кругляш" id="кн-искать" title="' + CW.безопасно(Т('Поиск')) + '">'
  +     CW.значок('лупа') + '</button>'
  + '</div>';
место.appendChild(шапка);

var вкладки = document.createElement('div');
вкладки.className = 'вкладки';
место.appendChild(вкладки);

/* ── строка поиска ─────────────────────────────────────────────────────
   Свёрнута, раскрывается лупой — как было в боевой программе. Живёт
   рядом с самой лупой, в правом углу шапки, и узкая: во всю ширину
   она отодвигала список вниз и выглядела как главное на экране, хотя
   это подсобная строка.

   Лупа раньше уводила в общее окно поиска. Но общий поиск ищет людей,
   группы, кубы и эфиры — сигналов он не ищет вовсе, и человек, нажавший
   лупу в сигналах, попадал не туда. Ищем здесь по тому, что на экране,
   и ровно по тому, что обещано в строке: пара и автор. */
var строкаПоиска = document.createElement('div');
строкаПоиска.className = 'поиск-сигналов';
строкаПоиска.innerHTML =
    '<span class="зн">' + CW.значок('лупа') + '</span>'
  + '<input id="поиск-сигналов" type="text" spellcheck="false" autocomplete="off"'
  + ' placeholder="' + CW.безопасно(Т('Пара, Автор')) + '">';
шапка.querySelector('.поиск-угол')
     .insertBefore(строкаПоиска, шапка.querySelector('#кн-искать'));

var тело = document.createElement('div');
место.appendChild(тело);
CW.ждём(тело);

/* Своё окно у сигналов было одно — создание. Оно переехало в
   modals/create-signal.js и выглядит как все остальные окна. */

/* ═══════════════════════════════════════════════════════════════════════
   ЗАГРУЗКА
   ═══════════════════════════════════════════════════════════════════════ */
/* Сигналы общие — как маркетплейс. Пишут их в кубе, а читают все и
   отовсюду: иначе один и тот же сигнал видела горстка людей, а в
   соседнем кубе экран стоял пустым. Куб здесь нужен только чтобы
   ВЫЛОЖИТЬ свой сигнал, а не чтобы смотреть чужие. */
загрузить();
CW.спросить('/signals/pairs', { тихо: true }).then(function (д) {
  С.пары = (д && д.pairs) || [];
});

/* Общий список живёт на новой ручке /signals. Пока она не залита на
   сервер, та отвечает 405 (там есть только POST /signals) — и экран
   оставался пустым. Поэтому при любой осечке спрашиваем по-старому,
   по кубу: лучше сигналы одного куба, чем красная строка вместо них. */
function загрузить() {
  CW.спросить('/signals?limit=120', { сроком: 20000 })
    .then(принять)
    .catch(function () {
      if (!куб) throw new Error(Т('нет куба'));
      return CW.спросить('/cubes/' + куб + '/signals', { сроком: 20000 })
               .then(принять);
    })
    .catch(показатьБеду);
}

function принять(д) {
  С.все = (д && д.signals) || [];
  показать();
}

function показатьБеду(е) {
  тело.innerHTML = '';
  var б = document.createElement('div');
  б.className = 'беда';
  б.textContent = е && е.сеть ? 'Нет связи с сервером'
                : 'Не вышло получить сигналы' + (е && е.message ? ': ' + е.message : '');
  тело.appendChild(б);
}

/* ═══════════════════════════════════════════════════════════════════════
   ОТРИСОВКА
   ═══════════════════════════════════════════════════════════════════════ */
var ОТБОРЫ = [
  { имя: 'все',      подпись: Т('Все') },
  { имя: 'открытые', подпись: Т('Открытые') },
  { имя: 'лонг',     подпись: Т('Лонг'),   зн: 'рост',  класс: 'лонг' },
  { имя: 'шорт',     подпись: Т('Шорт'),   зн: 'спад',  класс: 'шорт' },
  { имя: 'мои',      подпись: Т('Мои') },
  { имя: 'авторы',   подпись: Т('Авторы'), зн: 'звезда', класс: 'авторы' }
];

function кусок(класс, внутри) { return CW.кусок(класс, внутри); }

/* Отборы рисуем сразу, не дожидаясь ответа сервера: при любой осечке
   человек должен видеть страницу, а не голую красную строку. Вызов
   стоит здесь, а не выше: ОТБОРЫ объявлены строкой выше, и до них
   этот вызов был бы обращением к ещё пустой переменной. */
нарисоватьВкладки();

function нарисоватьВкладки() {
  вкладки.innerHTML = '';
  ОТБОРЫ.forEach(function (о) {
    var б = document.createElement('button');
    б.className = 'вкладка ' + (о.класс || '') + (С.отбор === о.имя ? ' тут' : '');
    б.innerHTML = (о.зн ? CW.значок(о.зн) : '') + '<span>' + о.подпись + '</span>';
    б.onclick = function () { С.отбор = о.имя; показать(); };
    вкладки.appendChild(б);
  });
}

/* Мерка общая на всю программу — CW.ровно: без регистра и без ё.

   Ищем ровно по двум вещам, как и написано в строке: пара и автор.
   Прежде сюда же подмешивались направление, состояние и заметка —
   строка обещала одно, а находила другое, и набранное «лонг» молча
   отбирало список, хотя для этого рядом стоит своя вкладка. */
function подходит(с) {
  if (!С.ищем) return true;
  var что = CW.ровно(С.ищем);
  return CW.ровно([с.pair, с.author].join(' ')).indexOf(что) >= 0;
}

function отобранные() {
  var я = (CW.ясныйЯ() || {}).id;
  return С.все.filter(подходит).filter(function (с) {
    switch (С.отбор) {
      case 'открытые': return с.status === 'open';
      case 'лонг':     return с.dir === 'LONG';
      case 'шорт':     return с.dir === 'SHORT';
      case 'мои':      return с.mine || (я && с.author_id === я);
      case 'авторы':   return с.subscribed;
      default:         return true;
    }
  });
}

function показать() {
  нарисоватьВкладки();
  тело.innerHTML = '';

  var список = отобранные();
  if (!список.length) {
    тело.appendChild(кусок('пусто-строка',
      С.ищем ? ('Ничего не нашлось по запросу «' + CW.безопасно(С.ищем) + '».')
             : (С.все.length
                 ? 'В этом отборе сигналов нет.'
                 : '' + CW.безопасно(Т('В этом кубе ещё не было сигналов.')) + '<br>' + CW.безопасно(Т('Нажми ＋ и опубликуй первый.')) + '')));
    return;
  }
  список.forEach(function (с) { тело.appendChild(карточка(с)); });
}

/* Цены пишем как на сайте: разряды пробелом, дробь запятой. */
function цена(ч) {
  if (ч == null) return '-';
  var з = Number(ч);
  if (!isFinite(з)) return '-';
  var знаков = з >= 100 ? 2 : з >= 1 ? 4 : 6;
  return з.toLocaleString('ru', { minimumFractionDigits: знаков,
                                  maximumFractionDigits: знаков });
}

function процент(ч) {
  if (ч == null) return null;
  var з = Number(ч);
  return (з > 0 ? '+' : '') + з.toFixed(2) + '%';
}

function карточка(с) {
  var у = кусок('сигнал');
  var открыт = с.status === 'open';
  var длинный = с.dir === 'SHORT' ? false : true;

  /* ── верхний ряд ── */
  var пнл = открыт ? с.pnl : с.result_pct;
  var текстПнл = процент(пнл);
  var видПнл = текстПнл == null ? 'никак'
             : Number(пнл) > 0 ? 'плюс'
             : Number(пнл) < 0 ? 'минус' : 'никак';

  /* Когда опубликован и когда закроется — в верхнем ряду, рядом с
     итогом. Внизу эта строка держала целую полосу ради шести слов. */
  var когда = с.created_at ? CW.прошло(с.created_at) : '';
  var срок = открыт && с.expires_at ? ' · ещё ' + CW.остаток(с.expires_at) : '';

  /* ── автор ── */
  var ст = с.stats || {};
  var закрытых = Number(ст.closed || ст.total_closed || 0);

  /* Уровень говорит сервер: двадцать закрытых — «автор», пятьдесят и
     три месяца — «в общей витрине». Своего правила («десять закрытых —
     опытный») у страницы больше нет: оно называло человека опытным
     тогда, когда сервер считал его новичком, и в окне автора стояло
     другое слово. */
  var УРОВНИ = { novice: Т('новичок'), author: Т('автор'), global: Т('в общей витрине') };

  var чипы = '';
  if (с.mine) чипы += '<span class="чип ты">' + CW.безопасно(Т('ты')) + '</span>';
  чипы += '<span class="чип">' + (УРОВНИ[ст.level] || УРОВНИ.novice) + '</span>';

  /* Автор и его опыт стоят в том же верхнем ряду, в пустоте между
     парой и итогом: своей строкой они держали целый этаж карточки,
     а говорят об одном — о том, кто это выложил.

     В строке — короткое «закр. 7». Всё остальное (процент, сумма при
     равной ставке, худшая серия, просадка и его сигналы) открывается
     нажатием, в окне автора: в карточку это не влезет, а врать
     сокращением нельзя. Полная фраза лежит в подсказке. */
  var опыт = Т.с('закр. {н}', { н: закрытых });

  var кто = '<span class="кто" title="' + CW.безопасно(опытомСловами(ст)) + '">'
          +   '<span class="опыт">' + CW.безопасно(опыт) + '</span>'
          +   '<span class="имя">' + CW.безопасно(с.author || '-') + '</span>' + чипы
          + '</span>';

  var верх = кусок('ряд');
  if (с.locked) {
    верх.innerHTML =
        '<span class="бирка-сост платный">' + CW.безопасно(Т('платный')) + '</span>'
      + '<span class="пара">' + CW.безопасно(Т('скрыт до раскрытия')) + '</span>'
      + кто;
  } else {
    верх.innerHTML =
        '<span class="бирка-дв ' + (длинный ? 'long' : 'short') + '">'
      +   CW.значок(длинный ? 'вверх' : 'вниз') + (длинный ? 'LONG' : 'SHORT') + '</span>'
      + '<span class="пара">' + CW.безопасно(с.pair || '-') + '</span>'
      + '<span class="бирка-сост ' + (открыт ? 'открыт' : 'закрыт') + '">'
      +   CW.безопасно(открыт ? Т('открыт') : Т('закрыт')) + '</span>'
      + кто
      + '<span class="процент">'
      +   '<div class="знач ' + видПнл + '">' + (текстПнл == null ? '-' : текстПнл) + '</div>'
      +   '<div class="когда">' + CW.безопасно(когда) + CW.безопасно(срок) + '</div>'
      + '</span>';
  }
  у.appendChild(верх);

  /* Нажатие на автора открывает его окно. Вешаем после вставки: ряд
     собран строкой, и узел появляется только здесь. */
  var узелКто = верх.querySelector('.кто');
  if (узелКто && Number(с.author_id || 0)) {
    узелКто.onclick = function () {
      CW.открыть('author-signals', { кто: Number(с.author_id), имя: с.author || '' });
    };
  } else if (узелКто) {
    узелКто.classList.add('нежмётся');
  }

  /* ── цены ──
     Стояли под автором и его опытом, через две строки от заголовка, и
     между ними гуляло пустое место. Это главное в сигнале — поднимаем
     сразу под верхний ряд, а автор с опытом уходят под них. */
  if (!с.locked) {
    у.appendChild(кусок('цены',
        '<div class="цена"><span class="над">' + CW.безопасно(Т('Вход')) + '</span>'
      +   '<span class="знач">' + цена(с.entry) + '</span></div>'
      + '<div class="цена цель"><span class="над">Take profit</span>'
      +   '<span class="знач">' + цена(с.tp) + '</span></div>'
      + '<div class="цена стоп"><span class="над">Stop loss</span>'
      +   '<span class="знач">' + цена(с.sl) + '</span></div>'));
  }


  if (с.locked) {
    у.appendChild(кусок('замок-строка',
        CW.значок('замок')
      + '<span>' + CW.безопасно(Т('Платный сигнал. Цены откроются')) + ' ' + когдаОткроется(с.reveal_at)
      + ' ' + CW.безопасно(Т('или сразу по подписке на автора.')) + '</span>'));
    return у;
  }

  /* ── низ ──
     Заметка автора и кнопка закрытия стоят одной строкой: заметка
     слева, кнопка справа. Раньше это были два этажа, и между ними
     оставалась пустая полоса в сантиметр — в карточке, где всё
     остальное ужато до строки. Нет ни заметки, ни кнопки — нет и
     самого низа. */
  var естьКнопка = открыт && с.mine;
  if (с.note || естьКнопка) {
    var низ = кусок('низ');
    if (с.note) низ.appendChild(кусок('слова', CW.сСсылками(с.note)));
    if (естьКнопка) {
      var б = document.createElement('button');
      б.className = 'кн-закрыть';
      б.textContent = Т('Закрыть сейчас');
      б.onclick = function () { спроситьЗакрытие(с, б); };
      низ.appendChild(б);
    }
    у.appendChild(низ);
  }

  return у;
}

/* Полная фраза об авторе — та же, что в работающей программе. Висит
   подсказкой на строке автора: в карточке для неё места нет, а знать
   её человеку надо до того, как он пойдёт за сигналом. */
function опытомСловами(ст) {
  ст = ст || {};
  var закрытых = Number(ст.closed || 0);
  if (!закрытых) return Т('закрытых сигналов пока нет: судить не по чему');
  if (ст.win_rate == null) {
    var надо = Number(ст.need_closed || 0);
    return Т.с('{закрытых} закрытых · процент покажем после {всего} (осталось {надо})',
               { закрытых: закрытых, всего: закрытых + надо, надо: надо });
  }
  return Т.с('{закрытых} закрытых · {процент}% в плюс · при равной ставке {сумма}'
           + ' · худшая серия убытков {серия}',
             { закрытых: закрытых, процент: ст.win_rate,
               сумма: процент(ст.sum_pct) || '-',
               серия: Number(ст.worst_streak || 0) });
}

function когдаОткроется(с) {
  if (!с) return Т('позже');
  var мс = CW.миг(с) - Date.now();
  return мс <= 0 ? Т('вот-вот') : Т.с('через {сколько}', { сколько: CW.остаток(с) });
}

/* ═══════════════════════════════════════════════════════════════════════
   ЗАКРЫТЬ СИГНАЛ. Это решение автора и отменить его нельзя — спрашиваем.
   ═══════════════════════════════════════════════════════════════════════ */
function спроситьЗакрытие(с, кнопка) {
  CW.лист([
    { заголовок: Т('Закрыть ') + (с.pair || 'сигнал') + ' по рынку?' },
    { зн: CW.значок('галка', 16), подпись: Т('Закрыть'), опасная: true, делать: function () {
        кнопка.disabled = true;
        кнопка.textContent = Т('Закрываю…');
        CW.спросить('/signals/' + с.id + '/close', { способ: 'POST', сроком: 25000 })
          .then(function (о) {
            CW.сказать(Т('Закрыт') + (о && о.result_pct != null
              ? ' · ' + процент(о.result_pct) : ''));
            загрузить();
          })
          .catch(function (е) {
            кнопка.disabled = false;
            кнопка.textContent = Т('Закрыть сейчас');
            CW.сказать(е.сеть ? 'Нет связи с сервером' : (е.message || 'Не вышло закрыть'));
          });
      } },
    { зн: CW.рисунок('M6 6 18 18M18 6 6 18', 15), подпись: Т('Отмена') }
  ]);
}

/* ═══════════════════════════════════════════════════════════════════════
   НОВЫЙ СИГНАЛ.
   Поля «вход» здесь нет: цену входа ставит сервер по котировке в момент
   публикации. Своё число тут означало бы вход, которого не было.
   ═══════════════════════════════════════════════════════════════════════ */
/* Создание сигнала — общая модалка (modals/create-signal.js). */
document.getElementById('кн-новый').onclick = function () {
  /* Смотреть сигналы можно откуда угодно, а выложить свой — только из
     куба: сигнал где-то должен родиться, и это решает не экран. */
  if (!куб) {
    CW.сказать(Т('Чтобы выложить сигнал, зайди в куб'));
    return;
  }
  CW.открыть('create-signal', { куб: куб, пары: С.пары, потом: загрузить });
};

/* Предупреждение — окошко под кнопкой с треугольником, а не полоса над
   списком. Четыре строки над каждым списком человек читает один раз, а
   место они занимают всегда. Текст тот же, что в боевой программе, —
   слово в слово, его не трогаем. */
CW.окошко(document.getElementById('кн-правила'),
  Т('Сигналы: мнение авторов, а не инвестиционная рекомендация. '
  + 'Цену входа и исход фиксирует сервер по котировкам: изменить сигнал '
  + 'после публикации нельзя. Решение и деньги, твои.'));

/* Лупа раскрывает и сворачивает строку. При сворачивании слово стирается:
   иначе спрятанная строка продолжала бы молча отбирать список, и человек
   не понимал бы, почему сигналов мало. */
var кнИскать = document.getElementById('кн-искать');
var полеПоиска = document.getElementById('поиск-сигналов');

кнИскать.onclick = function () {
  var видно = строкаПоиска.classList.toggle('видно');
  кнИскать.classList.toggle('горит', видно);
  if (видно) полеПоиска.focus();
  else if (С.ищем) { полеПоиска.value = ''; С.ищем = ''; показать(); }
};

полеПоиска.oninput = function () {
  С.ищем = полеПоиска.value.trim();
  показать();
};
полеПоиска.onkeydown = function (е) {
  if (е.key === 'Escape') { е.stopPropagation(); кнИскать.onclick(); }
};


});
</script>
</body>
