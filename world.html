<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- Страница заходит ПОД полоску с часами, и красит это место наша же
     шапка: .об-верх держит под него env(safe-area-inset-top), поэтому
     её содержимое остаётся на прежнем месте экрана. В режиме камеры
     шапка прозрачна — значит сквозь полоску видно картинку. Метка
     обязана стоять в странице: iOS читает её при добавлении значка. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Мир · CubeWorld</title>
<link rel="icon" href="icons/favicon.svg?v=20261128-549">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="shared/style.css?v=20261128-549">
<link rel="stylesheet" href="shared/window.css?v=20261128-549">
<link rel="stylesheet" href="shared/account.css?v=20261128-549">
<script src="shared/theme.js?v=20261128-549"></script>
<!--
  МИР. Карта кубов — та же, что в работающей программе.

  Рисовалка взята из рабочего world.html и переписана начисто, без
  изменений в поведении: восемь углов куба поворачиваются вокруг двух
  осей, перспектива считается делением на глубину, шесть граней
  сортируются от дальней к ближней. Трёхмерной библиотеки нет и не было —
  это обычное двумерное полотно.

  Что сохранено один в один:
    поворот сцены и самовращение;
    покачивание куба и его собственное вращение вокруг себя;
    подпись над кубом: значок, имя, часы жизни, «★ МОЙ ★»;
    подсказка при наведении;
    тяга мышью и пальцем, короткое нажатие — вход в куб.

  Добавлено сверх боевой: пока идёт игра с кубами (ладонь в столбике),
  куб под пальцем можно вести, бросать и бить, а два пальца и колесо
  отодвигают рой вглубь. На каждое касание куба телефон отвечает
  дрожью. Подробности — в блоке «ВВОД» ниже.

  Чего нет: мусора. Один файл, одна рисовалка, один список кубов.
-->
<style>
.рама{ background:#030310; }

/* ── МИР ПОД КАМЕРОЙ ──
   v=508. Мир — единственная страница со своими красками: звёздное небо
   рисуется холстом, а не заливкой, и поэтому режим камеры его не брал.
   Анна: «камера не передается на страницу world это надо поправить
   раньше все работало у нас там вообще стримы напомню».

   Здесь гасим три непрозрачных места, а небо на холсте гасит сам
   рисовальщик — см. «небо» в коде ниже. Размытие за верхней полосой
   тоже снимаем: размывать живую картинку с камеры незачем, от неё
   остаётся муть вместо лица. */
/* ── ТРИ РАЗНЫХ ФОНА ПОД КАМЕРОЙ ──
   v=541. Анна: «там 3 разных фона: боковой, внутренний большой и
   шапка, и надо также вернуть только фоны».

   В 508-й все три были сделаны полностью прозрачными — и мир стал
   одной сплошной картинкой от края до края, без деления на зоны.
   Возвращаем деление, но не красками, а плотностью: сквозь все три
   камера видна, просто по-разному. Поля по бокам самые глухие, рама
   почти чистая, шапка между ними. Самой картинки это не трогает —
   меняются только фоны, как Анна и просила. */
html[data-камера="да"] body{ background:rgba(0,0,6,.55); }
html[data-камера="да"] .рама{ background:rgba(3,3,16,.22); }
html[data-камера="да"] .верх{
  background:rgba(5,5,24,.62);
  backdrop-filter:none; -webkit-backdrop-filter:none;
}
html[data-камера="да"] .состояние{ background:rgba(8,8,30,.34); }

/* ── верхняя полоса ──────────────────────────────────────────────── */
/* Отступы и промежуток — те же, что в полосе разделов (shell.css):
   человек переходит из мира в ленту и обратно, и надпись с кружком не
   должны прыгать на несколько точек. */
.верх{
  flex:0 0 auto; height:54px; z-index:40;
  display:flex; align-items:center; gap:12px; padding:0 16px;
  padding-top:env(safe-area-inset-top); box-sizing:content-box;
  /* Размытия подложки нет нарочно: оно давало тень под полоской с
     часами. Подробности — shared/shell.css, .об-верх. */
  background:rgba(5,5,24,.92);
  border-bottom:1px solid rgba(255,255,255,.07);
}
.знак-мира{ font-weight:800; font-size:1.0667rem; letter-spacing:-.4px; white-space:nowrap; }
.знак-мира span{ color:var(--синий); }

/* Кружок лица — ровно такой же, как в разделах и в списках. Своей
   рамки и своего цвета знака здесь больше нет: кольцо переливом и
   сиреневый человечек приходят из общего правила (shared/style.css).
   Из-за своей рамки вокруг одного лица выходило два кольца, а с
   открытым меню - три; Анна прислала это снимком. */
#лицо-кнопка{
  width:32px; height:32px; flex:0 0 32px; border-radius:50%; padding:0;
  border:none;
  /* Заглушка голубо-розовая, как во всей программе и в обеих темах.
     Краска названа один раз в shared/style.css. */
  background:var(--лицо-заливка); cursor:pointer;
  display:flex; align-items:center; justify-content:center; font-size:1rem;
  overflow:hidden; color:var(--лицо-краска);
}
#лицо-кнопка img{ width:100%; height:100%; object-fit:cover; display:block; }
/* Размер значка общий на всю программу (shared/style.css): доля
   кружка, а не своё число. */
/* Меню открыто - кольцо светлеет, а не прибавляется вторым. */
#лицо-кнопка.горит::before{ background:var(--синий-светлее); }
.круг-верх svg{ width:16px; height:16px; }
.пилюля svg{ width:15px; height:15px; flex:0 0 auto; }
/* Значок в кружке столбика — 27 точек при кружке в 52: ровно
   половина. Было 18, и на чёрном небе кружок читался как пустой, а
   рисунок внутри приходилось разглядывать. */
.столбик button svg{ width:27px; height:27px; }

/* Правил для .счёт-мира здесь больше нет: счётчика «N онлайн · N
   кубов» нет в разметке. Зелёная точка .точка осталась - её берут
   подписи кубов на небе. */
.точка{ width:6px; height:6px; border-radius:50%; background:var(--зелёный);
  box-shadow:0 0 7px var(--зелёный); flex:0 0 6px; }

/* бегущая строка курсов */
.курсы{ flex:1; min-width:0; overflow:hidden;
  mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent); }
.курсы-лента{ display:flex; gap:22px; width:max-content; animation:бег 90s linear infinite; }
@keyframes бег{ from{transform:translateX(0)} to{transform:translateX(-50%)} }
.курсы:hover .курсы-лента{ animation-play-state:paused; }
.курс{ display:flex; align-items:baseline; gap:6px; font-size:0.7667rem; white-space:nowrap; }
.курс .сим{ color:var(--текст3); letter-spacing:.07em; font-weight:600; }
.курс .цена{ color:var(--текст); font-weight:600; }
.курс .вверх{ color:var(--зелёный); } .курс .вниз{ color:var(--красный); }

.полка{ display:flex; align-items:center; gap:8px; flex:0 0 auto; }
/* Микрофон и «домой» стоят без обводки и без заливки - как значки в
   шапке разделов (.об-круг в shell.css). Серый кружок вокруг каждого
   делал из двух значков две плашки, и полоса мира читалась набором
   кнопок, а не рядом знаков. Обводка появляется под пальцем и под
   мышью: тогда она к месту, она показывает отклик. */
.круг-верх{
  width:32px; height:32px; flex:0 0 32px; border-radius:50%;
  border:1px solid transparent; background:none;
  color:var(--текст2); cursor:pointer; font-size:0.9rem;
  display:flex; align-items:center; justify-content:center;
  transition:background .13s ease, color .13s ease, transform .1s ease;
}
.круг-верх:hover{ color:var(--текст); background:rgba(255,255,255,.07); }
.круг-верх:active{ background:rgba(255,255,255,.14); transform:scale(.9); }

.пилюля{
  display:flex; align-items:center; gap:7px; border-radius:var(--радиус-круг);
  padding:6px 13px; font-size:0.8667rem; font-weight:600; white-space:nowrap;
  border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.04);
  color:var(--текст); cursor:pointer;
}
/* Цвета взяты из боевой полосы мира: «Игры» синие, кошелёк золотой.
   Сиреневый у «Игр» был наш и выбивался — в полосе больше нигде нет
   сиреневого, и кнопка читалась как чужая. */
.пилюля.игры{ color:var(--синий); border-color:rgba(74,158,255,.4); background:rgba(74,158,255,.1); }
/* Сам джойстик — виолетовый, слово «Игры» остаётся синим. Значок в
   своём цвете читается как картинка раздела, а не как часть надписи. */
.пилюля.игры svg{ color:#a78bfa; }
.пилюля.игры:hover{ background:rgba(74,158,255,.22); border-color:rgba(74,158,255,.6); }
.пилюля.кубы{ color:var(--жёлтый); border-color:rgba(251,191,36,.3); background:rgba(251,191,36,.1); }
.пилюля.кубы:hover{ background:rgba(251,191,36,.2); border-color:rgba(251,191,36,.55); }
/* Монета крупнее прочих значков: у неё есть тело, и в 15 точках куб
   внутри сливается в пятно. */
.пилюля.кубы svg{ width:16px; height:16px; }

/* ── полотно мира ────────────────────────────────────────────────── */
#обёртка{ position:relative; flex:1; min-height:0;
  overflow:hidden; cursor:grab; touch-action:none; }
#обёртка.тянем{ cursor:grabbing; }
#полотно{ display:block; width:100%; height:100%; }

/* ── водяной знак ──
   Та же пара цветов, что в полосе наверху: «Cube» светлой сталью,
   «World» цветом оформления. Прежний знак был почти невидим (белый в
   четыре сотых) и к тому же огромным — пятно на полнеба вместо подписи.

   Цвет берётся из темы, а не вписан числом. Раньше «World» наверху был
   зелёным (как выбрано в оформлении), а внизу оставался синим: два
   одинаковых слова на одном экране разного цвета. Числа цвета темы
   лежат в «--синий-ргб» — их и берём, чтобы задать прозрачность. */
.водяной{
  position:absolute; left:50%; bottom:22px; transform:translateX(-50%);
  font-size:clamp(30px,6vw,44px); font-weight:800; letter-spacing:-.03em;
  color:rgba(180,200,255,.5); pointer-events:none; user-select:none; white-space:nowrap;
}
.водяной i{
  font-style:normal;
  /* Запасной цвет — на случай, если тема почему-то не отдала числа. */
  color:rgba(74,158,255,.62);
  color:rgba(var(--синий-ргб), .62);
}

/* ── подсказка при наведении ─────────────────────────────────────── */
.подсказка{
  position:fixed; z-index:45; display:none; pointer-events:none;
  background:rgba(8,8,30,.95); border:1px solid var(--край2);
  border-radius:11px; padding:10px 13px; min-width:170px; max-width:230px;
  box-shadow:0 14px 36px rgba(0,0,0,.6);
}
/* Имя — строкой со значком: значок берёт цвет куба, как и само имя. */
.подсказка .имя{ font-size:0.8667rem; font-weight:700; margin-bottom:3px;
  display:flex; align-items:center; gap:6px; }
.подсказка .имя svg{ width:15px; height:15px; flex:0 0 auto; }
.подсказка .опис{ font-size:0.7667rem; color:var(--текст3); margin-bottom:7px;
  overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
.подсказка .ряд{ display:flex; align-items:center; justify-content:space-between; gap:9px; }
.подсказка .часы{ font-family:ui-monospace,Menlo,monospace; font-size:0.7333rem; color:var(--текст2); }
.подсказка .вид{ font-size:0.6667rem; letter-spacing:.07em; padding:2px 7px;
  border-radius:var(--радиус-круг); border:1px solid currentColor; }
.подсказка .вид.открытый{ color:var(--зелёный); }
.подсказка .вид.закрытый{ color:var(--жёлтый); }

/* ── правый столбик ──────────────────────────────────────────────── */
.столбик{
  position:absolute; right:16px; bottom:calc(22px + var(--низ-край));
  z-index:35; display:flex; flex-direction:column; gap:12px;
}
.столбик button{
  width:52px; height:52px; border-radius:50%; cursor:pointer; font-size:1.3333rem;
  display:flex; align-items:center; justify-content:center; transition:transform .14s;
  background:rgba(8,8,30,.7); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
}
/* Каждая кнопка светится своим цветом, как в боевой: на чёрном небе
   плоский кружок с тонкой обводкой читается как выключённый. Верхняя
   залита и со значком в белом — она главная; две другие прозрачные,
   у них светятся обводка и значок. */
/* ── ЦВЕТ ТРЁХ КРУЖКОВ ──
   У каждого свой источник, и это нарочно:

       «Мои кубы»  — основной цвет оформления. Главная кнопка
                     столбика, залита им целиком.
       «Ключ куба» — ВСЕГДА зелёный, и ключ, и обводка. Это вход в
                     чужой куб, и он узнаётся по цвету, а не по
                     значку: зелёный тут не из оформления.
       «Игры»      — цвет значков из «Оформления». Если человек задал
                     значкам свой цвет, кружок красится им же —
                     обводка и ладонь заодно.

   Числа основного цвета берутся из «--синий-ргб» (их ставит
   shared/theme.js): rgba() не умеет брать краску из переменной. */
.столбик .мои {
  border:1px solid var(--синий); color:#fff; background:var(--синий);
  box-shadow:0 4px 24px rgba(var(--синий-ргб), .4);
}
/* У зелёного заливка тонкая, матовая: кружок просвечивает небо, но уже
   не читается как выключённый. */
.столбик .ключ{
  border:1.5px solid rgba(52,211,153,.65); color:var(--зелёный);
  background:rgba(52,211,153,.14);
  box-shadow:0 4px 22px rgba(52,211,153,.22);
}
.столбик .рука{
  border:1.5px solid rgba(139,124,246,.65); color:#c4b5fd;
  box-shadow:0 4px 22px rgba(139,124,246,.18);
}
/* Значок внутри слушается отдельной настройки «Иконки», если её
   задали. Правило стоит ПОСЛЕ кружков, чтобы побеждать их краску.

   Ключ из этого правила исключён: он зелёный всегда — и обводка, и
   сам ключ. Цвет тут не украшение, а признак: зелёным в мире помечен
   вход в чужой куб. */
html[data-значки-цвет="свой"] .столбик button:not(.ключ) svg,
html[data-значки-цвет="свой"] .пилюля svg,
html[data-значки-цвет="свой"] .круг-верх svg{ color:var(--значок-цвет); }
/* А у «Игр» этим цветом красится и сам кружок: обводка со свечением
   вслед за ладонью. Два других кружка свой цвет не отдают — у них он
   значит другое. */
html[data-значки-цвет="свой"] .столбик .рука{
  border-color:var(--значок-цвет); color:var(--значок-цвет);
  box-shadow:0 4px 22px rgba(0,0,0,.35);
}

.столбик .мои:hover { box-shadow:0 6px 28px rgba(var(--синий-ргб), .55); }
.столбик .ключ:hover{ box-shadow:0 6px 26px rgba(52,211,153,.35); }
.столбик .рука:hover{ box-shadow:0 6px 26px rgba(139,124,246,.35); }
/* Кружок наверху горит — микрофон слушает. Цвет тот же, что у всего
   оформления: раньше он загорался синим, даже когда выбран розовый. */
.круг-верх.горит{
  background:rgba(var(--синий-ргб), .3); border-color:var(--синий); color:#fff;
  box-shadow:0 0 0 4px rgba(var(--синий-ргб), .16);
}
/* Игра идёт — ладонь горит. Без этого единственный признак игры —
   строка внизу экрана, и та через полторы секунды прячется. */
.столбик .рука.горит{
  background:rgba(139,124,246,.35); border-color:#8b7cf6; color:#fff;
  box-shadow:0 0 0 4px rgba(139,124,246,.18);
}
/* Со своим цветом значков горящая ладонь берёт его же. */
html[data-значки-цвет="свой"] .столбик .рука.горит{
  border-color:var(--значок-цвет); color:#fff;
}
.столбик button:hover{ transform:translateY(-2px); }

/* ── нижняя строка состояния ─────────────────────────────────────── */
.состояние{
  position:absolute; left:50%; bottom:calc(20px + var(--низ-край));
  transform:translateX(-50%); z-index:30; pointer-events:none;
  background:rgba(8,8,30,.8); border:1px solid var(--край);
  border-radius:var(--радиус-круг); padding:8px 17px;
  font-size:0.8333rem; color:var(--текст2); white-space:nowrap; transition:opacity .25s;
}
.состояние.прячется{ opacity:0; }

/* ── ТЕЛЕФОН: ПОЛОСА МИРА В ОДНУ СТРОКУ ───────────────────────────
   Курсы остаются в той же строке, что и на компьютере, в промежутке
   между лицом и кнопками. Промежуток небольшой - на телефоне в 390
   точек это около 64, - но одного курса в нём и правда видно.

   Второй строкой они стояли полдня и не прижились: полоса мира от
   этого становилась в полтора раза выше и отъедала небо.

   ── ПОЧЕМУ ПРОСВЕТ ПО КРАЯМ СТАЛ УЖЕ ──
   У ленты по краям растушёвка, чтобы курсы не обрывались ножом. На
   широкой полосе она 24 точки с каждой стороны и незаметна. В окошке
   шириной 64 точки две такие растушёвки съедали почти всё: курс
   выезжал уже полупрозрачным, бледнел и пропадал, не успев дойти до
   середины. Отсюда и «мигает». На узком экране растушёвка 8 точек. */
@media (max-width:760px){
  .полка{ margin-inline-start:auto; }
  .курсы{
    mask-image:linear-gradient(90deg,transparent,#000 8px,#000 calc(100% - 8px),transparent);
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 8px,#000 calc(100% - 8px),transparent);
  }
  .пилюля .слово{ display:none; }
  .пилюля{ padding:7px 11px; }
  /* ── ДЖОЙСТИК НА ТЕЛЕФОНЕ — ТАКОЙ ЖЕ ЗНАЧОК, КАК ДОМИК ──
     Со спрятанным словом от пилюли остаётся обведённая коробочка
     вокруг значка, и в ряду простых кружков она одна была в рамке и
     с подложкой. Здесь «Игры» ведут себя как .круг-верх: тот же круг
     в 32 точки, те же поля, то же нажатие. Фиолетовым остаётся сам
     джойстик — он и был фиолетовым. */
  .пилюля.игры{
    width:32px; height:32px; flex:0 0 32px; padding:0;
    border-radius:50%; border:1px solid transparent; background:none;
    justify-content:center;
    transition:background .13s ease, color .13s ease, transform .1s ease;
  }
  .пилюля.игры:hover{ background:rgba(255,255,255,.07); border-color:transparent; }
  .пилюля.игры:active{ background:rgba(255,255,255,.14); transform:scale(.9); }
  .пилюля.игры svg{ width:16px; height:16px; }
  /* Знак внизу опущен: было девяносто шесть точек от края, и под ним
     висела пустота в треть экрана. Пятьдесят четыре - ниже, но выше
     строки состояния, которая живёт на двадцати: сойдись они, буквы
     легли бы друг на друга. */
  .водяной{ bottom:54px; }
}

/* ── УЗКИЙ ТЕЛЕФОН: ПЕРВАЯ СТРОКА ВЛЕЗАЕТ ЦЕЛИКОМ ──
   На экране в 390 точек правая полка уезжала за край: баланс был
   виден наполовину. Ужимаем зазоры и поля. */
@media (max-width:430px){
  .верх{ gap:8px; padding-inline-start:10px; padding-inline-end:10px; }
  /* Правый ряд стоит вплотную - как в шапке разделов. Зазор между
     кнопками не нужен: воздух у каждой уже внутри, кружок на
     тринадцать точек больше своего значка. Четыре точки между ними
     были ничьи, и ряд выглядел разреженным, а не собранным. */
  .полка{ gap:0; }
  .круг-верх{ width:30px; height:30px; flex:0 0 30px; }
  .пилюля{ padding:6px 9px; }
  /* Джойстик ужимается вместе с кружками: он теперь один из них. */
  .пилюля.игры{ width:30px; height:30px; flex:0 0 30px; }
  /* Пилюля баланса - с рамкой, и вплотную к кружкам она бы слиплась.
     Ей хватает двух точек. Джойстик рамки больше не носит, поэтому
     к домику он встаёт вплотную, как кружок к кружку, а баланс
     отходит от него на те же три точки, что и от любого кружка. */
  .полка .пилюля + .пилюля{ margin-inline-start:2px; }
  .полка .круг-верх + .пилюля{ margin-inline-start:3px; }
  .полка .круг-верх + .пилюля.игры{ margin-inline-start:0; }
  .полка .пилюля.игры + .пилюля{ margin-inline-start:3px; }
}
