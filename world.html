<script>
'use strict';

/* Нет ключа — уходим на титулку и мир даже не начинаем собирать.
   Прежде здесь стоял throw: делал он то же самое, но оставлял в консоли
   красную строку, будто что-то сломалось. */
if (CW.пускать()) запустить();

function запустить() {

/* Мир не зовёт оболочку: у него своя полоса сверху и свой столбик
   справа. Поэтому слова, вписанные прямо в разметку (data-слово,
   data-намёк), переводим здесь сами, как только приехал словарь. */
(CW.языкГотов || Promise.resolve()).then(function () {
  if (CW.разметка) CW.разметка(document);
}, function () {});

var $ = function (и) { return document.getElementById(и); };

/* ═══════════════════════════════════════════════════════════════════════
   СОСТОЯНИЕ МИРА. Одно на весь экран.
   ═══════════════════════════════════════════════════════════════════════ */
var М = {
  кубы: [],            /* что пришло с сервера */
  тела: [],            /* их положение в пространстве */
  мои: {},             /* номера моих кубов */
  отбор: [],           /* юниверс: какие кубы человек хочет видеть */
  я: null,

  угол: 0.5, наклон: 0.3,          /* где сцена сейчас */
  уголЦель: 0.5, наклонЦель: 0.3,  /* куда едет */
  /* Даль — на сколько камера отодвинута от роя. Чем меньше, тем ближе
     кубы. Колесо мыши и щипок двумя пальцами двигают «дальЦель», а
     сама даль догоняет её плавно — рывками рой разглядывать нельзя. */
  даль: 300, дальЦель: 300,
  сам: true,                        /* самовращение */

  тянем: false, тянулX: 0, тянулY: 0, ушлиX: 0, ушлиY: 0,
  уголТяги: 0.5, наклонТяги: 0.3,
  мышьX: -9999, мышьY: -9999,
  подНосом: null,

  Ш: 0, В: 0, звёзды: [], кадр: null
};

var ХОЛСТ = $('полотно');
var К = ХОЛСТ.getContext('2d');

/* ═══════════════════════════════════════════════════════════════════════
   ТОЧКА ПРОСТРАНСТВА → ТОЧКА ЭКРАНА.
   Поворот вокруг вертикальной оси, потом вокруг горизонтальной, потом
   перспектива: чем дальше точка, тем сильнее делим.
   ═══════════════════════════════════════════════════════════════════════ */
function наЭкран(x, y, z) {
  var cт = Math.cos(М.угол), sт = Math.sin(М.угол);
  var x1 =  x * cт + z * sт;
  var z1 = -x * sт + z * cт;

  var cф = Math.cos(М.наклон), sф = Math.sin(М.наклон);
  var y1 = y * cф - z1 * sф;
  var z2 = y * sф + z1 * cф;

  var обзор = Math.min(М.Ш, М.В) * 1.1;
  var д = обзор + z2 + М.даль;
  if (д <= 0) return null;
  var к = обзор / д;

  return { sx: М.Ш / 2 + x1 * к, sy: М.В / 2 - y1 * к, z: z2 };
}

function разобратьЦвет(ц) {
  var т = String(ц || '#0095F6').replace('#', '');
  if (т.length === 3) т = т[0]+т[0]+т[1]+т[1]+т[2]+т[2];
  var r = parseInt(т.slice(0, 2), 16), g = parseInt(т.slice(2, 4), 16), b = parseInt(т.slice(4, 6), 16);
  if (isNaN(r) || isNaN(g) || isNaN(b)) return { r: 0, g: 149, b: 246 };
  return { r: r, g: g, b: b };
}

/* Часы жизни куба: «∞», «12:04:37» или «истёк». */
function часыЖизни(сек) {
  if (сек <= 0) return 'истёк';
  сек = Math.round(сек);
  if (сек > 604800) return '∞';
  var ч = Math.floor(сек / 3600), м = Math.floor((сек % 3600) / 60), с = Math.floor(сек % 60);
  return ('0'+ч).slice(-2) + ':' + ('0'+м).slice(-2) + ':' + ('0'+с).slice(-2);
}

/* ═══════════════════════════════════════════════════════════════════════
   ОДИН ПРЕДМЕТ: вершины, грани, подпись над ним.

   Раньше здесь был жёстко написанный куб: восемь углов, шесть граней и
   свет по номеру грани. Теперь форма приходит из shared/формы.js —
   любая из двадцати, — а рисование одно на все: поворот вершин, проекция,
   сортировка граней по глубине, свет по тому, куда грань смотрит.

   Свет по номеру грани годился только кубу: у него грани всегда на своих
   местах. У шара или кристалла такого порядка нет.
   ═══════════════════════════════════════════════════════════════════════ */
function нарисоватьКуб(т, время) {
  var куб = т.куб;
  var ц = разобратьЦвет(куб.color);
  var м = CW.формы ? CW.формы.меш(CW.формы.какая(куб.id, куб.shape)) : null;
  if (!м) return;

  /* Прилёт издалека растит куб из точки: размер идёт от трёх процентов
     к полному. В остальное время множитель — единица. */
  var п = т.размер * (т.масш == null ? 1 : т.масш) / 2;
  var качание = Math.sin(время * т.качСкор + т.качСдвиг) * 18;
  var cр = Math.cos(т.своёВращ), sр = Math.sin(т.своёВращ);

  var точки = м.в.map(function (у) {
    var rx =  у[0] * cр + у[2] * sр;
    var rz = -у[0] * sр + у[2] * cр;
    return наЭкран(rx * п + т.x, у[1] * п + т.y + качание, rz * п + т.z);
  });

  var годные = точки.filter(Boolean);
  if (!годные.length) { т.скрыт = true; return; }

  т.сx = годные.reduce(function (с, р) { return с + р.sx; }, 0) / годные.length;
  т.сy = годные.reduce(function (с, р) { return с + р.sy; }, 0) / годные.length;
  т.сr = годные.reduce(function (м2, р) {
    return Math.max(м2, Math.abs(р.sx - т.сx), Math.abs(р.sy - т.сy));
  }, 20);
  /* Отдельно — насколько куб широк и насколько высок на экране. Раньше
     и табличка, и подсказка опирались на общий «радиус», а он берёт
     БОЛЬШЕЕ из двух: повёрнутый куб шире, чем выше, и табличка уезжала
     от него вверх на лишние полсотни точек. */
  т.сrX = годные.reduce(function (м2, р) {
    return Math.max(м2, Math.abs(р.sx - т.сx));
  }, 12);
  т.сrY = годные.reduce(function (м2, р) {
    return Math.max(м2, Math.abs(р.sy - т.сy));
  }, 12);

  if (т.сx < -200 || т.сx > М.Ш + 200 || т.сy < -200 || т.сy > М.В + 200) {
    т.скрыт = true; return;
  }
  т.скрыт = false;

  var подНосом = (М.подНосом === куб.id);
  var картинка = (CW.формы && CW.формы.наВсех()) ? CW.формы.своя() : null;

  /* Грани — от дальней к ближней, иначе задняя закрасит переднюю. */
  var грани = [];
  for (var i = 0; i < м.г.length; i++) {
    var г = м.г[i], пп = [], глубь = 0, целая = true;
    for (var j = 0; j < г.length; j++) {
      var р = точки[г[j]];
      if (!р) { целая = false; break; }
      пп.push(р); глубь += р.z;
    }
    /* Грань рисуем только целиком. Если хоть один угол не попал в кадр,
       многоугольник нарисовался бы по трём точкам — осколком. */
    if (!целая || пп.length < 3) continue;
    /* Нормаль берём по трём вершинам уже на экране: знак её z говорит,
       смотрит грань на нас или от нас. */
    var ax = пп[1].sx - пп[0].sx, ay = пп[1].sy - пп[0].sy;
    var bx = пп[2].sx - пп[0].sx, by = пп[2].sy - пп[0].sy;
    грани.push({ п: пп, д: глубь / пп.length, кнам: (ax * by - ay * bx) < 0 });
  }
  грани.sort(function (a, b) { return a.д - b.д; });

  for (var k = 0; k < грани.length; k++) {
    var ф = грани[k];
    /* Яркость от того, как грань развёрнута: ближние и «к нам» светлее.
       Для куба это даёт тот же вид, что был, для шара — настоящий объём. */
    var я = (ф.кнам ? 0.42 : 1.0) * (0.55 + 0.45 * ((ф.д + 400) / 800));
    я = Math.max(0.3, Math.min(1.15, я)) * (подНосом ? 1.28 : 1);

    if (картинка && !ф.кнам && ф.п.length === 4 && м.г.length <= 10) {
      натянуть(ф.п, картинка, я);
    } else if (картинка && !ф.кнам) {
      наклейка(ф.п, картинка, я, т);
    } else {
      К.beginPath();
      К.moveTo(ф.п[0].sx, ф.п[0].sy);
      for (var m2 = 1; m2 < ф.п.length; m2++) К.lineTo(ф.п[m2].sx, ф.п[m2].sy);
      К.closePath();
      К.fillStyle = 'rgba(' + Math.min(255, Math.round(ц.r * я)) + ','
                            + Math.min(255, Math.round(ц.g * я)) + ','
                            + Math.min(255, Math.round(ц.b * я)) + ',0.72)';
      К.fill();
      /* Обводку рисуем, пока граней немного: у шара из полутора сотен
         граней она превращает его в клубок ниток. */
      if (м.г.length < 30) {
        К.strokeStyle = 'rgba(' + ц.r + ',' + ц.g + ',' + ц.b + ','
                      + (подНосом ? 0.95 : 0.55) + ')';
        К.lineWidth = подНосом ? 1.8 : 0.9;
        К.stroke();
      }
    }
  }

  /* Знак на монете — поверх ближней плоской грани. */
  if (м.знак) {
    К.save();
    К.font = 'bold ' + Math.round(т.сr * 0.95) + 'px system-ui, sans-serif';
    К.textAlign = 'center'; К.textBaseline = 'middle';
    К.fillStyle = 'rgba(255,255,255,.92)';
    К.fillText(м.знак, т.сx, т.сy);
    К.restore();
  }

  подписать(т, куб);
}

/* ═══════════════════════════════════════════════════════════════════════
   СВОЯ КАРТИНКА НА ГРАНИ

   У полотна нет перспективного наложения картинок: оно умеет только
   линейное. Поэтому четырёхугольную грань делим пополам и для каждого
   треугольника считаем своё преобразование — так картинка садится
   ровно, без разъезжающихся швов.
   ═══════════════════════════════════════════════════════════════════════ */
function натянуть(п, им, я) {
  var ш = им.width, в = им.height;
  половина([п[0], п[1], п[2]], [[0,0],[ш,0],[ш,в]], им);
  половина([п[0], п[2], п[3]], [[0,0],[ш,в],[0,в]], им);
  if (я < 1) {
    К.save();
    К.beginPath(); К.moveTo(п[0].sx, п[0].sy);
    for (var i = 1; i < п.length; i++) К.lineTo(п[i].sx, п[i].sy);
    К.closePath();
    К.fillStyle = 'rgba(0,0,0,' + (1 - я).toFixed(2) + ')';
    К.fill(); К.restore();
  }
}

function половина(э, ис, им) {
  var x0 = ис[0][0], y0 = ис[0][1], x1 = ис[1][0], y1 = ис[1][1],
      x2 = ис[2][0], y2 = ис[2][1];
  var д = x0*(y2-y1) - x1*y2 + x2*y1 + (x1-x2)*y0;
  if (!д) return;
  var a = -(y0*(э[2].sx - э[1].sx) - y1*э[2].sx + y2*э[1].sx + (y1-y2)*э[0].sx) / д;
  var b =  (y1*э[2].sy + y0*(э[1].sy - э[2].sy) - y2*э[1].sy + (y2-y1)*э[0].sy) / д;
  var c =  (x0*(э[2].sx - э[1].sx) - x1*э[2].sx + x2*э[1].sx + (x1-x2)*э[0].sx) / д;
  var d = -(x1*э[2].sy + x0*(э[1].sy - э[2].sy) - x2*э[1].sy + (x2-x1)*э[0].sy) / д;
  var e =  (x0*(y2*э[1].sx - y1*э[2].sx) + y0*(x1*э[2].sx - x2*э[1].sx)
            + (x2*y1 - x1*y2)*э[0].sx) / д;
  var f =  (x0*(y2*э[1].sy - y1*э[2].sy) + y0*(x1*э[2].sy - x2*э[1].sy)
            + (x2*y1 - x1*y2)*э[0].sy) / д;
  К.save();
  К.beginPath();
  К.moveTo(э[0].sx, э[0].sy); К.lineTo(э[1].sx, э[1].sy);
  К.lineTo(э[2].sx, э[2].sy); К.closePath(); К.clip();
  К.transform(a, b, c, d, e, f);
  try { К.drawImage(им, 0, 0); } catch (е) {}
  К.restore();
}

/* У шара, звезды и икосаэдра грани треугольные: натянуть их двумя
   треугольниками нельзя. Кладём ОДНУ картинку на весь предмет и
   обрезаем её по грани — на фигуре видно цельное изображение, как
   наклейку, а не мозаику из полусотни маленьких картинок. */
function наклейка(п, им, я, т) {
  var сторона = т.сr * 2;
  if (!(сторона > 0.5)) return;
  К.save();
  К.beginPath();
  К.moveTo(п[0].sx, п[0].sy);
  for (var i = 1; i < п.length; i++) К.lineTo(п[i].sx, п[i].sy);
  К.closePath(); К.clip();
  К.globalAlpha = Math.max(0.42, Math.min(1, я));
  try { К.drawImage(им, т.сx - т.сr, т.сy - т.сr, сторона, сторона); } catch (е) {}
  К.restore();
}

/* ── НАШ ЗНАЧОК НА ПОЛОТНЕ ──
   Значки у нас — пути в клетке 24×24 (shared/icons.js). В разметке их
   рисует SVG, а здесь полотно: берём тот же путь, масштабируем под
   нужную сторону и обводим той же толщиной. Второго списка значков
   заводить не пришлось — список один, и разойтись ему не с чем.

   Разобранные пути помним: Path2D собирается из строки каждый раз, а
   подписи перерисовываются шестьдесят раз в секунду. */
var ПУТИ = {};
/* Одна толщина на всю табличку: и рамка, и значок внутри неё. */
var ЛИНИЯ_ТАБЛИЧКИ = 1.2;

function нарисоватьЗнак(имя, x, y, сторона, цвет) {
  var путь = ПУТИ[имя];
  if (путь === undefined) {
    var д = CW.путьЗначка ? CW.путьЗначка(имя) : '';
    путь = ПУТИ[имя] = д ? new Path2D(д) : null;
  }
  if (!путь) return;
  К.save();
  К.translate(x, y);
  К.scale(сторона / 24, сторона / 24);
  К.strokeStyle = цвет;
  /* Толщина линии ровно такая же, как у рамки таблички: 1.2 точки на
     экране. Делим на масштаб, потому что сам путь нарисован в клетке
     24×24 и мы его ужали. Раньше здесь стояло 1.445, и значок рядом с
     тонкой рамкой читался жирнее неё — одна табличка выглядела
     нарисованной двумя разными инструментами. */
  К.lineWidth = ЛИНИЯ_ТАБЛИЧКИ * (24 / сторона);
  К.lineCap = 'round'; К.lineJoin = 'round';
  К.stroke(путь);
  К.restore();
}

/* ═══════════════════════════════════════════════════════════════════════
   СМАЙЛ НА ТАБЛИЧКЕ - В ЦВЕТЕ КУБА, А НЕ В СВОЁМ.

   Смайл рисует система, и рисует его цветным: палитра разноцветная,
   яблоко зелёное, замок золотой. На табличке куба это выбивается -
   рядом стоят наши значки одной линией, в цвете куба.

   Красили фильтром холста (ctx.filter). На компьютере он работает, и
   Анна видела ровно то, что задумано. На её айфоне - нет: Сафари
   выучил фильтр у холста совсем недавно, а до того молча его
   пропускал. Поэтому в мире на телефоне смайлы стояли в своих родных
   цветах, а на компьютере - в цвете куба. Одна программа, два вида.

   Запасной путь работает везде и без фильтров: рисуем смайл на
   отдельном маленьком холсте, заливаем этот холст цветом в режиме
   source-in - краска ложится только туда, где смайл, - и переносим
   готовое на табличку. Выходит силуэт смайла в цвете куба.

   ── ПОЧЕМУ ПРОВЕРЯЕМ КРАСКОЙ, А НЕ ВОПРОСОМ ──
   Сперва я спрашивала просто: присвоила фильтр и прочла обратно.
   Этого мало. Сафари у Анны ОТВЕЧАЕТ, что фильтр понял, а краску не
   кладёт - и мы шли «рабочим» путём, который на её телефоне ничего не
   красит. Снимок после той сборки пришёл ровно такой же.

   Поэтому проверка делом: кладём серую точку под тем самым набором
   фильтров, что и у значков, и смотрим, что вышло. Посерела и осталась
   серой - фильтра нет, как бы браузер ни отвечал. Окрасилась - есть.
   Одна точка, один раз за посещение.
   ═══════════════════════════════════════════════════════════════════════ */
var ФИЛЬТРХОЛСТА = (function () {
  try {
    var х = document.createElement('canvas');
    х.width = х.height = 1;
    var к = х.getContext('2d');
    к.filter = 'grayscale(1) sepia(1) hue-rotate(90deg) saturate(4)';
    к.fillStyle = '#808080';
    к.fillRect(0, 0, 1, 1);
    var д = к.getImageData(0, 0, 1, 1).data;
    if (д[3] < 200) return false;
    return (Math.max(д[0], д[1], д[2]) - Math.min(д[0], д[1], д[2])) > 30;
  } catch (е) { return false; }
})();

var ХОЛСТИК = null;

function смайлВЦвете(смайл, x, y, цвет) {
  if (!смайл) return;
  if (ФИЛЬТРХОЛСТА && CW.тонЗнака) {
    К.filter = CW.тонЗнака(цвет);
    К.fillText(смайл, x, y);
    К.filter = 'none';
    return;
  }
  var ш = Math.ceil(К.measureText(смайл).width) + 4;
  var в = 22, низ = 15;              /* где у смайла основание строки */
  var густо = Math.min(window.devicePixelRatio || 1, 3);
  if (!ХОЛСТИК) ХОЛСТИК = document.createElement('canvas');
  ХОЛСТИК.width = Math.max(1, Math.ceil(ш * густо));
  ХОЛСТИК.height = Math.max(1, Math.ceil(в * густо));
  var м = ХОЛСТИК.getContext('2d');
  м.setTransform(густо, 0, 0, густо, 0, 0);
  м.clearRect(0, 0, ш, в);
  м.font = К.font;
  м.textAlign = 'left';
  м.textBaseline = 'alphabetic';
  м.fillText(смайл, 0, низ);
  м.globalCompositeOperation = 'source-in';
  м.fillStyle = цвет;
  м.fillRect(0, 0, ш, в);
  К.drawImage(ХОЛСТИК, x, y - низ, ш, в);
}

/* Подпись над кубом: рамка, значок с именем, часы, «★ МОЙ ★». */
function подписать(т, куб) {
  /* У персонажа подписи нет: табличка вставала ему ровно на глаза. */
  if (CW.персонаж && CW.персонаж.кто() && CW.персонаж.тело() === т) return;

  var цвет = куб.color || '#0095F6';
  /* Значок куба красится СВОИМ цветом, а не цветом куба: при создании
     это два разных меню. Старые кубы своего цвета значка не знают —
     у них он пустой, и значок берёт цвет куба, как и раньше. */
  var свойЦвет = CW.цветЗначка ? CW.цветЗначка(куб) : (куб.icon_color || '');
  var цветЗнака = свойЦвет || цвет;
  /* Что рисовать: смайл хозяина, наш значок линиями (так подписаны
     постоянные кубы площадки) или 📸, если на кубе фотография. */
  var лицо = CW.значокКуба ? CW.значокКуба(куб.icon)
                           : { вид: 'смайл', знак: куб.icon || '📦' };
  var значок = лицо.вид === 'фото' ? '📸' : (лицо.знак || '');
  /* Над кубом стоит ТОТ значок, который выбрал хозяин, и никакой
     другой. Раньше мы подменяли смайл своим значком линиями, если пара
     находилась: выбрал яблоко, а над кубом ящик, потому что пары
     яблоку нет, зато она есть у коробки по умолчанию. Подмена сбивала
     с толку сильнее, чем разные смайлы на разных системах.

     Смайл рисуем отдельной надписью, а не внутри имени: только так его
     можно покрасить в выбранный цвет. Цветной смайл — картинка в
     шрифте, цветом текста ей не укажешь, поэтому красим фильтром, тем
     же, что в окне выбора значка. */
  var наш = лицо.вид === 'линия' ? лицо.имя : '';
  var смайл = наш ? '' : значок;
  var имя = куб.name || ('Куб ' + куб.id);
  var часы = часыЖизни(куб.life);

  К.save();
  К.font = 'bold 11px sans-serif';
  var ЗН = 13;                       /* сторона значка в точках */
  var щель = 5;
  var шС = смайл ? К.measureText(смайл + ' ').width : 0;
  var шИ = К.measureText(имя).width + (наш ? ЗН + щель : шС);
  К.font = '9px ui-monospace, monospace';
  var шЧ = К.measureText(часы).width;

  var ш = Math.max(шИ, шЧ) + 18, в = 34;
  /* Табличка стоит вплотную над кубом: четыре точки зазора, не больше.
     Высоту берём именно вертикальную, а не общий радиус. */
  var x = т.сx - ш / 2, y = т.сy - (т.сrY || т.сr) - в - 4, р = 6;

  К.fillStyle = 'rgba(5,5,26,0.88)';
  К.beginPath();
  К.moveTo(x + р, y);
  К.lineTo(x + ш - р, y);     К.arcTo(x + ш, y, x + ш, y + р, р);
  К.lineTo(x + ш, y + в - р); К.arcTo(x + ш, y + в, x + ш - р, y + в, р);
  К.lineTo(x + р, y + в);     К.arcTo(x, y + в, x, y + в - р, р);
  К.lineTo(x, y + р);         К.arcTo(x, y, x + р, y, р);
  К.closePath();
  К.fill();
  К.strokeStyle = цвет; К.lineWidth = ЛИНИЯ_ТАБЛИЧКИ; К.stroke();

  К.textAlign = 'center';
  К.fillStyle = '#e0e0f8'; К.font = 'bold 11px sans-serif';
  if (наш) {
    /* Значок рисуем тем же путём, что и в разметке: одна клетка 24×24,
       одна толщина. Имя при этом сдвигается вправо на ширину значка,
       чтобы вся строка осталась по центру таблички. */
    var шТ = К.measureText(имя).width;
    var слева = т.сx - (шТ + ЗН + щель) / 2;
    нарисоватьЗнак(наш, слева, y + 15 - ЗН / 2, ЗН, цветЗнака);
    К.textAlign = 'left';
    К.fillText(имя, слева + ЗН + щель, y + 15);
    К.textAlign = 'center';
  } else if (смайл) {
    var слева2 = т.сx - (шС + К.measureText(имя).width) / 2;
    К.textAlign = 'left';
    /* Красим ВСЕГДА: свой цвет значка, а если его не выбирали — цвет
       куба. Раньше фильтр ставился только при своём цвете, и смайл у
       кубов без него оставался жёлтым, хотя в списке «Юниверс» тот же
       куб стоял в цвете. Красится значок, не куб. */
    смайлВЦвете(смайл, слева2, y + 15, цветЗнака);
    К.fillText(имя, слева2 + шС, y + 15);
    К.textAlign = 'center';
  } else {
    К.fillText(имя, т.сx, y + 15);
  }
  К.fillStyle = цвет; К.font = '9px ui-monospace, monospace';
  К.fillText(часы, т.сx, y + 28);

  if (М.мои[куб.id]) {
    К.fillStyle = цвет; К.font = 'bold 8px sans-serif';
    К.fillText('★ МОЙ ★', т.сx, y - 5);
  }
  К.restore();
}

/* ── СТОРОЖ ПЛАВНОСТИ ──
   Считает кадры двухсекундными окнами. Стало совсем туго — полотно
   становится пожиже, и так до самой единицы. Два окна подряд
   пропускаем в начале: первые секунды страница ещё грузит лица, шрифты
   и сам мир, и мерить по ним нечестно.

   ── ПОЧЕМУ ЭТО ПРИШЛОСЬ ПЕРЕДЕЛАТЬ ──
   Анна: «качество кубов теряется, пока они крутятся, становятся всё
   больше размытыми, кубы должны быть чёткие, линии не плывут».

   Так и было, и вот отчего. Сторож считал плохим любое окно ниже
   сорока пяти кадров - а ровно столько и выходит, пока мир ТЯНУТ
   мышью или пальцем: кадр тяжелее обычного, браузер гонит события
   ввода, и полсотни не набирается. Два таких окна подряд набегали за
   четыре секунды кручения, и чёткость падала на ступень. Покрутил
   подольше - упала ещё. А обратно она почти не возвращалась:
   возвратов было не больше двух за всю страницу, и для каждого
   требовалось шесть секунд подряд выше пятидесяти семи кадров, чего
   на шестидесятигерцевом экране при любом фоновом деле не бывает.
   Замер показал это числом: плотность 1,5 до кручения, 1,25 после, и
   через девять секунд покоя та же 1,25.

   Три поправки, и каждая отвечает своей причине:

   1. Пока мир тянут или идёт игра, окна НЕ считаем вовсе. Это как раз
      те мгновения, ради которых человек и смотрит на мир, и терять в
      них чёткость - ровно наоборот тому, что нужно. Кадры в такие
      окна не копим, окно начинаем заново.
   2. Порог опущен с сорока пяти кадров до тридцати. Сорок пять - это
      не «тормозит», это «не идеально». Ниже тридцати мир и правда
      дёргается, вот там чёткостью платить и стоит.
   3. Предел на число возвратов снят. Он и делал потерю чёткости
      вечной. Чтобы мир при этом не дышал - то резче, то мягче, - после
      каждой пары возвратов требуемое время хорошей работы удваивается:
      шесть секунд, потом двенадцать, потом двадцать четыре. Выше
      того, что умеет сам экран, почётче() и так не поднимет. */
var СТОРОЖ = { окно: 0, кадров: 0, пропусков: 2, подряд: 0, хорошо: 0, возвратов: 0 };
var ПЛОХО  = 30;     /* ниже стольких кадров в секунду - и правда туго */
var ХОРОШО = 40;     /* столько держится - можно вернуть чёткость      */

function заняты() {
  /* Тянут мир или идёт игра: кадр заведомо тяжелее, и мерить по нему
     нельзя. Проверяем оба занятия в одном месте, чтобы сторож и круг
     отрисовки не разошлись в том, что считать «занято». */
  return !!(М.тянем || (CW.игра && CW.игра.идёт()));
}

function сторожПлавности(сейчас) {
  if (!СТОРОЖ.окно) { СТОРОЖ.окно = сейчас; СТОРОЖ.кадров = 0; return; }
  if (заняты()) { СТОРОЖ.окно = сейчас; СТОРОЖ.кадров = 0; return; }
  СТОРОЖ.кадров++;
  var прошло = сейчас - СТОРОЖ.окно;
  if (прошло < 2000) return;
  var всек = СТОРОЖ.кадров / (прошло / 1000);
  СТОРОЖ.окно = сейчас; СТОРОЖ.кадров = 0;
  if (СТОРОЖ.пропусков > 0) { СТОРОЖ.пропусков--; return; }
  /* Жиже делаем не с первого плохого окна, а со второго подряд: одно
     окно проседает и от чужого дела - приехала картинка, страница
     что-то посчитала. Из-за одной такой секунды терять чёткость
     навсегда не стоит. */
  СТОРОЖ.подряд = (всек < ПЛОХО) ? (СТОРОЖ.подряд + 1) : 0;
  if (СТОРОЖ.подряд >= 2) {
    СТОРОЖ.подряд = 0; СТОРОЖ.хорошо = 0;
    пожиже();
    return;
  }

  /* ── И ОБРАТНО, КОГДА ПОЛЕГЧАЛО ──
     Тяжесть бывает временной: шёл эфир с камерой, крутилась игра,
     телефон грелся. Держится нужное число кадров - чёткость
     возвращаем на ступень вверх. */
  var надо = 3 * Math.pow(2, Math.floor(СТОРОЖ.возвратов / 2));
  СТОРОЖ.хорошо = (всек >= ХОРОШО) ? (СТОРОЖ.хорошо + 1) : 0;
  if (СТОРОЖ.хорошо >= надо) {
    СТОРОЖ.хорошо = 0;
    if (почётче()) СТОРОЖ.возвратов++;
  }
}

/* ═══════════════════════════════════════════════════════════════════════
   ПОКОЙ — КОГДА НИКТО НЕ СМОТРИТ

   Мир — самое тяжёлое место программы: холст во весь экран, шестьдесят
   кадров в секунду, и он крутится сам. Человек положил телефон на стол
   и ушёл за чаем — а мир всё рисует, греет корпус и жжёт заряд. Анна
   спросила прямо: может ли программа сжечь телефон. Сжечь не может —
   защита по температуре стоит в самом железе, ниже браузера, и
   страницу об этом даже не спрашивают. Но греть зря — может, и это
   наша вина, а не телефона.

   Поэтому: минуту никто не касался экрана — самовращение
   останавливается, и кадр рисуется раз в десять заходов, то есть
   примерно шесть раз в секунду вместо шестидесяти. Глазом это не
   видно: человек не смотрит. Первое касание, нажатие, колесо мыши или
   голосовая команда возвращают всё мгновенно.

   Пока идёт игра, покоя нет: кубы летят сами, и рваные кадры было бы
   видно. Кадры в скрытой вкладке останавливает сам браузер — об этом
   заботиться не нужно.
   ═══════════════════════════════════════════════════════════════════════ */
var ПОКОЙ_ЧЕРЕЗ = 60000;   /* сколько молчать до покоя */
var ПОКОЙ_ШАГ   = 10;      /* рисуем каждый десятый заход */
var ТРОНУЛИ = (окноПерф());
var ПОКОЙСЧЁТ = 0;
var СВЕРКАРАЗМЕРА = 0;

function окноПерф() {
  try { return performance.now(); } catch (е) { return Date.now(); }
}

function тронули() {
  ТРОНУЛИ = окноПерф();
}

/* Любое человеческое действие на странице — это «тронули». Слушаем на
   захвате и пассивно: так мы не мешаем ни одному обработчику ниже. */
['pointerdown', 'pointermove', 'touchstart', 'touchmove', 'wheel',
 'keydown', 'click'].forEach(function (и) {
  window.addEventListener(и, тронули, { capture: true, passive: true });
});

function вПокое() {
  if (CW.игра && CW.игра.идёт && CW.игра.идёт()) return false;
  if (М.тянем) return false;
  return (окноПерф() - ТРОНУЛИ) > ПОКОЙ_ЧЕРЕЗ;
}

/* ═══════════════════════════════════════════════════════════════════════
   КРУГ ОТРИСОВКИ. Единственный. Другого в файле нет.
   ═══════════════════════════════════════════════════════════════════════ */
function круг() {
  М.кадр = requestAnimationFrame(круг);
  if (!К || М.Ш < 4 || М.В < 4) return;

  /* Подстраховка на случай, когда события об изменении размера не
     пришло вовсе: раз в тридцать кадров (полсекунды) сверяем настоящий
     размер обёртки с тем, по которому рисуем. Разошлись — меряем
     заново. Чтение двух чисел раз в полсекунды дешевле, чем мир,
     который остался ростом с поперечный экран. */
  СВЕРКАРАЗМЕРА = (СВЕРКАРАЗМЕРА + 1) % 30;
  if (!СВЕРКАРАЗМЕРА) {
    var об = $('обёртка');
    if (об && (об.clientWidth !== М.Ш || об.clientHeight !== М.В)
           && об.clientWidth > 3 && об.clientHeight > 3) померить();
  }

  /* Покой: заход пропускаем целиком — ни счёта, ни рисования. Сторожа
     плавности тоже не зовём: он мерил бы наши же пропуски и честно
     решил, что телефон слабый. */
  if (вПокое()) {
    М.сам = false;
    ПОКОЙСЧЁТ = (ПОКОЙСЧЁТ + 1) % ПОКОЙ_ШАГ;
    if (ПОКОЙСЧЁТ) return;
  } else if (ПОКОЙСЧЁТ) {
    /* Вышли из покоя: окно сторожа начинаем заново. Иначе он поделил бы
       наши пропущенные заходы на прошедшие секунды, решил, что телефон
       слабый, и навсегда сбросил чёткость. */
    ПОКОЙСЧЁТ = 0;
    СТОРОЖ.окно = 0; СТОРОЖ.кадров = 0;
  }

  var время = performance.now() / 1000;
  сторожПлавности(время * 1000);

  if (М.сам) М.уголЦель += 0.004;
  М.угол   += (М.уголЦель   - М.угол)   * 0.08;
  М.наклон += (М.наклонЦель - М.наклон) * 0.08;
  М.даль   += (М.дальЦель   - М.даль)   * 0.12;
  М.тела.forEach(function (т) { т.своёВращ += т.своёСкор; });

  /* ── ИГРА ──
     Один шаг физики на кадр, и зовём его отсюда, а не своим кругом:
     два requestAnimationFrame на одной странице — это два разных
     «сейчас», и кубы в них дрожат. Игра не идёт — шаг сразу выходит. */
  if (CW.игра) CW.игра.шаг();

  /* небо */
  /* ── РЕЖИМ КАМЕРЫ ──
     Небо и звёзды рисует холст, и он закрывает собой всё, что лежит
     под страницей, — в том числе картинку с камеры. Оттого камера на
     этой странице и «не передавалась»: она была на месте, просто
     поверх неё каждый кадр заливалось звёздное небо.

     Поэтому под камерой холст не заливаем, а ОЧИЩАЕМ: кубы и подписи
     остаются, а между ними видно камеру. А звёзды рисуем в обоих
     случаях: гасить их незачем — заливки под ними нет, и сквозь них
     камера видна по-прежнему.

     Метку читаем с <html> каждый кадр, а не один раз при запуске:
     человек меняет тему, не перезагружая страницу, и мир обязан
     откликнуться сразу. Чтение атрибута стоит доли микросекунды. */
  var подКамерой = document.documentElement.getAttribute('data-камера') === 'да';
  if (подКамерой) {
    К.clearRect(0, 0, М.Ш, М.В);
  } else {
  var небо = К.createRadialGradient(М.Ш/2, М.В/2, 0, М.Ш/2, М.В/2, Math.max(М.Ш, М.В) * 0.75);
  небо.addColorStop(0, '#0c0a2e');
  небо.addColorStop(0.55, '#050518');
  небо.addColorStop(1, '#030310');
  К.fillStyle = небо; К.fillRect(0, 0, М.Ш, М.В);
  }

  /* звёзды мерцают */
  М.звёзды.forEach(function (з) {
    var мерц = 0.4 + 0.6 * Math.abs(Math.sin(время * 0.6 + з.ф));
    К.beginPath();
    К.arc(з.x * М.Ш, з.y * М.В, з.r, 0, 6.283);
    К.fillStyle = 'rgba(255,255,255,' + (з.я * мерц).toFixed(2) + ')';
    К.fill();
  });

  /* что под носом */
  М.подНосом = null;
  var ближе = 9999;
  М.тела.forEach(function (т) {
    if (т.куб.life <= 0 || т.скрыт) return;
    var дx = М.мышьX - т.сx, дy = М.мышьY - т.сy;
    var д = Math.sqrt(дx*дx + дy*дy);
    if (д < т.сr * 1.4 && д < ближе) { ближе = д; М.подНосом = т.куб.id; }
  });

  /* кубы — от дальнего к ближнему */
  М.тела.filter(function (т) { return т.куб.life > 0; })
    .sort(function (a, b) {
      var па = наЭкран(a.x, a.y, a.z), пб = наЭкран(b.x, b.y, b.z);
      return (па ? па.z : 0) - (пб ? пб.z : 0);
    })
    .forEach(function (т) { нарисоватьКуб(т, время); });

  /* ── ЛИЦО ПЕРСОНАЖА ──
     Отдельным проходом, после всей сцены. Если рисовать его в свой
     черёд, следующие кубы и их таблички лягут сверху — кот оказывался
     за чужой подписью. */
  if (CW.персонаж && CW.персонаж.кто()) {
    var живой = CW.персонаж.тело();
    if (живой && !живой.скрыт) CW.персонаж.лицо(К, живой);
  }

  показатьПодсказку();
}

function показатьПодсказку() {
  var п = $('подсказка');
  if (!М.подНосом) { п.style.display = 'none'; return; }
  var т = null;
  for (var i = 0; i < М.тела.length; i++) {
    if (М.тела[i].куб.id === М.подНосом) { т = М.тела[i]; break; }
  }
  if (!т) { п.style.display = 'none'; return; }

  var куб = т.куб;
  var открыт = !куб.type || куб.type === 'public';
  /* В подписи на полотне смайл куба уже заменён нашим значком. Здесь,
     в подсказке, он был смайлом — и один и тот же куб выглядел двумя
     разными иконками. Берём тот же значок; если смайлу у нас пары нет,
     остаётся сам смайл. */
  /* В подсказке тот же значок, что над кубом. */
  var лицоК = CW.значокКуба ? CW.значокКуба(куб.icon)
                            : { вид: 'смайл', знак: куб.icon || '📦' };
  var смайл = лицоК.вид === 'фото' ? '📸' : (лицоК.знак || '📦');
  var пара = лицоК.вид === 'линия' ? лицоК.имя : '';
  var цв = куб.color || '#0095F6';
  var свойЦв = CW.цветЗначка ? CW.цветЗначка(куб) : (куб.icon_color || '');
  var цвЗн = свойЦв || цв;
  $('п-имя').innerHTML =
      (пара ? '<span style="color:' + CW.безопасно(цвЗн) + '">' + CW.значок(пара) + '</span>'
            : '<span' + (CW.тонЗнака
                         ? ' style="filter:' + CW.тонЗнака(цвЗн) + '"' : '')
              + '>' + CW.безопасно(смайл) + '</span>')
    + '<span>' + CW.безопасно(куб.name || Т.с('Куб {н}', { н: куб.id })) + '</span>';
  $('п-имя').style.color = цв;
  /* У восьми кубов площадки описание наше, и оно идёт через словарь:
     см. CW.описаниеКуба в shared/icons.js. Чужое описание не трогаем. */
  $('п-опис').textContent = (CW.описаниеКуба ? CW.описаниеКуба(куб)
                                             : куб.description)
                         || Т('Без описания');
  $('п-часы').textContent = часыЖизни(куб.life);
  var вид = $('п-вид');
  вид.textContent = открыт ? Т('ОТКРЫТЫЙ') : Т('ПО КЛЮЧУ');
  вид.className = 'вид ' + (открыт ? 'открытый' : 'закрытый');

  /* Подсказка встаёт ВПЛОТНУЮ к кубу, с его правого бока, и держится
     на его высоте. Раньше она отсчитывалась от середины куба и висела
     в стороне: у широкого куба это полсотни точек пустоты, а у края
     экрана она и вовсе уезжала к столбцу кнопок.

     Не помещается справа — переходит налево, к другому боку. Внутри
     рамы её всё равно удерживаем: за чёрным полем ей делать нечего. */
  var рамка = $('обёртка').getBoundingClientRect();
  var ширина = п.offsetWidth || 230;
  var высота = п.offsetHeight || 96;
  var бок = (т.сrX || т.сr) + 12;

  var x = рамка.left + т.сx + бок;
  if (x + ширина > рамка.right - 10) x = рамка.left + т.сx - бок - ширина;
  x = Math.max(рамка.left + 10, Math.min(x, рамка.right - ширина - 10));

  var y = рамка.top + т.сy - высота / 2;
  y = Math.max(рамка.top + 10, Math.min(y, рамка.bottom - высота - 10));

  /* ── ОТКУДА СЧИТАЮТСЯ left и top ──
     Подсказка стоит position:fixed, и по правилам она должна мериться
     от окна браузера. Но у .рама есть transform (translateX(-50%) —
     ею рама стоит по центру), а элемент с transform становится новым
     началом отсчёта для всего fixed внутри. Поэтому числа из
     getBoundingClientRect (они всегда от окна) нужно перевести в
     систему рамы, иначе подсказка уезжает вправо ровно на ширину
     левого поля — те самые двести точек. */
  var рама = document.querySelector('.рама');
  var нуль = рама ? рама.getBoundingClientRect() : null;
  if (нуль) { x -= нуль.left; y -= нуль.top; }

  п.style.left = x + 'px';
  п.style.top  = y + 'px';
  п.style.display = 'block';
}

/* ═══════════════════════════════════════════════════════════════════════
   РАССТАНОВКА. Кубы по кольцу, каждый на своей высоте.
   Все «случайные» величины берутся из номера куба: мир должен
   перерисовываться одинаково, а не тасоваться при каждом обновлении.
   ═══════════════════════════════════════════════════════════════════════ */
function своё(номер, сдвиг) {
  var з = Math.sin(номер * 12.9898 + сдвиг * 78.233) * 43758.5453;
  return з - Math.floor(з);                   /* 0 … 1, но всегда одно и то же */
}

function поставить(куб, место, всего) {
  var угол = (место / Math.max(всего, 1)) * Math.PI * 2 + своё(куб.id, 1) * 0.4;
  var радиус = 170 + своё(куб.id, 2) * 90;
  М.тела.push({
    куб: куб,
    x: Math.cos(угол) * радиус,
    y: (своё(куб.id, 3) - 0.5) * 110,
    z: Math.sin(угол) * радиус,
    размер: (куб.size || 2) * 38 + своё(куб.id, 4) * 8,
    своёВращ: своё(куб.id, 5) * Math.PI * 2,
    своёСкор: (своё(куб.id, 6) - 0.5) * 0.009,
    качСдвиг: своё(куб.id, 7) * Math.PI * 2,
    качСкор: 0.28 + своё(куб.id, 8) * 0.45,
    сx: М.Ш / 2, сy: М.В / 2, сr: 40, скрыт: false
  });
}

function пересобрать() {
  /* Уже стоящие кубы оставляем на своих местах: иначе при обновлении
     списка мир подпрыгивает. */
  var было = {};
  М.тела.forEach(function (т) { было[т.куб.id] = т; });

  /* ── ЮНИВЕРС ──
     Человек отбирает кубы в окне «Мой Юниверс», и мир показывает
     только их. Пустой отбор значит «только кубы площадки»: новый
     человек видит восемь постоянных кубов, а чужие приходят в его мир
     по галочке, а не все разом. Небо при этом не пустое. */
  var видные = М.кубы.filter(вОтборе);

  М.тела = [];
  видные.forEach(function (куб, и) {
    if (куб.life <= 0) return;
    if (было[куб.id]) { было[куб.id].куб = куб; М.тела.push(было[куб.id]); }
    else поставить(куб, и, видные.length);
  });

  состояние(М.тела.length
    ? ''
    : (М.кубы.length ? Т('Ни один куб не отмечен в Юниверсе') : Т('Кубов пока нет')),
    М.тела.length > 0);
}

function вОтборе(куб) {
  if (М.отбор.length) return М.отбор.indexOf(String(куб.id)) >= 0;
  return площадкин(куб);
}

/* Куб площадки — тот, у кого нет хозяина: восемь постоянных кубов
   завёл сервер. Старый сервер поля owner_id не отдаёт вовсе, и тогда
   это условие верно для всех — мир покажет всё, как раньше. Пустое
   небо хуже лишних кубов. */
function площадкин(куб) {
  return !!куб && куб.owner_id == null;
}

/* Функции «склонение» здесь больше нет: её звала одна-единственная
   надпись «N кубов», а надписи не стало. Код, который никто не зовёт,
   со временем начинает врать, и никто этого не замечает. */

function состояние(текст, спрятать) {
  var с = $('состояние');
  if (текст) с.textContent = текст;
  с.classList.toggle('прячется', !!спрятать);
}

/* жизнь кубов тикает — часы в подписи идут */
setInterval(function () {
  М.кубы.forEach(function (к) { if (к.life > 0) к.life--; });
}, 1000);

/* ═══════════════════════════════════════════════════════════════════════
   РАЗМЕР ПОЛОТНА
   ═══════════════════════════════════════════════════════════════════════ */
/* ── СКОЛЬКО ТОЧЕК РИСУЕМ НА ОДНУ ЭКРАННУЮ ──
   Мир рисуется кистью по полотну, и цена кадра здесь — это ровно
   площадь полотна. Телефон говорит «у меня три точки на одну», и на
   экране 390×844 полотно выходит 1170×2367 — два с половиной
   миллиона точек на каждый кадр.

   Замер на стенде, телефонное окно, одна и та же сцена:

       плотность 3   24,6 кадра в секунду
       плотность 2   50,9
       плотность 1   60,2

   И это ВСЯ разница: без звёзд 25,1, без кубов 24,8, без неба 24,9 —
   то есть ни звёзды, ни кубы, ни небо почти ничего не стоят. Стоят
   точки.

   Поэтому плотность ограничена двойкой. Глазом два и три не
   различить: грань куба на тройке острее на треть точки, а кадров
   вдвое меньше — и вот это видно сразу, как дёрганье.

   Если и на двойке не выходит полсотни кадров (слабый телефон, жара,
   экономия заряда), мир сам опускается до полутора, а потом до
   четверти сверх единицы. Обратно не поднимается: прыгающая
   чёткость хуже ровной. */
var ПРЕДЕЛПЛОТНОСТИ = 2;
var СТУПЕНИ = [2, 1.5, 1.25, 1];

function плотностьМира() {
  return Math.min(window.devicePixelRatio || 1, ПРЕДЕЛПЛОТНОСТИ);
}

function пожиже() {
  var и = СТУПЕНИ.indexOf(ПРЕДЕЛПЛОТНОСТИ);
  if (и < 0 || и >= СТУПЕНИ.length - 1) return false;
  ПРЕДЕЛПЛОТНОСТИ = СТУПЕНИ[и + 1];
  померить();
  return true;
}

function почётче() {
  var и = СТУПЕНИ.indexOf(ПРЕДЕЛПЛОТНОСТИ);
  if (и <= 0) return false;
  /* Выше того, что умеет сам экран, подниматься незачем: лишние точки
     рисуются, а глазу их не видно. */
  if (СТУПЕНИ[и - 1] > (window.devicePixelRatio || 1)) return false;
  ПРЕДЕЛПЛОТНОСТИ = СТУПЕНИ[и - 1];
  померить();
  return true;
}

function померить() {
  var о = $('обёртка');
  var плотность = плотностьМира();
  М.Ш = о.clientWidth || window.innerWidth;
  М.В = о.clientHeight || window.innerHeight;
  ХОЛСТ.width = Math.round(М.Ш * плотность);
  ХОЛСТ.height = Math.round(М.В * плотность);
  ХОЛСТ.style.width = М.Ш + 'px';
  ХОЛСТ.style.height = М.В + 'px';
  К.setTransform(плотность, 0, 0, плотность, 0, 0);
}

/* ── ПОВОРОТ ТЕЛЕФОНА ──
   Беда с картинки Анны: стоймя → поперёк → снова стоймя, и мир остаётся
   ростом с поперечный экран — узкая полоска вверху, под ней чернота.

   Причина в том, что resize на телефоне приходит РАНЬШЕ, чем страница
   перестроилась. Мы меряем обёртку в этот миг и получаем старую высоту,
   а второго события уже не будет: для браузера всё случилось.

   Поэтому меряем не один раз, а несколько: сразу, следующим кадром и
   ещё трижды с задержкой. Лишние замеры ничего не стоят — это чтение
   двух чисел и установка размера холсту, — а картинку спасают. */
function перемерить() {
  померить();
  requestAnimationFrame(померить);
  setTimeout(померить, 120);
  setTimeout(померить, 350);
  setTimeout(померить, 800);
}

/* ═══════════════════════════════════════════════════════════════════════
   ВВОД

   Два разных занятия на одном экране, и путает их только тот, кто не
   знает про ладонь в столбике:

       игра выключена   тянем — крутим сцену, коротко нажали — входим в куб
       игра идёт        куб под пальцем можно вести, бросать и бить,
                        пустое место по-прежнему крутит сцену,
                        колесо и два пальца двигают рой вглубь и обратно

   Пока игра идёт, нажатие на куб в него НЕ уводит. Иначе любой удар
   заканчивался бы уходом со страницы, а именно удара человек и хотел.
   Чтобы войти в куб, игру выключают ладонью (двойное нажатие).

   Телефон трясётся при каждом касании куба: щелчок за касание, долгая
   дрожь за прямой удар, несколько толчков — если задело несколько
   кубов. Это и есть «почувствовать куб пальцем».
   ═══════════════════════════════════════════════════════════════════════ */
(function ввод() {
  var о = $('обёртка');

  function играем() { return !!(CW.игра && CW.игра.идёт()); }

  function где(е) {
    var р = о.getBoundingClientRect();
    return { x: е.clientX - р.left, y: е.clientY - р.top };
  }

  /* Нащупать куб под точкой сразу, не дожидаясь следующего кадра:
     иначе первое касание на телефоне уходило в пустоту. */
  function нащупать(x, y, запас) {
    М.мышьX = x; М.мышьY = y;
    М.подНосом = null;
    var ближе = 9999, нашли = null;
    М.тела.forEach(function (т) {
      if (т.куб.life <= 0 || т.скрыт) return;
      var дx = x - т.сx, дy = y - т.сy, д = Math.sqrt(дx*дx + дy*дy);
      if (д < т.сr * запас && д < ближе) { ближе = д; нашли = т; М.подНосом = т.куб.id; }
    });
    return нашли;
  }

  /* ── ЭКРАН → ПРОСТРАНСТВО ──
     Палец ходит по плоскому экрану, а куб живёт в коробке. Переводим
     сдвиг пальца в сдвиг куба на той глубине, где куб сейчас стоит:
     ближний куб ходит за пальцем точно, дальний — медленнее, как и
     должно быть при перспективе. */
  function вМир(dsx, dsy, т) {
    var обзор = Math.min(М.Ш, М.В) * 1.1;
    var точка = наЭкран(т.x, т.y, т.z);
    var z2 = точка ? точка.z : 0;
    var k = обзор / Math.max(1, обзор + z2 + 300);
    var dx1 = dsx / k, dy1 = -dsy / k;
    var cт = Math.cos(М.угол), sт = Math.sin(М.угол);
    var cф = Math.cos(М.наклон) || 1;
    return { x: dx1 * cт, y: dy1 / cф, z: dx1 * sт };
  }

  /* Куда смотрит экран: удар уносит куб от нас, вглубь коробки. */
  function отНас() {
    return { x: -Math.sin(М.угол), y: 0, z: Math.cos(М.угол) };
  }

  /* ── одно место, где решается, что делать с касанием ── */
  var рука = {
    тело: null, двигали: 0, когда: 0,
    пX: 0, пY: 0,          /* где палец был в прошлый раз */
    сX: 0, сY: 0,          /* где палец начал */
    vX: 0, vY: 0           /* размах за последний ход */
  };

  function взять(x, y, запас) {
    var т = нащупать(x, y, запас);
    if (!играем() || !т) return null;
    рука.тело = т; рука.двигали = 0;
    рука.пX = рука.сX = x; рука.пY = рука.сY = y;
    рука.vX = рука.vY = 0;
    CW.игра.схватить(т);
    if (CW.вибро) CW.вибро(1, 'тихо');
    /* ── ЗВУК КУБА ──
       Анна: «когда я дотрагиваюсь до кубов... если одним касанием то
       может быть как несколько звуков». Нота на каждый задетый куб —
       одна, если куб один; перебор, если задето несколько.

       Нота идёт туда же, куда и дрожь, и по той же причине: на
       телефоне это единственное подтверждение, что палец попал в куб,
       а не в пустое небо. Дрожь это говорила только андроиду, звук
       говорит всем.

       Во время эфира ничего отдельно включать не надо: эфир
       показывает эту же страницу, и касания здесь те же самые. */
    if (CW.звякнуть) CW.звякнуть('куб', 1);
    return т;
  }

  function вести(x, y) {
    if (!рука.тело) return false;
    var dx = x - рука.пX, dy = y - рука.пY;
    рука.пX = x; рука.пY = y;
    рука.vX = dx; рука.vY = dy;
    рука.двигали += Math.abs(dx) + Math.abs(dy);
    var д = вМир(dx, dy, рука.тело);
    var задело = CW.игра.вести(рука.тело, д.x, д.y, д.z);
    /* Куб в руке толкнул соседей — телефон это говорит сразу. Но не
       чаще раза в пятую секунды: столкновение длится несколько кадров
       подряд, и без удержки телефон дрожал бы непрерывно. */
    var теперь = Date.now();
    if (задело && CW.вибро && теперь - рука.когда > 200) {
      рука.когда = теперь;
      CW.вибро(задело);
      if (CW.звякнуть) CW.звякнуть('куб', задело);
    }
    return true;
  }

  function отпустить() {
    if (!рука.тело) return false;
    var т = рука.тело; рука.тело = null;
    if (рука.двигали < 10) {
      /* Не вели, а стукнули: прямой удар от себя. */
      var задето = CW.игра.ударить(т, отНас(), 1);
      if (CW.вибро) CW.вибро(задето, задето > 1 ? '' : 'сильно');
      /* Сколько кубов задето — столько нот. Это и есть просьба
         Анны: одним касанием несколько звуков. */
      if (CW.звякнуть) CW.звякнуть('куб', задето);
    } else {
      var д = вМир(рука.vX * 2.2, рука.vY * 2.2, т);
      CW.игра.бросить(т, д.x, д.y, д.z);
      if (CW.вибро) CW.вибро(1);
      if (CW.звякнуть) CW.звякнуть('куб', 1);
    }
    return true;
  }

  /* ── МЫШЬ ── */
  ХОЛСТ.addEventListener('mousedown', function (е) {
    var т = где(е);
    if (взять(т.x, т.y, 1.4)) return;
    М.тянем = true; М.сам = false;
    М.тянулX = е.clientX; М.тянулY = е.clientY; М.ушлиX = М.ушлиY = 0;
    М.уголТяги = М.уголЦель; М.наклонТяги = М.наклонЦель;
    о.classList.add('тянем');
  });

  window.addEventListener('mousemove', function (е) {
    /* Мышь над открытым окном — значит, она не над кубами. Без этой
       проверки под окном «нащупывался» куб, которого не видно, и
       подсказка выскакивала рядом с окном сама по себе. */
    var надОкном = е.target && е.target.closest && е.target.closest('.ок-окно');
    if (надОкном) { М.мышьX = -9999; М.мышьY = -9999; return; }
    var т = где(е); М.мышьX = т.x; М.мышьY = т.y;
    if (рука.тело) { вести(т.x, т.y); return; }
    if (!М.тянем) return;
    М.ушлиX = е.clientX - М.тянулX; М.ушлиY = е.clientY - М.тянулY;
    М.уголЦель = М.уголТяги + М.ушлиX * 0.009;
    М.наклонЦель = Math.max(-0.75, Math.min(0.75, М.наклонТяги - М.ушлиY * 0.007));
  });

  window.addEventListener('mouseup', function (е) {
    if (отпустить()) return;
    if (!М.тянем) return;
    М.тянем = false; о.classList.remove('тянем');
    if (Math.abs(М.ушлиX) + Math.abs(М.ушлиY) < 8) {
      var т = где(е); нащупать(т.x, т.y, 1.4);
      /* Дотронулись до куба — короткий щелчок, даже когда игра не идёт:
         на телефоне это единственное подтверждение, что палец попал
         именно в куб, а не в пустое небо. */
      if (М.подНосом && CW.вибро) CW.вибро(1, 'тихо');
      if (М.подНосом && CW.звякнуть) CW.звякнуть('куб', 1);
      if (!играем()) войтиВКуб();
    }
  });

  /* ── КОЛЕСО МЫШИ ──
     В игре оно двигает рой вглубь и обратно — то же, что два пальца на
     телефоне. ВНЕ игры оно приближает и отдаляет камеру: прежде колесо
     над полотном не делало ничего, страница под ним ползла, и кубы
     «ездили» сами по себе.

     Предел близости и дали взят не с потолка: ближе 90 рой упирается в
     нос и грани выворачиваются, дальше 900 кубы становятся точками.
     Шаг считаем от самой дали, а не постоянным: иначе вблизи каждый
     щелчок колеса прыгал через полмира, а вдали почти ничего не менял. */
  var БЛИЖЕ = 90, ДАЛЬШЕ = 900;

  function придвинуть(шаг) {
    var было = М.дальЦель;
    М.дальЦель = Math.max(БЛИЖЕ, Math.min(ДАЛЬШЕ, было * Math.exp(шаг * 0.0010)));
  }

  ХОЛСТ.addEventListener('wheel', function (е) {
    е.preventDefault();
    var d = Math.max(-120, Math.min(120, е.deltaY));
    if (играем()) {
      var ш = d * 1.2;
      CW.игра.вглубь(-ш * Math.sin(М.угол), ш * Math.cos(М.угол));
      return;
    }
    придвинуть(d);
  }, { passive: false });

  /* ── ПАЛЕЦ ── */
  var пX = 0, пY = 0, пШёл = 0, уголП = 0, наклонП = 0, щипок = 0;

  function пара(е) {
    var a = е.touches[0], b = е.touches[1];
    return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
  }

  ХОЛСТ.addEventListener('touchstart', function (е) {
    е.preventDefault();
    var р = о.getBoundingClientRect();
    if (е.touches.length > 1) { щипок = пара(е); отпустить(); return; }
    var т = е.touches[0];
    пX = т.clientX; пY = т.clientY; пШёл = 0;
    if (взять(пX - р.left, пY - р.top, 1.8)) return;
    М.тянем = true; М.сам = false;
    уголП = М.уголЦель; наклонП = М.наклонЦель;
  }, { passive: false });

  ХОЛСТ.addEventListener('touchmove', function (е) {
    е.preventDefault();
    var р = о.getBoundingClientRect();

    /* Два пальца: в игре щипок двигает рой вглубь и обратно, вне игры —
       приближает и отдаляет камеру, как колесо мыши. */
    if (е.touches.length > 1) {
      var было = щипок; щипок = пара(е);
      var d = (щипок - было) * 1.6;
      if (Math.abs(d) <= 0.5) return;
      if (играем()) CW.игра.вглубь(d * Math.sin(М.угол), -d * Math.cos(М.угол));
      else придвинуть(-d * 1.4);
      return;
    }

    var т = е.touches[0];
    if (рука.тело) { вести(т.clientX - р.left, т.clientY - р.top); return; }

    М.подНосом = null;
    var дx = т.clientX - пX, дy = т.clientY - пY;
    пШёл = Math.abs(дx) + Math.abs(дy);
    М.уголЦель = уголП + дx * 0.009;
    М.наклонЦель = Math.max(-0.75, Math.min(0.75, наклонП - дy * 0.007));
  }, { passive: false });

  ХОЛСТ.addEventListener('touchend', function (е) {
    е.preventDefault();
    щипок = 0;
    if (отпустить()) return;
    М.тянем = false;
    if (пШёл < 12) {
      var р = о.getBoundingClientRect();
      нащупать(пX - р.left, пY - р.top, 1.8);
      if (!играем()) войтиВКуб();
    }
  }, { passive: false });

  ХОЛСТ.addEventListener('touchcancel', function () {
    щипок = 0;
    if (рука.тело) { CW.игра.отпустить(); рука.тело = null; }
    М.тянем = false;
  });
})();

function войтиВКуб() {
  if (!М.подНосом) return;
  /* Открываем тот раздел меню, в котором человек был до мира: он ушёл
     смотреть мир из «Чатов» или «Ленты» и возвращается туда же, только
     уже внутри куба. Раньше здесь всегда стояли «Рефералы» — человек
     нажимал куб и оказывался на странице приглашений. */
  var куда = (CW.последнийРаздел && CW.последнийРаздел()) || 'feed';
  CW.уйти(CW.раздел(куда, М.подНосом));
}

/* ═══════════════════════════════════════════════════════════════════════
   КНОПКИ
   ═══════════════════════════════════════════════════════════════════════ */
/* ── ЛАДОНЬ: ИГРА С КУБАМИ ──
   Прежде эта кнопка останавливала самовращение сцены — и выглядела
   мёртвой: вращение и так останавливается, едва сцену потянут пальцем,
   а обратно его включает «домой». Нажатие ничего заметного не делало.

   Теперь она делает то же, что ладонь в боевой программе: открывает
   игру с кубами. Двойное нажатие выключает игру и возвращает кубы по
   местам, не открывая окна.

   Раздел «Игры» в верхней полосе — другое: это зал игр, восемь штук,
   от тетриса до башни. Одно окно на две разные вещи не делим. */
$('кн-рука').onclick    = function () { CW.открыть('cube-play'); };
$('кн-рука').ondblclick = function () { CW.игра.выключить(); };
/* ── ДОМОЙ ──
   Кнопка возвращает ВСЁ, что человек мог сдвинуть: поворот, наклон,
   даль (её двигает колесо мыши) и сами кубы. Прежде она правила один
   поворот — а если кубы перед этим раскидала и раскрутила игра, камера
   послушно ехала в начало вокруг улетевшего роя, и выглядело это так,
   будто кнопка только сильнее раскручивает мир.

   Кубы по местам ставит сама игра (CW.игра.домой): она помнит, где
   дом каждого тела и как медленно оно вращалось до игры. Игры на
   странице нет — возвращаем только обзор, и это честно. */
$('кн-домой').onclick   = function () {
  М.уголЦель = 0.5; М.наклонЦель = 0.3; М.сам = true;
  М.дальЦель = 300;
  if (CW.игра && CW.игра.домой) CW.игра.домой();
  if (CW.вибро) CW.вибро(1, 'тихо');
};
/* Кнопки, экранов для которых ещё нет, честно говорят об этом, а не
   уводят на несуществующую страницу. Появится экран — здесь поменяется
   одна строка. */
/* ── КЛЮЧИК В МИРЕ ──
   Эта кнопка — «войти по ключу куба», а не «тарифы». Ключ куба (Key 2)
   дают, чтобы пустить внутрь; человек с ключом в руке стоит именно
   здесь, в мире, куда этот куб и встанет. Тарифы живут на своей
   странице, и в мир их кнопка попала по недосмотру.
   Куб после входа сам попадает в Юниверс — иначе человек вернулся бы в
   мир и не нашёл куба, в который только что вошёл. */
$('кн-ключ').onclick    = function () {
  CW.открыть('join-by-key', { род: 'куб' });
};
/* «Мой Юниверс» — отбор кубов для мира. Окно само запоминает отбор и
   в браузере, и на сервере; мир только перерисовывается по его ответу. */
$('кн-мои').onclick     = function () {
  CW.открыть('universe', { потом: function (отбор) {
    М.отбор = (отбор || []).map(String);
    пересобрать();
  } });
};
/* ── ИГРА С КУБАМИ ──
   Игра двигает те самые тела, которые мир рисует. Отдаём ей не копию, а
   сам список: кубы приходят и уходят, и копия устарела бы в тот же миг.
   Пока игра идёт — ладонь в столбике горит. */
CW.игра.мир({ тела: function () { return М.тела; } });
CW.игра.следить(function () {
  $('кн-рука').classList.toggle('горит', CW.игра.идёт());
});

$('кн-игры').onclick    = function () { CW.открыть('games'); };
/* Пилюля с балансом открывает короткий взгляд на CUBE, а не уводит в
   кошелёк целиком: нажимают её, чтобы посмотреть, сколько набежало, а
   не чтобы переводить. Дальше в кошелёк ведёт стрелка в шапке окна. */
$('кн-баланс').onclick  = function () { CW.открыть('cube'); };
/* ── ЗНАЧКИ ПОЛОСЫ ──
   Наши линии вместо смайлов. Смайл у каждой системы свой: на Windows
   половина из них другая картинка, и в одном ряду они разного размера
   и цвета. Значки ставим здесь, а не в разметке, чтобы рисунок жил в
   одном месте — в shared/icons.js. */
[['кн-микрофон', 'микрофон'], ['кн-домой', 'дом'],
 ['кн-игры', 'джойстик'],
 /* «Мои кубы» — сам куб, а не сетка из четырёх клеток: кружок ведёт в
    отбор кубов для мира, и куб на нём читается сразу. Сетка говорила
    «меню» и ни о каких кубах. */
 ['кн-мои', 'куб'],           ['кн-ключ', 'ключик'],
 ['кн-рука', 'ладонь']].forEach(function (п) {
  var б = $(п[0]);
  if (б) б.insertAdjacentHTML('afterbegin', CW.значок(п[1]));
});
/* Баланс — не линия, а монета: золотой кружок с прорезанным кубом,
   как в боевой. Рисует его shared/icons.js, здесь только ставим. */
$('кн-баланс').insertAdjacentHTML('afterbegin', CW.монетаКуба(16));

/* ── МЕНЮ АККАУНТА ──
   То же самое меню, что в оболочке разделов: профиль, другой аккаунт,
   карта, голос, документы, установка, выход. Раньше лицо здесь вело
   прямо в профиль, и человек, нажав кружок в мире, не находил ни
   документов, ни выхода — тех самых, что видел минуту назад на ленте.
   Собирается одной строкой: само меню живёт в shared/account.js.

   Внутри кружка — наш значок человека, тот же, что в разделах: пустой
   синий кружок в мире читался как недогруженная картинка. Снимок, если
   он есть, встанет на его место сам — показатьМеня() ниже. */
$('лицо-кнопка').innerHTML = CW.значок('человек');
CW.менюСейчас = CW.менюАккаунта($('лицо-кнопка'), { откуда: 'world' });
/* ── МИКРОФОН: ГОЛОСОВОЙ ПОМОЩНИК ──
   Раньше эта кнопка начинала эфир, хотя рисует микрофон и в боевой
   всегда означала голос. Эфир никуда не делся: его начинают с полки
   «Стримить» в чатах и группах.

   Файл с распознаванием приезжает по нажатию: код, который просит
   микрофон, не должен лежать на странице у того, кто им не пользуется. */
$('кн-микрофон').onclick= function () { голосМира(true); };

function голосМира(переключить) {
  return CW.нужен('shared/голос.js').then(function () {
    CW.голос.следить(function () {
      $('кн-микрофон').classList.toggle('горит', CW.голос.идёт());
    });
    if (переключить) CW.голос.переключить();
    $('кн-микрофон').classList.toggle('горит', CW.голос.идёт());
  }).catch(function () {
    if (переключить) CW.сказать(Т('Голосовой помощник не приехал'));
  });
}

/* Был включён до перехода — поднимаем сам: иначе микрофон гас после
   первой же команды, ведь почти каждая уводит на другую страницу. */
try {
  if (window.sessionStorage.getItem('cw_голос-слушал') === '1') голосМира(false);
} catch (е) {}

/* ═══════════════════════════════════════════════════════════════════════
   ЗАГРУЗКА. Оба вопроса уходят сразу и одновременно.
   ═══════════════════════════════════════════════════════════════════════ */
function собрать() {
  CW.кто().then(показатьМеня);

  /* Отбор, лежащий в браузере, ставим ДО ответа сервера: мир должен
     собраться правильным с первого кадра, а не мигнуть всеми кубами и
     потом половину убрать. */
  М.отбор = изБраузера();

  Promise.all([
    CW.спросить('/cubes',       { тихо: true }),
    CW.спросить('/me/cubes',    { тихо: true }),
    CW.спросить('/me/universe', { тихо: true })
      .catch(function () { return null; })
  ]).then(function (о) {
    var всеК = список(о[0]), моиК = список(о[1]);
    /* Сервер главнее: отбор мог поменяться на другом устройстве. Но
       пустой ответ браузерный отбор не затирает. */
    var сСервера = (о[2] && о[2].universe) || [];
    if (сСервера.length) {
      М.отбор = сСервера.map(String);
      try { CW.положить('cw_юниверс', JSON.stringify(М.отбор)); } catch (е) {}
    }
    моиК.forEach(function (к) { М.мои[к.id] = true; });

    var видели = {}, итог = [];
    моиК.concat(всеК).forEach(function (к) {
      if (!к || к.id == null || видели[к.id]) return;
      видели[к.id] = true;
      к.life = (к.life_left_seconds != null) ? к.life_left_seconds : 999999999;
      итог.push(к);
    });

    М.кубы = итог;
    пересобрать();
  }).catch(function (е) {
    состояние(е && е.сеть ? Т('Нет связи с сервером') : Т('Не вышло собрать мир'));
  });
}

function список(о) {
  if (!о) return [];
  if (Array.isArray(о)) return о;
  return о.items || о.cubes || о.universe || [];
}

function изБраузера() {
  try {
    var с = JSON.parse(CW.взять('cw_юниверс') || '[]');
    return Array.isArray(с) ? с.map(String) : [];
  } catch (е) { return []; }
}

/* ── ЭФИР, НАЧАТЫЙ НЕ ОТСЮДА ──
   В режиме «Камера и кубы» кубам взяться неоткуда, если эфир открыт с
   другой страницы: мир рисуется только здесь. Окно эфира даёт кнопку
   «Открыть мир», и она приводит сюда с номером эфира в адресе —
   открываем его заново, уже с кубами в кадре. */
(function () {
  var ид = '';
  /* Имя в адресе по-английски; старое русское «?эфир=» читаем тоже. */
  try {
    var вп = new URLSearchParams(location.search);
    ид = вп.get('stream') || вп.get('эфир') || '';
  } catch (е) {}
  if (!ид) return;
  /* Номер из адреса убираем сразу: иначе перезагрузка страницы (и
     любой новый эфир, заведённый отсюда же) снова открывали бы ТОТ
     эфир — со всем его прежним разговором. */
  try {
    var а = new URL(location.href);
    а.searchParams.delete('stream');
    а.searchParams.delete('эфир');
    history.replaceState(null, '', а.pathname + (а.search || '') + (а.hash || ''));
  } catch (е) {}
  CW.открыть('live', { ид: Number(ид), свой: true });
})();

/* ── ПРИГЛАШЕНИЕ В КУБ ──
   Ссылку «index.html?куб=CK-…» титулка запоминает и уводит сюда: ключ
   куба в поле входа не годится, там ждут ключ доступа. Открываем окно
   входа по ключу с уже вставленным ключом, и память чистим сразу —
   иначе оно выскакивало бы при каждом заходе в мир. */
(function () {
  var ключ = '';
  try { ключ = CW.взять('cw_ключ_куба') || ''; } catch (е) {}
  if (!ключ) return;
  CW.убрать('cw_ключ_куба');
  CW.открыть('join-by-key', { ключ: ключ });
})();

function показатьМеня(я) {
  М.я = я || null;
  if (!я) return;
  /* Своё лицо на общий склад — им пользуются все кружки страницы. */
  if (CW.лица) CW.лица.знать(я.id, я.avatar_url, я.avatar_ver);
  $('баланс').textContent = Math.round(я.cube_balance || 0);
  if (CW.менюСейчас) CW.менюСейчас.кто(я);
  /* Лицо в углу ставит общий склад — тот же, что рисует все кружки
     страницы. Своей загрузки здесь больше нет: она не знала про склад,
     заводила новую картинку на каждый ответ сервера, и кнопка моргала.
     Смайл, снимок и ролик склад различает сам. */
  if (CW.лица) {
    var кн = $('лицо-кнопка');
    кн.style.filter = (я.avatar_color && CW.тонЗнака
                       && я.avatar_url && !CW.картинкаЛи(я.avatar_url))
      ? CW.тонЗнака(я.avatar_color) : '';
    CW.лица.одеть(кн, я.id);
  }
}

/* Перерисовку после смены снимка делает сам склад лиц: кнопка в углу
   одета через него (CW.лица.одеть), и свой слушатель «cw-лицо» здесь
   был вторым описанием той же работы. */

/* Запроса /stats здесь больше нет: он приезжал ради одной надписи
   «N онлайн», а надписи не стало. Лишний запрос на каждом заходе в мир
   ради того, что никто не читает, - это и расход, и лишнее ожидание. */

/* ═══════════════════════════════════════════════════════════════════════
   КУРСЫ. Сперва спрашиваем свой сервер и только потом биржу: биржа
   режет частоту, и половина значений оставалась серой.
   ═══════════════════════════════════════════════════════════════════════ */
var МОНЕТЫ = [
  ['bitcoin','BTC'],['ethereum','ETH'],['tether','USDT'],['binancecoin','BNB'],
  ['solana','SOL'],['ripple','XRP'],['dogecoin','DOGE'],['cardano','ADA'],
  ['tron','TRX'],['avalanche-2','AVAX'],['polkadot','DOT'],['chainlink','LINK'],
  ['litecoin','LTC'],['near','NEAR'],['uniswap','UNI'],['stellar','XLM']
];

function ценой(ц) {
  if (ц >= 10000) return ц.toLocaleString('en', { maximumFractionDigits: 0 });
  if (ц >= 1) return ц.toFixed(2);
  return ц.toFixed(5);
}

/* Второй вид ленты — акции: металлы, нефть, доллар, индексы и крупные
   компании. Он выбирается в «Оформлении → Лента курса» и приходит с
   нашего же сервера, узлом /markets. Цены там всегда с опозданием —
   обычно 15–20 минут: бесплатных живых котировок не бывает, они стоят
   денег и требуют договора с биржей. */
var АКЦИИ = [
  ['GOLD','GOLD'],['SILVER','SILVER'],['OIL','BRENT'],['GAS','GAS'],
  ['DXY','DXY'],['EURUSD','EUR'],['SP500','S&P 500'],['NDX','NASDAQ'],
  ['AAPL','AAPL'],['MSFT','MSFT'],['NVDA','NVDA'],['TSLA','TSLA'],
  ['AMZN','AMZN'],['GOOGL','GOOGL'],['META','META'],['COIN','COIN']
];

function какаяЛента() {
  var о = CW.оформление && CW.оформление.взять();
  var вид = о && о.лента && о.лента.вид;
  return (вид === 'акции' || вид === 'пусто') ? вид : 'крипта';
}

function курсы() {
  var вид = какаяЛента();

  /* «Пустой» в «Оформлении» — это совсем без бегущей строки: чистим её
     и наружу не ходим. Спрашивать цены, которые никто не увидит,
     значит зря будить сервер.

     Саму полосу при этом не прячем. Она растягивается на всё свободное
     место и тем держит кнопки справа у края: спрятали — и значки
     уехали к середине. Поэтому полоса остаётся на месте, просто
     пустая. */
  if (вид === 'пусто') {
    var л = $('курсы-лента');
    if (л) л.innerHTML = '';
    return;
  }

  var акции = вид === 'акции';
  var список = акции ? АКЦИИ : МОНЕТЫ;

  CW.спросить(акции ? '/markets' : '/prices', { тихо: true, сроком: 9000 })
    .catch(function () { return null; })
    .then(function (д) {
      if (акции) return д;              /* у акций запасного источника нет */
      if (д && д.bitcoin && д.bitcoin.usd) return д;
      return fetch('https://api.coingecko.com/api/v3/simple/price?ids='
        + МОНЕТЫ.map(function (м) { return м[0]; }).join(',')
        + '&vs_currencies=usd&include_24hr_change=true', { cache: 'no-store' })
        .then(function (о) { return о.ok ? о.json() : null; })
        .catch(function () { return null; });
    })
    .then(function (д) {
      if (!д) return;
      var куски = [];
      список.forEach(function (м) {
        var и = д[м[0]];
        if (!и || и.usd == null) return;
        var изм = (и.usd_24h_change || 0).toFixed(2);
        куски.push('<div class="курс"><span class="сим">' + м[1] + '</span>'
          + '<span class="цена">' + ценой(и.usd) + '</span>'
          + '<span class="' + (parseFloat(изм) >= 0 ? 'вверх' : 'вниз') + '">'
          + (parseFloat(изм) >= 0 ? '+' : '') + изм + '%</span></div>');
      });
      /* Подпись про опоздание ставим в конце круга, а не выдуманную
         свежесть: цены у акций правда несвежие, и молчать об этом нельзя. */
      if (акции && куски.length) {
        куски.push('<div class="курс"><span class="сим">' + CW.безопасно(Т('цены с задержкой ~15 мин')) + '</span></div>');
      }
      if (!куски.length) return;
      показатьКурсы(куски);
    });
}

/* ── ЛЕНТА НЕ НАЧИНАЕТСЯ ЗАНОВО КАЖДЫЕ ПОЛМИНУТЫ ──────────────────
   Цены спрашиваются раз в тридцать секунд. Раньше ответ каждый раз
   переписывал всю ленту целиком (innerHTML), а это для браузера новые
   узлы - значит, и поездка начинается с нуля. Со стороны человека
   выглядело так, будто строка дёргается и курс пропадает на середине.

   Теперь узлы переписываются только если изменился их СОСТАВ: пришла
   новая монета, пропала старая, сменился вид ленты. Пока состав тот
   же, меняем лишь цифры внутри - поездка не прерывается, потому что
   для браузера это те же самые узлы.

   Лента склеена из двух одинаковых половин: так круг замыкается без
   рывка (едем до -50% и начинаем сначала). Значит, и обновлять надо
   обе половины. */
var СОСТАВ = '';

/* Имя у неё своё, не «поставить»: такая функция в этом файле уже
   есть - она ставит кубы по кольцу. Две функции с одним именем в
   одном файле не спорят и не ругаются: вторая молча заменяет первую,
   и расстановка кубов начинает звать ленту курсов. Так мир и перестал
   собираться 23 ноября: вместо неба выходило «Не вышло собрать мир»,
   потому что ошибку ловил общий catch и показывал её одной строчкой.
   Урок простой: новой функции - новое имя, и проверять надо не только
   то, что чинил. */
function показатьКурсы(куски) {
  var лента = $('курсы-лента');
  if (!лента) return;
  var состав = куски.map(function (к) {
    return (к.match(/class="сим">([^<]*)/) || [])[1] || '';
  }).join('|');

  var курсы = лента.querySelectorAll('.курс');
  if (состав !== СОСТАВ || курсы.length !== куски.length * 2) {
    СОСТАВ = состав;
    лента.innerHTML = куски.join('') + куски.join('');
    поехали(лента);
    return;
  }

  /* Состав прежний - меняем только цифры. */
  var клетка = document.createElement('div');
  клетка.innerHTML = куски.join('');
  var свежие = клетка.querySelectorAll('.курс');
  for (var и = 0; и < курсы.length; и++) {
    var н = свежие[и % свежие.length];
    if (!н) continue;
    var было = курсы[и].children, стало = н.children;
    for (var к = 0; к < стало.length; к++) {
      if (!было[к]) continue;
      if (было[к].textContent !== стало[к].textContent) {
        было[к].textContent = стало[к].textContent;
      }
      if (было[к].className !== стало[к].className) {
        было[к].className = стало[к].className;
      }
    }
  }
}

/* ── ПОЕЗДКА НАЧИНАЕТСЯ, КОГДА ЕСТЬ ЧТО ВЕЗТИ ─────────────────────
   Лента едет на -50% СВОЕЙ ширины. Проценты считаются от ширины, а
   ширина до прихода цен равна нулю: ноль процентов от нуля - это ноль.
   Хром пересчитывает шаг, как только лента наполнилась, и поездка идёт.
   Сафари на айфоне - нет: он берёт то, что посчитал в начале, и лента
   стоит на месте, пока что-нибудь не заставит её пересчитаться. У Анны
   это случалось через тридцать-пятьдесят секунд, когда приходили
   следующие цены.

   Поэтому поездку заводим ЗАНОВО сразу после того, как лента
   наполнилась: снимаем движение, трогаем offsetWidth (это заставляет
   браузер пересчитать размеры прямо сейчас) и возвращаем. Проценты
   считаются уже от настоящей ширины, и лента едет с первой секунды.

   Делаем это только при смене состава, не при обновлении цифр: иначе
   каждые полминуты лента прыгала бы в начало. */
function поехали(лента) {
  try {
    лента.style.animation = 'none';
    void лента.offsetWidth;
    лента.style.animation = '';
  } catch (е) {}
}

/* ═══════════════════════════════════════════════════════════════════════
   ПУСК
   ═══════════════════════════════════════════════════════════════════════ */
for (var i = 0; i < 220; i++) {
  М.звёзды.push({
    x: Math.random(), y: Math.random(),
    r: Math.random() * 1.4 + 0.3,
    я: Math.random() * 0.65 + 0.35,
    ф: Math.random() * Math.PI * 2
  });
}

померить();
window.addEventListener('resize', перемерить);
window.addEventListener('orientationchange', перемерить);
/* Клавиатура меняет не размер окна, а размер ВИДИМОГО, и события
   resize у окна при этом может не быть вовсе. Рама же стоит ростом с
   видимое, значит полотно под ней в этот момент становится ниже - и
   без пересчёта картинка растянулась бы по высоте, пока человек
   печатает ключ куба. Поэтому слушаем и видимое тоже. */
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', померить);
}
круг();
собрать();
курсы();
setInterval(курсы, 30000);

window.М = М;      /* чтобы состояние мира можно было посмотреть снаружи */

}
</script>
