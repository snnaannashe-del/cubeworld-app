<!--
  ЗАРАБОТАТЬ.

  Ни одна ставка здесь не вписана руками. Все цифры в списке наград —
  это поле «rates» из ответа сервера:

      active_day_min / active_day_max  →  Активный день
      post_view_cube, views_for_reward →  Пост в ленте или группе
      comment_view_cube                →  Комментарий
      referral_paid                    →  Реферальная ссылка
      bonus_week / bonus_month / bonus_year → Активная неделя/месяц/год

  Это важно: ставки меняет сервер, и если переписать их в разметке, через
  месяц экран будет обещать одно, а начислять будет другое.

  Откуда остальное:
      /activity/stats   уровень, XP, счётчики за месяц, подписка
      /rewards/today    сколько набрано сегодня, дни подряд, минуты в сети
      /rewards/estimate сколько выходит за месяц
      /rewards/history  начисления
      /plans            цена подписки

  Нижний кусок — свайп и кошельки — общий с «Кошельком» и живёт в
  shared/wallets.js.
-->
<style>
/* ВСЕ МЕРКИ НА ЭТОЙ СТРАНИЦЕ СНЯТЫ С БОЕВОЙ (`~/Desktop/25/world.html`,
   блок `.ern-*`), а не подобраны на глаз. Было крупнее почти вдвое:
   поля по 20–22 точки, числа по 1.7rem — экран растягивался на три
   прокрутки там, где в боевой он помещается в одну. */

/* ── подписка ────────────────────────────────────────────────────── */
.подписка{
  display:flex; align-items:center; gap:10px;
  background:var(--окно); border:1px solid var(--край);
  border-radius:14px; padding:14px 16px; margin-bottom:12px;
}
.подписка .текст{ flex:1; min-width:0; }
.подписка .имя{ display:flex; align-items:center; gap:8px; }
.подписка .имя b{ font-size:13.5px; font-weight:800; }
/* Алмаз и кирка — как в боевой, числами, а не переменными: там у них
   «всегда» свой цвет, и ни смена оформления, ни смена цвета значков их
   не трогает. Алмаз 28 точек (в боевой это 2.1em от строки в 13.5) и
   голубой #0095F6, кирка розовая #EC4899. */
.подписка .имя .знак{ display:flex; color:#0095F6; }
.подписка .имя .знак svg{ width:28px; height:28px; }
.подписка p{ margin:3px 0 0; font-size:11px; line-height:1.5; color:var(--текст3); }
.подписка .цена{
  flex:0 0 auto; white-space:nowrap; cursor:pointer;
  border:1px solid rgba(var(--синий-ргб),.4);
  background:rgba(var(--синий-ргб),.16);
  color:var(--текст); border-radius:9px; padding:8px 16px;
  font-size:12px; font-weight:800;
}
.подписка .цена:hover{ background:rgba(var(--синий-ргб),.28); }
.подписка.есть .цена{
  color:var(--зелёный); border-color:rgba(52,211,153,.4);
  background:rgba(52,211,153,.14); cursor:default;
}

/* ── майнинг ─────────────────────────────────────────────────────── */
/* Подпись сидит верхом на рамке карточки — как в боевой. */
/* Отступ сверху 14, как в боевой: подпись сидит на рамке и выступает
   за неё на 9 точек — без отступа она легла бы на карточку подписки. */
.майнинг{
  position:relative; margin:14px 0 12px; padding:16px 16px 14px;
  border-radius:14px;
  background:rgba(var(--синий-ргб),.06);
  border:1px solid rgba(var(--синий-ргб),.22);
}
.майнинг .надпись{
  position:absolute; top:-9px; left:14px; padding:1px 9px;
  background:var(--фон); border-radius:6px;
  display:flex; align-items:center; gap:6px;
  font-size:11.5px; font-weight:800; color:var(--синий); white-space:nowrap;
}
.майнинг .надпись .знак{ display:flex; color:#EC4899; }
.майнинг .надпись .знак svg{ width:13px; height:13px; }
.майнинг .надпись .состояние{ font-weight:600; color:var(--текст3); }
.майнинг .жёлоб{ height:6px; border-radius:3px; }

/* ── полоса майнинга ──
   В боевой она не счётчик, а признак жизни: медленно наливается до
   конца, начинает заново, и всё время по ней идёт блик. Отсюда и
   «майнинг идёт постоянно».

   Два цвета, как просила хозяйка: цвет значков и основной цвет
   оформления, слитые в один переход. Цвет значков не выбран — в
   переменной стоит currentColor, и слева встаёт бирюза, заданная тут
   же строкой `color`. Выбран — встаёт он.

   Настоящие числа (сколько минут в сети) остаются подписью ниже:
   полоса — вид, числа — правда. */
.майнинг .жёлоб i{
  width:4%; min-width:0; color:#22d3ee; border-radius:3px;
  position:relative; overflow:hidden;
  background:linear-gradient(90deg,var(--значок-цвет),var(--синий));
  animation:майнинг-полнеет 50s linear infinite;
}
@keyframes майнинг-полнеет{ 0%{ width:4%; } 92%{ width:100%; } 100%{ width:100%; } }
.майнинг .жёлоб i::after{
  content:''; position:absolute; top:0; bottom:0; left:0; width:45%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);
  animation:майнинг-блик 3.4s linear infinite;
}
@keyframes майнинг-блик{
  0%{ transform:translateX(-120%); } 100%{ transform:translateX(320%); }
}
/* Кому движение на экране мешает — полоса стоит налитой и молчит. */
@media (prefers-reduced-motion: reduce){
  .майнинг .жёлоб i, .майнинг .жёлоб i::after{ animation:none; }
  .майнинг .жёлоб i{ width:100%; }
}

.майнинг .под{ margin-top:7px; font-size:10.5px; line-height:1.5; color:var(--текст3); }

/* ── три числа ───────────────────────────────────────────────────── */
.тройка{
  display:grid; gap:8px; margin-bottom:12px;
  grid-template-columns:repeat(3,1fr);
}
.тройка .ячейка{
  background:var(--окно); border:1px solid var(--край);
  border-radius:11px; padding:11px 8px; text-align:center;
}
.тройка .значение{
  font-size:17px; font-weight:900; letter-spacing:-.02em; line-height:1.15;
  font-variant-numeric:tabular-nums;
}
.тройка .значение.золото{ color:var(--жёлтый); }
.тройка .значение.бирюза{ color:#22d3ee; }
.тройка .значение.пусто{ color:var(--текст3); }
.тройка .подпись{ margin-top:3px; font-size:10px; color:var(--текст3); }

.примечание{
  background:var(--окно); border:1px solid var(--край);
  border-radius:10px; padding:9px 12px; margin-bottom:12px;
  font-size:11px; line-height:1.6; color:var(--текст3);
}
.примечание b{ color:var(--текст2); }

/* ── список наград ───────────────────────────────────────────────── */
.награды{ margin-bottom:12px; }
.награда{
  display:flex; align-items:center; gap:10px;
  padding:9px 0; border-bottom:1px solid var(--край);
  font-size:12.5px;
}
.награда:last-child{ border-bottom:none; }
.награда .знак{ display:flex; flex:0 0 17px; color:var(--текст3); }
.награда .знак svg{ width:16px; height:16px; }
.награда .что{ font-size:12.5px; }
.награда .что .тихо{ color:var(--текст3); }
.награда .сколько{
  margin-inline-start:auto; font-size:12.5px; font-weight:800; white-space:nowrap;
  color:var(--текст2); font-variant-numeric:tabular-nums;
}
.награда .сколько.плюс{ color:var(--синий); }
.награда .сколько.свободно{
  display:flex; align-items:center; gap:5px; color:var(--сирень);
}
.награда .сколько.свободно svg{ width:14px; height:14px; }

/* ── знак подсказки у заголовка «Награды» ──
   Четыре строки про то, как считаются начисления, человек читает один
   раз, а место занимали бы всегда. Поэтому они живут под знаком: нажал
   — показали, нажал ещё раз или мимо — убрали. Так же сделано в
   боевой. */
.наград-шапка{ position:relative; }
.подсказка-знак{
  background:none; border:none; padding:0; margin:0; cursor:pointer;
  color:var(--текст3); display:inline-flex; align-items:center;
  transition:color .15s;
}
.подсказка-знак svg{ width:14px; height:14px; }
.подсказка-знак:hover{ color:var(--текст2); }
.подсказка-знак.горит{ color:var(--синий); }
.подсказка-окно{
  position:absolute; z-index:40; display:none; left:0; top:100%;
  max-width:360px; padding:12px 14px; border-radius:14px;
  background:var(--окно); border:1px solid var(--край2); box-shadow:var(--тень);
  font-size:12px; line-height:1.55; color:var(--текст2);
}
.подсказка-окно.видно{ display:block; }

/* ── начисления ──────────────────────────────────────────────────── */
.начисления{
  border:1px solid var(--край); border-radius:11px;
  overflow:hidden; background:var(--окно); margin-bottom:12px;
}
/* Пустому списку коробка не нужна: в боевой на этом месте просто две
   строчки текста, а у нас стояла рамка в треть экрана вокруг пустоты. */
.начисления.нет{ border:none; background:none; }
.начисления.нет .пусто-строка{ padding:10px 0; }
.начисление{
  display:flex; align-items:center; gap:10px;
  padding:10px 14px; border-bottom:1px solid var(--край);
}
.начисление:last-child{ border-bottom:none; }
.начисление .день{ font-size:12.5px; }
.начисление .за-что{ font-size:10.5px; color:var(--текст3); margin-top:2px; }
.начисление .сумма{
  margin-inline-start:auto; font-weight:800; font-size:12.5px; color:var(--зелёный);
  font-variant-numeric:tabular-nums;
}

/* ── месяц ───────────────────────────────────────────────────────── */
.месяц{
  display:grid; gap:8px; margin-bottom:12px;
  grid-template-columns:repeat(4,1fr);
}
.месяц .ячейка{
  background:var(--окно); border:1px solid var(--край);
  border-radius:11px; padding:11px 8px; text-align:center;
}
.месяц .значение{
  font-size:17px; font-weight:900; line-height:1.15;
  font-variant-numeric:tabular-nums;
}
.месяц .значение.пусто{ color:var(--текст3); }
.месяц .подпись{ margin-top:3px; font-size:10px; color:var(--текст3); }

@media (max-width:560px){
  /* ── ТРИ ЧИСЛА ОСТАЮТСЯ В ОДИН РЯД ──
     Столбиком три одинаковые плашки занимали треть экрана, и чтобы
     увидеть третье число, приходилось крутить. Ряд из трёх на 390
     точках даёт каждой ячейке по 122 - этого хватает и числу, и
     короткой подписи. Ужимаем поля и буквы, а не ломаем ряд. */
  .тройка{ gap:6px; }
  .тройка .ячейка{ padding:9px 4px; }
  .тройка .значение{ font-size:15px; }
  .тройка .подпись{ font-size:9px; line-height:1.25; }
  .месяц{ grid-template-columns:repeat(2,1fr); }
}

/* ── уровень ──
   Коробка общая с «Кошельком» (shared/shell.css), здесь только краски
   и рост полосы, как в боевой на этой странице: полоса 7 точек,
   переливом от бирюзы к золоту, и XP золотом — он и есть то, что
   растёт. */
.уровень{ margin-bottom:12px; }
.уровень .ряд .имя{ font-size:13.5px; }
.уровень .ряд .xp{ color:var(--жёлтый); font-weight:700; font-size:11.5px; }
.уровень .жёлоб{ height:7px; border-radius:4px; }
.уровень .жёлоб i{ background:linear-gradient(90deg,#22d3ee,var(--жёлтый)); }
.уровень .пояснение{
  margin-top:8px; font-size:11px; line-height:1.55; color:var(--текст3);
}
</style>

<script>
'use strict';

CW.оболочка('earn').then(function (место) {

CW.заглавие(место, { имя: Т('Заработать') });

var тело = document.createElement('div');
место.appendChild(тело);
CW.ждём(тело);

var С = { стат: null, сегодня: null, оценка: null, история: [], планы: null };

Promise.all([
  CW.спросить('/activity/stats',    { сроком: 20000 }),
  CW.спросить('/rewards/today',     { тихо: true }),
  CW.спросить('/rewards/estimate',  { тихо: true }),
  CW.спросить('/rewards/history',   { тихо: true }),
  CW.спросить('/plans',             { тихо: true })
]).then(function (о) {
  С.стат    = о[0] || {};
  С.сегодня = о[1] || {};
  С.оценка  = о[2] || {};
  С.история = Array.isArray(о[3]) ? о[3] : ((о[3] && о[3].items) || []);
  С.планы   = (о[4] && о[4].plans) || null;
  показать();
}).catch(function (е) {
  тело.innerHTML = '';
  var б = document.createElement('div');
  б.className = 'беда';
  б.textContent = е.сеть ? Т('Нет связи с сервером')
                         : (е.message || Т('Не вышло открыть экран'));
  тело.appendChild(б);
});

/* ═══════════════════════════════════════════════════════════════════════
   ОТРИСОВКА
   ═══════════════════════════════════════════════════════════════════════ */
function кусок(класс, внутри) { return CW.кусок(класс, внутри); }

/* Числа CUBE пишем по-русски, с запятой, и без лишних нулей:
   0,01 — а не 0.010000000000000002, как выходит при сложении долей. */
function cube(ч) {
  var з = Number(ч || 0);
  if (!з) return '0';
  var с = з.toFixed(4).replace(/0+$/, '').replace(/\.$/, '');
  return с.replace('.', ',');
}

function показать() {
  тело.innerHTML = '';
  тело.appendChild(кускомПодписка());
  тело.appendChild(кускомМайнинг());
  тело.appendChild(кускомТройка());
  тело.appendChild(кускомПримечание());
  тело.appendChild(кускомШапкаНаград());
  тело.appendChild(кускомНаграды());
  тело.appendChild(кусок('раздел', Т('Начисления')));
  тело.appendChild(кускомНачисления());
  тело.appendChild(кусок('раздел', Т('Уровень')));
  тело.appendChild(кускомУровень());
  тело.appendChild(кусок('раздел', Т('За этот месяц')));
  тело.appendChild(кускомМесяц());
  тело.appendChild(CW.кусокСвайпа());
  тело.appendChild(CW.кусокКошельков());
}

/* ── подписка ── */
function кускомПодписка() {
  var есть = !!С.стат.is_premium;
  var цена = (С.планы && С.планы.silver && С.планы.silver.month) || null;

  var у = кусок('подписка' + (есть ? ' есть' : ''),
      '<div class="текст">'
    +   '<div class="имя"><b>' + CW.безопасно(Т('Подписка')) + '</b>'
    +     '<span class="знак">' + CW.значок('алмаз', 28) + '</span></div>'
    +   '<p>' + CW.безопасно(есть
          ? Т('Подписка есть: награды начисляются. Полный доступ к инструментам: '
            + 'общение, публикации, сообщества и своё цифровое пространство.')
          : (цена ? Т.с('От ${цена} в месяц', { цена: цена }) : Т('Подписка'))
            + Т(': полный доступ к инструментам современной социальной сети. '
            + 'Общайтесь, публикуйте контент, создавайте сообщества и '
            + 'управляйте своим цифровым пространством.'))
    +   '</p>'
    + '</div>'
    + '<button class="цена">' + CW.безопасно(есть ? Т('подключена')
        : (цена ? Т.с('${цена}/мес', { цена: цена }) : Т('смотреть'))) + '</button>');

  /* Кнопка открывает окно подписки прямо здесь, а не уводит на
     страницу тарифов: в боевой нажатие на «$6.99/мес» показывает
     витрину из четырёх плиток и платит CUBE'ами со счёта. Своего
     окна тут нет — зовём общее (modals/premium.js). */
  у.querySelector('.цена').onclick = function () {
    if (есть) return;
    CW.открыть('premium', { потом: перечитать });
  };
  return у;
}

/* После покупки экран должен сказать правду: подписка есть, награды
   начисляются. Спрашиваем сервер заново, а не дорисовываем от себя. */
function перечитать() {
  Promise.all([
    CW.спросить('/activity/stats',   { тихо: true }),
    CW.спросить('/rewards/today',    { тихо: true }),
    CW.спросить('/rewards/estimate', { тихо: true })
  ]).then(function (о) {
    if (о[0]) С.стат = о[0];
    if (о[1]) С.сегодня = о[1];
    if (о[2]) С.оценка = о[2];
    показать();
  });
}

/* ── майнинг ── */
function кускомМайнинг() {
  var счёт = С.сегодня.counters || {};
  var минут = Number(счёт.online_minutes || 0);

  /* «онлайн» — это не красивое слово, а условие: сервер засчитывает
     день только после min_minutes в сети. Само число минут на экран
     больше не выводим, но признак «идёт или ждёт» остаётся честным. */
  var порог = Number(С.сегодня.min_minutes || 0);
  var вСети = минут >= порог;

  /* Полоса ничего не считает — она идёт всегда, пока открыт экран, и
     это нарочно: так же сделано в боевой. Если бы полоса показывала
     минуты, она почти всё время стояла бы на месте, и «майнинг»
     выглядел бы выключенным. */
  return кусок('майнинг',
      '<div class="надпись">'
    +   '<span class="знак">' + CW.значок('кирка') + '</span>'
    +   CW.безопасно(Т('Майнинг Cube'))
    +   '<span class="состояние">(' + CW.безопасно(Т(вСети ? 'онлайн' : 'ждёт')) + ')</span>'
    + '</div>'
    + '<div class="жёлоб"><i></i></div>'
    /* Строка слово в слово как в боевой — и больше здесь ничего нет.
       Минуты в сети отсюда убраны по просьбе: блок должен выглядеть
       точно так же. */
    + '<div class="под">' + CW.безопасно(Т('Награды и уровень растут от вашей')) + ' '
    +   '' + CW.безопасно(Т('активности в сети')) + '</div>');
}

/* ── три числа ── */
function кускомТройка() {
  var сегодня = Number(С.сегодня.cube || 0);
  var подряд = Number(С.сегодня.streak || С.стат.streak || 0);
  /* «cube» в оценке — МОЯ доля за месяц. Рядом лежит «total_cube»: это
     сумма по всем людям, из которой считается доля. Взять её сюда —
     значит показать человеку чужие деньги как свои. */
  var месяц = Number(С.оценка.cube || С.стат.earned_cube || 0);

  /* Краски как в боевой: сегодняшние CUBE золотом, месячные бирюзой,
     дни подряд обычным цветом. */
  var у = кусок('тройка');
  [
    [сегодня, Т('CUBE сегодня'), 'золото', true],
    [подряд,  Т('дней подряд'),  '',       false],
    [месяц,   Т('CUBE за месяц'), 'бирюза', true]
  ].forEach(function (п) {
    у.appendChild(кусок('ячейка',
        '<div class="значение ' + (п[0] ? п[2] : 'пусто') + '">'
      +   (п[0] ? (п[3] ? cube(п[0]) : п[0]) : '-') + '</div>'
      + '<div class="подпись">' + CW.безопасно(Т(п[1])) + '</div>'));
  });
  return у;
}

/* Строка под числами. Сервер иногда объясняет, почему сегодня вышло
   столько, — например, что фонд месяца ещё не собран. Это объяснение
   и ставим сюда: раньше оно висело отдельной строчкой под списком
   наград вместе с курсом CUBE, и Анна попросила ту строчку убрать. */
function кускомПримечание() {
  var набрано = cube(С.сегодня.cube || 0);
  var есть = !!С.стат.is_premium;
  var причина = С.сегодня.reason || С.оценка.reason || '';

  if (!есть) {
    return кусок('примечание',
        '' + CW.безопасно(Т('Сегодня набрано')) + ' <b>' + набрано + ' CUBE</b>. '
      + CW.безопасно(Т('Начисляется только подписчикам.')));
  }
  if (причина) return кусок('примечание', CW.безопасно(причина));
  return кусок('примечание',
      '' + CW.безопасно(Т('Сегодня набрано')) + ' <b>' + набрано + ' CUBE</b>. '
    + CW.безопасно(Т('Начисление придёт за прошедший день.')));
}

/* ── заголовок «Награды» со знаком подсказки ──
   Числа в подсказке не вписаны: порог просмотров и вилка активного дня
   берутся из тех же ставок сервера, что и список ниже. */
function кускомШапкаНаград() {
  var с = С.сегодня.rates || С.стат.rates || {};
  var просмотров = Number(с.views_for_reward || 0);
  /* «10к» по-русски, «10k» по-английски: буква при числе тоже слово. */
  var порог = просмотров >= 1000
    ? Т.с('{н}к', { н: Math.round(просмотров / 1000) })
    : CW.число(просмотров);

  var где = кусок('наград-шапка');
  var ряд = кусок('раздел',
      CW.безопасно(Т('Награды · в CUBE'))
    + '<button type="button" class="подсказка-знак" title="' + CW.безопасно(Т('Как это считается')) + '">'
    +   CW.значок('внимание', 14)
    + '</button>'
    + '<span class="тихо">' + CW.безопасно(Т('ставки задаёт сервер')) + '</span>');
  где.appendChild(ряд);

  /* Четыре куска с числами между ними: по-английски из них выходила
     каша с русскими хвостами. Одна фраза, три вставки. */
  var окошко = кусок('подсказка-окно',
      Т.с('Начисление приходит раз в сутки, за прошедший день. Пост и '
        + 'комментарий оплачиваются один раз, когда наберут {порог}+ '
        + 'просмотров. Активный день растёт со временем в кубе от {от} '
        + 'до {до} CUBE.',
          { порог: порог, от: cube(с.active_day_min),
            до: cube(с.active_day_max) }));
  где.appendChild(окошко);

  var знак = ряд.querySelector('.подсказка-знак');
  знак.onclick = function (е) {
    е.stopPropagation();
    var открыть = !окошко.classList.contains('видно');
    окошко.classList.toggle('видно', открыть);
    знак.classList.toggle('горит', открыть);
  };
  /* Касание мимо — закрыть. Слушаем на всей странице, но снимать
     слушателя незачем: окошко живёт столько же, сколько страница. */
  document.addEventListener('click', function () {
    окошко.classList.remove('видно');
    знак.classList.remove('горит');
  });

  return где;
}

/* ── награды: все ставки из ответа сервера ── */
function кускомНаграды() {
  var с = С.сегодня.rates || С.стат.rates || {};
  var просмотров = Number(с.views_for_reward || 0);
  /* «10к» по-русски, «10k» по-английски: буква при числе тоже слово. */
  var тысяч = просмотров >= 1000
    ? Т.с('{н}к', { н: Math.round(просмотров / 1000) })
    : CW.число(просмотров);

  var строки = [
    { зн: 'календарь', имя: Т('Активный день'), тихо: Т('чем дольше в кубе'),
      цена: cube(с.active_day_min) + '-' + cube(с.active_day_max) + ' CUBE' },
    { зн: 'лист', имя: Т('Пост в ленте или группе'),
      тихо: Т.с('от {н} просмотров', { н: тысяч }),
      цена: cube(с.post_view_cube) + ' CUBE' },
    { зн: 'речь', имя: Т('Комментарий'),
      тихо: Т.с('от {н} просмотров', { н: тысяч }),
      цена: cube(с.comment_view_cube) + ' CUBE' },
    { зн: 'звено', имя: Т('Реферальная ссылка'),
      цена: '+' + cube(с.referral_paid) + ' CUBE', плюс: true },
    { зн: 'огонь', имя: Т('Активная неделя'),
      цена: '+' + cube(с.bonus_week) + ' CUBE', плюс: true },
    { зн: 'календарь', имя: Т('Активный месяц'),
      цена: '+' + cube(с.bonus_month) + ' CUBE', плюс: true },
    { зн: 'кубок', имя: Т('Активный год'),
      цена: '+' + cube(с.bonus_year) + ' CUBE', плюс: true },
    { зн: 'монета', имя: Т('Чаевые автору контента'), свободно: true },
    { зн: 'камера', имя: Т('Стримы и подарки'), свободно: true },
    { зн: 'картинка', имя: Т('Подарки и чаевые за истории'), свободно: true },
    { зн: 'сумка', имя: Т('Маркетплейс и сигналы'), свободно: true }
  ];

  var где = кусок('награды');
  строки.forEach(function (с2) {
    где.appendChild(кусок('награда',
        '<span class="знак">' + CW.значок(с2.зн) + '</span>'
      + '<span class="что">' + CW.безопасно(с2.имя)
      +   (с2.тихо ? ' <span class="тихо">· ' + CW.безопасно(с2.тихо) + '</span>' : '')
      + '</span>'
      + (с2.свободно
          ? '<span class="сколько свободно">' + CW.значок('молния')
            + '' + CW.безопасно(Т('свободная цена CUBE')) + '</span>'
          : '<span class="сколько' + (с2.плюс ? ' плюс' : '') + '">'
            + CW.безопасно(с2.цена) + '</span>')));
  });
  return где;
}

/* Строчки «Доля в фонде открывается подпиской. Расчётный курс…» под
   списком наград больше нет: Анна попросила её убрать, и в боевой её
   тоже нет. Объяснение сервера не потерялось — оно переехало в
   строку под тремя числами, а как считаются награды, рассказывает
   знак подсказки у заголовка. */

/* ── начисления ── */
function кускомНачисления() {
  var где = кусок('начисления' + (С.история.length ? '' : ' нет'));
  if (!С.история.length) {
    где.innerHTML = '<div class="пусто-строка">'
      + '' + CW.безопасно(Т('Пока ничего не начислено.')) + '<br>' + CW.безопасно(Т('CUBE приходят раз в сутки.')) + '</div>';
    return где;
  }
  С.история.forEach(function (н) {
    где.appendChild(кусок('начисление',
        '<span>'
      +   '<div class="день">' + CW.безопасно(н.day || н.month || '') + '</div>'
      +   '<div class="за-что">' + CW.безопасно(н.reason || н.note || Т('Награда')) + '</div>'
      + '</span>'
      + '<span class="сумма">+' + cube(н.cube || н.amount) + ' CUBE</span>'));
  });
  return где;
}

/* ── уровень ── */
function кускомУровень() {
  var с = С.стат;
  var в = Math.max(0, Math.min(100, Number(с.level_pct || 0)));
  return кусок('уровень',
      '<div class="ряд">'
    +   '<span class="знак">' + CW.значок('кубок') + '</span>'
    +   '<span class="имя">' + CW.безопасно(Т('Уровень')) + ' ' + (с.level || 1) + '</span>'
    +   '<span class="xp">' + (с.xp || 0) + ' XP</span>'
    + '</div>'
    + '<div class="жёлоб"><i style="width:' + в + '%"></i></div>'
    + '<div class="пояснение">'
    +   CW.безопасно(Т.с('До {уровень} уровня: {xp} XP.',
          { уровень: (с.level || 1) + 1, xp: с.xp_to_next || 0 })) + ' '
    +   CW.безопасно(Т('XP растёт от того же, за что идут награды:')) + ' '
    +   CW.безопасно(Т('посты, комментарии, лайки, приглашения и дни в сети.')) + '</div>');
}

/* ── за месяц ── */
function кускомМесяц() {
  var с = С.стат;
  var у = кусок('месяц');
  [
    [с.posts,              Т('постов')],
    [с.comments_received,  Т('комментариев')],
    [с.reactions_received, Т('лайков')],
    [с.days_active,        Т('активных дней')]
  ].forEach(function (п) {
    var з = Number(п[0] || 0);
    у.appendChild(кусок('ячейка',
        '<div class="значение' + (з ? '' : ' пусто') + '">' + з + '</div>'
      + '<div class="подпись">' + CW.безопасно(Т(п[1])) + '</div>'));
  });
  return у;
}

});
</script>
</body>
</html>
