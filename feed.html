<!--
  ЛЕНТА.

  Колонка 9:16 во всю высоту рамы, справа полка «Стримить» и «Добавить
  контент» — та же, что в чатах и группах. Один кадр = одна страница:
  прокрутка прилипает, пролистнуть половину ролика нельзя.

  Почему колонка, а не вся ширина. Ролик снят вертикально. Растянешь его
  на весь монитор — либо чёрные поля в половину экрана, либо обрежешь
  людям головы. Поэтому ширина считается от высоты: 9 к 16, не шире 430.

  Про звук. Браузер не даёт включить звук сам, пока человек ничего не
  нажал, — поэтому первый ролик идёт без звука, а кнопка сверху его
  включает и запоминает выбор. Это не наша прихоть, это правило браузера.

  Про просмотр. Он засчитывается через три секунды после того, как кадр
  встал перед глазами, и один раз на человека: на сервере за просмотры
  начисляют CUBE, и быстрая прокрутка не должна печатать деньги.

  Чего здесь ещё нет и почему так написано: создание записи, эфиры,
  профиль автора. Они — отдельные окна. Кнопка на месте и честно
  говорит, что окна пока нет, вместо того чтобы молчать.
-->
<style>

/* Два окна, первое 8,5 см, разделитель между ними — всё это общее и
   живёт в shared/shell.css под классами .две-колонки / .левая /
   .правая. Здесь своих правил на колонки нет нарочно: лента, чаты и
   группы должны стоять ОДИНАКОВО, а одинаково бывает только тогда,
   когда размер написан в одном месте.

   ── сама колонка ──
   Ширина — вся ширина первого окна. Высота — ровно та же, что у рамки
   в чатах и группах: 21 точка сверху, 21 снизу.

   ПОЧЕМУ НЕ 9:16, КАК БЫЛО. Высота считалась от ширины (425 × 16/9 =
   755,5), и столб центрировался посередине оставшегося места. Рамка же
   в чатах и группах просто занимает всё, что есть, минус 21 и 21 —
   это 760. Разница 4,5 точки, около миллиметра: верх ленты стоял на
   два пикселя ниже, низ на два выше, и три раздела не совпадали.
   Анна это и увидела.

   Теперь высоту диктует одно и то же место для всех трёх разделов, а
   пропорция рамки выходит 425:760 — это 1:1,788 против 1:1,778 у
   честных 9:16. Разница в десятых долях процента, глазом её нет, зато
   края совпадают. Сам ролик внутри по-прежнему стоячий: он
   вписывается в рамку, а не растягивается. */
.столб{
  position:relative; margin:0;
  width:100%; height:100%;
  background:#000;
  border:1px solid var(--край); border-radius:16px; overflow:hidden;
  display:flex; flex-direction:column;
}

/* Отступы сверху и снизу — те же 21 точка, что у .левая.в-рамке в
   чатах и группах. Пишу их здесь, а не в общем файле, потому что в
   общем файле у .левая отступ 18: там внутри рамка со своими полями,
   а здесь рамка и есть сам столб. */
.две-колонки > .левая{ padding:21px 0; }

/* ── вкладки поверх колонки ──────────────────────────────────────── */
.вкладки{
  position:absolute; top:0; left:0; right:0; z-index:30;
  background:linear-gradient(180deg,rgba(0,0,0,.78),rgba(0,0,0,0));
  padding-bottom:14px; transition:transform .28s cubic-bezier(.4,0,.2,1);
}
.вкладки.спрятаны{ transform:translateY(-100%); }
.вкладки .ряд{ display:flex; align-items:center; padding:9px 10px 0; }
.вкладка{
  padding:8px 11px; font-size:0.8667rem; font-weight:700; cursor:pointer;
  color:rgba(255,255,255,.5); background:none; border:none;
  border-bottom:2.5px solid transparent; letter-spacing:.02em;
  white-space:nowrap;
}
.вкладка:hover{ color:rgba(255,255,255,.8); }
.вкладка.тут{ color:#fff; border-bottom-color:#fff; }
.вк-кнопка{
  background:none; border:none; cursor:pointer; padding:5px 7px;
  color:rgba(255,255,255,.55); display:flex;
}
.вк-кнопка:hover,.вк-кнопка.горит{ color:#fff; }
.вк-кнопка svg{ width:15px; height:15px; }
.вк-лупа{ margin-left:auto; }
.вк-свернуть svg{ width:16px; height:16px; }

/* Обводки у этой птички нет нарочно: кружок с рамкой поверх кадра
   читался как кнопка записи или закрытия, хотя она всего лишь
   возвращает спрятанную шапку. Остаётся сам значок на лёгком
   затемнении — чтобы его было видно и на белом кадре. */
.птичка{
  position:absolute; top:8px; right:12px; z-index:31; padding:0;
  width:28px; height:28px; border-radius:50%; cursor:pointer;
  border:none; background:rgba(0,0,0,.35);
  color:rgba(255,255,255,.9); display:none;
  align-items:center; justify-content:center;
}
.птичка.видно{ display:flex; }
.птичка svg{ width:14px; height:14px; transform:rotate(180deg); }

.вк-поиск{
  display:none; align-items:center; gap:7px; padding:8px 12px;
  background:rgba(0,0,0,.5); backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border-top:1px solid rgba(255,255,255,.14);
  border-bottom:1px solid rgba(255,255,255,.1);
}
.вк-поиск.видно{ display:flex; }
.вк-поиск input{
  flex:1; min-width:0; background:rgba(255,255,255,.12);
  border:none; border-radius:20px;
  color:#fff; padding:6px 14px; font-size:0.8667rem; outline:none;
}
.вк-поиск input::placeholder{ color:rgba(255,255,255,.45); }
.вк-поиск .закрыть{
  background:none; border:none; color:#fff; cursor:pointer;
  font-size:1rem; padding:2px 5px; line-height:1;
}

/* ── НАЙДЕННОЕ СПИСКОМ, КАК В БОЕВОЙ ──
   Поиск не перематывает ленту на первое совпадение: он показывает,
   что есть, строками под полем — заголовок и под ним автор. Человек
   сам решает, куда идти. Прежде ввод двух букв молча уносил на чужое
   видео, и обратно надо было искать дорогу. */
.вк-находки{
  display:none; flex-direction:column; max-height:46%; overflow-y:auto;
  overscroll-behavior:contain;
  background:rgba(0,0,0,.72); backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(255,255,255,.12);
}
.вк-находки.видно{ display:flex; }
.вк-находка{
  display:flex; align-items:center; gap:12px; width:100%;
  padding:11px 14px; border:none; background:none; cursor:pointer;
  text-align:left; color:#fff; font-family:inherit;
}
.вк-находка:hover{ background:rgba(255,255,255,.08); }
.вк-находка svg{ width:16px; height:16px; flex:0 0 16px; opacity:.6; }
.вк-находка .что{ min-width:0; }
.вк-находка .что b{
  display:block; font-size:0.9333rem; font-weight:600;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.вк-находка .что span{
  display:block; font-size:0.8rem; color:rgba(255,255,255,.55);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.вк-находки .пусто{
  padding:16px 14px; font-size:0.8333rem; color:rgba(255,255,255,.55);
}

/* ── ЗВУК БЕЗ КНОПКИ ──
   Кнопка звука висела посреди кадра, над кружком «играть», и была
   единственной железкой поверх ролика. Анна: «спрячь её внутрь, как
   кнопку плей, просто разное количество нажатий».

   Теперь так: одно нажатие по кадру — пуск и пауза, два подряд —
   звук. Знак звука показывается тем же способом, что и знак паузы:
   большой кружок посреди кадра, который сам гаснет. Поэтому оформлен
   он рядом с «.пауза» и ровно так же (см. правило ниже).

/* ── полоса кадров ───────────────────────────────────────────────── */
.полоса{
  flex:1; min-height:0; overflow-y:auto; overflow-x:hidden;
  scroll-snap-type:y mandatory; overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch; scrollbar-width:none;
}
.полоса::-webkit-scrollbar{ display:none; }

.кадр{
  width:100%; height:100%; flex:0 0 auto; position:relative;
  scroll-snap-align:start; scroll-snap-stop:always;
  background:#000; overflow:hidden;
  display:flex; align-items:center; justify-content:center;
}
.кадр.спрятан{ display:none; }
.кадр video{ width:100%; height:100%; object-fit:cover; display:block; }

/* снимок: размытая подложка, сам снимок целиком — ничего не режем */
.снимок-фон{
  position:absolute; inset:0; background-size:cover; background-position:center;
  filter:blur(28px) brightness(.45); transform:scale(1.2);
}
.снимок{ position:relative; max-width:100%; max-height:100%;
  object-fit:contain; display:block; }

.текст-кадр{
  width:100%; height:100%; display:flex; flex-direction:column;
  align-items:center; justify-content:center; text-align:center;
  padding:76px 28px 150px; color:#fff; box-sizing:border-box;
  background:linear-gradient(150deg,#131a3a,#1d1033);
}
.текст-кадр .имя{ font-size:1.4rem; font-weight:700; margin-bottom:12px;
  text-shadow:0 2px 8px rgba(0,0,0,.7); }
.текст-кадр .что{ font-size:1.1333rem; line-height:1.65;
  text-shadow:0 1px 6px rgba(0,0,0,.6); word-break:break-word; }

.файл-кадр{
  width:100%; height:100%; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:10px; color:#fff;
  padding:76px 28px 150px; box-sizing:border-box; text-align:center;
}
.файл-кадр .знак{ display:flex; color:var(--сирень); }
.файл-кадр .знак svg{ width:44px; height:44px; }
.файл-кадр .вид{ font-size:0.8rem; color:var(--синий);
  background:rgba(0,149,246,.15); border-radius:6px; padding:3px 10px; }
.файл-кадр a{ color:#fff; text-decoration:none; font-size:0.8667rem;
  max-width:70%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.файл-кадр .что{ font-size:0.9333rem; color:rgba(255,255,255,.72); line-height:1.6;
  word-break:break-word; }
.файл-кадр.сбой .знак{ color:var(--красный); }
.ютуб{ width:100%; height:100%; }

.жила{ position:absolute; bottom:0; left:0; right:0; height:2px;
  background:rgba(255,255,255,.16); z-index:15; pointer-events:none; }
.жила i{ display:block; height:100%; width:0; background:#fff; }

.пауза, .звуком{
  position:absolute; inset:0; z-index:5; pointer-events:none;
  display:flex; align-items:center; justify-content:center;
  opacity:0; transition:opacity .25s;
}
.пауза.видно, .звуком.видно{ opacity:1; }
.пауза i, .звуком i{
  width:62px; height:62px; border-radius:50%; background:rgba(0,0,0,.45);
  display:flex; align-items:center; justify-content:center;
  font-style:normal; font-size:1.5333rem; color:#fff; padding-left:4px;
}
/* У знака звука внутри наш значок линиями, а не буква: ему отступ
   слева не нужен, он и так по середине. */
.звуком i{ padding-left:0; }
.звуком i svg{ width:28px; height:28px; }

/* ── низ кадра: слева автор, справа действия ─────────────────────── */
.низ{
  position:absolute; left:0; right:0; bottom:0; z-index:10;
  display:flex; align-items:flex-end; gap:12px;
  /* Запас сверху — это не отступ, это длина затемнения: на ярком кадре
     белые буквы без него теряются. Снизу считаем полосу дома на айфоне. */
  padding:54px 14px calc(16px + var(--низ-край));
  pointer-events:none;
  background:linear-gradient(0deg,rgba(0,0,0,.78),rgba(0,0,0,.45) 45%,rgba(0,0,0,0));
}
.про{ flex:1; min-width:0; pointer-events:auto; cursor:pointer; }
.про .кто{ display:flex; align-items:center; gap:9px; }
.про .имя{ font-size:0.9333rem; font-weight:800; color:#fff;
  text-shadow:0 1px 6px rgba(0,0,0,.85); letter-spacing:.01em;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.метка{ font-size:0.6rem; padding:2px 6px; border-radius:4px;
  font-weight:700; letter-spacing:.05em; flex:0 0 auto; }
.метка.short{ background:rgba(0,149,246,.17); color:#4a9eff; }
.метка.post{ background:rgba(99,220,120,.17); color:#63dc78; }

.про .заглавие{ font-size:1rem; font-weight:700; color:#fff;
  line-height:1.3; margin-top:8px; text-shadow:0 1px 6px rgba(0,0,0,.85); }
.про .текст,.про .теги,.про .нота{ display:none; }
.про.раскрыт .текст{ display:-webkit-box; -webkit-line-clamp:4;
  -webkit-box-orient:vertical; overflow:hidden;
  font-size:0.8667rem; color:#fff; line-height:1.5; margin-top:5px;
  text-shadow:0 1px 5px rgba(0,0,0,.8); }
.про.раскрыт .теги{ display:flex; flex-wrap:wrap; gap:5px; margin-top:6px; }
.про.раскрыт .нота{ display:flex; align-items:center; gap:6px;
  font-size:0.8rem; color:rgba(255,255,255,.9); margin-top:6px; }
.тег{ font-size:0.7333rem; color:#4a9eff; background:rgba(0,149,246,.14);
  border-radius:8px; padding:2px 7px; }

/* Три значка стоят тесно: это одна группа — «что сделать с записью», —
   а не три отдельные вещи, разложенные по низу кадра. Промежуток был
   20 точек, стал вдвое меньше. */
.дела{ display:flex; align-items:flex-end; gap:10px; pointer-events:auto;
  flex:0 0 auto; }
.дело{ display:flex; flex-direction:column; align-items:center; gap:4px;
  background:none; border:none; cursor:pointer; padding:0; color:#fff; }
.дело .зн{ display:flex; filter:drop-shadow(0 1px 4px rgba(0,0,0,.75)); }
/* Линия у этих трёх толще, чем у значков в окнах, и сами они крупнее:
   они стоят не на бумаге, а поверх ролика, где кадр может быть любым.
   Толщина и размер взяты с боевой — там этот ряд читается с одного
   взгляда, а тонкая линия на светлом кадре просто пропадала. */
.дело .зн svg{ width:29px; height:29px; stroke-width:2.6; }
.дело .счёт{ font-size:0.7333rem; font-weight:700; color:rgba(255,255,255,.92);
  text-shadow:0 1px 3px rgba(0,0,0,.6); min-height:13px; }
.дело:hover .зн{ transform:scale(1.08); }
/* ── СДЕЛАННОЕ ГОРИТ ОДНИМ ЦВЕТОМ ──
   Синий у стрелки был единственным цветом в этом ряду, и он читался
   как «это уже твоё». Теперь так же горит сердце, когда лайк
   поставлен, и значок комментариев, когда ты под записью уже писал:
   три иконки — один язык, и красный, означавший то же самое другим
   цветом, больше не нужен. */
.дело.сердце.горит .зн{ color:var(--синий); }
.дело.сердце.горит .зн svg path{ fill:currentColor; }
.дело.коммент.горит .зн{ color:var(--синий); }
.дело.поделиться .зн{ color:var(--синий); }

/* ── пусто и беда ────────────────────────────────────────────────── */
.пусто-лента{
  display:flex; flex-direction:column; align-items:center;
  justify-content:center; height:100%; gap:13px; text-align:center;
  padding:40px 30px; box-sizing:border-box;
}
.пусто-лента .знак{ display:flex; color:var(--сирень); }
.пусто-лента .знак svg{ width:46px; height:46px; }
.пусто-лента .слово{ font-size:1.0333rem; font-weight:600;
  color:rgba(255,255,255,.9); }
.пусто-лента .под{ font-size:0.8667rem; color:rgba(255,255,255,.45);
  line-height:1.7; max-width:300px; }
.пусто-лента.сбой .знак{ color:var(--красный); }
/* Кнопка «Повторить» под красной карточкой. Вид взят у общей кнопки
   программы (.кнопка в shared/style.css), только заметнее: на чёрном
   поле ленты обычная серая кнопка читается как надпись, а нажать её
   человек должен сразу. */
.пусто-кнопка{
  border:1px solid var(--край2); background:var(--поле);
  color:var(--текст); border-radius:var(--радиус-мал);
  padding:9px 19px; font:inherit; font-size:0.9333rem; cursor:pointer;
  transition:background .13s ease, transform .1s ease;
}
.пусто-кнопка:hover{ background:var(--край); }
.пусто-кнопка:active{ transform:scale(.97); }

.кружит{ display:flex; align-items:center; justify-content:center;
  height:100%; }
.кружит i{
  width:34px; height:34px; border-radius:50%; display:block;
  border:3.5px solid rgba(255,255,255,.1); border-top-color:#2f8bff;
  animation:вертеть .85s linear infinite;
}
@keyframes вертеть{ to{ transform:rotate(360deg); } }

/* ── комментарии ─────────────────────────────────────────────────── */
/* Оформление комментариев уехало вместе с ними в
   shared/window.css — там оно общее для всех окон. */

/* ── телефон: лента во весь экран, полка уезжает ──────────────────
   Единственное, чем лента отличается от чатов и групп, и отличие это
   не от небрежности: ролик на телефоне занимает экран целиком, а
   «Стримить» и «Добавить» достаются из полосы снизу. */
@media (max-width:1000px){
  .об-лист:has(.две-колонки){ padding:0; height:100%; }
  .об-место:has(.две-колонки){ overflow:hidden; }
  .две-колонки{ height:100%; }
  .правая{ display:none; }
  /* Пишем «.две-колонки > .левая», а не просто «.левая»: двумя
     десятками строк выше стоит ровно такой же двойной отбор с полем
     в 21 точку, и он весомее одиночного - медиазапрос этого не
     меняет. Из-за этого лента на телефоне до сих пор не доходила до
     краёв: сверху и снизу у неё оставалась полоса в 21 точку, а
     ролик должен занимать экран целиком. */
  .две-колонки > .левая{ flex:1 1 auto; margin:0; padding:0; }
  .столб{ width:100%; height:100%; max-height:none; aspect-ratio:auto;
    margin:0; border:none; border-radius:0; }
}

</style>

<script src="shared/time.js?v=20261123-427"></script>
<script src="shared/auth.js?v=20261123-427"></script>
<script src="shared/account.js?v=20261123-427"></script>
<script src="shared/shell.js?v=20261123-427"></script>
<script src="shared/shelf.js?v=20261123-427"></script>
<script>
'use strict';

CW.оболочка('feed').then(function (место) {

/* ═══════════════════════════════════════════════════════════════════════
   ЧТО МЫ СЕЙЧАС ПОКАЗЫВАЕМ
   ═══════════════════════════════════════════════════════════════════════ */
/* Четыре вкладки и то, что каждая показывает. «вид» — это род записи
   из родЗаписи() ниже, а не написание типа из базы: «Шортс» — всё, у
   чего есть видео, «Посты» — всё остальное. «Для тебя» и «Топ» берут
   записи обоих родов и отличаются только порядком. */
var ВКЛАДКИ = [
  { имя: 'shorts', подпись: 'Шортс',    вид: 'short' },
  { имя: 'post',   подпись: 'Посты',    вид: 'пост'  },
  { имя: 'rec',    подпись: 'Для тебя', вид: 'все'   },
  { имя: 'top',    подпись: 'Топ',      вид: 'все'   }
];

var ЗА_РАЗ = 30;          /* сколько записей просим у сервера за раз */
var ДОБОР  = 4;           /* столько лишних страниц разрешаем добрать */

var С = {
  вкладка: вспомнитьВкладку(),
  всё: [],               /* всё, что принесли с сервера */
  сдвиг: 0,
  ещёЕсть: true,
  грузим: false,
  сбой: false,
  ищем: '',
  тихо: взятьТихо(),
  текущий: null,
  видели: {},
  часы: {},
  подписки: null,        /* кого читаем: null — ещё не спрашивали */
};

/* ═══════════════════════════════════════════════════════════════════════
   РАЗМЕТКА. Собирается один раз, дальше меняется только полоса кадров.
   ═══════════════════════════════════════════════════════════════════════ */
var ряд = сделать('div', 'две-колонки');
место.appendChild(ряд);

var слева = сделать('div', 'левая');
ряд.appendChild(слева);

var справа = сделать('div', 'правая');
ряд.appendChild(справа);
справа.appendChild(CW.полка());

var столб = сделать('div', 'столб');
слева.appendChild(столб);

/* вкладки */
var вкладки = сделать('div', 'вкладки');
var рядВкладок = сделать('div', 'ряд');
ВКЛАДКИ.forEach(function (в) {
  var б = сделать('button', 'вкладка' + (в.имя === С.вкладка ? ' тут' : ''));
  б.textContent = в.подпись;
  б.onclick = function () { сменитьВкладку(в.имя); };
  рядВкладок.appendChild(б);
});

var кнЛупа = сделать('button', 'вк-кнопка вк-лупа');
кнЛупа.innerHTML = CW.значок('лупа');
кнЛупа.title = 'Поиск по ленте';
рядВкладок.appendChild(кнЛупа);

var кнСвернуть = сделать('button', 'вк-кнопка вк-свернуть');
кнСвернуть.innerHTML = CW.значок('шеврон');
кнСвернуть.title = 'Скрыть шапку';
рядВкладок.appendChild(кнСвернуть);

вкладки.appendChild(рядВкладок);

var поиск = сделать('div', 'вк-поиск');
поиск.innerHTML =
    '<input id="поиск-ленты" type="text" autocomplete="off" spellcheck="false" '
  + 'placeholder="Имя, заголовок, описание, тег">'
  + '<button class="закрыть" title="Закрыть поиск">✕</button>';
вкладки.appendChild(поиск);

/* Список найденного живёт прямо под полем, внутри той же шапки: он
   принадлежит полю, а не кадру, и уезжает вместе с шапкой. */
var находки = сделать('div', 'вк-находки');
вкладки.appendChild(находки);
столб.appendChild(вкладки);

var птичка = сделать('button', 'птичка');
птичка.innerHTML = CW.значок('шеврон');
птичка.title = 'Показать шапку';
столб.appendChild(птичка);

кнСвернуть.onclick = птичка.onclick = function () {
  var спрятано = вкладки.classList.toggle('спрятаны');
  птичка.classList.toggle('видно', спрятано);
  if (спрятано) закрытьПоиск();
};

кнЛупа.onclick = function () {
  var видно = поиск.classList.toggle('видно');
  кнЛупа.classList.toggle('горит', видно);
  if (видно) document.getElementById('поиск-ленты').focus();
  else закрытьПоиск();
};
поиск.querySelector('.закрыть').onclick = закрытьПоиск;
поискВвод();

function поискВвод() {
  var поле = document.getElementById('поиск-ленты');
  поле.oninput = function () {
    С.ищем = поле.value.trim();
    показатьНаходки();
    искатьГлубже();
  };
  поле.onkeydown = function (е) { if (е.key === 'Escape') закрытьПоиск(); };
}

/* ── ЧТО НАШЛОСЬ — СПИСКОМ, И НИКУДА НЕ УНОСИТ ──

   Поиск раньше прятал в ленте всё, кроме совпавшего, и лента тут же
   вставала на первое из них: человек набрал две буквы — и смотрит
   чужое видео, которого не выбирал.

   Теперь лента не трогается вовсе. Под полем встают строки: заголовок
   и под ним автор, как в боевой. Переход — только по нажатию на
   строку, то есть по решению человека.

   Меньше двух знаков списка нет: по одной букве совпадает половина
   ленты, и список из тридцати строк не помогает никому. */
var НАДО_ЗНАКОВ = 2;

function показатьНаходки() {
  находки.innerHTML = '';

  if (С.ищем.length < НАДО_ЗНАКОВ) {
    находки.classList.remove('видно');
    return;
  }
  находки.classList.add('видно');

  var ряды = С.всё.filter(подходит).slice(0, 30);
  if (!ряды.length) {
    var п = сделать('div', 'пусто');
    п.textContent = С.ещёЕсть ? 'Пока ничего. Загрузка…'
                              : 'Ничего не нашлось';
    находки.appendChild(п);
    return;
  }

  ряды.forEach(function (з) {
    var б = сделать('button', 'вк-находка');
    б.innerHTML = CW.значок('лупа')
      + '<div class="что"><b></b><span></span></div>';
    б.querySelector('b').textContent =
      String(з.title || з.description || 'Без названия').slice(0, 80);
    б.querySelector('span').textContent = имяАвтора(з);
    б.onclick = function () { перейтиКЗаписи(з); };
    находки.appendChild(б);
  });
}

/* Выбрали строку — идём к записи. Она может лежать в другой вкладке
   (искали пост, стоя на «Шортсе»), поэтому сперва вкладка, потом
   прокрутка: иначе кадра в полосе просто нет. */
function перейтиКЗаписи(з) {
  закрытьПоиск();
  var нужна = постЛи(з) ? 'post' : 'shorts';
  if (С.вкладка !== нужна && (С.вкладка === 'post' || С.вкладка === 'shorts')) {
    сменитьВкладку(нужна);
  } else {
    отобрать();
  }
  прокрутитьК(з.id);
}

function прокрутитьК(ид, попыток) {
  попыток = попыток == null ? 12 : попыток;
  var к = полоса.querySelector('.кадр[data-номер="' + ид + '"]');
  if (к) { полоса.scrollTop = к.offsetTop; С.текущий = ид; return; }
  /* Кадра ещё нет: вкладка только что сменилась и лента перерисовывается.
     Ждём её, но не вечно. */
  if (попыток > 0) setTimeout(function () { прокрутитьК(ид, попыток - 1); }, 150);
}

/* ── ПОИСК ИЩЕТ ВО ВСЕЙ ЛЕНТЕ, А НЕ В ТОМ, ЧТО УСПЕЛО ПРИЕХАТЬ ──

   Лента приходит кусками по тридцать записей. Искать только в
   приехавшем — значит искать на первой странице: человек ищет свою
   запись недельной давности, читает «ничего не нашлось» и решает,
   что поиск сломан. Сервер искать по ленте пока не умеет (такого
   запроса у него нет), поэтому ищем честно сами: пока ничего не
   нашлось, досылаем следующий кусок и смотрим в нём.

   Восемь кусков — предел нарочно: двести сорок записей хватает, а
   один набор букв наугад не должен вытягивать всю базу. Дошли до
   конца ленты — так и скажем в пустом месте.

   Номер запроса нужен, потому что человек печатает быстрее, чем
   отвечает сервер: ответ на «аб» не должен дописывать ленту, когда
   в поле уже «абв». */
var ПОИСК_КУСКОВ = 8;
var поискНомер = 0;

function искатьГлубже() {
  шагПоиска(++поискНомер, ПОИСК_КУСКОВ);
}

function шагПоиска(мой, осталось) {
  if (мой !== поискНомер || !С.ищем) return;
  if (осталось <= 0 || !С.ещёЕсть || С.грузим) return;
  if (С.ищем.length < НАДО_ЗНАКОВ) return;
  if (С.вкладка === 'rec' || С.вкладка === 'top') return;  /* они берут всё сразу */
  if (С.всё.filter(подходит).length) return;               /* уже нашли */

  CW.спросить(адресЛенты(), { тихо: true }).then(function (д) {
    if (мой !== поискНомер || !Array.isArray(д)) return;
    С.сдвиг += ЗА_РАЗ;
    С.ещёЕсть = д.length >= ЗА_РАЗ;
    var было = {};
    С.всё.forEach(function (п) { было[п.id] = 1; });
    д.forEach(function (п) { if (!было[п.id]) С.всё.push(п); });
    отобрать();
    показатьНаходки();
    шагПоиска(мой, осталось - 1);
  }).catch(function () { /* не доехало — ищем в том, что есть */ });
}

function закрытьПоиск() {
  поиск.classList.remove('видно');
  кнЛупа.classList.remove('горит');
  var поле = document.getElementById('поиск-ленты');
  if (поле) поле.value = '';
  С.ищем = '';
  находки.innerHTML = '';
  находки.classList.remove('видно');
}


/* полоса кадров */
var полоса = сделать('div', 'полоса');
столб.appendChild(полоса);

/* Панель комментариев жила здесь и потому открывалась только из ленты.
   Теперь это общая модалка (modals/comments.js): те же комментарии
   открываются из профиля, из уведомлений и по ссылке на запись. */

/* листание с клавиатуры — на мониторе это привычнее колеса */
document.addEventListener('keydown', function (е) {
  if (е.target && /INPUT|TEXTAREA/.test(е.target.tagName)) return;
  if (е.key === 'ArrowDown') { е.preventDefault(); шагнуть(1); }
  if (е.key === 'ArrowUp')   { е.preventDefault(); шагнуть(-1); }
});

function шагнуть(куда) {
  var кадры = [].slice.call(полоса.querySelectorAll('.кадр:not(.спрятан)'));
  var где = кадры.indexOf(полоса.querySelector('.кадр[data-номер="' + С.текущий + '"]'));
  var надо = Math.max(0, Math.min(кадры.length - 1, (где < 0 ? 0 : где) + куда));
  if (кадры[надо]) полоса.scrollTop = кадры[надо].offsetTop;
}

/* ═══════════════════════════════════════════════════════════════════════
   ЧТО ЛЕНТА УМЕЕТ СНАРУЖИ

   Ровно то, что можно сказать голосом: пролистать, поставить лайк,
   открыть комментарии, поделиться, включить звук, сменить вкладку.
   Голосовой помощник зовёт это, когда человек стоит на ленте; на
   других страницах CW.ленты просто нет, и команда честно говорит, что
   она для ленты.

   Отдаём не внутренности, а семь действий — те же, что делаются
   пальцем. Больше ленте показывать наружу нечего.
   ═══════════════════════════════════════════════════════════════════════ */
CW.лента = {
  вкладка: сменитьВкладку,
  дальше:  function () { шагнуть(1); },
  назад:   function () { шагнуть(-1); },
  звук:    переключитьЗвук,
  тихоЛи:  function () { return С.тихо; },
  лайк:    function () { нажать('.дело.сердце'); },
  коммент: function () { нажать('.дело.коммент'); },
  делись:  function () { нажать('.дело.поделиться'); }
};

/* Голосом делаем то же самое, что пальцем: находим кнопку на текущем
   кадре и нажимаем. Второго пути к действию нет — значит и разойтись
   им негде. */
function нажать(что) {
  var кадр = полоса.querySelector('.кадр[data-номер="' + С.текущий + '"]');
  var кн = кадр && кадр.querySelector(что);
  if (кн) кн.click();
  return !!кн;
}

/* ═══════════════════════════════════════════════════════════════════════
   ЗАГРУЗКА
   ═══════════════════════════════════════════════════════════════════════ */
взятьПервое();

function взятьПервое() {
  С.всё = []; С.сдвиг = 0; С.ещёЕсть = true; С.сбой = false;
  /* Счёт попыток обнуляется ЗДЕСЬ, а не в самой подгрузке: подгрузка
     зовёт себя же с тем же «первый», и обнуление внутри неё означало
     бы, что попытки не кончаются никогда - лента так и висела бы на
     «Загрузка», молча дёргая сервер. */
  попытка = 0;
  полоса.innerHTML = '<div class="кружит"><i></i></div>';
  подгрузить(true);
}

/* ── ОТКУДА БЕРЁМ ЗАПИСИ ──

   «Для тебя» раньше брала /feed/following — ленту тех, на кого человек
   подписан. Это не «для тебя», это «подписки»: у нового человека
   подписок нет, и вкладка стояла пустой, хотя записей в мире полно.
   Теперь «Для тебя» берёт общую ленту пошире и выстраивает её по
   интересу, а подписки идут отдельным тихим запросом — просто чтобы
   знать, чьи записи поднять выше. */
function адресЛенты() {
  if (С.вкладка === 'rec' || С.вкладка === 'top') return '/feed?limit=100&offset=0';
  return '/feed?limit=' + ЗА_РАЗ + '&offset=' + С.сдвиг;
}

/* Спрашиваем подписки один раз за посещение страницы и только когда
   открыта «Для тебя»: на «Шортсе» этот список не нужен. */
function узнатьПодписки() {
  if (С.подписки) return;
  С.подписки = {};
  CW.спросить('/feed/following', { тихо: true }).then(function (д) {
    if (!Array.isArray(д)) return;
    д.forEach(function (п) { С.подписки[п.user_id] = true; });
    /* Записи из подписок тоже кладём в общий мешок: вдруг их нет в
       сотне последних, а человек их ждёт. */
    var было = {};
    С.всё.forEach(function (п) { было[п.id] = 1; });
    д.forEach(function (п) { if (!было[п.id]) С.всё.push(п); });
    if (С.вкладка === 'rec') отобрать();
  }).catch(function () { /* нет подписок — не беда, просто не поднимаем */ });
}

/* ── ПЕРВЫЙ ЗАПРОС К СПЯЩЕМУ СЕРВЕРУ ────────────────────────────────
   Анна прислала снимок: «Лента не загрузилась. Нет связи с сервером.
   Проверь интернет и обнови страницу» - а через минуту лента
   появилась сама.

   Интернет был в порядке. Сервер на Render засыпает, когда его долго
   не трогают, и первый запрос к нему не отвечает вовсе: пока он
   просыпается, запрос отваливается по сроку. Лента на это сразу
   писала «нет связи» и ждала, чтобы человек обновил страницу руками.

   Теперь первый заход пробует трижды: сразу, через три секунды и ещё
   через восемь. Этого обычно хватает, чтобы сервер поднялся, и человек
   вообще ничего не замечает, кроме того, что лента приехала не сразу.
   Пока идут попытки, на месте ленты стоит обычное «Загрузка», а не
   красное «не загрузилась»: пугать раньше времени незачем.

   Если и три раза не вышло - тогда уже беда, и под ней стоит кнопка
   «Повторить»: нажать её проще, чем обновлять страницу, и ленту она
   поднимает с того же места. */
var ПАУЗЫ = [3000, 8000];      /* сколько ждать перед второй и третьей */
var попытка = 0;

function подгрузить(первый) {
  if (С.грузим || (!первый && !С.ещёЕсть)) return;
  С.грузим = true;

  CW.спросить(адресЛенты(), { сроком: 25000 })
    .then(function (д) {
      /* Пришёл массив — ответ был, пусть и пустой. Не массив — сервер не
         ответил или ответил чем-то другим, и об этом надо сказать прямо,
         а не писать «пока пусто»: это две разные правды. */
      if (!Array.isArray(д)) throw CW.Беда(502, 'Сервер ответил не лентой');

      С.грузим = false;
      С.сбой = false;
      попытка = 0;
      if (С.вкладка === 'rec' || С.вкладка === 'top') С.ещёЕсть = false;
      if (С.вкладка === 'rec') узнатьПодписки();
      else {
        С.сдвиг += ЗА_РАЗ;
        С.ещёЕсть = д.length >= ЗА_РАЗ;
      }

      var было = {};
      С.всё.forEach(function (п) { было[п.id] = 1; });
      д.forEach(function (п) { if (!было[п.id]) С.всё.push(п); });

      отобрать();
      добрать(первый ? ДОБОР : 0);
    })
    .catch(function (е) {
      С.грузим = false;
      /* Ещё есть попытки - молча ждём и пробуем снова, оставив на
         экране «Загрузка». Сбой не ставим: при нём пустое место в
         полосе само рисует красную карточку. */
      if (первый && попытка < ПАУЗЫ.length) {
        var пауза = ПАУЗЫ[попытка];
        попытка += 1;
        полоса.innerHTML = '';
        CW.ждём(полоса);
        setTimeout(function () { подгрузить(true); }, пауза);
        return;
      }
      С.сбой = true;
      показатьБеду(е);
    });
}

/* Вкладки «Шортс» и «Посты» отбирают из общей ленты по виду записи.
   Если в первых тридцати не оказалось ни одной записи нужного вида, а на
   сервере есть ещё — доберём. Иначе человек видит «Нет постов» при том,
   что посты есть, просто лежат глубже. */
function добрать(осталосьПопыток) {
  if (осталосьПопыток <= 0 || !С.ещёЕсть || С.грузим) return;
  if (отобранные().length >= 3) return;
  CW.спросить(адресЛенты(), { тихо: true }).then(function (д) {
    if (!Array.isArray(д)) return;
    С.сдвиг += ЗА_РАЗ;
    С.ещёЕсть = д.length >= ЗА_РАЗ;
    var было = {};
    С.всё.forEach(function (п) { было[п.id] = 1; });
    д.forEach(function (п) { if (!было[п.id]) С.всё.push(п); });
    отобрать();
    добрать(осталосьПопыток - 1);
  });
}

function показатьБеду(е) {
  полоса.innerHTML = '';
  полоса.appendChild(бедаЛенты(е));
}

/* Карточка отказа - одна на два места: её показывает показатьБеду сразу
   после отказа и пустоеМесто, когда полоса оказалась пустой при С.сбой.
   Прежде текст был написан дважды и уже разошёлся: в одном месте
   «проверь интернет», в другом нет. */
function бедаЛенты(е) {
  var у = пустое('внимание', 'Лента не загрузилась',
    (е && е.сеть)
      ? 'Сервер не отвечает. Бывает, что он просыпается после простоя, тогда помогает «Повторить».'
      : 'Сервер не ответил.', true);
  var кн = сделать('button', 'пусто-кнопка');
  кн.type = 'button';
  кн.textContent = 'Повторить';
  кн.onclick = function () {
    С.сбой = false;
    попытка = 0;                 /* нажали руками - снова три попытки */
    полоса.innerHTML = '';
    CW.ждём(полоса);
    подгрузить(true);
  };
  у.appendChild(кн);
  return у;
}

/* ═══════════════════════════════════════════════════════════════════════
   ОТБОР И ПОКАЗ
   ═══════════════════════════════════════════════════════════════════════ */
/* ── РОД ЗАПИСИ: ПО ТОМУ, ЧТО В НЕЙ ЕСТЬ, А НЕ ПО ТОМУ, КАК НАЗВАНА ──

   В базе за годы накопилось четыре написания типа: short, ball, post и
   даже text. Но беда глубже написания: запись могла называться «short»
   и не иметь ролика вовсе. Такая уезжала во вкладку «Шортс» и стояла
   там чёрным прямоугольником с одним заголовком — Анна это и увидела:
   «В гостях у Андрюши» без видео среди роликов.

   Поэтому род решает содержимое:
       есть ролик (hls_url или video_url) → ШОРТС
       ролика нет                         → ПОСТ, чем бы он ни звался

   Ютуб-ссылка — тоже ролик: играет её чужая рамка, а не наша, но
   смотреть её человек идёт в «Шортс», а не в «Посты». */
function родЗаписи(п) {
  if (String(п.hls_url || '')) return 'short';
  if (String(п.video_url || '')) return 'short';
  return 'пост';
}
function постЛи(п) { return родЗаписи(п) !== 'short'; }

/* ── ВЕС ЗАПИСИ ДЛЯ «ТОПА» ──
   Просто «больше лайков» — это вечный топ: запись годовой давности с
   сотней лайков навсегда перекрывает свежую с десятью. Поэтому вес
   стареет: лайк, комментарий и просмотр складываются в очки, а потом
   делятся на возраст. Через сутки очки весят вдвое меньше, через
   неделю — впятеро, но никогда не обнуляются совсем.

       лайк        3 очка   (самое дорогое: это осознанное действие)
       комментарий 2 очка   (дороже просмотра, дешевле лайка)
       просмотр    0,1 очка (их много, и они почти даром)
*/
function вес(п) {
  var очки = (Number(п.likes) || 0) * 3
           + (Number(п.comment_count) || 0) * 2
           + (Number(п.views || п.view_count) || 0) * 0.1;
  var часы = возрастЧасов(п);
  return очки / Math.pow(часы + 2, 0.4);
}

function возрастЧасов(п) {
  var т = Date.parse(String(п.created_at || '').replace(' ', 'T'));
  if (!т) return 48;
  var ч = (Date.now() - т) / 3600000;
  return ч > 0 ? ч : 0;
}

/* ── «ДЛЯ ТЕБЯ» ──
   Это не случайная лента и не вторая копия «Топа». Интерес считаем по
   тому, что человек уже отметил сам:

       тег, который встречался в понравившихся записях   +5
       автор, чью запись он уже отмечал                  +4
       своё собственное                                  −6 (своё он видел)
       свежесть                                          та же, что в «Топе»

   Данных для этого хватает в самой ленте: у каждой записи приезжает
   «liked» — отмечал её этот человек или нет. Никаких догадок о нём
   самом мы не делаем и никуда их не шлём. */
function мойИнтерес() {
  var теги = {}, авторы = {};
  С.всё.forEach(function (п) {
    if (!п.liked) return;
    авторы[п.user_id] = true;
    CW.теги(п.tags).forEach(function (т) { теги[т.toLowerCase()] = true; });
  });
  return { теги: теги, авторы: авторы };
}

function интерес(п, мой, я) {
  var очки = 0;
  CW.теги(п.tags).forEach(function (т) {
    if (мой.теги[String(т).toLowerCase()]) очки += 5;
  });
  if (мой.авторы[п.user_id]) очки += 4;
  if (С.подписки && С.подписки[п.user_id]) очки += 8;
  if (я && Number(п.user_id) === Number(я)) очки -= 6;
  /* Свежесть добавляем мягко, чтобы интерес не перевесила одна только
     новизна: сутки назад — плюс балл, неделю назад — почти ничего. */
  очки += 6 / Math.pow(возрастЧасов(п) + 6, 0.5);
  return очки + вес(п) * 0.3;
}

function отобранные() {
  var нужен = (ВКЛАДКИ.filter(function (в) { return в.имя === С.вкладка; })[0] || {}).вид;
  var ряды = С.всё.filter(function (п) {
    if (нужен === 'все') return true;
    return родЗаписи(п) === нужен;
  });

  if (С.вкладка === 'top') {
    ряды = ряды.slice().sort(function (а, б) { return вес(б) - вес(а); });
  } else if (С.вкладка === 'rec') {
    var мой = мойИнтерес();
    var я = (CW.ясныйЯ && CW.ясныйЯ() && CW.ясныйЯ().id) || 0;
    ряды = ряды.slice().sort(function (а, б) {
      return интерес(б, мой, я) - интерес(а, мой, я);
    });
  }
  return ряды;
}

function отобрать() {
  var ряды = отобранные();

  if (!ряды.length) { полоса.innerHTML = ''; полоса.appendChild(пустоеМесто()); return; }

  /* Добавляем только то, чего ещё нет, и НИЧЕГО не переставляем. Уже
     стоящий кадр нельзя трогать: перенос узла в разметке для браузера —
     это удаление и вставка заново, и ролик, который человек смотрит,
     начался бы с начала. Новое всегда приходит в конец, поэтому порядок
     и так верный. */
  var есть = {};
  [].slice.call(полоса.querySelectorAll('.кадр')).forEach(function (к) {
    есть[к.dataset.номер] = к;
  });
  if (полоса.querySelector('.кружит') || полоса.querySelector('.пусто-лента')) {
    полоса.innerHTML = ''; есть = {};
  }

  ряды.forEach(function (п) {
    var к = есть[String(п.id)];
    if (!к) {
      к = сделатьКадр(п);
      полоса.appendChild(к);
      готовщик().observe(к);
      смотрящий().observe(к);
    } else delete есть[String(п.id)];
    /* Поиск ленту больше не прячет: он показывает найденное списком
       под полем. Прятать кадры значило уносить человека на первое
       совпадение, которого он не выбирал. */
    к.classList.remove('спрятан');
  });

  /* кадры, которых больше нет в отборе — убираем совсем */
  Object.keys(есть).forEach(function (н) {
    var к = есть[н];
    смотрящий().unobserve(к);
    готовщик().unobserve(к);
    if (к.parentNode) к.parentNode.removeChild(к);
  });

  if (!полоса.querySelector('.кадр')) полоса.appendChild(пустоеМесто());
}

function подходит(п) {
  if (!С.ищем) return true;
  var что = CW.ровно(С.ищем);
  var поТегам = что.charAt(0) === '#';
  var теги = CW.ровно((Array.isArray(п.tags) ? п.tags : []).join(' '));
  if (поТегам) return теги.indexOf(что.slice(1)) >= 0;
  var всё = CW.ровно([имяАвтора(п), п.title || '', п.description || '', теги].join(' '));
  return всё.indexOf(что) >= 0;
}

function пустоеМесто() {
  if (С.сбой) return бедаЛенты(null);
  if (С.вкладка === 'rec') {
    return пустое('люди', 'Пока не на кого смотреть',
      'Подпишись на авторов: в этой вкладке будут только их новые публикации.');
  }
  if (С.вкладка === 'post') {
    return пустое('лист', 'Нет постов (POST)',
      'Нажми «Добавить контент»: опубликуй SHORT или POST, и он появится здесь сразу.');
  }
  if (С.вкладка === 'shorts') {
    return пустое('камера', 'Нет видео (SHORT)',
      'Нажми «Добавить контент»: опубликуй SHORT или POST, и он появится здесь сразу.');
  }
  return пустое('звезда', 'Лента пуста',
    'Нажми «Добавить контент»: опубликуй SHORT или POST, и он появится здесь сразу.');
}

function пустое(знак, слово, под, сбой) {
  var у = сделать('div', 'пусто-лента' + (сбой ? ' сбой' : ''));
  у.innerHTML = '<div class="знак">' + CW.значок(знак) + '</div>'
              + '<div class="слово">' + CW.безопасно(слово) + '</div>'
              + '<div class="под">' + CW.безопасно(под) + '</div>';
  return у;
}

function сменитьВкладку(имя) {
  if (имя === С.вкладка) return;
  var былоИсточник = источник(С.вкладка);
  С.вкладка = имя;
  try { localStorage.setItem('cw_feed_tab', имя); } catch (е) {}
  [].slice.call(рядВкладок.querySelectorAll('.вкладка')).forEach(function (б, и) {
    б.classList.toggle('тут', ВКЛАДКИ[и].имя === имя);
  });
  полоса.scrollTop = 0;

  /* «Шортс» и «Посты» — это одна и та же лента, просто отобранная по виду
     записи. Спрашивать сервер заново при переходе между ними незачем:
     данные уже на руках, меняется только отбор. */
  if (источник(имя) === былоИсточник && С.всё.length) { отобрать(); добрать(ДОБОР); }
  else взятьПервое();
  /* Подписки нужны только «Для тебя». Если лента не перезагружалась,
     спросить их всё равно надо — внутри стоит защита от повтора. */
  if (имя === 'rec') узнатьПодписки();
}

/* Откуда вкладка берёт записи. «Для тебя» и «Топ» теперь берут одну и
   ту же широкую выборку и отличаются только порядком — значит при
   переходе между ними сервер спрашивать не надо. */
function источник(в) {
  return (в === 'rec' || в === 'top') ? 'широкая' : 'общая';
}

function вспомнитьВкладку() {
  var н = null;
  try { н = localStorage.getItem('cw_feed_tab'); } catch (е) {}
  return ВКЛАДКИ.filter(function (в) { return в.имя === н; }).length ? н : 'shorts';
}

/* ═══════════════════════════════════════════════════════════════════════
   КАДР
   ═══════════════════════════════════════════════════════════════════════ */
function сделатьКадр(п) {
  var к = сделать('div', 'кадр');
  к.dataset.номер = String(п.id);
  к.dataset.автор = String(п.user_id || '');

  к.innerHTML = медиа(п)
    + '<div class="пауза"><i>▶</i></div>'
    + (естьРолик(п) ? '<div class="звуком"><i></i></div>' : '')
    + (естьРолик(п) ? '<div class="жила"><i></i></div>' : '')
    + '<div class="низ">'
    +   '<div class="про">'
    +     '<div class="кто"><span class="место-лица"></span>'
    +       '<span class="имя" data-имя="' + CW.безопасно(String(п.user_id || '')) + '">'
    +         CW.безопасно(имяАвтора(п)) + '</span>'
    +       '<span class="метка ' + (постЛи(п) ? 'post">POST' : 'short">SHORT')
    +     '</span></div>'
    +     (п.title ? '<div class="заглавие">' + CW.безопасно(п.title) + '</div>' : '')
    +     '<div class="текст">' + CW.безопасно(п.description || '') + '</div>'
    +     (п.music ? '<div class="нота">♪ ' + CW.безопасно(п.music) + '</div>' : '')
    +     теги(п)
    +   '</div>'
    /* Три кнопки, как в боевой: комментарии, сердце и синяя стрелка.
       Четвёртой — «гамбургера» — больше нет: всё, что он открывал,
       теперь внутри листа «Действия» под той же стрелкой. Две кнопки
       рядом, из которых одна открывает меню другой, человек читает как
       две разные вещи, а это была одна. */
    +   '<div class="дела">'
    +     дело('речь', 'коммент' + (п.commented ? ' горит' : ''),
                п.comment_count || 0)
    +     дело('сердце', 'сердце' + (п.liked ? ' горит' : ''), п.likes || 0)
    +     дело('поделиться', 'поделиться', '')
    +   '</div>'
    + '</div>';

  /* кружок лица собирает общий дом: картинка встаёт только загруженной,
     эмодзи остаётся эмодзи, и битых картинок в ленте не бывает */
  к.querySelector('.место-лица').appendChild(кружокАвтора(п));
  /* Имя автора — через склад: он помнит имена и правит их сам, когда
     человек переименовался. */
  if (CW.лица) CW.лица.подписать(к.querySelector('.имя'), п.user_id, имяАвтора(п));

  /* ── ЛИЦО ВЕДЁТ К ЧЕЛОВЕКУ ──
     Нажатие именно на кружок открывает окно «Портфолио» — то самое,
     что показывает профиль, только для этого человека (?кто=). Раньше
     лицо было просто картинкой: жали — не происходило ничего.
     Нажатие гасим, чтобы оно не досталось «.про» (та разворачивает
     описание) и ролику (тот встаёт на паузу): человек метил в лицо, а
     получил бы остановленное видео с раскрытым текстом. */
  к.querySelector('.место-лица').onclick = function (е) {
    е.stopPropagation();
    if (!п.user_id) return;
    CW.вПортфолио(п.user_id);
  };

  к.querySelector('.про').onclick = function (е) {
    е.stopPropagation();
    this.classList.toggle('раскрыт');
  };
  /* Комментарии выезжают снизу ВНУТРИ кадра, а не посреди экрана: так
     в боевой и так понятнее — видно, к какой записи они. */
  к.querySelector('.дело.коммент').onclick = function (е) {
    е.stopPropagation();
    /* Окно комментариев само говорит, сколько их стало и есть ли среди
       них моё: прибавлять единицу на каждое событие неверно — удаление
       тоже событие, а счёт от него уменьшается. */
    CW.открыть('comments', { пост: п.id, вКадре: к, потом: function (о) {
      if (!о) return;
      п.comment_count = о.всего;
      п.commented = !!о.моё;
      обновитьСчётКомментов(п);
    } });
  };
  к.querySelector('.дело.сердце').onclick = function (е) {
    е.stopPropagation(); лайк(п, к);
  };
  /* Синяя стрелка открывает «Действия» — тот самый лист, что был под
     «гамбургером». Само «Поделиться» стоит в нём первой строкой, так
     что прежнее действие стрелки никуда не делось, просто к нему
     добавились соседи. */
  к.querySelector('.дело.поделиться').onclick = function (е) {
    е.stopPropagation(); менюЗаписи(п, к);
  };

  var ролик = к.querySelector('video');
  if (ролик) {
    ролик.onclick = function () { нажали(к, ролик); };
    ролик.ontimeupdate = function () {
      var ж = к.querySelector('.жила i');
      if (ж && ролик.duration) {
        ж.style.width = (ролик.currentTime / ролик.duration * 100) + '%';
      }
    };
    /* Ссылка на ролик может быть мёртвой — такого добра в ленте хватает.
       Молча показывать чёрный квадрат нельзя: человек решит, что сломана
       программа, и будет ждать. Говорим прямо. */
    ролик.onerror = function () { роликНеОткрылся(к); };
  }
  return к;
}

function роликНеОткрылся(кадр) {
  var где = кадр.querySelector('video');
  if (!где) return;
  var у = сделать('div', 'файл-кадр сбой');
  у.innerHTML = '<div class="знак">' + CW.значок('внимание') + '</div>'
              + '<div class="что">Ролик не открылся</div>';
  где.parentNode.replaceChild(у, где);
  var ж = кадр.querySelector('.жила');
  if (ж && ж.parentNode) ж.parentNode.removeChild(ж);
}

/* ── подготовка кадра: адреса встают на место ────────────────────── */
function готовить(кадр) {
  if (кадр._готов) return;
  кадр._готов = true;

  var ю = кадр.querySelector('[data-ютуб]');
  if (ю) {
    var рамка = document.createElement('iframe');
    рамка.style.cssText = 'width:100%;height:100%;border:none';
    рамка.setAttribute('allow', 'autoplay;encrypted-media;picture-in-picture');
    рамка.setAttribute('allowfullscreen', '');
    рамка.src = 'https://www.youtube.com/embed/' + ю.dataset.ютуб
              + '?mute=1&controls=1&modestbranding=1&rel=0&playsinline=1';
    ю.parentNode.replaceChild(рамка, ю);
  }

  var фон = кадр.querySelector('[data-фон]');
  if (фон) фон.style.backgroundImage = 'url("' + CW.файл(фон.dataset.фон) + '")';

  var снимок = кадр.querySelector('img[data-ссылка]');
  if (снимок) снимок.src = CW.файл(снимок.dataset.ссылка);

  var ролик = кадр.querySelector('video');
  if (ролик) {
    if (ролик.dataset.заставка) ролик.poster = CW.файл(ролик.dataset.заставка);
    if (ролик.dataset.ссылка) ролик.src = CW.файл(ролик.dataset.ссылка) + '#t=0.001';
    ролик.preload = 'metadata';
  }
}

function дело(знак, класс, счёт) {
  return '<button class="дело ' + класс + '">'
       + '<span class="зн">' + CW.значок(знак) + '</span>'
       + '<span class="счёт">' + (счёт === '' ? '' : CW.безопасно(кругло(счёт))) + '</span>'
       + '</button>';
}

function теги(п) {
  var т = CW.теги(п.tags);
  if (!т.length) return '';
  return '<div class="теги">' + т.map(function (с) {
    return '<span class="тег">' + CW.безопасно(с) + '</span>';
  }).join('') + '</div>';
}

/* Как звать человека — одно правило на всю программу, оно в
   shared/api.js. Своего здесь больше нет: в ленте человек звался
   «Участник #16», а в чатах тот же человек «#16». */
function имяАвтора(п) {
  return CW.имяЧеловека(п) || ('Участник #' + (п.user_id || '?'));
}

function кружокАвтора(п, размер) {
  /* Своего разбора адресов здесь больше нет: куда смотреть за лицом,
     решает склад лиц (shared/лица.js).

     Своей заглушки здесь тоже больше нет. Стояла первая буква имени на
     светлом кружке - и лента была единственным местом в программе, где
     человек без фотографии выглядел буквой, а не значком; у кого имени
     нет, тому доставался ноль из номера. В комментариях под этой же
     записью тот же человек выходил значком на тёмном кружке. Теперь
     заглушка одна на всю программу и живёт в CW.кружок. */
  return CW.кружок({ размер: размер || 36, кто: п.user_id,
                     снимок: п.avatar_url, версия: п.avatar_ver });
}

/* «Есть ролик» в разметке значит не «это шортс», а «кадром управляем
   мы сами»: полоска проигрывания, звук и остановка по касанию есть
   только у нашего <video>. Внутрь ютубовской рамки мы не лезем. */
function естьРолик(п) {
  if (родЗаписи(п) !== 'short') return false;
  return !!(п.hls_url || (п.video_url && !/youtu/i.test(п.video_url)));
}

/* Ни одна картинка и ни один ролик в разметке не получает адрес сразу.
   Адрес лежит рядом, в data-, а в дело идёт, когда кадр подъезжает к
   экрану. Иначе вкладка «Топ» со ста записями заставляла браузер разом
   пойти за сотней роликов и сотней обложек — ровно та беда, что была со
   списком групп, только дороже: там были картинки, тут видео. */
function медиа(п) {
  if (постЛи(п)) return постМедиа(п);

  var плейлист = п.hls_url || '';
  var ссылка = п.video_url || '';
  var заставка = п.poster_url || п.image_url || '';
  /* Проверки «а есть ли вообще видео» тут больше нет: сюда попадают
     только записи, у которых оно есть, — это решает родЗаписи выше. */

  if (/youtu/i.test(ссылка)) {
    var н = ссылка.match(/(?:v=|embed\/|youtu\.be\/)([A-Za-z0-9_-]{11})/);
    if (н) return '<div class="ютуб" data-ютуб="' + н[1] + '"></div>';
  }

  return '<video playsinline webkit-playsinline loop preload="none"'
       + (плейлист ? ' data-плейлист="' + CW.безопасно(плейлист) + '"'
                   : ' data-ссылка="' + CW.безопасно(ссылка) + '"')
       + (заставка ? ' data-заставка="' + CW.безопасно(заставка) + '"' : '')
       + '></video>';
}

function постМедиа(п) {
  var файл = п.image_url || п.file_url || '';
  if (файл && /\.(jpe?g|png|gif|webp|avif|bmp|svg)(\?|$)/i.test(файл)) {
    return '<div class="снимок-фон" data-фон="' + CW.безопасно(файл) + '"></div>'
         + '<img class="снимок" alt="" loading="lazy" data-ссылка="'
         + CW.безопасно(файл) + '">';
  }
  if (файл) {
    var имя = файл.split('/').pop().split('?')[0];
    var расш = (имя.split('.').pop() || 'файл').toUpperCase();
    return '<div class="файл-кадр">'
         + '<div class="знак">' + CW.значок('лист') + '</div>'
         + '<div class="вид">' + CW.безопасно(расш) + '</div>'
         + '<a href="' + CW.безопасно(файл) + '" target="_blank" rel="noopener">'
         + CW.безопасно(имя) + '</a>'
         + '<div class="что">' + CW.безопасно(п.description || '') + '</div></div>';
  }
  return текстКадр(п);
}

function текстКадр(п) {
  return '<div class="текст-кадр">'
       + (п.title ? '<div class="имя">' + CW.безопасно(п.title) + '</div>' : '')
       + '<div class="что">' + CW.безопасно(п.description || '') + '</div></div>';
}

function кругло(ч) {
  ч = Number(ч) || 0;
  if (ч >= 1000000) return (ч / 1000000).toFixed(1).replace('.0', '') + 'M';
  if (ч >= 1000) return (ч / 1000).toFixed(1).replace('.0', '') + 'K';
  return String(ч);
}

/* ═══════════════════════════════════════════════════════════════════════
   ВОСПРОИЗВЕДЕНИЕ.

   Играет ровно один ролик — тот, что сейчас перед глазами. Это не
   красота: три играющих ролика — это три потока видео и севшая батарея.
   ═══════════════════════════════════════════════════════════════════════ */
var СМОТРЯЩИЙ = null, ГОТОВЩИК = null;

function смотрящий() {
  if (СМОТРЯЩИЙ) return СМОТРЯЩИЙ;
  СМОТРЯЩИЙ = new IntersectionObserver(function (кадры) {
    кадры.forEach(function (к) {
      if (к.isIntersecting) встал(к.target);
      else ушёл(к.target);
    });
  }, { root: полоса, threshold: 0.65 });
  return СМОТРЯЩИЙ;
}

/* ── КОММЕНТАРИИ К ЭТОЙ ЗАПИСИ СПРАШИВАЕМ ЗАРАНЕЕ ──
   Нажатие на речь открывает полку мгновенно, а список в ней ехал уже
   после нажатия: полсекунды «Смотрю…» на каждое открытие. Между тем
   какая запись под носом, лента знает заранее - вот и спрашиваем, пока
   человек смотрит ролик.

   Сам файл полки тоже подтягиваем заранее, один раз за страницу: он
   приезжает отдельным файлом, и в первый раз это был ещё один круг до
   сервера поверх ожидания списка.

   Всё тихо и не к спеху: не приехало - полка спросит сама, как
   спрашивала. */
var ПОЛКАЕДЕТ = false;

function погретьРазговор(номер) {
  if (!номер) return;
  if (!ПОЛКАЕДЕТ) {
    ПОЛКАЕДЕТ = true;
    CW.нужен('modals/comments.js').catch(function () { ПОЛКАЕДЕТ = false; });
  }
  /* Греем не сразу: первые мгновения кадра заняты роликом и обложкой,
     и лишний запрос там только мешает. */
  setTimeout(function () {
    if (String(С.текущий) !== String(номер)) return;   /* уже пролистали */
    if (CW.комментарии && CW.комментарии.погреть) {
      CW.комментарии.погреть('/feed/' + номер + '/comments');
    }
  }, 700);
}

/* Второй наблюдатель — на один экран вперёд и назад. Он не включает
   воспроизведение, он только проставляет адреса: к тому мгновению, когда
   кадр станет виден, обложка уже на месте, а ролик знает, откуда брать
   первый кусок. */
function готовщик() {
  if (ГОТОВЩИК) return ГОТОВЩИК;
  ГОТОВЩИК = new IntersectionObserver(function (кадры) {
    кадры.forEach(function (к) {
      if (!к.isIntersecting) return;
      готовить(к.target);
      ГОТОВЩИК.unobserve(к.target);
    });
  }, { root: полоса, rootMargin: '110% 0px' });
  return ГОТОВЩИК;
}

/* ── ЛЕНТА ДЕРЖИТ НОМЕР ЗАПИСИ В СВОЁМ АДРЕСЕ ───────────────────────
   Анна: «Если я в ленте и нажал на иконку, мне открылась страница
   портфолио второго юзера, я полистал её, может даже открыл чат,
   написал сообщение, закрыл сообщение, потом закрылось портфолио - и
   меня возвращает обратно в ленту на тот же пост, это правило».

   Портфолио - отдельная страница, и возврат из него идёт по адресу,
   который запомнил CW.запомнитьГде: путь и вопрос, то есть
   «/feed.html?id=6». Записи в этом адресе не было, и лента
   открывалась с начала - человек заново искал, где он стоял.

   Чинить это памятью «последний кадр» было бы неверно: лента тогда
   прыгала бы на старую запись и при обычном заходе, спустя час. Номер
   записи живёт в самом адресе ленты, рядом с номером куба, и меняется
   по ходу листания. Возврат - хоть из портфолио, хоть из чата, хоть
   стрелкой «назад», хоть обновлением страницы - приводит на ту же
   запись, потому что её номер приехал вместе с адресом. Разбирает его
   кусок «пришли по ссылке на запись» внизу этого файла, тот же, что
   открывает ленту по ссылке «поделиться».

   replaceState, а не pushState: лишних шагов в истории браузера от
   листания ленты быть не должно, иначе «назад» двадцать раз
   возвращало бы по одному кадру.

   Реже трёх раз в секунду адрес не переписываем: Сафари считает
   обращения к истории и при быстром листании молча перестаёт их
   принимать. */
var адресЧасы = 0, адресЖдёт = null;
function номерВАдрес(номер) {
  if (!окноИстории()) return;
  var теперь = Date.now();
  clearTimeout(адресЖдёт);
  if (теперь - адресЧасы < 350) {
    адресЖдёт = setTimeout(function () { номерВАдрес(номер); }, 350);
    return;
  }
  адресЧасы = теперь;
  try {
    var вопрос = new URLSearchParams(location.search);
    if (вопрос.get('пост') === String(номер)) return;
    вопрос.set('пост', String(номер));
    history.replaceState(history.state, '',
      location.pathname + '?' + вопрос.toString());
  } catch (е) {}
}
function окноИстории() {
  return !!(window.history && history.replaceState && window.URLSearchParams);
}

function встал(кадр) {
  var номер = кадр.dataset.номер;
  С.текущий = номер;
  номерВАдрес(номер);

  готовить(кадр);
  погретьРазговор(номер);
  var ролик = кадр.querySelector('video');
  if (ролик) {
    ролик.muted = С.тихо;
    кадр.querySelector('.пауза').classList.remove('видно');
    приложитьПлейлист(ролик).then(function () {
      ролик.play().catch(function () {
        /* браузер не дал играть со звуком — включаем без звука и играем */
        ролик.muted = true;
        нарисоватьЗвук();
        ролик.play().catch(function () {});
      });
    });
    /* следующий ролик заранее: тогда листание кажется мгновенным */
    var дальше = кадр.nextElementSibling;
    if (дальше && дальше.classList && дальше.classList.contains('кадр')) {
      готовить(дальше);
      var сл = дальше.querySelector('video');
      if (сл && сл.preload !== 'auto') сл.preload = 'auto';
    }
  }

  /* просмотр — через три секунды и один раз */
  if (!С.видели[номер]) {
    С.часы[номер] = setTimeout(function () {
      С.видели[номер] = 1;
      CW.спросить('/feed/' + номер + '/view', { способ: 'POST', тихо: true });
    }, 3000);
  }

  /* дочитываем ленту, когда до конца осталось меньше трёх кадров */
  var все = [].slice.call(полоса.querySelectorAll('.кадр:not(.спрятан)'));
  if (все.indexOf(кадр) >= все.length - 3) подгрузить(false);
}

function ушёл(кадр) {
  var ролик = кадр.querySelector('video');
  if (ролик) { ролик.pause(); ролик.currentTime = 0; }
  var ж = кадр.querySelector('.жила i');
  if (ж) ж.style.width = '0';
  var н = кадр.dataset.номер;
  if (С.часы[н]) { clearTimeout(С.часы[н]); delete С.часы[н]; }
}

function щёлкнуть(кадр, ролик) {
  var значок = кадр.querySelector('.пауза');
  if (ролик.paused) { ролик.play().catch(function () {}); значок.classList.remove('видно'); }
  else { ролик.pause(); значок.classList.add('видно'); }
}

/* ── ОДНО НАЖАТИЕ — ПУСК, ДВА — ЗВУК ──
   Кнопки звука на кадре больше нет, и оба дела делает сам кадр.

   Пуск срабатывает СРАЗУ, не дожидаясь второго нажатия: ждать треть
   секунды на самом частом действии нельзя, это читается как
   задержка. Если второе нажатие всё-таки пришло, первое отменяется
   тем же щёлкнуть() - оно симметрично, и ролик возвращается в то
   состояние, в котором был, - а звук переключается.

   Триста миллисекунд - обычная мера двойного нажатия: быстрее
   человек не успевает, дольше - это уже два отдельных нажатия. */
var ЖДЁМ_ВТОРОГО = null;

function нажали(кадр, ролик) {
  if (ЖДЁМ_ВТОРОГО) {
    clearTimeout(ЖДЁМ_ВТОРОГО.часы);
    var было = ЖДЁМ_ВТОРОГО;
    ЖДЁМ_ВТОРОГО = null;
    if (было.кадр === кадр) {
      щёлкнуть(кадр, ролик);          /* отменяем пуск-паузу первого */
      переключитьЗвук();
      мигнутьЗвуком(кадр);
      return;
    }
  }
  щёлкнуть(кадр, ролик);
  ЖДЁМ_ВТОРОГО = { кадр: кадр, часы: setTimeout(function () {
    ЖДЁМ_ВТОРОГО = null;
  }, 300) };
}

/* Знак звука на полсекунды посреди кадра - тот же способ, которым
   показывается пауза. Человек должен видеть, что именно он сделал:
   без знака двойное нажатие выглядит как «ничего не произошло». */
function мигнутьЗвуком(кадр) {
  var з = кадр.querySelector('.звуком');
  if (!з) return;
  з.querySelector('i').innerHTML = CW.значок(С.тихо ? 'тихо' : 'звук', 28);
  з.classList.add('видно');
  clearTimeout(з._часы);
  з._часы = setTimeout(function () { з.classList.remove('видно'); }, 700);
}

/* ── плейлист HLS ─────────────────────────────────────────────────────
   Сафари и айфоны открывают плейлист сами. Остальным нужен hls.js —
   берём его один раз и только если он правда понадобился. */
var ГОТОВ_HLS = null;

function взятьHls() {
  if (ГОТОВ_HLS) return ГОТОВ_HLS;
  ГОТОВ_HLS = new Promise(function (готово) {
    if (window.Hls) { готово(true); return; }
    var с = document.createElement('script');
    с.src = 'https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js';
    с.onload = function () { готово(!!window.Hls); };
    с.onerror = function () { готово(false); };
    document.head.appendChild(с);
  });
  return ГОТОВ_HLS;
}

function приложитьПлейлист(ролик) {
  if (ролик._готов) return Promise.resolve(true);
  var плейлист = ролик.getAttribute('data-плейлист');
  if (!плейлист) { ролик._готов = true; return Promise.resolve(true); }

  if (ролик.canPlayType('application/vnd.apple.mpegurl')) {
    ролик.src = CW.файл(плейлист); ролик._готов = true;
    return Promise.resolve(true);
  }
  return взятьHls().then(function (есть) {
    ролик._готов = true;
    if (!есть || !window.Hls || !window.Hls.isSupported()) {
      CW.сказать('Этот браузер не открыл видео');
      return false;
    }
    try {
      var х = new window.Hls({ maxBufferLength: 20, startLevel: -1 });
      х.loadSource(плейлист);
      х.attachMedia(ролик);
      ролик._hls = х;
      return true;
    } catch (е) { return false; }
  });
}

/* ── звук ───────────────────────────────────────────────────────────── */
function взятьТихо() {
  try { return localStorage.getItem('cw_feed_звук') !== 'да'; }
  catch (е) { return true; }
}

function переключитьЗвук() {
  С.тихо = !С.тихо;
  try { localStorage.setItem('cw_feed_звук', С.тихо ? 'нет' : 'да'); } catch (е) {}
  нарисоватьЗвук();
  var кадр = полоса.querySelector('.кадр[data-номер="' + С.текущий + '"]');
  var ролик = кадр && кадр.querySelector('video');
  if (ролик) {
    ролик.muted = С.тихо;
    /* Играет - пусть играет дальше, уже со звуком. Стоит на паузе -
       звук его не запускает: человек нажал про звук, а не про пуск.
       Прежде здесь стоял безусловный play(), и двойное нажатие по
       остановленному ролику снимало его с паузы заодно со звуком. */
    if (!ролик.paused) ролик.play().catch(function () {});
  }
}

/* Подсказка на самом ролике: нажатие одно и нажатие двойное. Кнопки
   нет, и сказать об этом больше негде - на мониторе это видно при
   наведении, на телефоне остаётся знак после двойного нажатия. */
function нарисоватьЗвук() {
  [].slice.call(полоса.querySelectorAll('.кадр video')).forEach(function (в) {
    в.title = (С.тихо ? 'Два нажатия — включить звук'
                      : 'Два нажатия — выключить звук') + ' · одно — пауза';
  });
}

/* ═══════════════════════════════════════════════════════════════════════
   ЛАЙК, КОММЕНТАРИИ, ССЫЛКА
   ═══════════════════════════════════════════════════════════════════════ */
function лайк(п, кадр) {
  var кн = кадр.querySelector('.дело.сердце');
  var счёт = кн.querySelector('.счёт');

  /* Показываем сразу, но считает сервер: с его ответом и поправим. */
  var былоГорит = кн.classList.contains('горит');
  кн.classList.toggle('горит', !былоГорит);
  счёт.textContent = кругло(Math.max(0, (Number(п.likes) || 0) + (былоГорит ? -1 : 1)));

  CW.спросить('/feed/' + п.id + '/like', { способ: 'POST' })
    .then(function (о) {
      п.likes = о.likes; п.liked = !!о.liked;
      кн.classList.toggle('горит', п.liked);
      счёт.textContent = кругло(п.likes);
    })
    .catch(function (е) {
      кн.classList.toggle('горит', былоГорит);
      счёт.textContent = кругло(п.likes || 0);
      CW.сказать(е.сеть ? 'Нет связи с сервером' : (е.message || 'Лайк не прошёл'));
    });
}

function обновитьСчётКомментов(п) {
  var кадр = полоса.querySelector('.кадр[data-номер="' + п.id + '"]');
  if (!кадр) return;
  кадр.querySelector('.дело.коммент .счёт').textContent = кругло(п.comment_count);
  /* Написал — значок загорается сразу, не дожидаясь перезагрузки
     ленты: сервер об этом узнает, но спрашивать его ради своей же
     только что написанной строки незачем. */
  кадр.querySelector('.дело.коммент').classList.toggle('горит', !!п.commented);
}

/* ── меню записи ──────────────────────────────────────────────────
   Пожаловаться, удалить своё, открыть автора. Всё это окна из modals/:
   жалоба нужна и в комментариях, удаление — везде, где что-то удаляют.
   Своё и чужое — разные списки: предлагать удалить чужую запись
   бессмысленно, а жаловаться на свою — тем более. */
/* ═══════════════════════════════════════════════════════════════════════
   ДЕЙСТВИЯ НАД ЗАПИСЬЮ

   Лист выезжает снизу внутри кадра — из-под синей стрелки. Состав
   взят из боевой: поделиться, репост, сохранить, скачать, чаевые,
   править, удалить. Чужое править и удалять нельзя, себе чаевых не
   пошлёшь — поэтому список у своей записи и у чужой разный, и лишних
   строк, которые всё равно откажут, тут нет.
   ═══════════════════════════════════════════════════════════════════════ */
function менюЗаписи(п, кадр) {
  var я = (CW.ясныйЯ() || {}).id;
  var моя = Number(п.user_id) === Number(я);
  var файл = п.hls_url || п.video_url || п.image_url || п.file_url || '';

  var пункты = [];

  пункты.push({ зн: CW.значок('поделиться', 16), подпись: 'Поделиться',
    делать: function () {
      CW.открыть('share', { что: 'пост', ид: п.id, имя: п.description || '' });
    } });

  пункты.push({ зн: CW.значок('повтор', 16), подпись: 'Репост', делать: function () {
    CW.спросить('/feed/' + п.id + '/repost', { способ: 'POST' })
      .then(function () { CW.сказать('Запись у тебя в ленте'); взятьПервое(); })
      .catch(function (е) { CW.сказать((е && е.message) || 'Репост не прошёл'); });
  } });

  /* Сервер сам переключает: было сохранено — снимет, не было —
     сохранит. Поэтому и спрашивать ничего не надо.

     Уже сохранённая запись говорит об этом прямо в меню: строка горит
     тем же синим, что стрелка и загоревшийся лайк. Это один язык на
     всю ленту — синий значит «это уже твоё». Без него человек открывал
     меню и не знал, сохранял он эту запись или нет. */
  пункты.push({ зн: CW.значок('звезда', 16),
    подпись: п.saved ? 'Сохранено' : 'Сохранить',
    выбран: !!п.saved,
    делать: function () {
      CW.спросить('/feed/' + п.id + '/save', { способ: 'POST' })
        .then(function (о) {
          п.saved = !(о && о.saved === false);
          CW.сказать(п.saved ? 'Сохранено' : 'Убрано из сохранённых');
        })
        .catch(function (е) { CW.сказать((е && е.message) || 'Не вышло сохранить'); });
    } });

  /* Скачивать нечего, если записи нечего отдать: у текстового поста
     файла нет вовсе. Показываем строку только когда есть что качать —
     мёртвая строка хуже отсутствующей. */
  if (файл) {
    пункты.push({ зн: CW.значок('скачать', 16), подпись: 'Скачать', делать: function () {
      CW.скачать(CW.файл(файл));
    } });
  }

  /* Чаевые — перевод CUBE автору. Окно перевода уже умеет находить
     человека, показывать баланс и спрашивать подтверждение с суммой;
     второй такой же писать незачем. Себе чаевых не шлют. */
  if (!моя && п.user_id) {
    пункты.push({ зн: CW.значок('монета', 16), подпись: 'Чаевые автору',
      делать: function () { CW.открыть('transfer', { кому: п.user_id }); } });
  }

  if (моя) {
    пункты.push({ зн: CW.значок('карандаш', 16), подпись: 'Редактировать',
      делать: function () {
        CW.открыть('edit-post', { пост: п, потом: function (новое) {
          п.title = новое.title; п.description = новое.description;
          п.tags = новое.tags;
          /* Правим подписи прямо в кадре, а не перерисовываем ленту:
             отобрать() нарочно не трогает уже стоящие кадры, иначе
             ролик, который человек смотрит, начался бы с начала. */
          подписатьКадр(кадр, п);
        } });
      } });
    пункты.push('-');
    пункты.push({ зн: CW.значок('урна', 16), подпись: 'Удалить',
      опасная: true, делать: function () {
        CW.открыть('delete', {
          чего: 'запись',
          что: п.description ? String(п.description).slice(0, 60) : ('#' + п.id),
          ещё: 'Лайки и комментарии исчезнут вместе с ней.',
          делать: function () {
            return CW.спросить('/feed/' + п.id, { способ: 'DELETE' });
          },
          потом: function () { взятьПервое(); }
        });
      } });
  } else {
    пункты.push('-');
    пункты.push({ зн: CW.значок('внимание', 16), подпись: 'Пожаловаться',
      опасная: true, делать: function () { CW.открыть('report', { пост: п.id }); } });
  }

  CW.лист(пункты, кадр ? { вКадре: кадр } : null);
}

/* Новые подписи в уже стоящем кадре: заголовок, текст и теги. Кадр
   остаётся тем же узлом, поэтому ролик не перезапускается. */
function подписатьКадр(кадр, п) {
  if (!кадр) return;
  var про = кадр.querySelector('.про');
  if (!про) return;

  var заг = про.querySelector('.заглавие');
  if (п.title) {
    if (!заг) {
      заг = сделать('div', 'заглавие');
      про.insertBefore(заг, про.querySelector('.текст'));
    }
    заг.textContent = п.title;
  } else if (заг && заг.parentNode) {
    заг.parentNode.removeChild(заг);
  }

  var текст = про.querySelector('.текст');
  if (текст) текст.textContent = п.description || '';

  var старыеТеги = про.querySelector('.теги');
  if (старыеТеги && старыеТеги.parentNode) старыеТеги.parentNode.removeChild(старыеТеги);
  var свежие = теги(п);
  if (свежие) про.insertAdjacentHTML('beforeend', свежие);
}

/* «Поделиться» и комментарии переехали в modals/ — они нужны не
   только ленте: комментарии открывают из профиля и из уведомлений,
   ссылкой делятся из поиска и из карточки товара. */
/* ── пришли по ссылке на запись ─────────────────────────────────────── */
(function () {
  var номер = null;
  try { номер = new URLSearchParams(location.search).get('пост'); } catch (е) {}
  if (!номер) return;

  /* ── СНАЧАЛА СМОТРИМ, НЕ ПРИЕХАЛА ЛИ ОНА САМА ──
     Теперь номер записи стоит в адресе ленты почти всегда: его пишет
     туда само листание, чтобы возврат из портфолио приходил на тот же
     кадр. Значит и этот кусок стал срабатывать почти на каждом заходе
     в ленту - а он просил у сервера сотню записей. Лишний запрос на
     ровном месте, да ещё и самый тяжёлый.

     Поэтому ждём первую страницу, и если нужный кадр в ней уже есть -
     просто встаём на него. Сотню просим только тогда, когда записи в
     первой странице не нашлось: она и правда лежит глубже (ссылка
     «поделиться» на запись недельной давности). */
  ждатьКадр(14);

  function ждатьКадр(попыток) {
    var к = полоса.querySelector('.кадр[data-номер="' + номер + '"]');
    if (к) { полоса.scrollTop = к.offsetTop; С.текущий = номер; return; }
    if (попыток > 0) {
      setTimeout(function () { ждатьКадр(попыток - 1); }, 150);
      return;
    }
    искатьГлубже();
  }

  function искатьГлубже() {
  /* Запись может лежать глубже первой страницы — просим сразу сотню. */
  CW.спросить('/feed?limit=100&offset=0', { тихо: true }).then(function (д) {
    if (!Array.isArray(д)) return;
    var было = {};
    С.всё.forEach(function (п) { было[п.id] = 1; });
    д.forEach(function (п) { if (!было[п.id]) С.всё.push(п); });
    С.сдвиг = Math.max(С.сдвиг, д.length);

    /* ── ВКЛАДКУ ВЫБИРАЕМ ПО САМОЙ ЗАПИСИ ──
       Сюда приходят двумя путями: по ссылке «поделиться» и сразу после
       публикации. В оба раза человек ждёт увидеть именно эту запись. А
       стоять он может на любой вкладке — и если вкладка не того рода,
       отбор запись выбросит, и мы честно, но обидно скажем «её уже
       нет». Поэтому сперва встаём на ту вкладку, где запись живёт:
       ролик — «Шортс», всё прочее — «Посты». Вкладки «Для тебя» и
       «Топ» показывают оба рода, так что с них никуда уходить не надо. */
    var она = С.всё.filter(function (п) { return String(п.id) === String(номер); })[0];
    if (она && С.вкладка !== 'rec' && С.вкладка !== 'top') {
      var надо = родЗаписи(она) === 'short' ? 'shorts' : 'post';
      if (надо !== С.вкладка) { сменитьВкладку(надо); }
    }

    отобрать();
    setTimeout(function () {
      var к = полоса.querySelector('.кадр[data-номер="' + номер + '"]');
      if (к) { полоса.scrollTop = к.offsetTop; С.текущий = номер; }
      else CW.сказать('Этой публикации в ленте уже нет');
    }, 120);
  });
  }
})();

/* ── мелочь ─────────────────────────────────────────────────────────── */
function сделать(тег, класс) {
  var у = document.createElement(тег);
  if (класс) у.className = класс;
  return у;
}

});
</script>
</body>
