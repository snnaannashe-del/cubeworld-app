<!--
  КОШЕЛЁК.

  Всё на экране — из базы, ни одного вписанного числа:
    /cube/balance       баланс, уровень, XP, дневной предел переводов
    /cube/history       кривая баланса по дням (настоящая, а не «+72%»)
    /cube/transactions  движения по счёту
    /wallet/my          привязанные адреса
    /cube/find          кому переводим: поиск по имени, @нику, #номеру
    /cube/transfer      сам перевод

  Про перевод. Это единственное место в программе, которое двигает
  деньги, поэтому оно устроено нарочно медленно: сперва надо выбрать
  получателя из найденных (просто набрать имя мало), потом подтвердить
  сумму и получателя в отдельном окне. Случайно отправить нельзя.

  Про кошельки. Привязка адреса — это подпись в самом кошельке, деньги
  она не трогает: выплата уходит на адрес из заявки, а не на этот.
  Без подписи адрес сохраняется как «непроверен» — так его и показываем,
  а не выдаём за проверенный.
-->
<style>
.уровень{ margin-bottom:16px; }
.кошельки-кусок{ margin-bottom:14px; }

/* ── баланс ──────────────────────────────────────────────────────── */
/* Мерки те же, что в боевой: поле 22/20, число 42, метка 10, строка
   под ним 12. Было крупнее почти вдвое, и карточка занимала пол-экрана. */
.баланс{
  background:linear-gradient(135deg,rgba(251,191,36,.14),rgba(0,149,246,.08));
  border:1px solid rgba(251,191,36,.28);
  border-radius:18px; padding:22px 20px; margin-bottom:16px;
}
.баланс .над{
  font-size:10px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--текст2); margin-bottom:6px;
}
.баланс .сумма{
  font-size:42px; font-weight:900; letter-spacing:-.02em;
  line-height:1; margin-bottom:4px; color:var(--жёлтый);
  font-variant-numeric:tabular-nums;
}
.баланс .под{ margin-top:0; font-size:12px; color:var(--текст2); }





/* ── график ──────────────────────────────────────────────────────
   Мерки боевой до точки: поле 12/14, радиус 12, подпись отбита на 8,
   полотно 56 точек, края 10. Было 14/16 и полотно 64 с отбивками
   сверху и снизу — блок выходил в полтора раза выше боевого. */
.график{
  background:var(--окно); border:1px solid var(--край);
  border-radius:12px; padding:12px 14px; margin-bottom:14px;
  overflow:hidden;
}
.график .раздел{ margin:0 0 8px; }
/* Значок графика зелёный: он про деньги на счету, и зелёный тут
   значит то же, что зелёные суммы в истории — приход. */
.график .раздел .знак{ color:var(--зелёный); }
.график .полотно{ width:100%; height:56px; display:block; margin:0; }
.график .края{ display:flex; justify-content:space-between;
  margin-top:5px;
  font-size:10px; color:var(--текст3); font-family:ui-monospace,Menlo,monospace; }
.график .края b{ color:var(--бирюза,#22d3ee); font-weight:600; }

/* ── перевод ─────────────────────────────────────────────────────── */
.перевод{
  background:var(--окно); border:1px solid var(--край);
  border-radius:12px; padding:14px 16px; margin-bottom:14px;
}
.перевод .раздел{ margin:0 0 10px; }
/* Строка перевода в одну линию, как в боевой: кому, сколько и кнопка.
   Переносится только на узком экране. */
.перевод .поля{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.перевод input{
  padding:7px 10px; font-size:12px; background:var(--фон);
  border:1px solid var(--край); color:var(--текст);
  border-radius:8px; outline:none;
}
.перевод input:focus{ border-color:var(--синий); }
.перевод input::placeholder{ color:var(--текст3); }
.перевод .кому{ flex:1; min-width:180px;
  font-family:ui-monospace,Menlo,monospace; }
.перевод .сколько{ width:74px; text-align:center;
  color:var(--жёлтый); font-family:ui-monospace,Menlo,monospace; }
.перевод .кнопка{
  padding:7px 14px; font-size:12px; font-weight:700;
  border-radius:8px; white-space:nowrap;
}
/* Выбранный человек виден по самому полю: рамка загорается цветом
   оформления. Отдельной плашки «выбран такой-то» не рисуем — в поле
   уже стоит его имя. */
.перевод .кому.нашли{ border-color:rgba(var(--синий-ргб),.7); }

/* ── кого нашли ──
   Список выпадает под строкой и живёт только пока в нём есть кто-то. */
.перевод .найдены{
  margin-top:8px; border:1px solid var(--край); border-radius:10px;
  overflow:hidden; display:none; background:var(--фон);
}
.перевод .найдены.видно{ display:block; }
.перевод .найден{
  display:flex; align-items:center; gap:10px; width:100%;
  padding:8px 10px; background:none; border:none;
  border-bottom:1px solid var(--край);
  color:var(--текст); font:inherit; font-size:12px;
  cursor:pointer; text-align:left;
}
.перевод .найден:last-child{ border-bottom:none; }
.перевод .найден:hover{ background:var(--поле); }
.перевод .найден b{ display:block; font-weight:600; }
.перевод .найден .мелко{
  display:block; font-size:10px; color:var(--текст3);
  font-family:ui-monospace,Menlo,monospace;
}

/* ── история ─────────────────────────────────────────────────────── */
.история{ border:1px solid var(--край); border-radius:12px;
  overflow:hidden; background:var(--окно); }
.движение{
  display:flex; align-items:center; gap:11px;
  padding:10px 14px; border-bottom:1px solid var(--край);
}
.движение:last-child{ border-bottom:none; }
.движение .стрелка{
  width:30px; height:30px; flex:0 0 30px; border-radius:9px;
  display:flex; align-items:center; justify-content:center;
}
.движение.in  .стрелка{ background:rgba(52,211,153,.12); color:var(--зелёный); }
.движение.out .стрелка{ background:rgba(248,113,113,.12); color:var(--красный); }
.движение .стрелка svg{ width:17px; height:17px; }
.движение .что{ font-size:0.9333rem; }
.движение .когда{ font-size:0.8rem; color:var(--текст3); margin-top:2px; }
.движение .сколько{
  margin-left:auto; font-weight:700; font-size:1rem;
  font-variant-numeric:tabular-nums; white-space:nowrap;
}
.движение.in  .сколько{ color:var(--зелёный); }
.движение.out .сколько{ color:var(--красный); }

</style>
</head>

<script src="shared/wallets.js?v=20261123-396"></script>
<script>
'use strict';

CW.оболочка('wallet').then(function (место) {

CW.заглавие(место, { имя: 'Кошелёк' });

var тело = document.createElement('div');
место.appendChild(тело);
CW.ждём(тело);

/* ═══════════════════════════════════════════════════════════════════════
   СОСТОЯНИЕ
   ═══════════════════════════════════════════════════════════════════════ */
var С = { счёт: null, кривая: null, движения: [] };

Promise.all([
  CW.спросить('/cube/balance',           { сроком: 20000 }),
  CW.спросить('/cube/history?days=30',   { тихо: true }),
  CW.спросить('/cube/transactions?limit=40', { тихо: true }),
]).then(function (о) {
  С.счёт = о[0] || {};
  С.кривая = о[1] || null;
  С.движения = (о[2] && о[2].transactions) || [];
  показать();
}).catch(function (е) {
  тело.innerHTML = '';
  var б = document.createElement('div');
  б.className = 'беда';
  б.textContent = е.сеть ? 'Нет связи с сервером' : (е.message || 'Не вышло открыть кошелёк');
  тело.appendChild(б);
});

/* ═══════════════════════════════════════════════════════════════════════
   ОТРИСОВКА. Одно место, которое строит экран.
   ═══════════════════════════════════════════════════════════════════════ */
function показать() {
  var с = С.счёт || {};
  тело.innerHTML = '';

  тело.appendChild(кускомБаланс(с));
  тело.appendChild(CW.кусокСвайпа());
  тело.appendChild(кускомУровень(с));
  тело.appendChild(CW.кусокКошельков());
  тело.appendChild(кускомГрафик());
  тело.appendChild(кускомПеревод());
  тело.appendChild(кускомИстория());
}

/* Блока «Ещё про деньги» (вывести / ключи / премиум / рефералы) тут
   больше нет: в боевой его и не было, после строки перевода сразу идёт
   история. Окна никуда не делись — «Ключи» открывает Key 2 в шапке,
   «Рефералы» стоят в левом меню, «Премиум» живёт в «Заработать», а
   «Вывести» пока остаётся только голосовой командой. */

function кусок(класс, внутри) { return CW.кусок(класс, внутри); }

function деньги(ч) {
  var з = Number(ч || 0);
  return Number.isInteger(з) ? з.toLocaleString('ru') : з.toFixed(2);
}

/* ── баланс ── */
function кускомБаланс(с) {
  return кусок('баланс',
      '<div class="над">Баланс кошелька</div>'
    + '<div class="сумма">' + деньги(с.balance) + '</div>'
    + '<div class="под">CUBE Token · Уровень ' + (с.level || 1)
    + ' · ' + (с.xp || 0) + ' XP</div>');
}

/* ── уровень ── */
function кускомУровень(с) {
  var в = Math.max(0, Math.min(100, Number(с.level_pct || 0)));
  var у = кусок('уровень',
      '<div class="ряд">'
    +   '<span class="знак">' + CW.значок('кубок') + '</span>'
    +   '<span class="имя">Уровень ' + (с.level || 1) + '</span>'
    +   '<span class="xp">' + (с.xp_in_level || 0) + ' / '
    +     ((с.xp_next_level || 0) - (с.xp_level_start || 0)) + ' XP</span>'
    + '</div>'
    + '<div class="жёлоб"><i style="width:' + в + '%"></i></div>');
  return у;
}

/* ── график ── */
function кускомГрафик() {
  var точки = (С.кривая && С.кривая.points) || [];
  var было = точки.length ? точки[0] : null;
  var стало = точки.length ? точки[точки.length - 1] : null;

  var менялось = точки.some(function (т, и) {
    return и > 0 && Number(т.balance) !== Number(точки[и - 1].balance);
  });

  var у = кусок('график',
      '<div class="раздел">'
    /* Значок блока — столбики, а не стрелка роста. Стрелка стоит рядом
       у «Отправить CUBE» и означает там отправку; две одинаковые
       стрелки подряд с разным смыслом читались плохо. В боевой здесь
       тоже значок графика. */
    +   '<span class="знак">' + CW.значок('столбики') + '</span>'
    +   'Баланс · 30 дней'
    +   '<span class="тихо">' + (менялось ? '' : 'движений не было') + '</span>'
    + '</div>'
    + '<canvas class="полотно"></canvas>'
    + '<div class="края">'
    +   '<span>' + (было ? день(было.day) + ' · ' + деньги(было.balance) : '') + '</span>'
    +   '<span><b>сейчас ' + (стало ? деньги(стало.balance) : 0) + ' CUBE</b></span>'
    + '</div>');

  /* Рисуем после того, как блок встанет на страницу: до этого у полотна
     нет ширины, и кривая получилась бы в одну точку. */
  setTimeout(function () { нарисоватьКривую(у.querySelector('canvas'), точки); }, 0);
  return у;
}

function день(с) {
  var ч = String(с || '').split('-');
  return ч.length === 3 ? ч[2] + '.' + ч[1] : с;
}

function нарисоватьКривую(холст, точки) {
  if (!холст || !точки.length) return;
  var п = window.devicePixelRatio || 1;
  var ш = холст.clientWidth, в = холст.clientHeight;
  if (!ш || !в) return;
  холст.width = ш * п; холст.height = в * п;
  var к = холст.getContext('2d');
  к.setTransform(п, 0, 0, п, 0, 0);

  var значения = точки.map(function (т) { return Number(т.balance || 0); });
  var низ = Math.min.apply(null, значения);
  var верх = Math.max.apply(null, значения);

  /* Совсем ровная линия (движений не было) — ведём её по середине поля,
     как в боевой, а не прижимаем к низу: прижатая к низу читается как
     «баланс упал в ноль», и заливки под ней не видно вовсе. */
  var плоско = (верх - низ) < 1e-9;

  var поле = 5;
  function x(и) { return поле + (и / Math.max(1, точки.length - 1)) * (ш - поле * 2); }
  function y(з) {
    if (плоско) return в / 2;
    return в - поле - ((з - низ) / (верх - низ)) * (в - поле * 2);
  }

  /* заливка под кривой */
  var заливка = к.createLinearGradient(0, 0, 0, в);
  заливка.addColorStop(0, 'rgba(34,211,238,.28)');
  заливка.addColorStop(1, 'rgba(34,211,238,0)');
  к.beginPath();
  к.moveTo(x(0), в);
  значения.forEach(function (з, и) { к.lineTo(x(и), y(з)); });
  к.lineTo(x(значения.length - 1), в);
  к.closePath();
  к.fillStyle = заливка; к.fill();

  /* сама кривая */
  к.beginPath();
  значения.forEach(function (з, и) { и ? к.lineTo(x(и), y(з)) : к.moveTo(x(и), y(з)); });
  к.strokeStyle = '#22d3ee'; к.lineWidth = 2; к.lineJoin = 'round'; к.stroke();

  /* точка «сейчас» */
  к.beginPath();
  к.arc(x(значения.length - 1), y(значения[значения.length - 1]), 3.2, 0, 6.283);
  к.fillStyle = '#22d3ee'; к.fill();
}

/* ═══════════════════════════════════════════════════════════════════════
   ПЕРЕВОД. Единственное место, которое двигает деньги.
   ═══════════════════════════════════════════════════════════════════════ */
function кускомПеревод() {
  /* Строка как в боевой: кому, сколько и «Отправить» в одну линию.
     Раньше тут стояла плашка «Перевести CUBE» во всю ширину и строка
     «сегодня отправлено столько-то» — ни того, ни другого в боевой нет.

     Поиск работает прямо здесь: набрал имя, @ник, ключ или номер — под
     строкой выпадает список найденных, и человека ВЫБИРАЮТ. Сам поиск
     при этом не переписан заново: спрашивает его общая рука
     CW.найтиЛюдей (shared/api.js), та же, что у окна перевода и у
     чатов. Три разбора одного ответа в трёх файлах — верный способ
     однажды отправить деньги не тому.

     Сами деньги остаются в одном месте — в общей модалке
     (modals/transfer.js). Проверку суммы, подтверждение с именем и
     отправку здесь не повторяем. Строка отдаёт окну НОМЕР выбранного
     человека (а не набранный текст) и сумму, и окно спрашивает
     «перевести N CUBE такому-то?». Набранное имя — ещё не человек:
     тёзки бывают, и подтверждение остаётся обязательным.

     Дневной предел тоже не пропал: окно показывает его подзаголовком,
     когда спросит кошелёк. */
  var у = кусок('перевод',
      '<div class="раздел">'
    +   '<span class="знак">' + CW.значок('рост') + '</span>Отправить CUBE'
    + '</div>');

  var ряд = кусок('поля');

  var кому = document.createElement('input');
  кому.className = 'кому';
  кому.type = 'text';
  кому.placeholder = 'Имя, @ник, CUBE-… или #номер';
  кому.autocomplete = 'off';
  /* Браузер принимает пару «строка + число» за платёжную форму и вешает
     сверху свою плашку про автозаполнение. Называем поля их настоящими
     именами из стандарта: это получатель и сумма перевода. */
  кому.name = 'cw-transfer-to';

  var сколько = document.createElement('input');
  сколько.className = 'сколько';
  сколько.type = 'number';
  сколько.placeholder = 'CUBE';
  сколько.min = '1';
  сколько.step = '1';
  сколько.inputMode = 'decimal';
  сколько.name = 'cw-transfer-amount';
  сколько.autocomplete = 'transaction-amount';

  var б = document.createElement('button');
  б.type = 'button';
  б.className = 'кнопка главная';
  б.textContent = '→ Отправить';

  ряд.appendChild(кому);
  ряд.appendChild(сколько);
  ряд.appendChild(б);
  у.appendChild(ряд);

  /* ── поиск ── */
  var список = кусок('найдены');
  у.appendChild(список);

  var выбран = null;          /* {id, display_name, …} — кому переводим */
  var часы = null;

  кому.oninput = function () {
    /* Набрал заново — прежний выбор больше не действует. Иначе можно
       выбрать Аню, стереть её имя, набрать Петю и отправить Ане. */
    выбрать(null);
    clearTimeout(часы);
    var что = кому.value.trim();
    if (что.length < 2) { показать([]); return; }
    часы = setTimeout(function () {
      CW.найтиЛюдей(что).then(function (люди) {
        /* Пока ходили на сервер, человек мог набрать дальше. Ответ на
           устаревший запрос не показываем. */
        if (кому.value.trim() !== что) return;
        показать(люди);
      });
    }, 300);
  };

  function показать(люди) {
    список.innerHTML = '';
    список.classList.toggle('видно', !!люди.length);
    люди.slice(0, 6).forEach(function (ч) {
      var стр = document.createElement('button');
      стр.type = 'button';
      стр.className = 'найден';
      стр.appendChild(CW.кружок({ размер: 28, кто: ч.id, снимок: ч.avatar_url,
                                  версия: ч.avatar_ver, значок: '👤' }));
      var кто = document.createElement('span');
      кто.innerHTML = '<b>' + CW.безопасно(CW.имяЧеловека(ч)) + '</b>'
                    + '<span class="мелко">UID · '
                    + CW.безопасно(ч.uid || ч.id) + '</span>';
      стр.appendChild(кто);
      стр.onclick = function () { выбрать(ч); };
      список.appendChild(стр);
    });
  }

  function выбрать(ч) {
    выбран = ч || null;
    if (ч) {
      кому.value = CW.имяЧеловека(ч);
      показать([]);
    }
    кому.classList.toggle('нашли', !!ч);
  }

  б.onclick = function () {
    /* В окно отдаём номер выбранного, а если не выбирали — набранное
       слово: окно само поищет по нему и всё равно спросит «точно?». */
    CW.открыть('transfer', {
      кому: выбран ? выбран.id : кому.value.trim(),
      сколько: сколько.value.trim(),
      потом: function (о) {
        кому.value = ''; сколько.value = ''; выбрать(null);
        обновитьСчёт(о);
      }
    });
  };

  /* Enter в любом из двух полей — то же самое, что нажать кнопку. */
  function поEnter(е) { if (е.key === 'Enter') { е.preventDefault(); б.onclick(); } }
  кому.onkeydown = поEnter;
  сколько.onkeydown = поEnter;

  return у;
}

function обновитьСчёт() {
  Promise.all([
    CW.спросить('/cube/balance', { тихо: true }),
    CW.спросить('/cube/history?days=30', { тихо: true }),
    CW.спросить('/cube/transactions?limit=40', { тихо: true })
  ]).then(function (о) {
    if (о[0]) С.счёт = о[0];
    if (о[1]) С.кривая = о[1];
    if (о[2]) С.движения = о[2].transactions || [];
    показать();
  });
}

/* ── история ── */
function кускомИстория() {
  var где = document.createElement('div');
  где.appendChild(кусок('раздел', 'История движений'));

  var список = кусок('история');
  if (!С.движения.length) {
    список.innerHTML = '<div class="пусто-строка">'
      + 'Движений по счёту ещё не было.<br>Начисления закрываются раз в сутки.'
      + '</div>';
  } else {
    С.движения.forEach(function (д) {
      var пришло = д.dir === 'in';
      список.appendChild(кусок('движение ' + д.dir,
          '<span class="стрелка">' + CW.значок(пришло ? 'вниз' : 'вверх') + '</span>'
        + '<span>'
        +   '<span class="что">' + CW.безопасно(д.description || д.type || 'Движение') + '</span>'
        +   '<div class="когда">' + CW.безопасно(CW.подпись(д.created_at)) + '</div>'
        + '</span>'
        + '<span class="сколько">' + (пришло ? '+' : '') + деньги(д.amount) + '</span>'));
    });
  }
  где.appendChild(список);
  return где;
}


});
</script>
