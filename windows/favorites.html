<!--
  ИЗБРАННОЕ — стоячее окно шириной 10 см, как портфолио и правка профиля.

  ПРАВИЛО, по которому сделано: избранное, чаты и группы внутри одинаковые.
  Сверху название с кнопками и поиском, посередине лента пузырей, снизу
  поле ввода. Поэтому вид взят из оболочки, сборка — из shared/chat.js,
  и своего здесь только одно: откуда берутся записи.

  ГДЕ ЛЕЖАТ ЗАПИСИ. В двух местах сразу:

      localStorage cw_saved_msgs — тот же ключ, что у прежней программы,
                                   поэтому старое избранное видно сразу;
      /me/prefs ключ «избранное» — личное хранилище на сервере.

  Прежнее избранное жило только в браузере, и чистка данных сайта стирала
  его насовсем. Теперь оно едет за человеком на другое устройство и
  переживает чистку. Сводим по номеру записи: что есть в одном месте и
  нет в другом — добавляем, ничего не затирая молча.
-->
<style>

/* Шапку, ширину и выход рисует общий каркас (shared/window.css).
   Здесь остаётся только то, чего нет больше нигде: панель поиска,
   шаги по совпадениям. Своих правил для шапки здесь нет: название
   стоит слева у звезды, как во всех окнах программы. (Был короткий
   заход поставить его по центру — не прижилось: шапка у нас одна на
   все окна, и «Избранное» посреди неё выбивалось из ряда.) */

/* Панель поиска — общая: «пер-панель» в shared/shell.css, та же, что
   в чатах и группах. Своих правил для неё здесь больше нет: пока они
   были, поле поиска в избранном и в переписке стояли разной высоты. */

.лента-сообщений .пузырь{ max-width:88%; }
.изб-пусто{
  margin:auto; text-align:center; padding:40px 24px; color:var(--текст3);
  font-size:0.9rem; line-height:1.8;
}
.изб-пусто .зн{ display:flex; justify-content:center; color:var(--жёлтый);
  margin-bottom:16px; }
.изб-пусто .зн svg{ width:42px; height:42px; }
.изб-пусто b{ color:var(--текст2); font-weight:600; }

.пузырь.тут{ box-shadow:0 0 0 2px rgba(74,158,255,.7); }

</style>

<body>

<script src="../shared/api.js?v=20261123-377"></script>

<script>
'use strict';

CW.оболочка('favorites').then(function (место) {

var КЛЮЧ_БРАУЗЕРА = 'cw_saved_msgs';   /* как в прежней программе */
var ЗАРАЗ = 10;                        /* файлов за одно прикладывание */
var КЛЮЧ_СЕРВЕРА = 'избранное';        /* в личном хранилище /me/prefs */
var ПРЕДЕЛ = 500;   /* сколько записей держим; человеку это число не
                       показываем — он путал его с длиной заметки */

var ВКЛАДКИ = [
  { имя: 'фото',   подпись: 'Фото' },
  { имя: 'видео',  подпись: 'Видео' },
  { имя: 'аудио',  подпись: 'Аудио' },
  { имя: 'ссылки', подпись: 'Ссылки' }
];

var С = { записи: [], вкладка: '', ищем: '', поискВиден: false,
          везёт: false, найдено: -1 };

/* ── окно ── */
место.appendChild(ок('div', 'пусто-строка',
  'Избранное открыто отдельным окном. Закрой его, чтобы вернуться.'));

/* Окно собирает общий каркас: шапка, выход, ширина 10 см и оба правила
   проекта лежат там, и здесь их писать не нужно. Тело без отступов —
   внутри лента сообщений, у неё свои. */
var ОКНО = CW.стойка({
  имя: 'избранное',
  знак: 'звезда',
  заголовок: 'Избранное',
  назад: уйтиВМеню,
  поля: false,
  /* Ряд тот же, что в личке и в группах: лупа · три точки · крестик.
     Стрелки больше нет — выход рисуется крестиком, хотя по-прежнему
     уводит туда, откуда пришли. Избранное открыто поверх раздела, и
     крестик честнее: он закрывает то, что открыто. */
  крест: true,
  кнопки: [
    { имя: 'поиск', зн: 'лупа', подсказка: 'Поиск по избранному',
      делать: переключитьПоиск },
    { имя: 'ещё', зн: 'точки', подсказка: 'Ещё', делать: менюОкна }
  ]
});
ОКНО.открыть();
var шапка = { кнопки: ОКНО.кнопки };

/* Панель поиска: строка со стрелками по совпадениям и вкладки по виду
   вложения. Открывается лупой, закрывается крестом. Пока её нет, лента
   показывает всё — и это честнее, чем вечный ряд вкладок, из которого
   один всегда выбран. */
var панельПоиска = ок('div', 'пер-панель');
панельПоиска.style.display = 'none';

var строкаПоиска = ок('div', 'пер-строка');
var поиск = CW.строкаПоиска({
  подпись: 'Искать в избранном…',
  подождать: 180,
  искать: function (текст) { С.ищем = текст; С.найдено = -1; показать(); }
});
строкаПоиска.appendChild(поиск);

var вверх = ок('button', 'пер-шаг', '↑');
вверх.title = 'Предыдущее совпадение';
вверх.onclick = function () { шагПоиска(-1); };
var вниз = ок('button', 'пер-шаг', '↓');
вниз.title = 'Следующее совпадение';
вниз.onclick = function () { шагПоиска(1); };
var закрыть = ок('button', 'пер-шаг', '✕');
закрыть.title = 'Закрыть поиск';
закрыть.onclick = переключитьПоиск;
строкаПоиска.appendChild(вверх);
строкаПоиска.appendChild(вниз);
строкаПоиска.appendChild(закрыть);
панельПоиска.appendChild(строкаПоиска);

var вкладки = ок('div', 'пер-вкладки');
панельПоиска.appendChild(вкладки);

var итогПоиска = ок('div', 'пер-итог');
панельПоиска.appendChild(итогПоиска);

ОКНО.сверху(панельПоиска);

/* лента и ввод */
/* Тело окна — столбец, в котором прокручивается лента, а не само тело.
   Без этого лента с «flex:1» растягивалась во всю свою длину, прокрутку
   забирало тело, и CW.вниз() двигал ленту, у которой двигать нечего:
   заметки стояли на первой, а ползунок жил сам по себе. */
ОКНО.тело.classList.add('лентой');

var лента = CW.лентаСообщений();
ОКНО.тело.appendChild(лента);

/* Прилипание к низу и стрелка вниз - те же, что в чатах и группах:
   общий CW.прилипало() из shared/chat.js. Своей копии здесь нет и
   быть не должно, иначе избранное и переписка однажды поедут
   по-разному. */
ОКНО.тело.style.position = 'relative';
var ПРИЛИП = CW.прилипало(лента, ОКНО.тело);

/* Рисует ленту тот же счёт, что и в чатах: CW.живаяЛента. Заметка, у
   которой ничего не изменилось, остаётся тем же самым узлом.

   Прежде показать() стирало ленту целиком, а зовут его при открытии, по
   ответу сервера, по поиску и по вкладке. Отложенный ролик от этого
   начинал качаться заново - по разу на каждый показ, - и свежая закачка
   обрывалась на полпути следующим показом. */
var ЖИВАЯ = CW.живаяЛента(лента, function (о) {
  var п = CW.пузырь(о);
  if (о.нашлось) п.classList.add('нашлось');
  return п;
});

var ввод = CW.полеВвода({
  подпись: 'Заметка себе…',
  /* Своего предела тут больше нет: он один на чаты, группы и заметки и
     живёт в общем поле ввода. Было 4000 - и расходилось с сервером. */
  скрепка: приложить,
  микрофон: голосом,
  /* Кнопка записи одна и та же, что в чатах и группах: одиночное
     нажатие пишет, двойное переключает микрофон на камеру и обратно.
     Выбор запоминается браузером на всю программу. */
  кружок: кружком,
  послать: function (текст, готово, доп) {
    добавить(текст, null, доп.срок);
    готово();
  }
});
ОКНО.снизу(ввод);

/* ── КНОПКИ СООБЩЕНИЯ ──
   Полка, где они ждут отправки, живёт над строкой ввода. Кнопка с
   действием «написать» здесь заводит новую заметку: в избранном
   переписка сама с собой, и писать есть куда. */
CW.кнопкиСообщения.копить(ввод);
CW.кнопкиСообщения.здесь({
  написать: function (текст) { добавить(текст, null, 0); }
});

/* Какой срок выбран кнопкой «∞» прямо сейчас. Нужен вложениям: срок
   относится ко всему, что уходит из этого поля, а не только к тексту. */
function срокВвода() { return (ввод && ввод.срок) ? ввод.срок() : 0; }

/* Строки «0 из 500 · едет за тобой на другие устройства» внизу больше
   нет. Пятьсот — это сколько записей влезает в избранное, но читалось
   как предел длины заметки, и человека это сбивало. Про то, что записи
   ездят за ним, он узнаёт не из подписи под полем ввода: они просто
   есть на другом устройстве. */

/* поле выбора файла стоит в разметке с самого начала: оторванное от
   страницы оно в части браузеров молчит о выборе */
var полеФайла = document.createElement('input');
полеФайла.type = 'file';
полеФайла.id = 'выбор-файла-избранного';
полеФайла.style.cssText =
  'position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none';
document.body.appendChild(полеФайла);
/* Берём сразу всё, что выбрали: до десяти штук за раз, как в чатах и
   группах. Прежде здесь читался только первый файл, и человек, выбрав
   десять снимков, получал один. */
полеФайла.multiple = true;
полеФайла.onchange = function () {
  var все = [].slice.call(полеФайла.files || []);
  var документом = полеФайла.dataset.документом === '1';
  полеФайла.value = '';
  if (все.length > ЗАРАЗ) {
    CW.сказать('За раз берём не больше ' + ЗАРАЗ + ' файлов. Остальные '
             + (все.length - ЗАРАЗ) + ' - следующей отправкой.', 7000);
    все = все.slice(0, ЗАРАЗ);
  }
  if (все.length) взятьФайлы(все, документом);
};

нарисоватьВкладки();
загрузить();

/* Перезагрузка возвращает туда же: была открыта панель поиска — откроем. */
(function () {
  var было = CW.гдеБыл();
  if (было && было.окно === 'поиск') {
    С.вкладка = было.вкладка || '';
    переключитьПоиск();
  }
})();

/* ═══════════════════════════════════════════════════════════════════════
   ОТКУДА БЕРУТСЯ ЗАПИСИ
   ═══════════════════════════════════════════════════════════════════════ */
function изБраузера() {
  var сп = [];
  try { сп = JSON.parse(localStorage.getItem(КЛЮЧ_БРАУЗЕРА) || '[]') || []; }
  catch (е) { сп = []; }
  if (!Array.isArray(сп)) сп = [];

  /* Прежняя программа складывала избранное ещё и по переписке отдельно:
     cw_fav_msgs_<кто>. Эти записи тоже наши — подбираем. */
  try {
    for (var и = 0; и < localStorage.length; и++) {
      var к = localStorage.key(и);
      if (!к || к.indexOf('cw_fav_msgs_') !== 0) continue;
      var кусок = [];
      try { кусок = JSON.parse(localStorage.getItem(к) || '[]') || []; } catch (е) {}
      (Array.isArray(кусок) ? кусок : []).forEach(function (з) { сп.push(з); });
    }
  } catch (е) {}
  return сп;
}

function вБраузер() {
  try {
    localStorage.setItem(КЛЮЧ_БРАУЗЕРА, JSON.stringify(С.записи));
    return true;
  } catch (е) {
    CW.сказать('В браузере кончилось место: запись не сохранилась');
    return false;
  }
}

function загрузить() {
  С.записи = свести(изБраузера(), []);
  показать();

  CW.спросить('/me/prefs?keys=' + encodeURIComponent(КЛЮЧ_СЕРВЕРА), { тихо: true })
    .then(function (д) {
      var сырое = д && д.prefs && д.prefs[КЛЮЧ_СЕРВЕРА] && д.prefs[КЛЮЧ_СЕРВЕРА].v;
      var сСервера = [];
      try { сСервера = JSON.parse(сырое || '[]') || []; } catch (е) {}
      С.везёт = true;
      var было = С.записи.length;
      С.записи = свести(С.записи, Array.isArray(сСервера) ? сСервера : []);
      вБраузер();
      показать();
      if (С.записи.length !== было) наСервер();
    })
    .catch(function () { С.везёт = false; показать(); });
}

/* Сводим два списка по номеру записи. Ничего не затираем молча: чего нет
   в одном месте — добавляем, что есть в обоих — берём свежее по метке. */
function свести(а, б) {
  var где = {}, итог = [];

  (а || []).concat(б || []).forEach(function (з) {
    if (!з || (!з.text && !з.fileName)) return;
    var номер = з.id
      || ('з' + (з.savedAt || з.time || '') + String(з.text || '').slice(0, 24));
    з.id = номер;

    var место = где[номер];
    if (место === undefined) { где[номер] = итог.length; итог.push(з); return; }
    if (миг(з) > миг(итог[место])) итог[место] = з;
  });

  итог.sort(function (х, у) { return миг(х) - миг(у); });
  if (итог.length > ПРЕДЕЛ) итог = итог.slice(итог.length - ПРЕДЕЛ);
  return итог;
}

function миг(з) {
  var с = (з && (з.savedAt || з.time)) || '';
  var т = CW.миг(с);
  return т || 0;
}

var часыСервера = null;
function наСервер() {
  clearTimeout(часыСервера);
  часыСервера = setTimeout(function () {
    var тело = {};
    тело[КЛЮЧ_СЕРВЕРА] = { v: JSON.stringify(С.записи), t: Date.now() };
    CW.спросить('/me/prefs', { способ: 'POST', тело: { prefs: тело }, тихо: true })
      .then(function (о) { С.везёт = !!о; })
      .catch(function () { С.везёт = false; });
  }, 600);
}

function сохранить() {
  вБраузер();
  наСервер();
  показать();
}

/* ═══════════════════════════════════════════════════════════════════════
   ЧТО ПОКАЗЫВАЕМ
   ═══════════════════════════════════════════════════════════════════════ */
/* Род записи считает общий разбор (CW.родФайла в shared/chat.js) — тот
   же, по которому значок выбирает пузырь и отбирают полки в поиске по
   переписке. Свой список расширений здесь уже успел разойтись с общим:
   .oga в избранном считалось «прочим», а в переписке звуком. */
function вид(з) {
  return CW.родФайла(з.fileName, з.text, '');
}

function отобранные() {
  var что = С.ищем.toLowerCase();
  return С.записи.filter(function (з) {
    if (С.вкладка && вид(з) !== С.вкладка) return false;
    if (!что) return true;
    /* Ищем по тому, что видно: служебная строка кнопок в поиск не
       попадает, иначе «cw» находило бы половину заметок. */
    return (CW.кнопкиСообщения.без(з.text || '') + ' ' + String(з.fileName || '')
            + ' ' + String(з.author || '')).toLowerCase().indexOf(что) >= 0;
  });
}

function нарисоватьВкладки() {
  вкладки.innerHTML = '';
  ВКЛАДКИ.forEach(function (в) {
    var сколько = С.записи.filter(function (з) { return вид(з) === в.имя; }).length;
    var б = ок('button', 'пер-вкладка' + (С.вкладка === в.имя ? ' тут' : ''));
    б.innerHTML = в.подпись
      + (сколько ? '<span class="сколько">' + сколько + '</span>' : '');
    /* Повторное нажатие снимает отбор: иначе выбранную вкладку нечем
       отменить и лента навсегда остаётся обрезанной. */
    б.onclick = function () {
      С.вкладка = (С.вкладка === в.имя) ? '' : в.имя;
      показать();
    };
    вкладки.appendChild(б);
  });
}

function показать() {
  /* Запись со сроком пропадает сама — проверяем при каждом показе, а не
     только при открытии: окно может стоять открытым часами. */
  var сейчас = Date.now();
  var было = С.записи.length;
  С.записи = С.записи.filter(function (з) {
    return !з.hideAt || CW.миг(з.hideAt) > сейчас;
  });
  if (С.записи.length !== было) { вБраузер(); наСервер(); }

  нарисоватьВкладки();

  var ряды = отобранные();
  if (ПРИЛИП) ПРИЛИП.запомнить();

  if (!ряды.length) {
    ЖИВАЯ.нарисовать([], пустое());
    if (ПРИЛИП) ПРИЛИП.вернуть();
    return;
  }

  /* Закреплённые наверху, остальные по времени — как и лежат.
     Сначала собираем описания, потом отдаём их живой ленте: пачка
     снимков, отложенных одна за другой, встаёт одной кучкой - так же,
     как в чатах и в группах. */
  var описания = ряды.slice().sort(function (х, у) {
    return (у.закреплена ? 1 : 0) - (х.закреплена ? 1 : 0);
  }).map(function (з) {
    /* Кнопки у заметки лежат там же, где у сообщения, — последней
       строкой текста. Разбор один на всю программу
       (shared/кнопки-сообщения.js), и заметка ничем не особенная. */
    var раз = CW.кнопкиСообщения.разобрать(з.text || '');
    var о = {
      своё: true,
      кто: з.author && з.author !== 'Заметка' ? з.author : '',
      текст: раз.текст,
      кнопки: раз.кнопки,
      вряд: раз.вряд,
      цвет: раз.цвет,
      /* Строка «geo:…» показывается карточкой места, а не самой
         строкой: разбирает её общий пузырь, ему нужен только вид.

         Снимок и ролик, отложенные себе, показываем ими самими, а не
         строкой файла: в чатах это давно так, а здесь заметка со
         снимком оставалась серой строкой с именем файла. */
      вид: /^geo:/i.test(String(раз.текст || '')) ? 'geo' : видЗаписи(з),
      адрес: видЗаписи(з) ? з.fileUrl : '',
      когда: CW.подпись(з.savedAt || з.time),
      метка: Date.parse(з.savedAt || з.time) || 0,
      /* «изменено» ставится, когда запись правили через меню. В чатах
         и группах эту метку отдаёт сервер, здесь — сама запись: её
         правка живёт в этом браузере. */
      правлено: !!з.изменена,
      срок: з.hideAt ? CW.остаток(з.hideAt) : '',
      истекает: з.hideAt || '',
      ид: з.id || '',
      закреплён: !!з.закреплена,
      файл: (з.fileName && !видЗаписи(з))
              ? { имя: з.fileName, размер: з.fileSize, адрес: з.fileUrl } : null,
      меню: function (x, y) { менюЗаписи(з, x, y); }
    };
    о.нашлось = !!С.ищем;
    return о;
  });

  ЖИВАЯ.нарисовать(описания);

  if (С.поискВиден) {
    var сколько = ряды.length;
    итогПоиска.textContent = С.ищем
      ? (сколько ? 'Нашлось: ' + сколько : 'Ничего не нашлось')
      : (С.вкладка ? 'В разделе: ' + сколько : '');
  }
  if (ПРИЛИП) ПРИЛИП.вернуть(); else CW.вниз(лента);
}

/* Каким видом показать отложенный файл. Разбор рода один на всю
   программу - CW.родФайла, - чтобы избранное и переписка не разошлись
   в том, что считать снимком. */
/* Есть ли что показывать картинкой: снимок или ролик. Строка
   договора переключать нечего. */
function медиаЗапись(з) {
  var род = CW.родФайла(з.fileName || '', '', '');
  return род === 'фото' || род === 'видео';
}

function видЗаписи(з) {
  if (!з.fileUrl) return '';
  /* Отложено «файлом» - значит строкой файла, как в чатах. */
  if (з.какФайл) return '';
  var род = CW.родФайла(з.fileName || '', '', '');
  if (род === 'фото')  return 'image';
  if (род === 'видео') return 'video';
  return '';
}

function пустое() {
  var у = ок('div', 'изб-пусто');
  if (С.ищем) {
    у.innerHTML = 'По запросу «' + CW.безопасно(С.ищем) + '» ничего не нашлось.';
    return у;
  }
  if (С.вкладка) {
    у.innerHTML = 'В этой переписке пока ничего нет';
    return у;
  }
  /* Было три строки с объяснением, откуда берутся записи. Человек
     читает их один раз, а видит каждый раз, когда избранное пусто.
     Осталась одна короткая строка: что делать — видно по полю ввода
     внизу, оно прямо под ней и подписано «Заметка себе…». */
  у.innerHTML = '<div class="зн">' + CW.значок('звезда') + '</div>'
    + '(Здесь пока пусто)';
  return у;
}

/* ═══════════════════════════════════════════════════════════════════════
   ЧТО С НИМИ МОЖНО ДЕЛАТЬ
   ═══════════════════════════════════════════════════════════════════════ */
function добавить(текст, вложение, срок) {
  текст = String(текст || '').trim();
  if (!текст && !вложение) return;

  /* Кнопки, собранные через меню окна, уходят с этой записью и
     стираются из полки: они были привязаны именно к ней. */
  var ждали = CW.кнопкиСообщения.забрать();
  if (ждали) {
    текст = CW.кнопкиСообщения.вшить(текст, ждали);
    CW.кнопкиСообщения.очистить();
  }

  var сейчас = new Date().toISOString();
  var з = {
    id: 'з' + Date.now() + Math.random().toString(36).slice(2, 7),
    text: текст, author: 'Заметка', sender: 'me',
    savedAt: сейчас, time: сейчас
  };
  /* «Скрыть через» из менюшки ввода: запись сама пропадёт в срок. */
  if (срок) з.hideAt = new Date(Date.now() + срок * 1000).toISOString();
  if (вложение) {
    з.fileName = вложение.имя;
    з.fileSize = вложение.размер;
    if (вложение.адрес) з.fileUrl = вложение.адрес;
    /* Человек выбрал «Файл» - значит, файлом и покажем. Запись это
       помнит, иначе снимок всё равно развернулся бы картинкой. */
    if (вложение.документом) з.какФайл = true;
  }
  С.записи.push(з);
  if (С.записи.length > ПРЕДЕЛ) С.записи.shift();
  сохранить();
}

/* Меню записи — ОБЩЕЕ меню сообщения (shared/меню-сообщения.js), то же,
   что в чатах и группах. Прежде здесь было своё, из двух пунктов:
   «Копировать» и «Закрепить», — и форматирования в избранном не было
   вовсе. Список действий у сообщения в программе один.

   Отличия избранного честные: записи лежат в этом браузере, поэтому
   правка и закрепление пишутся в localStorage, а не на сервер. */
function менюЗаписи(з, x, y) {
  CW.нужен('shared/меню-сообщения.js').then(function () {
    var адрес = з.fileUrl || '';
    /* Кнопки снимаем перед показом: в меню и в правке человек должен
       видеть свой текст, а не служебную строку под ним. */
    var раз = CW.кнопкиСообщения.разобрать(з.text || '');
    var род = /^geo:/i.test(String(раз.текст || ''))
      ? 'место'
      : CW.родСообщения(з.fileName ? 'file' : '', з.fileName, адрес);

    CW.менюСообщения({
      род: род,
      своё: true,                /* избранное — всегда своё */
      текст: раз.текст,
      адрес: адрес, имя: з.fileName || '', размер: Number(з.fileSize) || 0,
      когда: CW.когдаСловами(з.savedAt || з.time) + (з.изменена ? ' · изменено' : ''),
      закреплено: !!з.закреплена,
      действия: {
        ответить: function (т) { вПоле(т); },
        скопировать: function () { копировать(раз.текст || з.fileName || ''); },
        изменить: function (новый) {
          /* Правка текста не трогает кнопки: сняли, поправили,
             пришили обратно. */
          з.text = CW.кнопкиСообщения.вшить(новый, раз.набор);
          з.изменена = true;
          сохранить();
          return Promise.resolve();
        },
        кнопки: {
          набор: раз.кнопки, вряд: раз.вряд, цвет: раз.цвет,
          сохранить: function (сп, вряд, цвет) {
            з.text = CW.кнопкиСообщения.вшить(раз.текст, сп, вряд, цвет);
            сохранить();
            return Promise.resolve();
          }
        },
        сохранить: адрес ? function () { CW.сохранитьФайл(адрес, з.fileName || ''); } : null,
        /* Заменить файл в заметке. Заметки лежат в браузере, поэтому
           новый файл читаем прямо в адрес data: - тем же путём, что и
           при добавлении, и с тем же пределом в 900 КБ. */
        заменить: адрес ? function (берём) {
          выбратьОдин(берём).then(function (ф) {
            if (!ф) return;
            if (ф.size > 900 * 1024) {
              CW.сказать('В избранное берём файлы до 900 КБ', 7000); return;
            }
            var чтец = new FileReader();
            чтец.onerror = function () { CW.сказать('Файл прочитать не вышло'); };
            чтец.onload = function () {
              з.fileUrl = String(чтец.result || '');
              з.fileName = ф.name || з.fileName;
              з.fileSize = ф.size;
              з.изменена = true;
              сохранить();
              CW.сказать('Файл заменён', 2500);
            };
            чтец.readAsDataURL(ф);
          });
        } : null,
        /* Снимок или ролик в заметке можно переключить: лежит
           картинкой - показать файлом, и наоборот. Заметки, отложенные
           до этой сборки, своего выбора не помнят вовсе, и этот пункт -
           единственный способ их поправить, не откладывая заново. */
        показатьИначе: (з.fileUrl && медиаЗапись(з)) ? {
          файлом: !з.какФайл,
          делать: function () { з.какФайл = !з.какФайл; сохранить(); }
        } : null,
        закрепить: function (надо) { з.закреплена = надо; сохранить(); },
        переслать: function () {
          CW.открыть('forward', адрес
            ? { адрес: адрес, вид: 'file', имя: з.fileName || '', текст: раз.текст }
            : { текст: раз.текст });
        },
        удалить: function () { удалить(з); },
        выбрать: function () { начатьВыбор(з.id); }
      }
    }, x, y);
  }).catch(function () { CW.сказать('Меню не приехало'); });
}

/* ── ВЫБРАТЬ НЕСКОЛЬКО ──
   Тот же общий файл, что в переписке и в группах. Записи избранного
   лежат в этом браузере, поэтому удаление — просто вычеркнуть их из
   списка и сохранить. */
function начатьВыбор(первый) {
  CW.нужен('shared/выбор-сообщений.js').then(function () {
    CW.выборСообщений.начать({
      лента: лента,
      куда: ОКНО.тело,
      первый: первый,
      текстом: function (ид) {
        var з = записьПо(ид);
        return з ? (CW.кнопкиСообщения.без(з.text || '') || з.fileName || '') : '';
      },
      переслать: function (сп) {
        var строки = сп.map(function (ид) {
          var з = записьПо(ид);
          if (!з) return '';
          return CW.кнопкиСообщения.без(з.text || '') || з.fileUrl || з.fileName || '';
        }).filter(Boolean);
        CW.открыть('forward', { текст: строки.join('\n') });
      },
      удалить: function (сп) {
        С.записи = С.записи.filter(function (з) {
          return сп.indexOf(String(з.id)) < 0;
        });
        сохранить();
        return Promise.resolve();
      }
    });
  }).catch(function () { CW.сказать('Выбор не приехал'); });
}

function записьПо(ид) {
  for (var i = 0; i < С.записи.length; i++) {
    if (String(С.записи[i].id) === String(ид)) return С.записи[i];
  }
  return null;
}

/* Ответ самому себе — цитата в поле: в заметках это способ связать
   новую мысль со старой. */
function вПоле(текст) {
  var поле = ввод && ввод.поле;
  if (!поле) return;
  var кусок = String(текст || '').split('\n')[0].slice(0, 120);
  поле.value = (кусок ? '> ' + кусок + '\n' : '') + поле.value;
  поле.focus();
}

function удалить(з) {
  var где = С.записи.indexOf(з);
  if (где < 0) return;
  С.записи.splice(где, 1);
  сохранить();
  CW.сказать('Удалено');
}

function копировать(текст) {
  if (!текст) { CW.сказать('Копировать нечего'); return; }
  CW.вбуфер(текст, 'Скопировано');
}

/* Файл кладём в запись строкой data: — он остаётся при себе и не зависит
   от чужой ссылки, которая однажды перестанет открываться. Поэтому и
   предел скромный: избранное целиком должно влезать в хранилище. */
/* Скрепка открывает тот же лист, что в чатах и группах: «Фото или
   видео · Файл · Геолокация». Прежде она сразу открывала выбор файла,
   и положить в заметки своё место было нечем.

   Видеокружок тут есть, но устроен иначе, чем остальные вложения:
   см. кружком() ниже. Коротко: сам ролик уезжает на сервер, а в
   заметке остаётся ссылка на него. Иначе он не влез бы: заметки
   лежат у браузера, и файл внутри заметки ограничен 900 КБ, это около
   двух секунд видео. */
function приложить(е) {
  var узел = е && е.currentTarget;
  CW.лист([
    { зн: CW.значок('картинка', 16), подпись: 'Фото или видео',
      делать: function () { взятьИз('image/*,video/*', false); } },
    /* «Файл» значит файл: снимок, выбранный этим пунктом, ляжет
       СТРОКОЙ ФАЙЛА, а не картинкой во всю ленту. Так же устроены
       чаты и группы (shared/вложения.js, вид «документом»), и
       избранное больше от них не отличается. */
    { зн: CW.значок('лист', 16), подпись: 'Файл',
      делать: function () { взятьИз('', true); } },
    { зн: CW.значок('место', 16), подпись: 'Геолокация', делать: положитьМесто }
  ], узел ? { узел: узел } : null);
}

/* Выбор ОДНОГО файла - для замены. Своё поле, не то, что копит
   пачку: у пачки свои правила и своё «после выбора». */
function выбратьОдин(берём) {
  return new Promise(function (готово) {
    var п = document.createElement('input');
    п.type = 'file';
    п.accept = берём || '';
    п.style.cssText = 'position:fixed;left:0;top:0;width:1px;height:1px;opacity:0';
    document.body.appendChild(п);
    п.onchange = function () {
      var ф = п.files && п.files[0];
      if (п.parentNode) п.parentNode.removeChild(п);
      готово(ф || null);
    };
    п.click();
  });
}

function взятьИз(берём, документом) {
  полеФайла.accept = берём || '';
  полеФайла.dataset.документом = документом ? '1' : '';
  полеФайла.click();
}

function положитьМесто() {
  CW.вложения.геопозиция().then(function (м) {
    добавить(CW.вложения.строкойГео(м), null, срокВвода());
    CW.сказать('Место в избранном');
  }).catch(function (е) {
    CW.сказать((е && е.message) || 'Место не определилось', 6000);
  });
}

/* Складываем по очереди: читаем файл, кладём заметку, беремся за
   следующий. Разом нельзя - заметки лежат в браузере, и десять
   параллельных чтений забивают ему память.

   Идут они друг за другом в одну-две десятых секунды, поэтому в ленте
   встают одной кучкой: правило «одно за другим» у кучки одно на всю
   программу (shared/chat.js). */
function взятьФайлы(файлы, документом) {
  var срок = срокВвода();
  var легло = 0, тяжёлых = 0;
  (function следующий(и) {
    if (и >= файлы.length) {
      if (легло) CW.сказать(легло === 1 ? 'Файл в избранном'
                                        : (легло + ' файла в избранном'), 2500);
      if (тяжёлых) CW.сказать(тяжёлых + ' не влезли: в избранное берём до 900 КБ', 7000);
      return;
    }
    var ф = файлы[и];
    if (ф.size > 900 * 1024) { тяжёлых++; следующий(и + 1); return; }
    var чтец = new FileReader();
    чтец.onerror = function () {
      CW.сказать('Файл «' + (ф.name || '') + '» прочитать не вышло');
      следующий(и + 1);
    };
    чтец.onload = function () {
      добавить('', { имя: ф.name, размер: ф.size, адрес: String(чтец.result || ''),
                     документом: !!документом }, срок);
      легло++;
      следующий(и + 1);
    };
    чтец.readAsDataURL(ф);
  })(0);
}

/* ═══════════════════════════════════════════════════════════════════════
   ВИДЕОКРУЖОК.

   Запись одна на всю программу (shared/вложения.js), та же, что в
   чатах и группах: квадрат с камеры и микрофона, не длиннее минуты.

   А вот кладём мы его не так, как остальное в избранном. Файл и голос
   лежат внутри заметки строкой data: и потому ограничены 900 КБ.
   Минута видео — это мегабайты, в заметку такое не положишь. Поэтому
   ролик уезжает на сервер тем же путём, что вложения чатов, а в
   заметке остаётся ссылка.

   Отсюда и честная разница: кружок в избранном требует связи с
   сервером. Не ушёл — так и скажем, молча терять запись нельзя.
   ═══════════════════════════════════════════════════════════════════════ */
function кружком() {
  if (!CW.вложения || !CW.вложения.кружок) {
    CW.сказать('Запись кружка не приехала, обнови страницу');
    return;
  }
  CW.вложения.кружок().then(function (ф) {
    if (!ф) return;                       /* отменили запись */
    return CW.вложения.отправить([ф], 'clip', 'circle', function (о) {
      добавить('', { имя: о.имя || 'кружок.webm',
                     размер: о.размер || ф.size || 0,
                     адрес: о.адрес }, срокВвода());
      CW.сказать('Кружок в избранном');
    });
  }).catch(function (е) {
    CW.сказать((е && е.message) || 'Кружок не записался', 6000);
  });
}

/* ═══════════════════════════════════════════════════════════════════════
   ГОЛОСОМ.

   Пишем прямо в браузере и кладём в запись тем же куском data: что и
   файл. Разрешение спрашиваем в тот момент, когда человек нажал на
   микрофон, — не раньше: окно «разрешить доступ» без причины пугает.
   ═══════════════════════════════════════════════════════════════════════ */
var запись = null;

function голосом(поле, готово) {
  if (запись) { остановитьЗапись(); if (готово) готово(); return; }

  if (!navigator.mediaDevices || !окноЕстьЗапись()) {
    CW.сказать('Этот браузер не умеет записывать голос');
    if (готово) готово();
    return;
  }

  navigator.mediaDevices.getUserMedia({ audio: true }).then(function (поток) {
    var писарь = new window.MediaRecorder(поток);
    var куски = [];
    писарь.ondataavailable = function (е) { if (е.data.size) куски.push(е.data); };
    писарь.onstop = function () {
      поток.getTracks().forEach(function (д) { д.stop(); });
      var капля = new Blob(куски, { type: писарь.mimeType || 'audio/webm' });
      запись = null;
      CW.сказать('');
      if (!капля.size) { if (готово) готово(); return; }
      if (капля.size > 900 * 1024) {
        CW.сказать('Голос длиннее минуты в избранное не влезет');
        if (готово) готово();
        return;
      }
      var чтец = new FileReader();
      чтец.onload = function () {
        var сек = Math.round((Date.now() - запискоГда) / 1000);
        добавить('', { имя: 'голос ' + сек + ' с.webm', размер: капля.size,
                       адрес: String(чтец.result || '') }, срокВвода());
        CW.сказать('Голос в избранном');
        if (готово) готово();
      };
      чтец.readAsDataURL(капля);
    };
    запискоГда = Date.now();
    писарь.start();
    запись = писарь;
    CW.сказать('Пишу… нажми микрофон ещё раз, чтобы остановить', 60000);
  }).catch(function () {
    CW.сказать('Микрофон не дали');
    if (готово) готово();
  });
}

var запискоГда = 0;

function остановитьЗапись() {
  try { запись.stop(); } catch (е) { запись = null; }
}

function окноЕстьЗапись() {
  return typeof window.MediaRecorder === 'function';
}

/* ═══════════════════════════════════════════════════════════════════════
   МЕНЮ ОКНА
   ═══════════════════════════════════════════════════════════════════════ */
/* В меню один пункт. Было три: «Сохранить в файл», «Загрузить из
   файла» и очистка. Два первых уехали вместе со своим кодом — не
   спрятались, а удалены: мёртвый код, до которого нельзя дойти, хуже
   отсутствующего, его начинают чинить и поддерживать впустую.
   Понадобятся — вернём пунктом и кодом разом. */
/* Меню выезжает ПОД своей кнопкой: каркас передаёт сюда саму кнопку
   вторым доводом, а лист вешается под неё по правому краю. Раньше оно
   всплывало посреди окна, и было непонятно, чьё оно. */
function менюОкна(е, кнопка) {
  CW.лист([
    /* Те же два пункта, что в чатах и в группах: собирает их общий
       файл (shared/кнопки-сообщения.js). */
    { зн: CW.значок('кнопка', 16), подпись: 'Добавить кнопку',
      делать: function () { CW.кнопкиСообщения.добавить({ одна: true, ввод: ввод }); } },
    { зн: CW.значок('клетки', 16), подпись: 'Добавить ряд кнопок',
      делать: function () { CW.кнопкиСообщения.добавить({ ввод: ввод }); } },
    { зн: CW.значок('урна', 16), подпись: 'Очистить переписку',
      опасная: true, делать: спроситьОчистку }
  ], кнопка ? { узел: кнопка } : null);
}

function спроситьОчистку() {
  CW.лист([
    { заголовок: 'Очистить избранное целиком?' },
    { зн: CW.значок('урна', 16), подпись: 'Очистить', опасная: true, делать: function () {
        С.записи = [];
        сохранить();
        CW.сказать('Избранное очищено');
      } },
    { зн: CW.значок('стрелка', 16), подпись: 'Оставить' }
  ]);
}

/* ═══════════════════════════════════════════════════════════════════════
   МЕЛОЧЬ
   ═══════════════════════════════════════════════════════════════════════ */
function переключитьПоиск() {
  С.поискВиден = !С.поискВиден;
  CW.гдеБыл(С.поискВиден ? { окно: 'поиск', вкладка: С.вкладка } : null);
  панельПоиска.style.display = С.поискВиден ? 'block' : 'none';
  шапка.кнопки.поиск.classList.toggle('горит', С.поискВиден);
  if (С.поискВиден) { поиск.поле.focus(); показать(); return; }
  С.ищем = ''; С.вкладка = ''; С.найдено = -1;
  поиск.поле.value = '';
  показать();
}

/* Стрелки ведут по совпадениям, а не перерисовывают ленту: человек
   видит, где именно нашлось, и может идти дальше. */
function шагПоиска(куда) {
  var пузыри = лента.querySelectorAll('.пузырь.нашлось');
  if (!пузыри.length) { CW.сказать('Совпадений нет'); return; }
  С.найдено = (С.найдено + куда + пузыри.length) % пузыри.length;
  пузыри.forEach(function (п) { п.classList.remove('тут'); });
  var этот = пузыри[С.найдено];
  этот.classList.add('тут');
  этот.scrollIntoView({ block: 'center', behavior: 'smooth' });
  итогПоиска.textContent = (С.найдено + 1) + ' из ' + пузыри.length;
}

/* Выход — туда, откуда пришли. Избранное открывают из чатов, но могут и
   из другого раздела: оболочка запоминает, откуда нажали. */
function уйтиВМеню() {
  var куб = CW.какойКуб();
  var откуда = '';
  try { откуда = sessionStorage.getItem('cw_откуда') || ''; } catch (е) {}
  var ладно = /^(feed|chats|groups|signals|market|earn|wallet|stats|refs)$/;
  var имя = ладно.test(откуда) ? откуда : 'chats';
  CW.уйти(CW.раздел(имя, куб));
}

function ок(тег, класс, внутри) { return CW.элВ(тег, класс, внутри); }

});
