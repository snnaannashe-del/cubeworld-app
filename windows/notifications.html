<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>Уведомления · CubeWorld</title>
<link rel="icon" href="../icons/favicon.svg?v=20261124-465">
<link rel="stylesheet" href="../shared/style.css?v=20261124-465">
<link rel="stylesheet" href="../shared/window.css?v=20261124-465">
<link rel="stylesheet" href="../shared/account.css?v=20261124-465">
<script src="../shared/theme.js?v=20261124-465"></script>

<!--
  УВЕДОМЛЕНИЯ — окно поверх программы. То же, что в меню под
  колокольчиком, но целым списком и с объяснением внизу.

  ЗДЕСЬ ТОЛЬКО СИСТЕМНОЕ: что случилось с кубом и со счётом. Переписки
  здесь нет — кто кому что написал, видно в чатах, и дублировать это
  колокольчиком значит хоронить настоящие события под болтовнёй.

  ЧЕСТНО О ГЛАВНОМ. У сервера пока нет ленты событий: он не хранит
  «тебя лайкнули в 14:20» и не умеет это отдавать. Поэтому окно
  собирает уведомления из того, что сервер рассказать МОЖЕТ:

      входы в кубы и их срок   →  /me/cube-memberships
      движения CUBE (награды)  →  /cube/transactions
      выплаты и их судьба      →  /rewards/history
      новые подписчики         →  /follow/{я}/followers
      пределы ключа на исходе  →  /me/limits

  Лайки, комментарии и ответы здесь появятся в тот день, когда сервер
  начнёт их записывать, — и появятся сами, потому что добавить их
  значит добавить один источник в список ИСТОЧНИКИ —
  он живёт в shared/вести.js, общий для этого окна и меню под
  колокольчиком.

  Это сказано и человеку, внизу окна, прямым текстом. Молчащее окно
  уведомлений человек считает сломанным: он точно знает, что его
  лайкали, а здесь пусто.

  Прочитанное помним у себя (/me/prefs), а не на сервере сбоку: иначе
  открыл с телефона — и всё снова непрочитанное.
-->
<style>

.ув-строка{
  display:flex; align-items:flex-start; gap:12px;
  padding:12px 16px; border-bottom:1px solid var(--край);
  cursor:pointer; width:100%; border-inline-start:none; border-inline-end:none;
  border-top:none; background:none; text-align:start; color:var(--текст);
}
.ув-строка:hover{ background:var(--полоса); }
.ув-строка .что{ flex:1; min-width:0; }
.ув-строка .что b{ font-size:0.9667rem; font-weight:600; }
.ув-строка .что p{ margin:3px 0 0; font-size:0.8667rem; color:var(--текст2);
  line-height:1.45; }
.ув-строка .что .когда{ display:block; margin-top:5px; font-size:0.7667rem;
  color:var(--текст3); }
/* Точка слева — непрочитанное. Кружок лица уже занят, цветом строку
   красить нельзя (цветных строк станет десять), остаётся точка. */
.ув-строка .точка{
  flex:0 0 8px; width:8px; height:8px; border-radius:50%;
  background:var(--синий); margin-top:16px;
}
.ув-строка.прочитано .точка{ background:transparent; }
.ув-строка.прочитано .что b{ font-weight:500; color:var(--текст2); }

.ув-день{
  padding:16px 16px 7px; font-size:0.7333rem; letter-spacing:.1em;
  text-transform:uppercase; color:var(--текст3);
}

.ув-хвост{
  padding:20px 16px 26px; font-size:0.8333rem; line-height:1.65;
  color:var(--текст3); border-top:1px solid var(--край); margin-top:6px;
}
.ув-хвост b{ color:var(--текст2); }

</style>
</head>
<body>

<script src="../shared/api.js?v=20261124-465"></script>
<script src="../shared/ui.js?v=20261124-465"></script>
<script src="../shared/смайлы.js?v=20261124-465"></script>
<script src="../shared/лица.js?v=20261124-465"></script>
<script src="../shared/эфир.js?v=20261124-465"></script>
<script src="../shared/icons.js?v=20261124-465"></script>
<script src="../shared/window.js?v=20261124-465"></script>
<script src="../shared/без-копий.js?v=20261124-465"></script>
<script src="../shared/time.js?v=20261124-465"></script>
<script src="../shared/auth.js?v=20261124-465"></script>
<script src="../shared/lang.js?v=20261124-465"></script>
<script src="../shared/account.js?v=20261124-465"></script>
<script src="../shared/вести.js?v=20261124-465"></script>
<script src="../shared/shell.js?v=20261124-465"></script>
<script>
'use strict';

CW.оболочка('feed').then(function (место) {

место.appendChild(ок('div', 'пусто-строка',
  Т('Уведомления открыты отдельным окном. Закрой его, чтобы вернуться.')));

var ОКНО = CW.стойка({
  имя: 'уведомления',
  знак: 'колокол',
  заголовок: Т('Уведомления'),
  подзаголовок: Т('спрашиваю…'),
  назад: уйти,
  поля: false,
  кнопки: [
    { имя: 'прочитано', зн: 'галка', подсказка: Т('Отметить всё прочитанным'),
      делать: всёПрочитано },
    { имя: 'обновить', зн: 'повтор', подсказка: Т('Обновить'), делать: собрать }
  ]
});
ОКНО.открыть();

/* Откуда берутся события и что считается прочитанным — в общем файле
   shared/вести.js. Его делят это окно и меню под колокольчиком: сбор,
   написанный дважды, однажды разойдётся, и событие будет видно в одном
   месте и не видно в другом. */
var СОБЫТИЯ = [];

собрать();

/* ═══════════════════════════════════════════════════════════════════════
   СОБРАТЬ
   ═══════════════════════════════════════════════════════════════════════ */
function собрать() {
  ОКНО.имя(Т('Уведомления'), Т('спрашиваю…'));
  ОКНО.тело.innerHTML = '<div class="пусто-строка">' + CW.безопасно(Т('Загрузка…')) + '</div>';
  CW.вести.собрать().then(function (список) {
    СОБЫТИЯ = список;
    показать();
  });
}

function показать() {
  var т = ОКНО.тело;
  т.innerHTML = '';

  var новых = CW.вести.новых(СОБЫТИЯ);
  /* «16 новых», «1 новое». Слово при числе берёт Т.мн: по-русски форм
     три, по-английски одна, и решает это словарь, а не этот код. */
  ОКНО.имя(Т('Уведомления'),
    новых ? (новых + ' ' + Т.мн(новых, 'новое', 'новых', 'новых'))
          : Т('всё прочитано'));
  ОКНО.кнопки['прочитано'].disabled = !новых;

  if (!СОБЫТИЯ.length) {
    ОКНО.пусто({
      знак: 'колокол',
      заголовок: Т('Пока тихо'),
      текст: 'Новых событий в кубах и наград нет.'
    });
    хвост();
    return;
  }

  СОБЫТИЯ.forEach(function (с) { т.appendChild(строка(с)); });
  хвост();
}

function строка(с) {
  var прочитано = CW.вести.прочитано(с.ключ);
  var б = ок('button', 'ув-строка' + (прочитано ? ' прочитано' : ''));

  б.appendChild(ок('span', 'точка'));

  if (с.кружок) {
    б.appendChild(CW.кружок({ размер: 40, снимок: с.кружок.снимок,
                              значок: с.кружок.значок }));
  } else {
    var зн = ок('div', 'ок-знак');
    зн.innerHTML = CW.значок(с.знак || 'колокол');
    зн.style.cssText = 'width:40px;height:40px;flex:0 0 40px;border-radius:50%';
    б.appendChild(зн);
  }

  var что = ок('div', 'что');
  что.innerHTML = '<b>' + CW.безопасно(с.имя) + '</b>'
                + '<p>' + CW.безопасно(с.текст) + '</p>'
                + (с.когда || с.метка
                    ? '<span class="когда">'
                      + CW.безопасно([с.метка, когда(с.когда)].filter(Boolean).join(' · '))
                      + '</span>'
                    : '');
  б.appendChild(что);

  б.onclick = function () {
    CW.вести.отметить(с.ключ);
    if (с.куда) с.куда();
  };
  return б;
}

function хвост() {
  var х = ок('div', 'ув-хвост');

  /* Фраза целиком одним ключом, а жирные слова — вставками. Прежде она
     была склеена из шести кусков, и союз «и» между ними оставался
     русским на всех языках: переводить склейку по кускам нельзя, в
     другом языке и порядок слов другой, и союза может не быть вовсе. */
  function ж(фраза) { return '<b>' + CW.безопасно(Т(фраза)) + '</b>'; }

  х.innerHTML =
      Т.с('Здесь системные события: {входы}, {движения} (награды, переводы), '
        + '{выплаты}, {подписчики} и {пределы}, которые вот-вот кончатся.',
          { входы: ж('входы в кубы'), движения: ж('движения CUBE'),
            выплаты: ж('выплаты'), подписчики: ж('новые подписчики'),
            пределы: ж('пределы ключа') })
    + '<br><br>'
    + CW.безопасно(Т('Переписки здесь нет намеренно: кто что написал, видно в чатах. '
      + 'Лайков, комментариев и ответов пока нет: сервер их не записывает. '
      + 'Как начнёт: они появятся здесь сами, отдельно делать ничего не придётся.'));
  ОКНО.тело.appendChild(х);
}

function всёПрочитано() {
  CW.вести.всёПрочитано(СОБЫТИЯ);
  показать();
  CW.сказать(Т('Отмечено прочитанным'));
}

/* ═══════════════════════════════════════════════════════════════════════
   МЕЛОЧЬ
   ═══════════════════════════════════════════════════════════════════════ */
function когда(иso) { return CW.вести.когда(иso); }

function уйти() {
  var откуда = '';
  try { откуда = sessionStorage.getItem('cw_откуда') || ''; } catch (е) {}
  var ладно = /^(feed|chats|groups|signals|market|earn|wallet|stats|refs)$/;
  CW.уйти(CW.раздел(ладно.test(откуда) ? откуда : 'feed', CW.какойКуб()));
}

function ок(тег, класс, текст) { return CW.эл(тег, класс, текст); }

});
</script>
</body>
</html>
