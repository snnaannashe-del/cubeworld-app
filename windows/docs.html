<!--
  ДОКУМЕНТЫ — окно поверх программы, со своим адресом.

      windows/docs.html        первый документ
      windows/docs.html?н=3    сразу нужный

  Их семь: соглашение, конфиденциальность, правила сообщества,
  начисления, свайп и платежи, подписка и ключи, камера и микрофон.

  ── Почему со своим адресом ───────────────────────────────────────
  На документ ссылаются: из окна подписки — на «Подписку и ключи», из
  свайпа — на «Свайп, платежи и возвраты». Ссылка должна открывать
  нужную страницу сразу, а не первую с просьбой долистать.

  ── Почему тексты лежат не здесь ──────────────────────────────────
  Они в shared/docs.js. Документ меняется не тогда же, когда окно, и
  править юридический текст должно быть можно, не трогая разметку.
-->
<style>
/* ══ ДВА СТОЛБЦА: СПИСОК И БУМАГА ═════════════════════════════════════
   Как в боевой: слева семь бумаг, справа та, что открыта. Прежде список
   выпадал меню поверх текста — окно было шириной в десять сантиметров,
   и столбцу рядом с текстом места не было. Теперь у документов своя
   ширина («широкое» в shared/window.js), и список стоит на виду: видно
   сразу, что тут есть, и переход между бумагами — одно нажатие, а не
   три.

   На узком экране столбцы складываются один под другим: сперва список,
   под ним текст. Ничего не прячется и здесь. */
.дк-два{ display:flex; align-items:stretch; min-height:0; height:100%; }

.дк-полка{
  flex:0 0 260px; min-width:0; padding:12px 10px 16px;
  border-inline-end:1px solid var(--край);
  overflow-y:auto; overscroll-behavior:contain;
  display:flex; flex-direction:column; gap:4px;
}
.дк-полка .дк-шапочка{
  padding:4px 10px 8px; font-size:0.6667rem; letter-spacing:.14em;
  text-transform:uppercase; color:var(--текст3);
}
.дк-бумага{ flex:1 1 auto; min-width:0; overflow-y:auto; overscroll-behavior:contain; }

@media (max-width:760px){
  .дк-два{ flex-direction:column; height:auto; }
  .дк-полка{
    flex:0 0 auto; border-inline-end:none; border-bottom:1px solid var(--край);
    max-height:none; overflow:visible;
  }
}

.дк-пункт{
  display:flex; align-items:center; gap:11px; width:100%;
  padding:8px 10px; border:1px solid transparent; border-radius:13px;
  cursor:pointer; background:none; color:var(--текст2); font:inherit;
  font-size:0.8667rem; text-align:start; line-height:1.3;
  transition:background .14s, border-color .14s, transform .12s;
}
.дк-пункт:hover{ background:rgba(255,255,255,.06); transform:translateX(2px); }
.дк-пункт .зн{
  flex:0 0 auto; width:30px; height:30px; border-radius:10px;
  display:flex; align-items:center; justify-content:center;
  background:rgba(255,255,255,.06); border:1px solid var(--край);
}
.дк-пункт .зн svg{ width:16px; height:16px; }
/* Выбранный — заливкой слева направо, значок в полный цвет: в списке из
   семи одинаковых строк глазу нужна одна зацепка, а не две. */
.дк-пункт.тут{
  background:linear-gradient(90deg, rgba(74,158,255,.22), rgba(74,158,255,.06));
  border-color:rgba(74,158,255,.42); color:var(--текст); font-weight:600;
}
.дк-пункт.тут .зн{
  background:var(--синий); color:#fff; border-color:transparent;
  box-shadow:0 3px 12px rgba(74,158,255,.5);
}

/* ══ САМ ТЕКСТ ════════════════════════════════════════════════════════
   Первый вид был серой простынёй: один кегль, один цвет, заголовки не
   отличались от текста. Оформление перенесено из боевой — воздух,
   синяя полоса у заголовка, врезка под сутью. */
/* Поля у окна выключены — столбцы должны доходить до краёв, — значит,
   отступы текста задаём здесь. */
.дк-страница{ padding:14px 16px 22px; }
@media (max-width:560px){ .дк-страница{ padding:12px 13px 20px; } }

.дк-текст{ font-size:0.9333rem; line-height:1.72; color:var(--текст2); }

/* Дата — не подпись внизу, а плашка сверху: читающий должен видеть, ту
   ли редакцию он читает, ДО текста, а не после. */
.дк-дата{
  display:inline-block; margin:0 0 16px; padding:4px 12px;
  font-size:0.7rem; letter-spacing:.08em; text-transform:uppercase;
  color:var(--синий); background:rgba(74,158,255,.12);
  border:1px solid rgba(74,158,255,.28); border-radius:999px;
}

/* Оговорка про перевод — рядом с датой и такой же плашкой, только
   жёлтой: это не предупреждение об опасности, но и не мелкий шрифт
   внизу, который никто не читает. Стоит ДО текста, по той же причине,
   что и дата. */
.дк-оговорка{
  margin:0 0 16px; padding:8px 12px;
  font-size:0.78rem; line-height:1.5; color:var(--текст2);
  background:rgba(255,176,32,.10);
  border:1px solid rgba(255,176,32,.30); border-radius:12px;
}

.дк-текст h3{
  position:relative; margin:24px 0 9px; padding-inline-start:12px;
  font-size:1rem; font-weight:800; color:var(--текст); letter-spacing:-.005em;
}
.дк-текст h3::before{
  content:''; position:absolute; left:0; top:3px; bottom:3px; width:3px;
  border-radius:3px; background:var(--синий);
}
.дк-текст h3:first-of-type{ margin-top:2px; }
.дк-текст p{ margin:0 0 13px; }
/* Первый абзац документа — всегда короткая суть, поэтому он врезкой. */
.дк-текст h3:first-of-type + p{
  background:rgba(74,158,255,.09); border-inline-start:3px solid var(--синий);
  border-radius:0 12px 12px 0; padding:12px 15px; margin:0 0 18px;
  color:var(--текст);
}
.дк-текст b{ color:var(--синий); font-weight:700; }
.дк-текст code{
  font-family:ui-monospace,Menlo,monospace; font-size:0.8rem;
  background:rgba(74,158,255,.14); color:var(--синий);
  border:1px solid rgba(74,158,255,.22); border-radius:7px; padding:2px 7px;
}
.дк-текст ul{ margin:0 0 13px; padding-inline-start:20px; }
.дк-текст li{ margin-bottom:6px; }
.дк-текст table{
  width:100%; border-collapse:separate; border-spacing:0; margin:6px 0 18px;
  font-size:0.8rem; border:1px solid var(--край); border-radius:13px;
  overflow:hidden;
}
.дк-текст th{
  padding:9px 12px; text-align:start; vertical-align:top;
  background:rgba(74,158,255,.16); color:var(--синий);
  font-size:0.7rem; letter-spacing:.06em; text-transform:uppercase;
  font-weight:700; border:none;
}
.дк-текст td{
  padding:9px 12px; text-align:start; vertical-align:top;
  border:none; border-bottom:1px solid var(--край);
}
.дк-текст tr:last-child td{ border-bottom:none; }
.дк-текст tr:nth-child(even) td{ background:rgba(255,255,255,.03); }
</style>
</head>
<body>

<script src="../shared/api.js?v=20261124-466"></script>
<script src="../shared/ui.js?v=20261124-466"></script>
<script src="../shared/смайлы.js?v=20261124-466"></script>
<script src="../shared/лица.js?v=20261124-466"></script>
<script src="../shared/эфир.js?v=20261124-466"></script>
<script src="../shared/icons.js?v=20261124-466"></script>
<script src="../shared/window.js?v=20261124-466"></script>
<script src="../shared/без-копий.js?v=20261124-466"></script>
<script src="../shared/time.js?v=20261124-466"></script>
<script src="../shared/auth.js?v=20261124-466"></script>
<script src="../shared/lang.js?v=20261124-466"></script>
<script src="../shared/account.js?v=20261124-466"></script>
<script src="../shared/shell.js?v=20261124-466"></script>
<script src="../shared/docs.js?v=20261124-466"></script>
<script>
'use strict';

/* Бумаги на языке везутся отдельным набором (lang/docs-en.js и дальше),
   и ждать его надо ДО первого кадра: иначе человек увидел бы русский
   текст и через полсекунды он сменился бы переводом. Набора нет —
   показываем русский, это не беда, а главный текст. */
Promise.all([
  CW.оболочка('feed'),
  (CW.довезти ? CW.довезти('docs') : Promise.resolve()).catch(function () {})
]).then(function (всё) { построить(всё[0]); });

function построить(место) {

var ЯЗ = CW.язык ? CW.язык() : 'ru';
var ДОКИ = (CW.документыНа ? CW.документыНа(ЯЗ) : CW.документы) || [];
var ОГОВОРКА = CW.документыОговорка ? CW.документыОговорка(ЯЗ) : '';
var ДАТА = CW.документыДатаНа ? CW.документыДатаНа(ЯЗ) : CW.документыДата;

/* Пришли по ссылке на документ (?н=3) — открываем сразу его. Прятать
   при этом нечего: список стоит столбцом слева и виден всегда. */
var текущий = (function () {
  var н = 0;
  try { н = parseInt(new URLSearchParams(location.search).get('н'), 10) || 0; }
  catch (е) {}
  return (н >= 0 && н < ДОКИ.length) ? н : 0;
})();

место.appendChild(ок('div', 'пусто-строка',
  Т('Документы открыты отдельным окном. Закрой его, чтобы вернуться.')));

/* Свой цвет у каждого документа. Семь строк с одинаковым синим значком
   читаются как одна; цвет — это метка, по которой нужную строку находят
   со второго раза не глядя. */
var ЦВЕТА = {
  'лист':     '#4a9eff',
  'замок':    '#a78bfa',
  'люди':     '#34d399',
  'монета':   '#ffb020',
  'обмен':    '#f472b6',
  'ключик':   '#ffd166',
  'микрофон': '#60d6ff'
};

var ОКНО = CW.стойка({
  имя: 'документы',
  знак: 'лист',
  знакЦвет: '#4a9eff',
  заголовок: Т('Документы'),
  /* Выход — крестик: документы открыты отдельным окном поверх
     программы, и отсюда именно закрывают, а не идут на шаг назад. */
  назад: уйти,
  крест: true,
  /* Два столбца, поэтому окно шире обычных десяти сантиметров.
     Единственное такое окно во всей программе. */
  широкое: true,
  поля: false
});
ОКНО.открыть();

var список = null, бумага = null;

if (!ДОКИ.length) {
  ОКНО.пусто({ знак: 'внимание', заголовок: Т('Документов нет'),
               текст: 'Файл с текстами не приехал. Обнови страницу.' });
} else {
  var два = ок('div', 'дк-два');
  список = ок('div', 'дк-полка');
  бумага = ок('div', 'дк-бумага');
  список.appendChild(ок('div', 'дк-шапочка', Т('Документы')));
  два.appendChild(список);
  два.appendChild(бумага);
  ОКНО.тело.appendChild(два);
  нарисоватьСписок();
  показать();
}

function нарисоватьСписок() {
  /* Шапочку столбца оставляем на месте, перерисовываем только строки. */
  список.innerHTML = '';
  список.appendChild(ок('div', 'дк-шапочка', Т('Документы')));
  ДОКИ.forEach(function (д, н) {
    var б = document.createElement('button');
    б.type = 'button';
    б.className = 'дк-пункт' + (н === текущий ? ' тут' : '');
    б.innerHTML = '<span class="зн">' + CW.значок(д.знак) + '</span>'
                + '<span>' + CW.безопасно(д.имя) + '</span>';
    /* Цвет значка — только у невыбранных: у выбранного плитка залита
       синим целиком, и цветной значок на ней не читался бы. */
    if (н !== текущий) {
      var з = б.querySelector('.зн');
      з.style.color = ЦВЕТА[д.знак] || 'var(--синий)';
    }
    б.onclick = function () {
      текущий = н;
      нарисоватьСписок();
      показать();
      /* Адрес меняем без перезагрузки: ссылку на документ должно быть
         можно скопировать из строки браузера. */
      try { history.replaceState(null, '', '?н=' + н); } catch (е) {}
    };
    список.appendChild(б);
  });
}

function показать() {
  var д = ДОКИ[текущий];
  /* В шапке — название открытой бумаги: в двух столбцах заголовок
     «Документы» один на оба, а что читаешь — видно подписью. */
  ОКНО.имя(Т('Документы'), д.имя);
  /* Поля у окна выключены, чтобы столбцы доходили до краёв. Значит,
     отступы текста — на нас: строка, упёртая в край окна, читается как
     обрезанная. */
  бумага.innerHTML =
      '<div class="дк-страница">'
    +   '<div class="дк-дата">' + CW.безопасно(Т('Редакция от')) + ' '
    +     CW.безопасно(ДАТА || '-') + '</div>'
    +   (ОГОВОРКА
        ? '<div class="дк-оговорка">' + CW.безопасно(ОГОВОРКА) + '</div>' : '')
    +   '<div class="дк-текст">' + разметка(д.текст) + '</div>'
    + '</div>';
  бумага.scrollTop = 0;
}

/* ═══════════════════════════════════════════════════════════════════════
   РАЗМЕТКА

   Свой разбор, а не готовая библиотека: нужны ровно пять вещей —
   заголовки, абзацы, жирное, код и таблицы. Тянуть ради них стороннюю
   сборку на сорок килобайт в окно, которое открывают раз в жизни,
   незачем.

   Всё, что приходит, сперва обезвреживается: текст документа наш, но
   правило «любой текст в разметку — только через безопасно» не знает
   исключений, иначе однажды сюда попадёт чужой.
   ═══════════════════════════════════════════════════════════════════════ */
function разметка(текст) {
  var строки = String(текст || '').split('\n');
  var куски = [], абзац = [], таблица = [], список = [];

  function закрытьАбзац() {
    if (абзац.length) { куски.push('<p>' + абзац.join(' ') + '</p>'); абзац = []; }
  }
  function закрытьСписок() {
    if (список.length) { куски.push('<ul>' + список.join('') + '</ul>'); список = []; }
  }
  function закрытьТаблицу() {
    if (!таблица.length) { return; }
    var ряды = таблица.filter(function (р) {
      /* Вторая строка таблицы — черта из дефисов, она не данные. */
      return !/^\s*\|?[\s:|-]+\|?\s*$/.test(р);
    });
    var html = '<table>';
    ряды.forEach(function (р, н) {
      var ячейки = р.replace(/^\||\|$/g, '').split('|')
                    .map(function (я) { return строкой(я.trim()); });
      var т = н === 0 ? 'th' : 'td';
      html += '<tr>' + ячейки.map(function (я) {
        return '<' + т + '>' + я + '</' + т + '>';
      }).join('') + '</tr>';
    });
    куски.push(html + '</table>');
    таблица = [];
  }
  function закрытьВсё() { закрытьАбзац(); закрытьСписок(); закрытьТаблицу(); }

  строки.forEach(function (с) {
    var ч = с.trim();
    if (!ч) { закрытьВсё(); return; }

    if (ч.charAt(0) === '|') { закрытьАбзац(); закрытьСписок(); таблица.push(ч); return; }
    закрытьТаблицу();

    if (/^#{1,6}\s/.test(ч)) {
      закрытьАбзац(); закрытьСписок();
      куски.push('<h3>' + строкой(ч.replace(/^#+\s*/, '')) + '</h3>');
      return;
    }
    if (/^[-*]\s/.test(ч)) {
      закрытьАбзац();
      список.push('<li>' + строкой(ч.replace(/^[-*]\s*/, '')) + '</li>');
      return;
    }
    закрытьСписок();
    абзац.push(строкой(ч));
  });

  закрытьВсё();
  return куски.join('');
}

function строкой(т) {
  return CW.безопасно(т)
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/`([^`]+)`/g, '<code>$1</code>');
}

/* ═══════════════════════════════════════════════════════════════════════
   ВЫХОД
   ═══════════════════════════════════════════════════════════════════════ */
function уйти() {
  var откуда = '';
  try { откуда = sessionStorage.getItem('cw_откуда') || ''; } catch (е) {}
  CW.уйти(откуда ? CW.раздел(откуда, CW.какойКуб()) : CW.раздел('world'));
}

function ок(тег, класс, текст) { return CW.эл(тег, класс, текст); }

}
</script>
