<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>Группа · CubeWorld</title>
<link rel="icon" href="../icons/favicon.svg?v=20261125-477">
<link rel="stylesheet" href="../shared/style.css?v=20261125-477">
<link rel="stylesheet" href="../shared/window.css?v=20261125-477">
<link rel="stylesheet" href="../shared/account.css?v=20261125-477">
<script src="../shared/theme.js?v=20261125-477"></script>
<link rel="stylesheet" href="../shared/shell.css?v=20261125-477">
<!--
  ПЕРЕПИСКА ГРУППЫ — окно поверх программы, со своим адресом.

      windows/group.html?id=12

  Это близнец личной переписки. По правилу проекта внутри они почти
  одинаковые: сверху название с кнопками, посередине лента пузырей,
  снизу поле ввода. Разного ровно три вещи:

      1. над пузырём чужого видно, кто написал — в личной это лишнее;
      2. файл уходит в /groups/{id}/media, который сам заводит
         сообщение, а не через общую загрузку;
      3. срок жизни сообщения у групп зовётся expire_seconds,
         а у личной переписки expires_secs. Это сервер, и спорить
         с ним здесь не место.

  Всё остальное — общее (shared/chat.js и shared/window.js).
-->
</head>
<body>

<script src="../shared/api.js?v=20261125-477"></script>
<script src="../shared/ui.js?v=20261125-477"></script>
<script src="../shared/смайлы.js?v=20261125-477"></script>
<script src="../shared/лица.js?v=20261125-477"></script>
<script src="../shared/эфир.js?v=20261125-477"></script>
<script src="../shared/icons.js?v=20261125-477"></script>
<script src="../shared/window.js?v=20261125-477"></script>
<script src="../shared/без-копий.js?v=20261125-477"></script>
<script src="../shared/time.js?v=20261125-477"></script>
<script src="../shared/auth.js?v=20261125-477"></script>
<script src="../shared/lang.js?v=20261125-477"></script>
<script src="../shared/account.js?v=20261125-477"></script>
<script src="../shared/shell.js?v=20261125-477"></script>
<script src="../shared/вложения.js?v=20261125-477"></script>
<script src="../shared/запись-голоса.js?v=20261125-477"></script>
<script src="../shared/кнопки-сообщения.js?v=20261125-477"></script>
<script src="../shared/кадр-ролика.js?v=20261125-477"></script>
<script src="../shared/chat.js?v=20261125-477"></script>
<script>
'use strict';

CW.оболочка('groups').then(function (место) {

var ИД = (function () {
  var н = null;
  /* Имя в адресе по-английски. Русское «?ид=» читаем тоже: такие
     ссылки на группы уже разосланы, и ломать их нельзя. */
  try {
    var вп = new URLSearchParams(location.search);
    н = вп.get('id') || вп.get('ид');
  } catch (е) {}
  return н ? parseInt(н, 10) : null;
})();

место.appendChild(ок('div', 'пусто-строка',
  Т('Группа открыта отдельным окном. Закрой его, чтобы вернуться к списку.')));

if (!ИД) {
  CW.сказать(Т('Не указано, какая группа'));
  CW.уйти(CW.раздел('groups', CW.какойКуб()));
  return;
}

var ГРУППА = { id: ИД, name: '', icon: '👥', member_count: 0 };

/* Последние скачанные сообщения держим здесь: окно «Информация о
   группе» считает по ним общие файлы переписки, и ходить за ними на
   сервер второй раз незачем. */
var ПОСЛЕДНИЕ = [];

var П = CW.перепискаОкно({
  имя: 'группа',
  память: { ид: ИД },
  кружок: { группа: ИД, значок: '👥' },
  заголовок: Т('Группа'),
  подзаголовок: '',
  назад: вСписок,
  крест: true,          /* как в личке: крестик закрывает открытое */
  меню: меню,
  подпись: Т('Сообщение…'),

  читать: function () {
    return CW.спросить('/groups/' + ИД + '/messages', { сроком: 20000 })
      .then(function (д) {
        ПОСЛЕДНИЕ = Array.isArray(д) ? д : ((д && (д.messages || д.items)) || []);
        return д;
      });
  },

  /* Групповые сообщения сервер рассылает в отдельный сокет группы;
     ради него пришлось бы держать второе соединение на каждое окно.
     Поэтому здесь — переспрос раз в восемь секунд, и только пока окно
     видно. */
  живо: { тип: 'переспрос', каждые: 8000 },

  пузырь: function (м, я) {
    var своё = Number(м.user_id || м.from_user_id) === Number(я);
    /* В группе сервер хранит только content и msg_type: имени и размера
       файла у него для групповых сообщений нет вовсе. Поэтому адрес —
       из content, а имя — из адреса. */
    var вид = м.msg_type && м.msg_type !== 'text' ? м.msg_type : '';
    /* Кнопки под сообщением лежат его последней строкой: снимаем их
       прежде, чем взять текст или адрес файла. Разбор один на всю
       программу (shared/кнопки-сообщения.js). */
    var раз = CW.кнопкиСообщения.разобрать(м.content || '');
    /* Привью ролика едет своей служебной строкой, следом за адресом
       (shared/кадр-ролика.js): снимаем её так же, как кнопки. */
    var рам = CW.кадрРолика.разобрать(раз.текст);
    var адрес = вид && вид !== 'geo' && вид !== 'call'
      ? (м.file_url || рам.текст || '') : '';
    return {
      своё: своё,
      кадр: рам.кадр,
      кнопки: раз.кнопки,
      вряд: раз.вряд,
      цвет: раз.цвет,
      /* Над чужим пузырём — имя. В группе без него не понять, кто
         говорит, а в личной переписке оно было бы шумом. */
      кто: своё ? '' : CW.имяЧеловека(м),
      /* Номер говорящего нужен ленте: по нему она решает, писать ли
         имя над пузырём. Подряд идущие сообщения одного человека
         получают имя один раз (shared/chat.js, именаПодряд). По
         имени так не сложишь: тёзки в группе - обычное дело. */
      автор: м.user_id || м.from_user_id || '',
      вид: вид,
      адрес: адрес,
      /* Строку «call:…» и «geo:…» пузырь разбирает сам и показывает
         карточкой. Пока звонок сюда не попадал, карточка в группе
         выходила пустой: без времени разговора и всегда со значком
         микрофона, даже если звонок был видео. */
      текст: вид ? ((вид === 'geo' || вид === 'call') ? рам.текст : '') : рам.текст,
      когда: CW.часы(м.created_at),
      метка: Date.parse(м.created_at) || 0,
      /* Метка «изменено» в группе была потеряна: сервер её отдаёт
         (поле edited), а пузырь про неё не спрашивали. В личке она
         стояла, в группе нет — одно и то же сообщение выглядело
         по-разному в двух окнах. */
      правлено: !!м.edited,
      /* В группе галочка одна и означает «дошло до сервера». Второй
         быть не может: кто из участников прочитал, сервер не считает,
         и рисовать «прочитано» было бы выдумкой. */
      статус: своё ? 'доставлено' : '',
      срок: м.expires_at ? CW.остаток(м.expires_at) : '',
      истекает: м.expires_at || '',
      файл: (вид === 'file' || (!вид && м.file_name))
        ? { имя: м.file_name || имяИзАдреса(адрес), размер: м.file_size, адрес: адрес }
        : null,
      ид: м.id,
      закреплён: закреплено(м.id),
      /* То же меню, что в личной переписке: список действий у
         сообщения в программе один. */
      меню: function (x, y) { менюСообщения(м, своё, x, y); }
    };
  },

  слать: function (тело) {
    if (тело.expires_secs) {
      тело.expire_seconds = тело.expires_secs;
      delete тело.expires_secs;
    }
    return CW.спросить('/groups/' + ИД + '/messages', {
      способ: 'POST', тело: тело, сроком: 25000
    });
  },

  /* ── ВЛОЖЕНИЕ В ГРУППУ ──
     Байты кладём общей загрузкой и отправляем сообщение с адресом —
     так же, как в личной переписке.

     Прежде файл уходил в /groups/{ид}/media. Это НЕ переписка: это
     витрина группы — снимки для её карточки, и класть туда разрешено
     только владельцу. У всех остальных скрепка молча отвечала «403»,
     а у владельца файл ложился в витрину и в переписке не появлялся
     вовсе. Сообщения из этого не выходило ни у кого. */
  вложением: function (о) {
    /* «хвост» — кнопки, ждавшие у поля ввода: к файлу их тоже можно
       приложить, и едут они последней строкой того же content.
       «кадр» — привью ролика, снятое при отправке: встаёт между
       адресом и кнопками, потому что кнопки ищут себя последними. */
    var тело = { content: CW.кадрРолика.вшить(о.адрес, о.кадр) + (о.хвост || ''),
                 msg_type: о.тип };
    /* Срок у группы зовётся expire_seconds — так его назвал сервер.
       Кнопка «∞» в ряду ввода одна и та же для текста и вложения. */
    if (о.срок) тело.expire_seconds = о.срок;
    return CW.спросить('/groups/' + ИД + '/messages', {
      способ: 'POST', сроком: 25000, тело: тело
    });
  }
});

П.обновить();
узнатьГруппу();

/* ═══════════════════════════════════════════════════════════════════════
   МЕНЮ ОДНОГО СООБЩЕНИЯ

   Собирает его общий файл (shared/меню-сообщения.js) — тот же, что в
   личной переписке. Здесь только то, чем действия отличаются в
   группе: свои запросы правки и удаления.

   Правка у сервера групповых сообщений принимает ТОЛЬКО content: поля
   подписи под снимком у него для групп нет. Поэтому у вложения в
   группе правится сам адрес — то есть менять там пока нечего, и
   «Изменить» показываем только у текстовых сообщений.
   ═══════════════════════════════════════════════════════════════════════ */
var КЛЮЧ_БУЛАВОК = 'cw-закреплено-гр-' + ИД;

function булавки() {
  try { return JSON.parse(localStorage.getItem(КЛЮЧ_БУЛАВОК) || '[]') || []; }
  catch (е) { return []; }
}
function закреплено(ид) { return булавки().indexOf(Number(ид)) >= 0; }
function закрепить(ид, надо) {
  var сп = булавки().filter(function (х) { return х !== Number(ид); });
  if (надо) сп.push(Number(ид));
  try { localStorage.setItem(КЛЮЧ_БУЛАВОК, JSON.stringify(сп.slice(-50))); } catch (е) {}
  CW.сказать(Т(надо ? 'Закреплено' : 'Откреплено'), 1800);
  П.обновить();
}

function менюСообщения(м, своё, x, y) {
  CW.нужен('shared/меню-сообщения.js').then(function () {
    var вид = м.msg_type && м.msg_type !== 'text' ? м.msg_type : '';
    var раз = CW.кнопкиСообщения.разобрать(м.content || '');
    var рам = CW.кадрРолика.разобрать(раз.текст);
    var адрес = вид && вид !== 'geo' && вид !== 'call'
      ? (м.file_url || рам.текст || '') : '';
    var имя = м.file_name || (адрес ? имяИзАдреса(адрес) : '');
    var род = CW.родСообщения(вид, имя, адрес);
    /* У звонка «скопировать» должно давать человеческие слова, а не
       служебную строку «call:аудио:состоялся:6». */
    var текст = вид === 'call' ? CW.звонокСловами(рам.текст, своё).строкой
              : (вид ? '' : рам.текст);
    /* Правка пересобирает content заново, и привью обязано остаться:
       иначе первое же «Изменить» стирало бы кадр ролика. */
    function основой(что) { return CW.кадрРолика.вшить(что, рам.кадр); }

    CW.менюСообщения({
      род: род, своё: своё, текст: текст,
      адрес: адрес, имя: имя, размер: Number(м.file_size) || 0,
      когда: CW.когдаСловами(м.created_at) + (м.edited ? (' · ' + Т('изменено')) : ''),
      закреплено: закреплено(м.id),
      действия: {
        ответить: function (т) { ответитьНа(м, т); },
        скопировать: function () { CW.вбуфер(текст || адрес || '', Т('Скопировано')); },
        /* Правка не трогает кнопки: сняли перед показом, пришили
           обратно при сохранении. */
        изменить: (своё && !вид) ? function (новый) {
          return CW.спросить('/groups/' + ИД + '/messages/' + м.id, {
            способ: 'PUT',
            тело: { content: CW.кнопкиСообщения.вшить(новый, раз.набор) }
          }).then(function () { П.обновить(); });
        } : null,
        /* Правка самих кнопок. У вложения в группе тоже работает:
           правится не подпись, а ряд кнопок под ним. */
        кнопки: своё ? {
          набор: раз.кнопки, вряд: раз.вряд, цвет: раз.цвет,
          сохранить: function (сп, вряд, цвет) {
            var основа = вид ? основой(адрес) : текст;
            return CW.спросить('/groups/' + ИД + '/messages/' + м.id, {
              способ: 'PUT',
              тело: { content: CW.кнопкиСообщения.вшить(основа, сп, вряд, цвет) }
            }).then(function () { П.обновить(); });
          }
        } : null,
        сохранить: адрес ? function () { CW.сохранитьФайл(адрес, имя); } : null,
        /* Заменить один файл в пачке, не трогая остальные. В группе
           сервер хранит адрес в самом content, поэтому правка - та же
           правка текста, только текстом едет новый адрес. */
        заменить: (своё && адрес) ? function (берём) {
          CW.нужен('shared/вложения.js').then(function () {
            return CW.вложения.заменить({ берём: берём, положить: function (о) {
              return CW.спросить('/groups/' + ИД + '/messages/' + м.id, {
                способ: 'PUT',
                /* Кадр берём новый, от нового файла. */
                тело: { content: CW.кнопкиСообщения.вшить(
                          CW.кадрРолика.вшить(о.адрес, о.кадр), раз.набор) }
              });
            } });
          }).then(function (вышло) { if (вышло) П.обновить(); });
        } : null,
        закрепить: function (надо) { закрепить(м.id, надо); },
        переслать: function () {
          CW.открыть('forward', адрес
            ? { адрес: адрес, вид: вид || 'file', имя: имя, текст: текст }
            : { текст: текст });
        },
        удалить: своё ? function () { удалитьСообщение(м); } : null,
        выбрать: function () { начатьВыбор(м.id); }
      }
    }, x, y);
  }).catch(function () { CW.сказать(Т('Меню не приехало')); });
}

/* ── ВЫБРАТЬ НЕСКОЛЬКО ──
   Пункт «Выбрать» в меню сообщения был, а самого выбора в группе не
   было: строка звала функцию, которой здесь нет, и нажатие кончалось
   ошибкой в тишине. В личной переписке и в избранном он работал.

   Сам выбор — общий файл (shared/выбор-сообщений.js), тот же. Здесь
   только то, что делать с отмеченными В ГРУППЕ: взять их текст,
   переслать по одному и удалить. */
function начатьВыбор(первый) {
  CW.нужен('shared/выбор-сообщений.js').then(function () {
    CW.выборСообщений.начать({
      лента: П.лента,
      куда: П.окно,
      первый: первый,
      текстом: function (ид) {
        var м = найти(ид);
        if (!м) return '';
        return (м.msg_type && м.msg_type !== 'text')
          ? (м.file_name || '')
          : CW.кнопкиСообщения.без(м.content || '');
      },
      переслать: function (сп) {
        var строки = сп.map(function (ид) {
          var м = найти(ид);
          if (!м) return '';
          var чисто = CW.кнопкиСообщения.без(м.content || '');
          return (м.msg_type && м.msg_type !== 'text')
            ? (м.file_url || чисто) : чисто;
        }).filter(Boolean);
        CW.открыть('forward', { текст: строки.join('\n') });
      },
      /* Удалить в группе можно только своё: чужое сообщение сервер не
         отдаст (403), и отмеченное чужое мы молча пропускаем. */
      удалить: function (сп) {
        var я = (CW.ясныйЯ() || {}).id;
        var мои = сп.filter(function (ид) {
          var м = найти(ид);
          return м && Number(м.user_id || м.from_user_id) === Number(я);
        });
        if (!мои.length) {
          CW.сказать(Т('Удалять можно только свои сообщения'));
          return Promise.resolve();
        }
        if (мои.length < сп.length) {
          CW.сказать(Т('Чужие сообщения оставлены: их удаляет автор'), 3000);
        }
        return Promise.all(мои.map(function (ид) {
          return CW.спросить('/groups/' + ИД + '/messages/' + ид,
                             { способ: 'DELETE', тихо: true });
        })).then(function () { П.обновить(); });
      }
    });
  }).catch(function () { CW.сказать(Т('Выбор не приехал')); });
}

/* Сообщение по номеру — из последнего ответа сервера. */
function найти(ид) {
  for (var i = 0; i < ПОСЛЕДНИЕ.length; i++) {
    if (String(ПОСЛЕДНИЕ[i].id) === String(ид)) return ПОСЛЕДНИЕ[i];
  }
  return null;
}

function ответитьНа(м, текст) {
  var поле = П.ввод && П.ввод.поле;
  if (!поле) return;
  var кто = CW.имяЧеловека(м);
  var кусок = (текст || '').split('\n')[0].slice(0, 120);
  поле.value = '> ' + (кто ? кто + ': ' : '') + кусок + '\n' + поле.value;
  поле.focus();
  try { поле.setSelectionRange(поле.value.length, поле.value.length); } catch (е) {}
}

function удалитьСообщение(м) {
  CW.открыть('delete', {
    заголовок: Т('Удалить сообщение?'),
    что: CW.кнопкиСообщения.без(м.content || '').slice(0, 60),
    кнопка: Т('Удалить'),
    сказать: Т('Сообщение удалено'),
    ещё: Т('Уйдёт у всех в группе.'),
    делать: function () {
      return CW.спросить('/groups/' + ИД + '/messages/' + м.id, { способ: 'DELETE' })
        .then(function () { П.обновить(); });
    }
  });
}

/* ═══════════════════════════════════════════════════════════════════════
   ЧТО ЭТО ЗА ГРУППА
   ═══════════════════════════════════════════════════════════════════════ */
function узнатьГруппу() {
  CW.спросить('/groups/' + ИД + '/info', { тихо: true }).then(function (г) {
    if (!г) return;
    ГРУППА = г;
    если_не_участник(г);
    П.шапку({
      кружок: { группа: ИД, значок: г.icon || '👥' },
      заголовок: г.name || Т.с('Группа #{н}', { н: ИД }),
      подзаголовок: Number(г.member_count || 0) + ' ' + склонение(Number(г.member_count || 0)),
      назад: вСписок,
      крест: true
      /* Своих кнопок у группы нет ни одной: ряд — лупа, три точки и
         выход — ставит само окно переписки, и он одинаков у лички, у
         групп и у избранного. Кнопка «Участники» отсюда убрана: к тем
         же участникам ведёт пункт «Информация о группе» в меню, а две
         дороги к одному окну — это лишний значок в шапке. */
    });
  }).catch(function () { /* нет ответа — шапка остаётся как есть */ });
}

/* ── ПРИШЛА ПО ССЫЛКЕ ──────────────────────────────────────────────────
   Ссылку на группу дают из окна «Информация о группе», и открывает её
   человек, которого в группе ещё нет. Сервер его сюда пускает смотреть,
   но первое же сообщение отлетело бы с отказом. Поэтому спрашиваем
   прямо: войти? В приватную группу сервер не пустит, и это он скажет
   сам — выдумывать за него причину мы не станем. */
var СПРАШИВАЛИ = false;
function если_не_участник(г) {
  if (г.is_member || СПРАШИВАЛИ) return;
  СПРАШИВАЛИ = true;
  CW.лист([
    { заголовок: Т.с('Войти в «{имя}»?', { имя: г.name || Т('группу') }) },
    { зн: CW.значок('люди', 16), подпись: Т('Войти'), делать: function () {
        CW.спросить('/groups/' + ИД + '/join', { способ: 'POST', сроком: 20000 })
          .then(function () {
            CW.сказать(Т('Ты в группе'));
            ГРУППА.is_member = 1;
            П.обновить();
            узнатьГруппу();
          })
          .catch(function (е) {
            CW.сказать((е && е.message) || Т('Не вышло войти'));
          });
      } },
    { зн: CW.значок('назад', 16), подпись: Т('Только посмотреть') }
  ]);
}

/* ═══════════════════════════════════════════════════════════════════════
   ВЫХОД И МЕНЮ
   ═══════════════════════════════════════════════════════════════════════ */
function вСписок() { CW.уйти(CW.раздел('groups', CW.какойКуб())); }

/* Меню группы: два звонка, сведения о группе и выход. «Очистить
   переписку» убрано по просьбе — это была кнопка, стирающая сообщения
   у всех разом, и стояла она в одном касании от «Видеозвонка».

   «Выйти из группы» оставлено, хотя в боевой его в этом меню нет:
   другой дороги из группы у нас попросту не существует, и убрать пункт
   значило бы запереть человека внутри. Тот же выход есть и в окне
   «Информация о группе», внизу. */
function меню(е, кнопка) {
  CW.лист([
    { зн: CW.значок('микрофон', 16), подпись: Т('Аудиозвонок группе'),
      делать: function () { звонокГруппе(false); } },
    { зн: CW.значок('камера', 16), подпись: Т('Видеозвонок группе'),
      делать: function () { звонокГруппе(true); } },
    { зн: CW.значок('внимание', 16), подпись: Т('Информация о группе'), делать: function () {
        /* Одно окно на всё про группу: описание, ссылка-приглашение,
           теги, снимки, файлы переписки и участники. Прежде отсюда
           открывался голый список имён. */
        CW.открыть('group-info', {
          группа: ИД, сообщения: ПОСЛЕДНИЕ, ушла: вСписок
        });
      } },
    /* Те же два пункта, что в личной переписке и в избранном: всё
       про кнопки знает общий файл (shared/кнопки-сообщения.js). */
    { зн: CW.значок('кнопка', 16), подпись: Т('Добавить кнопку'),
      делать: function () { CW.кнопкиСообщения.добавить({ одна: true, ввод: П.ввод }); } },
    { зн: CW.значок('клетки', 16), подпись: Т('Добавить ряд кнопок'),
      делать: function () { CW.кнопкиСообщения.добавить({ ввод: П.ввод }); } },
    { зн: CW.значок('выйти', 16), подпись: Т('Выйти из группы'),
      опасная: true, делать: спроситьВыход }
  ], кнопка ? { узел: кнопка } : null);
}

/* ── ЗВОНОК ГРУППЕ ──
   Открываем то же окно звонка, что и для личного, но с номером группы:
   оно само спросит у сервера состав и позовёт всех, кроме себя.

   Каждый соединяется с каждым, поэтому дальше шести человек разговор
   не зовут: на седьмом браузеру надо держать шесть встречных потоков,
   и звук начинает рваться у всех сразу. Это сказано и в shared/звонки.js,
   где стоит сам предел. */
function звонокГруппе(видео) {
  CW.уйти(CW.окно(видео ? 'call-video' : 'call') + '?group=' + ИД);
}

/* Очистки переписки здесь больше нет совсем: ни пункта в меню, ни
   запроса. Сервер стирать по-прежнему умеет (DELETE
   /groups/{ид}/messages?both=1), но из программы это не позвать — и
   случайно тоже. */

function спроситьВыход() {
  CW.лист([
    { заголовок: Т.с('Выйти из «{имя}»?', { имя: ГРУППА.name || Т('группы') }) },
    { зн: CW.значок('выйти', 16), подпись: Т('Выйти'), опасная: true, делать: function () {
        CW.спросить('/groups/' + ИД + '/leave', { способ: 'POST' })
          .then(function () { CW.сказать(Т('Вышла из группы')); вСписок(); })
          .catch(function (е) { CW.сказать((е && е.message) || Т('Не вышло')); });
      } },
    { зн: CW.значок('назад', 16), подпись: Т('Остаться') }
  ]);
}

/* ═══════════════════════════════════════════════════════════════════════
   МЕЛОЧЬ
   ═══════════════════════════════════════════════════════════════════════ */
function склонение(н) {
  return CW.склонение(н, 'участник', 'участника', 'участников');
}

/* Имя файла, когда сервер его не сохранил: берём из адреса. */
function имяИзАдреса(адрес) {
  var с = String(адрес || '').split('?')[0].split('/');
  return с[с.length - 1] || 'файл';
}

function ок(тег, класс, текст) { return CW.эл(тег, класс, текст); }

});
</script>
