<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Переписка · CubeWorld</title>
<link rel="icon" href="../icons/favicon.svg?v=20261123-372">
<link rel="stylesheet" href="../shared/style.css?v=20261123-372">
<link rel="stylesheet" href="../shared/window.css?v=20261123-372">
<link rel="stylesheet" href="../shared/account.css?v=20261123-372">
<script src="../shared/theme.js?v=20261123-372"></script>
<link rel="stylesheet" href="../shared/shell.css?v=20261123-372">
<!--
  ЛИЧНАЯ ПЕРЕПИСКА — окно поверх программы, со своим адресом.

      windows/dm.html?кто=7

  Почему у переписки свой адрес, а не «левая колонка в чатах». Человек
  сворачивает разговор, уходит в ленту, возвращается — и должен попасть
  в тот же разговор, а не в список. Со своим адресом это само собой:
  перезагрузка, кнопка «назад» браузера и ссылка из другого места ведут
  ровно сюда. Внутри страницы такое пришлось бы хранить и чинить руками.

  Своего кода здесь мало, и это нарочно. Лента пузырей, поле ввода,
  «скрыть через», смайлы, голос и файлы — общие с группой и избранным
  (shared/chat.js), шапка, ширина 10 см и выход — общие со всеми окнами
  (shared/window.js). Здесь остаётся одно: КТО собеседник и КУДА
  уходит сообщение.
-->
</head>
<body>

<script src="../shared/api.js?v=20261123-372"></script>
<script src="../shared/ui.js?v=20261123-372"></script>
<script src="../shared/смайлы.js?v=20261123-372"></script>
<script src="../shared/лица.js?v=20261123-372"></script>
<script src="../shared/эфир.js?v=20261123-372"></script>
<script src="../shared/icons.js?v=20261123-372"></script>
<script src="../shared/window.js?v=20261123-372"></script>
<script src="../shared/без-копий.js?v=20261123-372"></script>
<script src="../shared/time.js?v=20261123-372"></script>
<script src="../shared/auth.js?v=20261123-372"></script>
<script src="../shared/account.js?v=20261123-372"></script>
<script src="../shared/shell.js?v=20261123-372"></script>
<script src="../shared/вложения.js?v=20261123-372"></script>
<script src="../shared/кнопки-сообщения.js?v=20261123-372"></script>
<script src="../shared/chat.js?v=20261123-372"></script>
<script>
'use strict';

CW.оболочка('chats').then(function (место) {

var КТО = (function () {
  var н = null;
  try { н = new URLSearchParams(location.search).get('кто'); } catch (е) {}
  return н ? parseInt(н, 10) : null;
})();

var ИМЯ = (function () {
  var и = '';
  try { и = new URLSearchParams(location.search).get('имя') || ''; } catch (е) {}
  return и;
})();

место.appendChild(ок('div', 'пусто-строка',
  'Переписка открыта отдельным окном. Закрой его, чтобы вернуться к списку.'));

if (!КТО) {
  /* Без собеседника окна нет. Молча показать пустоту — значит оставить
     человека гадать; уводим обратно в список и говорим почему. */
  CW.сказать('Не указано, с кем переписка');
  CW.уйти(CW.раздел('chats', CW.какойКуб()));
  return;
}

var СОБЕСЕДНИК = { peer_id: КТО, display_name: ИМЯ, avatar_url: '' };

var П = CW.перепискаОкно({
  имя: 'переписка',
  память: { кто: КТО },
  кружок: { кто: КТО, значок: '👤' },
  заголовок: ИМЯ || ('#' + КТО),
  подзаголовок: '',
  /* Лицо, имя и ник в шапке ведут в портфолио собеседника: это первое,
     куда человек тянется, когда хочет понять, с кем говорит. */
  нажатие: вПортфолио,
  назад: вСписок,
  /* Выход крестиком, а не стрелкой: переписка открыта поверх списка, и
     крестик честнее — он закрывает то, что открыто. Уводит он туда же,
     куда уводила бы стрелка, — в список чатов. */
  крест: true,
  меню: меню,
  подпись: 'Сообщение…',

  читать: function () {
    return CW.спросить('/dm/' + КТО, { сроком: 20000 }).then(function (д) {
      /* Держим последний ответ при себе: выбор нескольких ищет в нём
         сообщение по номеру, а второй раз спрашивать сервер ради
         этого незачем. */
      ПОСЛЕДНИЕ_ДМ = Array.isArray(д) ? д : ((д && (д.messages || д.items)) || []);
      return д;
    });
  },

  /* Сообщения собеседника появляются сами: сервер шлёт их в общий
     сокет, и ждать перезагрузки не надо. */
  живо: { тип: 'dm', кто: КТО },

  пузырь: function (м, я) {
    /* Адрес вложения лежит в САМОМ сообщении: сервер хранит его в
       content и отдельного поля file_url в ответе не отдаёт — он есть
       только в живом известии по сокету. Отсюда и брали, и поэтому
       снимок в переписке открыть было нельзя: адрес приходил пустым. */
    var вид = м.msg_type && м.msg_type !== 'text' ? м.msg_type : '';
    /* ── КНОПКИ ПОД СООБЩЕНИЕМ ──
       Они лежат последней строкой самого сообщения, и снять их надо
       ДО того, как из него возьмут текст или адрес файла
       (shared/кнопки-сообщения.js). Иначе человек увидит служебную
       строку, а снимок не откроется: в адрес попадёт лишнее. */
    var раз = CW.кнопкиСообщения.разобрать(м.content || '');
    var адрес = вид && вид !== 'geo' ? адресомФайла(раз.текст, м.file_url) : '';
    return {
      своё: Number(м.from_user_id) === Number(я),
      вид: вид,
      адрес: адрес,
      кнопки: раз.кнопки,
      вряд: раз.вряд,
      цвет: раз.цвет,
      /* Строку «call:…» и «geo:…» пузырь разбирает сам: это не текст
         сообщения, а его содержимое, и показывает он их карточкой. */
      текст: (вид === 'geo' || вид === 'call') ? раз.текст
            : (вид ? '' : раз.текст),
      когда: CW.часы(м.created_at),
      /* Точное время нужно кучке: по нему она решает, ушли эти
         вложения одной пачкой или человек слал их по одному.
         Минуты для этого мало (shared/chat.js, CW.кучками). */
      метка: Date.parse(м.created_at) || 0,
      правлено: !!м.edited,
      /* Галочки у своих: одна — доставлено, две — прочитано. Поле
         read_at сервер ставит, когда собеседник открыл переписку. */
      статус: (Number(м.from_user_id) === Number(я))
        ? (м.read_at ? 'прочитано' : 'доставлено') : '',
      /* Только остаток, без слов: «4м» рядом с часами говорит всё,
         а «исчезнет через 4м» отдельной строкой занимало строку. */
      срок: м.expires_at ? CW.остаток(м.expires_at) : '',
      /* Точное время нужно часовому: он уберёт пузырь сам, когда срок
         выйдет, не дожидаясь перезахода в переписку. */
      истекает: м.expires_at || '',
      /* Строкой-файлом показываем только то, что не показать иначе. */
      файл: (вид === 'file' || (!вид && м.file_name))
        ? { имя: м.file_name || имяИзАдреса(адрес), размер: м.file_size, адрес: адрес }
        : null,
      ид: м.id,
      закреплён: закреплено(м.id),
      /* Долгое нажатие и правая кнопка открывают меню сообщения. Оно
         одно на всю программу (shared/меню-сообщения.js): и в чатах, и
         в группах список действий обязан быть один. */
      меню: function (x, y) { менюСообщения(м, Number(м.from_user_id) === Number(я), x, y); }
    };
  },

  слать: function (тело) {
    return CW.спросить('/dm/' + КТО, { способ: 'POST', тело: тело, сроком: 25000 });
  },

  /* Любое вложение: снимок, ролик, голос, кружок, файл. Байты уже
     лежат в хранилище, сюда приходит адрес. */
  вложением: function (о) {
    return CW.спросить('/dm/' + КТО, {
      способ: 'POST', сроком: 25000,
      /* file_size на сервере объявлен строкой — числом он отвечает 422.
         Это его правило, и спорить с ним здесь не место.

         «хвост» — кнопки, которые ждали у поля ввода: к файлу их тоже
         можно прикладывать, и едут они той же последней строкой. */
      тело: { content: о.адрес + (о.хвост || ''), msg_type: о.тип,
              file_name: о.имя, file_size: String(о.размер || 0),
              file_url: о.адрес, duration: о.длительность || null,
              /* Срок, выбранный кнопкой «∞», относится и к вложению. */
              expires_secs: о.срок || null }
    });
  }
});

П.обновить();
узнатьКто();

/* Портфолио собеседника — отдельное окно со своим адресом, и номер
   человека в нём обязателен: без него оно откроется моим. */
function вПортфолио() {
  /* Помощник запоминает, что мы были в ЭТОЙ переписке: крестик в
     портфолио вернёт сюда, а не в общий список чатов. */
  CW.вПортфолио(КТО);
}

/* ═══════════════════════════════════════════════════════════════════════
   КТО СОБЕСЕДНИК

   Имя и лицо приходят в адресе из списка переписок — чтобы окно встало
   с именем сразу, без мигания «#7». Но по прямой ссылке их нет, да и
   человек мог сменить снимок. Поэтому спрашиваем сервер и тихо
   поправляем шапку, когда ответ придёт.
   ═══════════════════════════════════════════════════════════════════════ */
function узнатьКто() {
  CW.спросить('/users/' + КТО, { тихо: true }).then(function (ч) {
    if (!ч) return;
    СОБЕСЕДНИК = {
      peer_id: КТО,
      display_name: ч.display_name || ч.username || '',
      avatar_url: ч.avatar_url || ''
    };
    П.шапку({
      кружок: { кто: КТО, снимок: СОБЕСЕДНИК.avatar_url, значок: '👤' },
      заголовок: CW.имяЧеловека(СОБЕСЕДНИК) || ('Участник #' + КТО),
      подзаголовок: ч.username ? '@' + ч.username : ('UID · ' + (ч.uid || КТО)),
      нажатие: вПортфолио,
      назад: вСписок,
      крест: true
      /* Кнопок здесь не перечисляем нарочно. Лупу, три точки и выход
         ставит само окно переписки — они одинаковы у лички и у групп.
         Перечислить их тут значило бы завести вторую копию ряда,
         которая однажды разойдётся с первой. */
    });
  }).catch(function () { /* нет ответа — остаётся то, что было в адресе */ });
}

/* ═══════════════════════════════════════════════════════════════════════
   ВЫХОД И МЕНЮ
   ═══════════════════════════════════════════════════════════════════════ */
function вСписок() { CW.уйти(CW.раздел('chats', CW.какойКуб())); }

/* Меню — как в боевой: два звонка и очистка, больше ничего. Профиль
   собеседника открывается не отсюда: на него ведёт его лицо в списке
   чатов, и второй дороги к одному и тому же окну заводить незачем.
   «Обновить» убрано тоже: лента обновляется сама после каждой
   отправки, а кнопка «обновить» в живой переписке — это признание,
   что она не живая. */
function меню(е, кнопка) {
  CW.лист([
    { зн: CW.значок('микрофон', 16), подпись: 'Аудиозвонок', делать: function () {
        CW.уйти(CW.окно('call') + '?кто=' + КТО);
      } },
    { зн: CW.значок('камера', 16), подпись: 'Видеозвонок', делать: function () {
        CW.уйти(CW.окно('call-video') + '?кто=' + КТО);
      } },
    /* ── ДВА ПУНКТА ПРО КНОПКИ ──
       Всё про них знает общий файл (shared/кнопки-сообщения.js): он
       собирает, кладёт в полку над вводом и отправляет со следующим
       сообщением. Тот же пункт стоит в группах и в избранном. */
    { зн: CW.значок('кнопка', 16), подпись: 'Добавить кнопку',
      делать: function () { CW.кнопкиСообщения.добавить({ одна: true, ввод: П.ввод }); } },
    { зн: CW.значок('клетки', 16), подпись: 'Добавить ряд кнопок',
      делать: function () { CW.кнопкиСообщения.добавить({ ввод: П.ввод }); } },
    { зн: CW.значок('урна', 16), подпись: 'Очистить переписку',
      опасная: true, делать: спроситьОчистку }
  ], кнопка ? { узел: кнопка } : null);
}

/* Сервер умеет очистить переписку у себя (both=0) и у обоих (both=1).
   Берём «у себя»: стирать написанное у другого человека — не наше
   право, и в боевой этот пункт делает то же самое. */
function спроситьОчистку() {
  CW.лист([
    { заголовок: 'Очистить переписку у себя?' },
    { зн: CW.значок('урна', 16), подпись: 'Очистить', опасная: true,
      делать: function () {
        CW.спросить('/dm/conversation/' + КТО, { способ: 'DELETE' })
          .then(function () { CW.сказать('Переписка очищена'); П.обновить(); })
          .catch(function (е) { CW.сказать((е && е.message) || 'Не вышло очистить'); });
      } },
    { зн: CW.значок('назад', 16), подпись: 'Оставить' }
  ]);
}

/* ═══════════════════════════════════════════════════════════════════════
   МЕНЮ ОДНОГО СООБЩЕНИЯ

   Само меню собирает общий файл: он знает, какие действия у снимка,
   какие у голосового и какие у звонка. Здесь мы только говорим, ЧТО
   делает каждое действие в личной переписке.

   Закрепление пока живёт в этом браузере: у сервера поля «закреплено»
   у личного сообщения нет, и врать, будто собеседник тоже увидит
   булавку, нельзя. Появится поле — сюда придёт один запрос вместо
   записи в память.
   ═══════════════════════════════════════════════════════════════════════ */
var КЛЮЧ_БУЛАВОК = 'cw-закреплено-дм-' + КТО;

function булавки() {
  try { return JSON.parse(localStorage.getItem(КЛЮЧ_БУЛАВОК) || '[]') || []; }
  catch (е) { return []; }
}
function закреплено(ид) { return булавки().indexOf(Number(ид)) >= 0; }
function закрепить(ид, надо) {
  var сп = булавки().filter(function (х) { return х !== Number(ид); });
  if (надо) сп.push(Number(ид));
  try { localStorage.setItem(КЛЮЧ_БУЛАВОК, JSON.stringify(сп.slice(-50))); } catch (е) {}
  CW.сказать(надо ? 'Закреплено' : 'Откреплено', 1800);
  П.обновить();
}

function менюСообщения(м, своё, x, y) {
  CW.нужен('shared/меню-сообщения.js').then(function () {
    var вид = м.msg_type && м.msg_type !== 'text' ? м.msg_type : '';
    /* Та же разборка, что и в пузыре: кнопки снимаем, остальное
       остаётся текстом или адресом. */
    var раз = CW.кнопкиСообщения.разобрать(м.content || '');
    var адрес = вид && вид !== 'geo' ? адресомФайла(раз.текст, м.file_url) : '';
    var имя = м.file_name || (адрес ? имяИзАдреса(адрес) : '');
    var род = CW.родСообщения(вид, имя, адрес);
    var текст = вид ? (м.caption || '') : раз.текст;

    CW.менюСообщения({
      род: род, своё: своё, текст: текст,
      адрес: адрес, имя: имя, размер: Number(м.file_size) || 0,
      когда: CW.когдаСловами(м.created_at) + (м.edited ? ' · изменено' : ''),
      закреплено: закреплено(м.id),
      действия: {
        /* У карточки звонка «Ответить» значит «перезвонить»: отвечать
           в поле ввода на звонок нечем, а позвонить обратно — ровно
           то, чего от этой строки ждут. */
        ответить: (род === 'звонок')
          ? function () { перезвонить(м); }
          : function (т) { ответитьНа(м, т); },
        скопировать: function () {
          CW.вбуфер(текст || адрес || '', 'Скопировано');
        },
        /* Правка текста не трогает кнопки: они снимаются перед
           показом и пришиваются обратно при сохранении. Иначе первое
           же «Изменить» стирало бы весь ряд. */
        изменить: своё ? function (новый) {
          var тело = вид
            ? { content: CW.кнопкиСообщения.вшить(адрес, раз.набор),
                caption: новый }
            : { content: CW.кнопкиСообщения.вшить(новый, раз.набор) };
          return CW.спросить('/dm/message/' + м.id, { способ: 'PUT', тело: тело })
            .then(function () { П.обновить(); });
        } : null,
        /* А это — правка самих кнопок: тот же ряд, что собирали перед
           отправкой, только у уже отправленного сообщения. */
        кнопки: своё ? {
          набор: раз.кнопки, вряд: раз.вряд, цвет: раз.цвет,
          сохранить: function (сп, вряд, цвет) {
            var основа = вид ? адрес : текст;
            return CW.спросить('/dm/message/' + м.id, {
              способ: 'PUT',
              тело: { content: CW.кнопкиСообщения.вшить(основа, сп, вряд, цвет) }
            }).then(function () { П.обновить(); });
          }
        } : null,
        сохранить: адрес ? function () { CW.сохранитьФайл(адрес, имя); } : null,
        /* Заменить один файл, не трогая остальные: сообщение остаётся
           на своём месте в пачке, меняется только вложение.
           Выбор файла и заливка общие (shared/вложения.js), здесь
           только правка своего сообщения. */
        заменить: (своё && адрес) ? function (берём) {
          CW.нужен('shared/вложения.js').then(function () {
            return CW.вложения.заменить({ берём: берём, положить: function (о) {
              return CW.спросить('/dm/message/' + м.id, {
                способ: 'PUT',
                тело: { content: CW.кнопкиСообщения.вшить(о.адрес, раз.набор),
                        file_name: о.имя, file_size: String(о.размер || 0) }
              });
            } });
          }).then(function (вышло) { if (вышло) П.обновить(); });
        } : null,
        /* Замена файла: первый из корзины встаёт на место этого
           сообщения, остальные уходят следом отдельными. Подпись
           сохраняется вместе с первым. */
        файлы: (своё && адрес) ? function (корзина, подпись) {
          return заменитьФайлы(м, корзина, подпись);
        } : null,
        закрепить: function (надо) { закрепить(м.id, надо); },
        переслать: function () {
          CW.открыть('forward', адрес
            ? { адрес: адрес, вид: вид || 'file', имя: имя, текст: текст }
            : { текст: текст });
        },
        удалить: function () { удалитьСообщение(м, своё); },
        выбрать: function () { начатьВыбор(м.id); }
      }
    }, x, y);
  }).catch(function () { CW.сказать('Меню не приехало'); });
}

/* Перезвонить: тем же звонком, что и кнопка в шапке, и тем же видом
   — на видеозвонок отвечаем видеозвонком. */
function перезвонить(м) {
  var видео = String(м.content || '').indexOf(':видео:') >= 0;
  CW.уйти(CW.окно(видео ? 'call-video' : 'call') + '?кто=' + КТО);
}

/* ── ЗАМЕНА ФАЙЛОВ ──
   Корзина приходит из окна правки: до десяти файлов. Первый заменяет
   файл этого сообщения (PUT), остальные уходят новыми сообщениями тем
   же запросом, которым уходит обычное вложение. Везём по одному: сто
   мегабайт одним махом сервер не возьмёт, да и видеть, что едет,
   человеку полезнее. */
function заменитьФайлы(м, корзина, подпись) {
  CW.сказать('Везу файлы…', 2500);
  var первый = корзина[0];
  return CW.залить(первый, родЗаливки(первый))
    .then(function (о) {
      return CW.спросить('/dm/message/' + м.id, {
        способ: 'PUT',
        тело: { content: о.адрес, caption: подпись || '' }
      });
    })
    .then(function () {
      var шаг = Promise.resolve();
      корзина.slice(1).forEach(function (ф) {
        шаг = шаг.then(function () {
          return CW.залить(ф, родЗаливки(ф)).then(function (о) {
            return CW.спросить('/dm/' + КТО, {
              способ: 'POST', сроком: 25000,
              тело: { content: о.адрес, msg_type: видФайла(ф),
                      file_name: ф.name || '', file_size: String(о.размер || ф.size || 0),
                      file_url: о.адрес }
            });
          });
        });
      });
      return шаг;
    })
    .then(function () {
      CW.сказать(корзина.length > 1
        ? ('Готово: ' + корзина.length + ' файла') : 'Файл заменён', 2500);
      П.обновить();
    });
}

function видФайла(ф) {
  var т = String(ф.type || '');
  if (т.indexOf('image/') === 0) return 'image';
  if (т.indexOf('video/') === 0) return 'video';
  if (т.indexOf('audio/') === 0) return 'audio';
  return 'file';
}
function родЗаливки(ф) {
  var в = видФайла(ф);
  return в === 'image' ? 'image' : (в === 'video' ? 'movie'
       : (в === 'audio' ? 'audio' : 'doc'));
}

/* ── ВЫБРАТЬ НЕСКОЛЬКО ──
   Сам выбор живёт в общем файле (shared/выбор-сообщений.js) — он же
   работает в группах и в избранном. Здесь мы говорим только, что
   делать с отмеченными в ЛИЧНОЙ переписке: скопировать их текст,
   переслать по одному и удалить. */
function начатьВыбор(первый) {
  CW.нужен('shared/выбор-сообщений.js').then(function () {
    CW.выборСообщений.начать({
      лента: П.лента,
      куда: П.окно,
      первый: первый,
      текстом: function (ид) {
        var м = найти(ид);
        return м ? (м.msg_type && м.msg_type !== 'text'
                      ? (м.caption || м.file_name || '')
                      : CW.кнопкиСообщения.без(м.content || '')) : '';
      },
      переслать: function (сп) {
        /* Пересылаем по одному: окно «Переслать» спрашивает, кому, и
           шлёт туда каждое отмеченное. */
        var строки = сп.map(function (ид) {
          var м = найти(ид);
          if (!м) return '';
          /* Пересылаем то, что человек видит: без служебной строки
             кнопок. Кнопки — дело автора сообщения, и в чужую
             переписку они не едут. */
          var чисто = CW.кнопкиСообщения.без(м.content || '');
          return (м.msg_type && м.msg_type !== 'text')
            ? (м.file_url || чисто) : чисто;
        }).filter(Boolean);
        CW.открыть('forward', { текст: строки.join('\n') });
      },
      удалить: function (сп) {
        return Promise.all(сп.map(function (ид) {
          var м = найти(ид);
          var своё = м && Number(м.from_user_id) === Number((CW.ясныйЯ() || {}).id);
          return CW.спросить('/dm/message/' + ид + (своё ? '?both=1' : ''),
                             { способ: 'DELETE', тихо: true });
        })).then(function () { П.обновить(); });
      }
    });
  }).catch(function () { CW.сказать('Выбор не приехал'); });
}

/* Сообщение по номеру — из того, что сейчас на экране. */
var ПОСЛЕДНИЕ_ДМ = [];
function найти(ид) {
  for (var i = 0; i < ПОСЛЕДНИЕ_ДМ.length; i++) {
    if (String(ПОСЛЕДНИЕ_ДМ[i].id) === String(ид)) return ПОСЛЕДНИЕ_ДМ[i];
  }
  return null;
}

/* Ответ — цитата в поле ввода: человек видит, на что отвечает, и
   может дописать своё. Сервер про «ответ на сообщение» пока не знает,
   и выдумывать стрелку, которой он не поймёт, мы не будем. */
function ответитьНа(м, текст) {
  var поле = П.ввод && П.ввод.поле;
  if (!поле) return;
  var кусок = (текст || '').split('\n')[0].slice(0, 120);
  поле.value = (кусок ? '> ' + кусок + '\n' : '') + поле.value;
  поле.focus();
  try { поле.setSelectionRange(поле.value.length, поле.value.length); } catch (е) {}
}

function удалитьСообщение(м, своё) {
  CW.открыть('delete', {
    заголовок: 'Удалить сообщение?',
    что: CW.кнопкиСообщения.без(м.content || '').slice(0, 60),
    кнопка: 'Удалить',
    сказать: 'Сообщение удалено',
    ещё: своё ? 'Уйдёт у обоих.' : 'Уйдёт только у тебя.',
    делать: function () {
      return CW.спросить('/dm/message/' + м.id + (своё ? '?both=1' : ''),
                         { способ: 'DELETE' })
        .then(function () { П.обновить(); });
    }
  });
}

/* ═══════════════════════════════════════════════════════════════════════
   МЕЛОЧЬ
   ═══════════════════════════════════════════════════════════════════════ */
/* Имя файла, когда сервер его не сохранил: берём из адреса. Пустая
   строка вместо имени выглядит как поломка. */

/* ── ГДЕ ЛЕЖИТ АДРЕС ВЛОЖЕНИЯ ──
   В самом сообщении, в content. Поле file_url сервер отдаёт только в
   живом известии по сокету, и, главное, при ЗАМЕНЕ файла он его не
   трогает: правка меняет content. Поэтому content главнее - иначе
   заменённый снимок показывался бы старым, пока не перезайдёшь.

   Старым сообщениям это ничем не грозит: там в content лежит тот же
   самый адрес, что и в file_url. */
function адресомФайла(изТекста, изПоля) {
  var т = String(изТекста || '').trim();
  if (/^(https?:\/\/|\/uploads\/|data:)/i.test(т)) return т;
  return изПоля || т || '';
}

function имяИзАдреса(адрес) {
  var с = String(адрес || '').split('?')[0].split('/');
  return с[с.length - 1] || 'файл';
}

function ок(тег, класс, текст) { return CW.эл(тег, класс, текст); }

});
</script>
