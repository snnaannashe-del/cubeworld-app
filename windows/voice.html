<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>Голосовые команды · CubeWorld</title>
<link rel="icon" href="../icons/favicon.svg?v=20261123-412">
<link rel="stylesheet" href="../shared/style.css?v=20261123-412">
<link rel="stylesheet" href="../shared/window.css?v=20261123-412">

<!--
  ГОЛОСОВЫЕ КОМАНДЫ — окно поверх программы.

      windows/voice.html

  Здесь человек видит ВСЕ слова, которые понимает помощник, выбирает
  язык речи, включает или выключает ответ вслух — и отсюда же может
  включить микрофон.

  ── Почему список, а не «просто говори» ───────────────────────────
  Свободную речь помощник не понимает: он сличает сказанное со словами
  из таблицы. Значит, таблица — это и есть справка. Один список и для
  человека, и для разбора: справка не может разойтись с делом, потому
  что это одно и то же место.

  ── Про микрофон говорим прямо ────────────────────────────────────
  Распознаёт речь САМ БРАУЗЕР, и Chrome отправляет звук на серверы
  Google. Площадка на это не влияет. И по обычному http микрофона не
  будет вовсе — это правило браузера. Обе вещи написаны в окне, а не
  спрятаны в документах.
-->
<style>
.гл-весть{
  margin:0 16px 10px; padding:11px 14px; border-radius:11px;
  font-size:0.8667rem; line-height:1.6; color:var(--текст2);
  background:rgba(255,59,48,.12); border:1px solid rgba(255,59,48,.3);
}
.гл-весть b{ color:var(--текст); }

/* ── ВЕРХНЯЯ ПОЛОСА: поиск, язык, ответ вслух ──
   Три вещи в один ряд. Прежде поиск стоял отдельной строкой под
   языком, а выбор языка занимал всю ширину — ряд из одного поля. */
.гл-верх{
  display:flex; align-items:center; flex-wrap:wrap; gap:8px;
  /* Сверху отступ: полоса стояла вплотную к черте под шапкой и
     читалась её продолжением. */
  margin:14px 16px;
}
/* Поиск забирает всё свободное место: по нему здесь работают, а язык
   выбирают раз в жизни. */
.гл-поиск{ position:relative; flex:1 1 180px; min-width:0; }
.гл-поиск input{
  width:100%; box-sizing:border-box;
  background:var(--поле); border:none; border-radius:11px;
  color:var(--текст); font:inherit; font-size:0.9rem;
  padding:9px 13px 9px 38px; outline:none;
}
.гл-поиск input:hover{ background:var(--край); }
.гл-поиск input:focus{ box-shadow:0 0 0 2px rgba(var(--синий-ргб),.45); }
.гл-поиск .зн{
  position:absolute; left:13px; top:50%; transform:translateY(-50%);
  color:var(--текст3); pointer-events:none; display:flex;
}
.гл-поиск .зн svg{ width:15px; height:15px; }

/* Язык — по ширине своего слова, а не во весь ряд. */
.гл-верх select{
  flex:0 0 auto; width:auto; max-width:40%; cursor:pointer;
  background:none; border:1px solid var(--край); border-radius:11px;
  color:var(--текст2); font:inherit; font-size:0.8333rem;
  padding:9px 10px; outline:none;
}
/* Правил для кнопки звука здесь больше нет: сама кнопка переехала в
   шапку окна и одета как её соседи - микрофон и крестик (.ок-кн в
   shared/window.css). Своя одежда ей не нужна. */

/* ── отступы по краям ──
   Окно идёт без полей (поля:false), чтобы верхняя полоса стояла во всю
   ширину. Списку поля нужны: строки, упёртые в самый край окна,
   читаются как обрезанные. */
.гл-список{ padding:0 16px 16px; }
@media (max-width:620px){
  .гл-список{ padding:0 12px 14px; }
  .гл-верх, .гл-весть{ margin-left:12px; margin-right:12px; }
}

.гл-раздел{
  margin:18px 0 9px; font-size:0.7rem; font-weight:700;
  letter-spacing:.07em; text-transform:uppercase; color:var(--текст3);
}

/* ── СТРОКА КОМАНДЫ ──
   Слева — что будет сделано, справа — слова, которыми это говорят.
   Прежде они стояли друг под другом: окно было 10 см, и рядом они не
   помещались. Теперь у окна своя ширина, и строка читается как
   строка: «Открыть ленту … лент · новости · видео лент».

   Заливки нет — только обводка, подниз тот же, что у окна. */
.гл-строка{
  display:flex; align-items:center; justify-content:space-between;
  flex-wrap:wrap; gap:10px;
  padding:11px 14px; margin-bottom:8px; border-radius:11px;
  border:1px solid var(--край); background:none;
}
.гл-строка .что{
  flex:0 1 auto; font-size:0.8667rem; font-weight:600; line-height:1.3;
}
.гл-слова{ display:flex; flex-wrap:wrap; gap:6px; justify-content:flex-end; }
/* Слово — не кнопка, а именно слово: его говорят, а не нажимают.
   Поэтому обводка без заливки и без руки на наведении. */
.гл-слово{
  padding:3px 10px; border-radius:20px; font-size:0.7333rem;
  border:1px solid rgba(74,158,255,.4); background:none;
  color:var(--синий); white-space:nowrap;
}
</style>
</head>
<body>

<script src="../shared/api.js?v=20261123-412"></script>
<script src="../shared/ui.js?v=20261123-412"></script>
<script src="../shared/смайлы.js?v=20261123-412"></script>
<script src="../shared/лица.js?v=20261123-412"></script>
<script src="../shared/эфир.js?v=20261123-412"></script>
<script src="../shared/icons.js?v=20261123-412"></script>
<script src="../shared/window.js?v=20261123-412"></script>
<script src="../shared/без-копий.js?v=20261123-412"></script>
<script src="../shared/time.js?v=20261123-412"></script>
<script src="../shared/auth.js?v=20261123-412"></script>
<script src="../shared/account.js?v=20261123-412"></script>

<!-- Игра, формы и персонаж — ради их команд: список должен быть полным
     и здесь, а не только в мире. Сами они тут ничего не двигают, кубов на
     этой странице нет; команда из этих разделов уводит в мир. -->
<script src="../shared/игра.js?v=20261123-412"></script>
<script src="../shared/формы.js?v=20261123-412"></script>
<script src="../shared/персонаж.js?v=20261123-412"></script>
<script src="../shared/голос.js?v=20261123-412"></script>
<script>
'use strict';

CW.оболочка('feed').then(function (место) {

место.appendChild(ок('div', 'пусто-строка',
  'Голосовые команды открыты отдельным окном. Закрой его, чтобы вернуться.'));

var ОКНО = CW.стойка({
  имя: 'голос',
  /* Ни значка, ни подписи «скажи, что делать»: название окна и так
     говорит, что это. Выход — крестик: окно открыто поверх программы. */
  заголовок: 'Голосовые команды',
  назад: уйти,
  крест: true,
  поля: false,
  /* Команд больше сотни, и каждая — строка «что сделать → каким словом».
     В десяти сантиметрах такая строка складывалась надвое; в пятнадцати
     читается целиком, слева направо, и посреди строки не остаётся
     ладони пустоты. */
  полуторное: true,
  /* ── ЗВУК СТОИТ В ШАПКЕ, РЯДОМ С КРЕСТИКОМ ────────────────────────
     Сперва это была кнопка со словом «Без звука» в полосе поиска. Она
     туда не влезала и уносила за собой пустую строку во всю ширину
     окна. Потом стала значком там же - строка выправилась, но у неё
     осталась рамка, и значок читался отдельной плашкой среди поля.

     Теперь он в шапке, в одном ряду с микрофоном и крестиком: без
     рамки, без подложки, тем же кругляшом, что и соседи. Там его и
     ищут - все переключатели окна живут в шапке. Полоса поиска от
     этого стала на строку короче и вдвое ниже. */
  кнопки: [
    { имя: 'звук', зн: 'тихо', подсказка: 'Без звука. Включить ответ вслух',
      делать: function () { CW.голос.вслух(!CW.голос.вслух()); } }
  ],
  главная: { зн: 'микрофон', подсказка: 'Включить микрофон',
             делать: function () { CW.голос.переключить(); } }
});
ОКНО.открыть();

/* ── одна полоса: поиск, язык, ответ вслух ──
   Поиск стоит первым и занимает всё свободное место: им тут и
   пользуются. Язык — по ширине своего слова. */
var верх = ок('div', 'гл-верх');
верх.innerHTML =
    '<span class="гл-поиск"><span class="зн">' + CW.значок('лупа') + '</span>'
  +   '<input type="text" spellcheck="false" autocomplete="off"'
  +   ' placeholder="Найти команду…"></span>'
  + '<select class="гл-язык">'
  +   CW.голос.ЯЗЫКИ.map(function (я) {
        return '<option value="' + я.код + '">' + CW.безопасно(я.имя) + '</option>';
      }).join('')
  + '</select>'
  ;   /* кнопка звука живёт в шапке окна, а не здесь */
ОКНО.сверху(верх);

var поле = верх.querySelector('.гл-поиск input');
поле.oninput = нарисовать;

var выборЯзыка = верх.querySelector('.гл-язык');
выборЯзыка.value = CW.голос.язык();
выборЯзыка.onchange = function () {
  CW.голос.язык(this.value);
  нарисовать();
};

CW.голос.следить(отметить);
отметить();
нарисовать();

function отметить() {
  /* Кнопка говорит, что СЕЙЧАС, а не что будет по нажатию: обычный
     динамик значит, что помощник отвечает вслух, перечёркнутый — что
     молчит. Слова на кнопке нет, поэтому оно в подсказке и в метке:
     подсказка для мыши, метка для читалки. */
  var звучит = CW.голос.вслух();
  var кнВслух = ОКНО.кнопки['звук'];
  if (кнВслух) {
    кнВслух.classList.toggle('горит', звучит);
    /* Значок меняем, а счётчик у кнопки оставляем: его кладёт сама
       стойка, и переписывать всё нутро значит его потерять. */
    кнВслух.innerHTML = CW.значок(звучит ? 'звук' : 'тихо')
                      + '<span class="счёт"></span>';
    кнВслух.title = звучит ? 'Со звуком. Выключить ответ вслух'
                           : 'Без звука. Включить ответ вслух';
    кнВслух.setAttribute('aria-label', кнВслух.title);
    кнВслух.setAttribute('aria-pressed', звучит ? 'true' : 'false');
  }

  /* Микрофон — то же самое: пока слушает, кнопка горит и называется
     «Выключить микрофон». */
  var г = ОКНО.кнопки['главная'];
  if (г) {
    г.classList.toggle('опасная', CW.голос.идёт());
    г.title = CW.голос.идёт() ? 'Выключить микрофон' : 'Включить микрофон';
    г.setAttribute('aria-label', г.title);
  }
  /* Подпись под названием — только по делу: слушает микрофон или нет.
     Без микрофона подписи нет вовсе. */
  ОКНО.имя('Голосовые команды',
    CW.голос.идёт() ? (CW.голос.слышит() ? 'слушаю…' : 'поднимаю микрофон…') : '');
}

/* ═══════════════════════════════════════════════════════════════════════
   СПИСОК

   Он же таблица разбора: справка и дело — одно место, и разойтись им
   негде.
   ═══════════════════════════════════════════════════════════════════════ */
function нарисовать() {
  var что = CW.ровно(поле.value.trim());
  ОКНО.тело.innerHTML = '';

  /* Полосы-объяснения «нажми микрофон вверху…» больше нет: она
     занимала треть окна, а прочитать её надо было один раз. То же
     самое написано в документах, в «Камера, микрофон и голос».

     Беду показываем по-прежнему: если микрофона в этом браузере не
     будет вовсе, молчать об этом нельзя. */
  var беда = CW.голос.беда();
  if (беда) {
    var весть = ок('div', 'гл-весть');
    весть.innerHTML = '<b>Микрофона здесь не будет.</b> ' + CW.безопасно(беда)
      + ' Команды из списка всё равно делаются руками.';
    ОКНО.тело.appendChild(весть);
  }

  var короб = ок('div', 'гл-список');
  ОКНО.тело.appendChild(короб);

  var все = CW.голос.команды();
  var подходят = все.filter(function (к) {
    if (!что) return true;
    if (CW.ровно(к.имя).indexOf(что) >= 0) return true;
    return к.слова.some(function (с) { return CW.ровно(с).indexOf(что) >= 0; });
  });

  var разделы = [];
  подходят.forEach(function (к) {
    if (разделы.indexOf(к.раздел) < 0) разделы.push(к.раздел);
  });

  разделы.forEach(function (р) {
    короб.appendChild(ок('div', 'гл-раздел', р));
    подходят.filter(function (к) { return к.раздел === р; }).forEach(function (к) {
      var с = ок('div', 'гл-строка');
      с.innerHTML = '<span class="что">' + CW.безопасно(к.имя) + '</span>'
        + '<span class="гл-слова">'
        + к.слова.map(function (сл) {
            return '<span class="гл-слово">' + CW.безопасно(сл) + '</span>';
          }).join('')
        + '</span>';
      короб.appendChild(с);
    });
  });

  if (!подходят.length) {
    короб.appendChild(ок('div', 'пусто-строка',
      'Такой команды нет. Поищи по части слова.'));
  }

  ОКНО.имя('Голосовые команды',
           что ? ('нашлось ' + подходят.length)
               : (CW.голос.идёт() ? 'слушаю…' : ''));
}

/* Выход из голосовых команд: возвращаемся ровно туда, откуда пришли.

   Пришли из мира — в мир, из «Оформления» — в «Оформление», из раздела
   — в раздел. Самый честный ответ на вопрос «куда» даёт сам браузер:
   он помнит страницу, с которой нас открыли. Её и берём, если она
   наша и это не мы сами.

   Если страницы нет (открыли по прямому адресу или вкладку
   перезагрузили), спрашиваем по старшинству: `cw_откуда` — его пишут
   меню и кружок лица, потом последний раздел меню, и только в самом
   конце мир. Имя раздела при этом проверяем: окно вроде «Оформления»
   разделом не считается, и подсовывать его в CW.раздел() нельзя —
   такой страницы в корне просто нет. */
function уйти() {
  CW.голос.выключить(true);

  var откуда = назад();
  if (откуда) { CW.уйти(откуда); return; }

  var куда = '';
  try { куда = sessionStorage.getItem('cw_откуда') || ''; } catch (е) {}
  if (куда !== 'world' && !разделЛи(куда)) {
    куда = (CW.последнийРаздел && CW.последнийРаздел()) || '';
  }
  if (куда !== 'world' && !разделЛи(куда)) куда = 'world';
  CW.уйти(CW.раздел(куда, CW.какойКуб()));
}

/* Страница, с которой нас открыли, — но только своя и не мы сами. */
function назад() {
  var откуда = '';
  try { откуда = document.referrer || ''; } catch (е) { return ''; }
  if (!откуда) return '';
  var у;
  try { у = new URL(откуда, location.href); } catch (е) { return ''; }
  if (у.origin !== location.origin) return '';
  if (/\/voice\.html$/.test(у.pathname)) return '';
  return у.pathname + у.search;
}

function разделЛи(имя) {
  if (!имя) return false;
  /* Пока оболочка не приехала, спросить некого — тогда верим имени:
     на такой странице оно всё равно взялось из меню. */
  return CW.разделЛи ? CW.разделЛи(имя) : true;
}

function ок(тег, класс, текст) { return CW.эл(тег, класс, текст); }

});
</script>
