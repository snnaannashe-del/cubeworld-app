<!--
  ПОИСК — окно поверх программы.

      windows/search.html            пустой поиск
      windows/search.html?что=пётр   сразу с запросом

  Строка в окне одна, и она делает обе работы. Пусто в ней — видно
  помощника с его вопросами. Набрал — сверху подходящие наши вопросы
  (их помощник знает наизусть, ждать сервера для них незачем), под ними
  находки по площадке: люди, группы, кубы, эфиры подряд, по три каждого
  рода, с кнопкой «Ещё N…», которая раскрывает раздел на месте.

  Полосы вкладок и отдельной строки помощника внизу здесь нет нарочно:
  выбирать раздел заранее человек всё равно не может — он не знает, в
  каком из них лежит то, что он ищет.

  Сервер спрашивается четырьмя запросами разом, и раздел, который не
  ответил, просто не показывается — остальные три от этого не ждут.
  Запрос не улетает на каждую букву: пауза 280 мс. Иначе на слове
  «разработка» уходит сорок запросов, из которых нужен последний. И
  последний ответ может прийти раньше предпоследнего — поэтому у
  каждого запроса есть номер, и чужие ответы выбрасываются.

  ЧЕСТНО про помощника: это не живой ИИ и не запрос к чужой модели.
  Ответы написаны заранее и лежат в shared/помощник.js — тот же набор,
  что в работающей программе, слово в слово. Помощник узнаёт вопрос по
  словам; чего он не знает, он так и говорит и ищет это по площадке, а
  не придумывает. Поэтому он и не ошибается, и работает без сети.
-->
<style>

/* ── строка запроса ─────────────────────────────────────────────── */
.по-строка{
  flex:0 0 auto; display:flex; align-items:center; gap:9px;
  padding:12px 16px; border-bottom:1px solid var(--край);
}
.по-строка .лупа{ color:var(--текст3); display:flex; }
.по-строка .лупа svg{ width:18px; height:18px; }
.по-строка input{
  flex:1; min-width:0; background:none; border:none; outline:none;
  color:var(--текст); font:1rem/1.4 var(--шрифт); padding:6px 0;
}
.по-строка input::placeholder{ color:var(--текст3); }
.по-строка .стереть{
  border:none; background:none; color:var(--текст3); cursor:pointer;
  font-size:1.1333rem; padding:4px 6px; line-height:1;
}
.по-строка .стереть:hover{ color:var(--текст); }

/* ── находки ────────────────────────────────────────────────────── */
.по-раздел{
  font-size:0.7333rem; letter-spacing:.1em; text-transform:uppercase;
  color:var(--текст3); padding:16px 16px 8px;
}
.по-раздел:first-child{ padding-top:10px; }
.по-ещё{
  border:none; background:none; color:var(--синий); cursor:pointer;
  font:0.8667rem var(--шрифт); padding:6px 16px 14px;
}
.по-ещё:hover{ text-decoration:underline; }

.по-строчка{
  width:100%; display:flex; align-items:center; gap:12px;
  padding:9px 16px; border:none; background:none; cursor:pointer;
  text-align:start; color:var(--текст);
}
.по-строчка:hover{ background:var(--полоса); }
.по-строчка .кто{ flex:1; min-width:0; }
.по-строчка .кто b{
  display:block; font-size:0.9667rem; font-weight:550;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.по-строчка .кто span{
  display:block; font-size:0.8333rem; color:var(--текст3); margin-top:2px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.по-строчка .метка{
  flex:0 0 auto; font-size:0.7333rem; color:var(--текст3);
  border:1px solid var(--край); border-radius:var(--радиус-круг);
  padding:3px 9px;
}
/* Найденный кусок слова подсвечиваем — видно, почему строка нашлась. */
.по-строчка mark{ background:rgba(74,158,255,.22); color:var(--текст);
  border-radius:3px; padding:0 1px; }

/* ── помощник ───────────────────────────────────────────────────────
   Пузыри разговора, подсказки, каталог вопросов и своя строка внизу.
   Всё внутри тела окна: шапка и верхняя строка поиска остаются общими,
   у помощника своего окна нет. */
.пм{ padding:14px 16px 6px; }

.пм-пузырь{
  max-width:86%; padding:10px 13px; border-radius:14px; margin-bottom:10px;
  font-size:0.9rem; line-height:1.55; white-space:pre-wrap; word-break:break-word;
}
.пм-пузырь.свой{
  margin-inline-start:auto; background:var(--пузырь); color:#fff;
  border-bottom-right-radius:5px;
}
.пм-пузырь.его{
  background:var(--поле); border:1px solid var(--край); color:var(--текст);
  border-bottom-left-radius:5px;
}
/* Подпись над ответом: человек должен видеть, что это ответ помощника,
   а не чьё-то сообщение. */
.пм-пузырь .метка{
  display:flex; align-items:center; gap:6px; margin-bottom:5px;
  font-size:0.7333rem; font-weight:700; letter-spacing:.04em;
  text-transform:uppercase; color:var(--синий);
}
.пм-пузырь .метка svg{ width:13px; height:13px; }

/* Кнопка «Открыть раздел» под ответом: ответ про кошелёк без пути в
   кошелёк заставляет человека искать раздел руками. */
.пм-уйти{
  display:inline-flex; align-items:center; gap:7px; margin-top:9px;
  padding:6px 13px; border-radius:var(--радиус-круг); cursor:pointer;
  font:0.8333rem var(--шрифт); color:var(--синий);
  background:rgba(var(--синий-ргб),.14); border:1px solid rgba(var(--синий-ргб),.35);
}
.пм-уйти:hover{ background:rgba(var(--синий-ргб),.24); }
.пм-уйти svg{ width:14px; height:14px; }

.пм-подсказки{ display:flex; flex-wrap:wrap; gap:7px; margin-top:4px; }
.пм-чип{
  font-size:0.8333rem; padding:8px 13px; border-radius:var(--радиус-круг);
  cursor:pointer; color:var(--текст2);
  background:var(--поле); border:1px solid var(--край);
}
.пм-чип:hover{ color:var(--текст); border-color:rgba(var(--синий-ргб),.45);
  background:rgba(var(--синий-ргб),.14); }

.пм-все{
  margin:14px 0 2px; padding:7px 14px; border-radius:var(--радиус-круг);
  cursor:pointer; font:0.8667rem var(--шрифт); font-weight:600;
  color:var(--синий); background:rgba(var(--синий-ргб),.14);
  border:1px solid rgba(var(--синий-ргб),.3);
}
.пм-все:hover{ background:rgba(var(--синий-ргб),.24); }

.пм-группа{
  font-size:0.7333rem; letter-spacing:.09em; text-transform:uppercase;
  color:var(--синий); margin:14px 2px 7px;
}

/* ── строка вопроса внизу ──
   Стоит вне прокрутки: каталог длинный, и поле, уехавшее вместе с ним
   вверх, человек ищет колесом. */
.пм-строка{
  flex:0 0 auto; display:flex; align-items:center; gap:9px;
  padding:11px 16px; border-top:1px solid var(--край);
}
.пм-строка input{
  flex:1; min-width:0; padding:10px 14px; font:0.9rem var(--шрифт);
  color:var(--текст); background:var(--поле); border:1px solid var(--край);
  border-radius:var(--радиус-круг); outline:none;
}
.пм-строка input:focus{ border-color:var(--синий); }
.пм-строка button{
  flex:0 0 auto; padding:10px 18px; border-radius:var(--радиус-круг);
  cursor:pointer; font:0.8667rem var(--шрифт); font-weight:600; color:#fff;
  background:var(--синий); border:1px solid var(--синий);
}
.пм-строка button:hover{ background:var(--синий-светлее); }

</style>

<script>
'use strict';

CW.оболочка('feed').then(function (место) {

/* ═══════════════════════════════════════════════════════════════════════
   ГДЕ ИЩЕМ

   Один список на всё окно: и находки под строкой, и находки, которыми
   помощник отвечает на незнакомый вопрос, берутся отсюда. Появится
   новый род — он добавляется сюда, и работает сразу в обоих местах.
   ═══════════════════════════════════════════════════════════════════════ */
var ГДЕ = [
  { имя: 'люди',   подпись: Т('Люди'),   зн: 'человек', адрес: '/users/search',
    строка: строкаЧеловек },
  { имя: 'группы', подпись: Т('Группы'), зн: 'люди',    адрес: '/groups/search',
    строка: строкаГруппа },
  { имя: 'кубы',   подпись: Т('Кубы'),   зн: 'ромб',    адрес: '/cubes/search',
    строка: строкаКуб },
  { имя: 'эфиры',  подпись: Т('Эфиры'),  зн: 'камера',  адрес: '/streams',
    строка: строкаЭфир }
];

var ВО_ВСЁМ = 3;        /* по скольку показывать каждого рода сразу */
var ПАУЗА = 280;        /* мс тишины, после которых спрашиваем сервер */

/* раскрыт — имя раздела, который человек развернул кнопкой «Ещё N…»;
   пришло — сколько разделов уже ответило на текущий запрос. */
var С = { ищем: '', ответы: {}, раскрыт: '', номер: 0, пришло: 0, часы: null };

/* Разговор с помощником: что спросили и что ответили. Живёт, пока окно
   открыто, — переписки с ним мы не храним ни у себя, ни на сервере. */
var П = { разговор: [], каталог: false, думает: false, кВнизу: false };

место.appendChild(ок('div', 'пусто-строка',
  Т('Поиск открыт отдельным окном. Закрой его, чтобы вернуться.')));

/* ═══════════════════════════════════════════════════════════════════════
   ОКНО
   ═══════════════════════════════════════════════════════════════════════ */
/* В шапке только название и крестик. Значка нет нарочно: лупа стоит
   строчкой ниже, в самой строке запроса, и вторая такая же над ней
   была повтором. Строчки под названием тоже нет — окно и так про
   поиск, а место она занимала всегда. Выход крестиком, а не стрелкой:
   стрелка обещает возврат по истории, а окно просто закрывается туда,
   откуда пришли. Высота по содержимому: прежде окно тянулось от верха
   до низа и под шестью подсказками оставалось полтора пустых экрана. */
var ОКНО = CW.стойка({
  имя: 'поиск',
  заголовок: Т('Поиск Cube'),
  назад: уйти,
  крест: true,
  поРосту: true,
  поля: false
});
ОКНО.открыть();

/* строка запроса */
var строка = ок('div', 'по-строка');
строка.innerHTML = '<span class="лупа">' + CW.значок('лупа') + '</span>'
                 + '<input type="text" spellcheck="false" autocomplete="off"'
                 + ' placeholder="' + CW.безопасно(Т('Кого или что ищем?')) + '">'
                 + '<button class="стереть" title="' + CW.безопасно(Т('Очистить')) + '">✕</button>';
ОКНО.сверху(строка);

var поле = строка.querySelector('input');
var стереть = строка.querySelector('.стереть');
стереть.style.visibility = 'hidden';

поле.oninput = function () {
  С.ищем = поле.value.trim();
  стереть.style.visibility = С.ищем ? 'visible' : 'hidden';
  С.раскрыт = '';
  clearTimeout(С.часы);
  /* Показываем сразу: подходящие вопросы помощник знает наизусть и
     ждать сервера для них незачем. Находки по площадке приедут следом. */
  показать();
  if (!С.ищем) return;
  С.часы = setTimeout(искать, ПАУЗА);
};

поле.onkeydown = function (е) {
  if (е.key === 'Enter') {
    clearTimeout(С.часы);
    /* Набрал то, что помощник знает, — отвечаем, а не ищем людей с
       таким именем. Чего он не знает — ищем по площадке, как раньше. */
    var вопрос = вопросПохожий(С.ищем);
    if (вопрос) { очистить(); спросить(вопрос); return; }
    искать();
  }
  if (е.key === 'Escape' && С.ищем) { е.stopPropagation(); очистить(); }
};

/* ── какие наши вопросы подходят к набранному ──────────────────────
   Помощник отвечает только на то, что у нас записано (shared/помощник.js),
   и честно: придумывать он не умеет. Поэтому пока человек печатает, мы
   показываем ему подходящие вопросы из каталога — выбрал, получил
   ответ. Каталог спрашиваем тем же отбором, что и кнопка «Все вопросы»:
   второго поиска по вопросам в проекте нет. */
function вопросыПохожие(что) {
  что = String(что || '').trim();
  if (что.length < 2 || !CW.помощник) return [];
  var вышло = [];
  CW.помощник.каталог(что).forEach(function (г) {
    г.вопросы.forEach(function (в) { if (вышло.length < 6) вышло.push(в.в); });
  });
  return вышло;
}

function вопросПохожий(что) {
  var список = вопросыПохожие(что);
  return список.length ? список[0] : '';
}

стереть.onclick = очистить;

function очистить() {
  поле.value = ''; С.ищем = '';
  стереть.style.visibility = 'hidden';
  поле.focus();
  показать();
}

/* Полосы вкладок («AI Assistant · Всё · Люди · Группы · Кубы · Эфиры»)
   здесь больше нет, и своей строки у помощника внизу — тоже. Обе
   убраны по просьбе, и это не потеря: строка наверху одна на всё.
   Пусто в ней — окно показывает помощника с его вопросами; набрал —
   показывает подходящие вопросы и находки по площадке разом. Выбирать
   раздел заранее человек всё равно не должен: он не знает, где лежит
   то, что он ищет. */

/* ═══════════════════════════════════════════════════════════════════════
   СПРОСИТЬ СЕРВЕР

   Четыре запроса уходят разом. Номер нужен от перегонки: человек печатает
   «пётр», ответ про «пёт» приходит позже ответа про «пётр» — и без номера
   на экране осталось бы старое.
   ═══════════════════════════════════════════════════════════════════════ */
function искать() {
  var что = С.ищем;
  if (!что) return;
  var мой = ++С.номер;

  /* Ответы прошлого запроса выбрасываем сразу: иначе под новым словом
     полминуты висят находки по старому. */
  С.ответы = {}; С.пришло = 0;
  показать();

  ГДЕ.forEach(function (г) {
    CW.спросить(г.адрес + '?q=' + encodeURIComponent(что) + '&limit=20',
                { тихо: true, сроком: 15000 })
      .then(function (д) { положить(мой, г.имя, рядами(д)); })
      /* Раздел, который не ответил, остаётся пустым, и три остальных
         его не ждут. Ошибку наверх не тащим: человек искал людей, а не
         отчёт о том, что ручка эфиров сегодня молчит. */
      .catch(function () { положить(мой, г.имя, []); });
  });
}

function положить(номер, имя, ряды) {
  if (номер !== С.номер) return;          /* ответ от прошлого запроса */
  С.ответы[имя] = ряды;
  С.пришло++;
  показать();
}

function рядами(д) {
  if (!д) return [];
  if (Array.isArray(д)) return д;
  return д.items || д.users || д.groups || д.cubes || д.streams || [];
}

/* ═══════════════════════════════════════════════════════════════════════
   ЧТО ВИДНО
   ═══════════════════════════════════════════════════════════════════════ */
function показать() {
  var тело = ОКНО.тело;
  тело.innerHTML = '';

  /* Строка пуста — окно про помощника: его разговор, его вопросы. */
  if (!С.ищем) { помощник(); return; }

  /* Сперва наши вопросы: ответ на них у нас есть, и он точный. */
  var вопросы = вопросыПохожие(С.ищем);
  if (вопросы.length) {
    тело.appendChild(ок('div', 'по-раздел', Т('Вопросы')));
    var ряд = ок('div', 'пм-подсказки');
    вопросы.forEach(function (в) {
      var ч = ок('button', 'пм-чип', в);
      ч.innerHTML = подсветить(в);
      ч.onclick = function () { очистить(); спросить(в); };
      ряд.appendChild(ч);
    });
    тело.appendChild(ряд);
  }

  /* Пока не все четыре раздела ответили — одна строчка внизу. Раньше
     она стирала тело целиком, и подходящие вопросы, уже показанные,
     исчезали на пол-секунды и возвращались. */
  var ждём = С.пришло < ГДЕ.length;

  /* Потом находки по площадке — все роды подряд, без вкладок. */
  var всего = 0;
  ГДЕ.forEach(function (г) {
    var ряды = С.ответы[г.имя] || [];
    if (!ряды.length) return;
    всего += ряды.length;

    тело.appendChild(ок('div', 'по-раздел', г.подпись));
    var раскрыт = С.раскрыт === г.имя;
    (раскрыт ? ряды : ряды.slice(0, ВО_ВСЁМ)).forEach(function (р) {
      тело.appendChild(г.строка(р));
    });

    if (!раскрыт && ряды.length > ВО_ВСЁМ) {
      var ещё = ок('button', 'по-ещё',
                   Т.с('Ещё {н} в разделе «{раздел}»',
                       { н: ряды.length - ВО_ВСЁМ, раздел: г.подпись }));
      /* Раскрываем раздел на месте: вкладок, куда можно было бы
         перейти, больше нет. */
      ещё.onclick = function () { С.раскрыт = г.имя; показать(); };
      тело.appendChild(ещё);
    }
  });

  if (ждём) {
    тело.appendChild(ок('div', 'пусто-строка', Т('Ищу…')));
    return;
  }

  if (!всего && !вопросы.length) {
    ОКНО.пусто({
      знак: 'лупа',
      заголовок: Т('Ничего не нашлось'),
      текст: Т.с('По запросу «{что}» ни вопроса, ни людей, ни групп, ни кубов, '
               + 'ни эфиров. Попробуй короче, поиск ищет по началу слова.',
                 { что: С.ищем })
    });
  }
}

/* ═══════════════════════════════════════════════════════════════════════
   ПОМОЩНИК

   Вкладка целиком собирается здесь, а знает он всё из shared/помощник.js.
   Порядок на экране тот же, что в работающей программе: разговор, потом
   шесть подсказок (пока ничего не спросили), потом кнопка «Все вопросы»
   и за ней каталог, а строка вопроса стоит внизу окна отдельно.
   ═══════════════════════════════════════════════════════════════════════ */
function помощник() {
  var т = ОКНО.тело;

  var лист = ок('div', 'пм');
  т.appendChild(лист);

  П.разговор.forEach(function (м) { лист.appendChild(пузырь(м)); });
  if (П.думает) лист.appendChild(пузырь({ чей: 'его', текст: Т('Загрузка…') }));

  /* Подсказки — только пока разговор не начался: после первого ответа
     они повторяют то, что человек и так уже видел. */
  if (!П.разговор.length) {
    var п = ок('div', 'пм-подсказки');
    CW.помощник.подсказки().forEach(function (в) {
      var ч = ок('button', 'пм-чип', в);
      ч.onclick = function () { спросить(в); };
      п.appendChild(ч);
    });
    лист.appendChild(п);
  }

  var все = ок('button', 'пм-все', П.каталог ? Т('Свернуть список') : Т('Все вопросы'));
  все.onclick = function () { П.каталог = !П.каталог; показать(); };
  лист.appendChild(все);

  if (П.каталог) {
    /* Своего поля «Искать вопрос…» здесь больше нет. В окне и так есть
       строка запроса, одна на всё: набрал в ней слово - подходящие
       вопросы встают сверху отдельным разделом. Два поля в одном окне,
       одно под другим, человек читает как поломку, и каждый раз надо
       гадать, какое из них про что. Каталог теперь показывается
       целиком, списком, как список и есть. */
    каталогГде = ок('div', 'пм-каталог');
    лист.appendChild(каталогГде);
    нарисоватьКаталог();
  }

  /* Вниз съезжаем только после нового ответа. Прежде окно уезжало вниз
     и при открытии каталога — человек нажимал «Все вопросы» и попадал
     в конец списка, к последней группе. */
  if (П.кВнизу) { т.scrollTop = т.scrollHeight; П.кВнизу = false; }
}

var каталогГде = null;

function нарисоватьКаталог() {
  if (!каталогГде) return;
  каталогГде.innerHTML = '';
  var группы = CW.помощник.каталог('');
  if (!группы.length) {
    каталогГде.appendChild(ок('div', 'пм-группа', Т('Ничего не нашлось')));
    return;
  }
  группы.forEach(function (г) {
    каталогГде.appendChild(ок('div', 'пм-группа', г.имя));
    var ряд = ок('div', 'пм-подсказки');
    г.вопросы.forEach(function (в) {
      var ч = ок('button', 'пм-чип', в.в);
      ч.onclick = function () { спросить(в.в); };
      ряд.appendChild(ч);
    });
    каталогГде.appendChild(ряд);
  });
}

function пузырь(м) {
  var б = ок('div', 'пм-пузырь ' + (м.чей === 'свой' ? 'свой' : 'его'));
  if (м.чей !== 'свой') {
    var метка = ок('div', 'метка');
    метка.innerHTML = CW.значок('робот') + '<span>AI Assistant</span>';
    б.appendChild(метка);
  }
  б.appendChild(ок('div', 'слова', м.текст));

  if (м.раздел) {
    var р = CW.помощник.раздел(м.раздел);
    if (р) {
      var у = ок('button', 'пм-уйти');
      у.innerHTML = CW.значок(р.зн) + '<span>' + CW.безопасно(Т('Открыть «')) + '' + CW.безопасно(р.имя) + '»</span>';
      у.onclick = function () { CW.уйти(CW.раздел(р.к, CW.какойКуб())); };
      б.appendChild(у);
    }
  }

  (м.находки || []).forEach(function (н) { б.appendChild(н); });
  return б;
}

/* Спросили. Ответ помощника приходит сразу — он лежит у нас. Ждать
   приходится только тогда, когда ответа нет и мы идём искать по
   площадке; на это время в разговоре стоит «Смотрю…». */
function спросить(вопрос) {
  вопрос = String(вопрос || '').trim();
  if (!вопрос) return;

  П.разговор.push({ чей: 'свой', текст: вопрос });
  П.каталог = false;
  П.кВнизу = true;

  var о = CW.помощник.ответ(вопрос);

  if (о.искать) {
    П.думает = true; показать();
    поПлощадке(о.искать).then(function (карточки) {
      П.думает = false;
      П.разговор.push(карточки.length
        ? { чей: 'его',
            текст: Т.с('Вот что нашлось по запросу «{что}»:', { что: о.искать }),
            находки: карточки }
        : { чей: 'его',
            текст: Т.с('По запросу «{что}» на площадке ничего не нашлось. '
                     + 'Ни людей, ни групп, ни кубов, ни эфиров.',
                       { что: о.искать }) });
      П.кВнизу = true;
      показать();
    });
    return;
  }

  if (о.нет && о.искатьТоже) {
    П.думает = true; показать();
    поПлощадке(о.искатьТоже).then(function (карточки) {
      П.думает = false;
      П.разговор.push(карточки.length
        ? { чей: 'его', текст: Т('Про это я не знаю, но на площадке нашлось вот что:'),
            находки: карточки }
        : { чей: 'его', текст: о.текст });
      П.кВнизу = true;
      показать();
    });
    return;
  }

  П.разговор.push({ чей: 'его', текст: о.текст, раздел: о.раздел || '' });
  показать();
}

/* Поиск у помощника не свой: он зовёт те же ручки. Иначе
   находки в двух местах окна разъехались бы — и по виду, и по тому,
   что именно спрашивается у сервера. */
function поПлощадке(что) {
  return Promise.all(ГДЕ.map(function (г) {
    return CW.спросить(г.адрес + '?q=' + encodeURIComponent(что) + '&limit=4',
                       { тихо: true, сроком: 15000 })
      .then(function (д) { return { г: г, ряды: рядами(д).slice(0, 3) }; })
      .catch(function () { return { г: г, ряды: [] }; });
  })).then(function (всё) {
    var узлы = [];
    всё.forEach(function (ч) {
      if (!ч.ряды.length) return;
      узлы.push(ок('div', 'по-раздел', ч.г.подпись));
      ч.ряды.forEach(function (р) { узлы.push(ч.г.строка(р)); });
    });
    return узлы;
  });
}

/* ── строки находок ──────────────────────────────────────────────── */
function строчка(кружок, имя, под, метка, делать) {
  var б = ок('button', 'по-строчка');
  б.appendChild(кружок);
  var кто = ок('div', 'кто');
  кто.innerHTML = '<b>' + подсветить(имя) + '</b>'
                + (под ? '<span>' + подсветить(под) + '</span>' : '');
  б.appendChild(кто);
  if (метка) б.appendChild(ок('span', 'метка', метка));
  б.onclick = делать;
  return б;
}

function строкаЧеловек(ч) {
  return строчка(
    CW.кружок({ размер: 38, кто: ч.id, снимок: ч.avatar_url,
                версия: ч.avatar_ver }),
    CW.имяЧеловека(ч),
    ч.username ? '@' + ч.username : ('UID · ' + (ч.uid || ч.id)),
    '',
    function () { CW.вПортфолио(ч.id); });
}

function строкаГруппа(г) {
  return строчка(
    CW.кружок({ размер: 38, род: 'группа', значок: г.icon || '' }),
    г.name || Т.с('Группа #{н}', { н: г.id }),
    г.description || '',
    Number(г.member_count || 0) ? Т.с('{н} чел.', { н: г.member_count }) : '',
    function () { CW.уйти(CW.окно('group') + '?id=' + г.id); });
}

function строкаКуб(к) {
  return строчка(
    CW.кружок({ размер: 38, род: 'куб', значок: к.icon || '' }),
    к.name || Т.с('Куб #{н}', { н: к.id }),
    к.description || '',
    '',
    function () { CW.уйти(CW.раздел('feed', к.id)); });
}

function строкаЭфир(э) {
  return строчка(
    CW.кружок({ размер: 38, род: 'эфир', цвет: 'linear-gradient(140deg,#3b1d2e,#2a1420)' }),
    э.title || э.name || Т.с('Эфир #{н}', { н: э.id }),
    э.display_name || '',
    Т('в эфире'),
    function () { CW.сказать(Т('Окно эфира ещё не готово')); });
}

/* Подсветка найденного куска. Через безопасный текст, а не через
   замену в сыром — иначе чужое имя с угловой скобкой ломает разметку. */
function подсветить(текст) {
  var безопасно = CW.безопасно(текст || '');
  if (!С.ищем) return безопасно;
  var щит = С.ищем.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return безопасно.replace(new RegExp('(' + щит + ')', 'ig'), '<mark>$1</mark>');
}

/* Списка «недавно искали» здесь больше нет. Он показывался на пустой
   вкладке «Всё», а вкладок не стало: пустая строка теперь открывает
   помощника. Память о прошлых запросах тоже убрана — хранить её,
   никому не показывая, незачем. */

/* ═══════════════════════════════════════════════════════════════════════
   ВХОД И ВЫХОД
   ═══════════════════════════════════════════════════════════════════════ */
function уйти() {
  var откуда = '';
  try { откуда = sessionStorage.getItem('cw_откуда') || ''; } catch (е) {}
  var ладно = /^(feed|chats|groups|signals|market|earn|wallet|stats|refs)$/;
  CW.уйти(CW.раздел(ладно.test(откуда) ? откуда : 'feed', CW.какойКуб()));
}

/* Запрос мог приехать в адресе — из верхней строки программы.

   Первый кадр ждёт слова помощника: справочник везётся отдельным
   набором (lang/help-<язык>.js), и если нарисовать до него, подсказки
   и каталог мелькнут по-русски и только потом станут английскими. Ждём
   недолго — файл маленький, — а если он не приехал, рисуем как есть: по
   английскому запасу или по русскому источнику. */
(function () {
  var сразу = '';
  try { сразу = new URLSearchParams(location.search).get('что') || ''; } catch (е) {}

  function первыйКадр() {
    if (сразу) {
      поле.value = сразу; С.ищем = сразу.trim();
      стереть.style.visibility = 'visible';
      показать();
      искать();
    } else {
      показать();
    }
    /* Курсор всегда в единственной строке окна: она и ищет, и
       спрашивает. */
    поле.focus();
  }

  var слова = (CW.помощник && CW.помощник.слова) || null;
  if (слова && слова.then) слова.then(первыйКадр, первыйКадр);
  else первыйКадр();
})();

function ок(тег, класс, текст) { return CW.эл(тег, класс, текст); }

});
</script>
