<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Оформление · CubeWorld</title>
<link rel="icon" href="../icons/favicon.svg?v=20261123-374">
<link rel="stylesheet" href="../shared/style.css?v=20261123-374">
<link rel="stylesheet" href="../shared/window.css?v=20261123-374">
<link rel="stylesheet" href="../shared/account.css?v=20261123-374">
<script src="../shared/theme.js?v=20261123-374"></script>
<link rel="stylesheet" href="../shared/shell.css?v=20261123-374">
<!--
  ОФОРМЛЕНИЕ — окно поверх программы.
  /home/claude/новое/cubeworld-app/windows/theme.html

  Правило этого окна: каждая перемена видна немедленно, прямо здесь, на
  этом же экране. Никакого «Сохранить» внизу — в боевой эта кнопка просто
  закрывала окно, ничего не сохраняя сверх того, что уже сохранилось.
  Человек нажал «Светлая» — и окно под его пальцем уже светлое.

  Сам выбор живёт в shared/theme.js: он подключается в шапке каждой
  страницы и ставит оформление до первой краски. Здесь только кнопки.

  ── Что здесь есть ─────────────────────────────────────────────────
      ЯЗЫК ПРИЛОЖЕНИЯ   один на всю программу
      ТЕМА              тёмная · светлая · камера
      ЦВЕТ ОСНОВНОЙ     кнопки, ссылки, своё сообщение
      ЦВЕТ ЗНАЧКОВ      отдельно: значки часто нужны тише
      ОКНА              семь зон, у каждой цвет и четыре ползунка
      ЗНАЧКИ            пять начертаний, пять движений, четыре почерка
      ОБОИ              картинка за перепиской
      ТЕКСТ В ПЕРЕПИСКЕ размер и цвет
      ЛЕНТА КУРСА       крипта или акции, цвет цены
      ГОЛОСОВОЙ ПОМОЩНИК микрофон и язык команд
      РАЗМЕР ТЕКСТА     три ступени на всю программу
      ДВИЖЕНИЕ          плавное появление окон
-->
<style>

/* ── полоса раздела: имя и шеврон, за ним створка ─────────────────── */
/* Буквы, цвет, шеврон и подсветка под мышкой — общие на всю
   программу, они лежат в shared/window.css у «.вщ-шапка», и этот класс
   стоит на полосе вторым. Здесь остаётся только своё: ширина во всё
   окно, поля по краям и то, что полоса — кнопка, а не строка. Второй
   раз описывать размер букв нельзя: разойдётся с остальными окнами. */
.оф-полоса{
  width:100%; gap:10px; line-height:1.45;
  padding:18px 16px 9px; border:none; background:none; text-align:left;
}
/* Первый раздел не вплотную к шапке: шапка и так прижата к рамке, и
   без этого отступа «Язык приложения» читался её продолжением. */
.оф-полоса:first-child{ padding-top:20px; }
/* Шеврон в значках смотрит вверх. Закрытый раздел поворачиваем на
   четверть вправо, открытый — вниз, на содержимое под ним. Всё
   остальное про шеврон — в общем файле. */
.оф-полоса .шев{ transform:rotate(180deg); }
.оф-полоса.закрыт .шев{ transform:rotate(90deg); }
/* Синей рамки вокруг полосы раздела быть не должно. Браузер рисует её
   сам, когда кнопка в фокусе, и человек видит подсвеченный квадрат,
   которого не просил. Убираем её у нажатия мышью, но оставляем тем,
   кто ходит по окну с клавиатуры: иначе им не видно, где они стоят. */
.оф-полоса:focus{ outline:none; }
.оф-полоса:focus-visible{ outline:2px solid var(--край2); outline-offset:-2px; }
.оф-створка{ padding-bottom:4px; }
.оф-створка.закрыта{ display:none; }

.оф-мелко{
  padding:0 16px; margin:-2px 0 9px;
  font-size:0.7667rem; line-height:1.55; color:var(--текст3);
}

/* ── кнопки темы: одна полоса из трёх отрезков, как в боевой ──────
   Выбранный отрезок залит основным цветом, остальные прозрачные. Над
   словом стоит значок: луна, солнце, камера. Картинок с полосками
   больше нет — они занимали пол-экрана и объясняли очевидное. */
.оф-темы{
  display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px;
  margin:0 16px; padding:6px; border-radius:16px;
  border:1px solid var(--край); background:var(--поле);
}
.оф-тема{
  border:none; background:none; border-radius:12px;
  padding:10px 6px; cursor:pointer; color:var(--текст2);
  font:0.8667rem var(--шрифт); display:flex; flex-direction:column;
  align-items:center; gap:6px;
}
.оф-тема svg{ width:18px; height:18px; }
.оф-тема:hover{ color:var(--текст); }
.оф-тема.выбрана{ background:var(--синий); color:#fff; }

/* Картинка темы — три полоски на подложке. Видно, что светлое, а что
   тёмное, без единого слова. */
.оф-вид{
  width:100%; height:46px; border-radius:9px; overflow:hidden;
  display:flex; flex-direction:column; gap:4px; padding:7px 8px;
  border:1px solid rgba(128,128,128,.25);
}
.оф-вид i{ display:block; height:5px; border-radius:3px; }
.оф-вид.тьма{ background:#01010c; }   /* тот же цвет, что --фон тёмной темы */
.оф-вид.тьма i{ background:#2d3650; }
.оф-вид.тьма i:first-child{ background:#4a9eff; width:52%; }
.оф-вид.свет{ background:#f5f7fb; }
.оф-вид.свет i{ background:#c3cde0; }
.оф-вид.свет i:first-child{ background:#2563eb; width:52%; }
.оф-вид.камера{
  background:linear-gradient(130deg,#243040,#4b5a6e 45%,#1a222e);
  display:flex; align-items:center; justify-content:center;
}
.оф-вид.камера svg{ width:20px; height:20px; color:rgba(255,255,255,.75); }

/* ── цвета ──────────────────────────────────────────────────────── */
.оф-цвета{ display:flex; flex-wrap:wrap; gap:11px; padding:0 16px; }
.оф-цвет{
  width:38px; height:38px; border-radius:50%; cursor:pointer; padding:0;
  /* background:none обязателен: без него кнопка берёт серо-белый цвет
     системы, и вокруг каждого кружка появляется светлое кольцо. */
  border:2px solid transparent; background:none; position:relative;
}
.оф-цвет::after{
  content:''; position:absolute; inset:3px; border-radius:50%;
  background:var(--он);
}
.оф-цвет.радуга::after{
  background:conic-gradient(#ff4757,#fbbf24,#34d399,#22d3ee,#4a9eff,#8b7cf6,#f472b6,#ff4757);
}
.оф-цвет.пусто::after{
  background:var(--поле); border:1px solid var(--край2); box-sizing:border-box;
}
/* Обводка есть всегда, а не только у выбранного: на тёмном фоне
   тёмно-синий кружок без неё сливается с окном. У выбранного она
   светлая и толще. */
.оф-цвет{ border-color:var(--край2); }
.оф-цвет.выбран{ border-color:var(--текст); }
.оф-цвет .галка, .оф-цвет .буква{
  position:absolute; inset:0; display:flex; align-items:center;
  justify-content:center; color:#fff; font-size:0.8rem; font-weight:700;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.55));
}
.оф-цвет .галка{ display:none; }
.оф-цвет .галка svg{ width:16px; height:16px; }
.оф-цвет.выбран .галка{ display:flex; }
.оф-цвет.пусто .буква{ color:var(--текст2); }
.оф-цвет.пусто.выбран .галка{ color:var(--текст); }

/* ── семь зон окон ──────────────────────────────────────────────── */
.оф-зоны{ padding:0 16px; }
.оф-зона{
  display:flex; align-items:center; gap:10px; padding:9px 10px;
  border:1px solid var(--край); border-radius:12px; margin-bottom:8px;
  cursor:pointer; background:var(--окно);
}
.оф-зона.открыта{ border-bottom-left-radius:0; border-bottom-right-radius:0;
  margin-bottom:0; border-bottom-color:transparent; }
.оф-сброс{
  margin:0 16px 10px; width:38px; height:38px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  border:1px solid var(--край); background:var(--поле);
  color:var(--зелёный);
}
.оф-сброс:hover{ border-color:var(--зелёный); }
.оф-зона .мазок{
  width:28px; height:28px; flex:0 0 28px; border-radius:9px; padding:0;
  border:1px dashed var(--край2); background:none; cursor:pointer;
  /* Косая черта внутри пустого квадратика: «цвет не выбран», как в
     боевой. Залитый цветом квадратик её не показывает. */
  background-image:linear-gradient(to top right, transparent calc(50% - 0.5px),
                   var(--край2) calc(50% - 0.5px), var(--край2) calc(50% + 0.5px),
                   transparent calc(50% + 0.5px));
}
.оф-зона .мазок.есть{ border-style:solid; background-image:none; }
.оф-зона .тк{ flex:1; min-width:0; }
.оф-зона .тк b{ display:block; font-size:0.8667rem; font-weight:600; }
.оф-зона .тк span{
  display:block; font-size:0.7333rem; color:var(--текст3); margin-top:2px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.оф-зона .снять, .оф-зона .шев{
  width:26px; height:26px; flex:0 0 26px; padding:0; cursor:pointer;
  border:none; background:none; color:var(--текст3);
  display:flex; align-items:center; justify-content:center;
}
.оф-зона .снять svg, .оф-зона .шев svg{ width:13px; height:13px; }
.оф-ползунки{
  padding:4px 12px 10px; margin-bottom:8px;
  border:1px solid var(--край); border-top:none;
  border-radius:0 0 12px 12px; background:var(--полоса);
}
.оф-ползунки.нет{ display:none; }
.оф-ползунки.тускло{ opacity:.45; pointer-events:none; }

.оф-ряд{ display:flex; align-items:center; gap:9px; margin-top:8px; }
.оф-ряд .им{ font-size:0.7333rem; color:var(--текст3); width:92px; flex:0 0 92px; }
.оф-ряд input[type=range]{ flex:1; min-width:0; accent-color:var(--синий); }
.оф-ряд .чис{
  font-size:0.7333rem; color:var(--текст2); width:44px; text-align:right;
  flex:0 0 44px; font-variant-numeric:tabular-nums;
}

/* ── плитки: наборы значков, движение, почерк, тип ленты ────────── */
.оф-плитки{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; padding:0 16px; }
.оф-плитки.четыре{ grid-template-columns:repeat(4,1fr); }
.оф-плитки.две{ grid-template-columns:repeat(2,1fr); }
.оф-плитки.три{ grid-template-columns:repeat(3,1fr); }
.оф-плитка{
  border:1.5px solid var(--край); background:none; border-radius:12px;
  padding:9px 4px; cursor:pointer; color:var(--текст2);
  font:0.7333rem var(--шрифт); display:flex; flex-direction:column;
  align-items:center; gap:6px; text-align:center;
}
.оф-плитка:hover{ border-color:var(--край2); color:var(--текст); }
.оф-плитка.выбрана{ border-color:var(--синий); color:var(--синий);
  background:rgba(74,158,255,.1); }
.оф-плитка svg{ width:20px; height:20px; }
.оф-плитка b{ font-weight:600; font-size:0.8333rem; }
.оф-плитка span{ font-size:0.7rem; color:var(--текст3); }

.оф-подполоса{
  padding:12px 16px 7px; font-size:0.7rem; letter-spacing:.09em;
  text-transform:uppercase; color:var(--текст3);
}

/* Две кнопки голосового помощника — одним рядом; значок внутри кнопки
   держим в размере строки, иначе он растягивается на всю кнопку. */
/* Язык пожирнее: строка с флагом стоит первой в окне, и её читают
   мельком, не вчитываясь. */
.оф-поле select{ font-weight:600; }

/* Окно палитры без рамки живёт общим правилом «.голое-окно» в
   window.css: такую же палитру открывает панель смайлов, и двух
   описаний одного окна в программе быть не должно. */

/* ── камера ─────────────────────────────────────────────────────── */
.оф-гкарта.столбиком{ display:block; }
.оф-гкарта.столбиком .подпись{ display:block; margin-bottom:8px; }
.оф-вуаль .оф-ряд{ margin:0; }
.оф-вуаль .оф-ряд .им{ display:none; }
/* Карточки камеры и картинка под ними — одним столбцом, края ровно по
   полосе тем выше. */
.оф-камера{ display:flex; flex-direction:column; gap:9px; margin:10px 16px 9px; }
.оф-камера .оф-гкарта{ margin:0; }
/* «Переключить» прижата к правому краю карточки: иначе справа от неё
   остаётся пустое поле в треть ширины, и карточка выглядит недоделанной. */
.оф-камера .оф-гкарта .кнопка{ margin-left:auto; }
.оф-камокно{
  margin:0; border-radius:var(--радиус); overflow:hidden;
  background:var(--поле); border:1px solid var(--край);
  aspect-ratio:16/10; display:flex; align-items:center; justify-content:center;
}
.оф-камокно video{ width:100%; height:100%; object-fit:cover; display:none; }
.оф-камокно.есть video{ display:block; }
.оф-камокно .ждём{ font-size:0.8rem; color:var(--текст3); padding:0 14px; text-align:center; }

/* ── голосовой помощник ─────────────────────────────────────────── */
.оф-голос{ padding:0 16px; display:flex; flex-direction:column; gap:9px; }
.оф-гкарта{
  display:flex; align-items:center; gap:11px; box-sizing:border-box;
  padding:11px 14px; border-radius:var(--радиус);
  border:1px solid var(--край); background:var(--поле);
}
/* Точка микрофона мигает: красным, пока он молчит, зелёным, пока
   слушает. Моргание само говорит «я живая», и человек не думает,
   застыло окно или нет. Выключенное «Плавное появление» моргание тоже
   выключает: кому мешает движение, тому мешает и оно. */
.оф-гкарта .точка{
  width:10px; height:10px; flex:0 0 10px; border-radius:50%;
  background:var(--красный); animation:оф-мигание 1.4s ease-in-out infinite;
}
html[data-движение="нет"] .оф-гкарта .точка{ animation:none; }
@keyframes оф-мигание{
  0%, 100% { opacity:1;   transform:scale(1);    }
  50%      { opacity:.25; transform:scale(.78);  }
}
.оф-гкарта.слушает .точка{
  background:var(--зелёный); box-shadow:0 0 8px var(--зелёный);
}
.оф-гкарта .текст b{ display:block; font-size:0.9333rem; }
.оф-гкарта .текст span{ display:block; font-size:0.8rem; color:var(--текст2); margin-top:1px; }
.оф-гкарта .подпись{ font-size:0.9333rem; font-weight:600; }
.оф-гкарта select{
  margin-left:auto; max-width:56%; padding:8px 11px; font-size:0.9rem;
  font-family:inherit; background:var(--фон2); color:var(--текст);
  border:1px solid var(--край); border-radius:var(--радиус-мал); outline:none;
}
.оф-гкарта select:focus{ border-color:var(--синий); }
.оф-голос .кнопка{
  width:100%; display:flex; align-items:center; justify-content:center; gap:8px;
}
.оф-голос .кнопка svg{ width:16px; height:16px; flex:0 0 16px; }
/* «Голосовые команды» в боевой не серая: она того же цвета, что и
   главная кнопка, только не залитая. Так видно, что обе про одно. */
.оф-голос .кнопка:not(.главная){
  color:var(--синий); border-color:rgba(var(--синий-ргб),.45);
}
.оф-голос .кнопка:not(.главная):hover{ border-color:var(--синий); }

.оф-кнопки{ display:flex; gap:9px; flex-wrap:wrap; }
.оф-кнопки .кнопка{ display:flex; align-items:center; gap:7px; }
.оф-кнопки .кнопка svg{ width:15px; height:15px; flex:0 0 15px; }

/* ── курок обоев ────────────────────────────────────────────────── */
.оф-курок{
  display:flex; align-items:center; gap:11px; width:100%; cursor:pointer;
  margin:0 16px; width:calc(100% - 32px); box-sizing:border-box;
  padding:9px 13px; border-radius:12px;
  border:1px solid var(--край); background:var(--поле);
  color:var(--текст); font:inherit; font-size:0.9333rem; text-align:left;
}
.оф-курок:hover{ border-color:var(--край2); }
.оф-курок .пр{
  width:34px; height:34px; flex:0 0 34px; border-radius:9px;
  background-size:cover; background-position:center;
  border:1px solid var(--край2);
}
.оф-курок .пр.нет{ border-style:dashed; }
.оф-курок .тк{ flex:1; min-width:0; }
.оф-курок .тк b{ display:block; font-size:0.8667rem; font-weight:600; }
.оф-курок .тк span{ display:block; font-size:0.7333rem; color:var(--текст3); }
.оф-курок .уг{ display:flex; color:var(--текст3); transform:rotate(90deg); }
.оф-курок .уг svg{ width:15px; height:15px; }

/* сетка обоев в своём окошке */
.оф-обои{ display:grid; grid-template-columns:repeat(4,1fr); gap:9px; }
.оф-обой{
  aspect-ratio:9/16; border-radius:11px; cursor:pointer; padding:0;
  border:2px solid transparent; background-size:cover; background-position:center;
  position:relative; color:var(--текст3); font:0.7rem var(--шрифт);
  display:flex; align-items:flex-end; justify-content:center;
}
.оф-обой.тут{ border-color:var(--синий); }
.оф-обой i{
  position:absolute; left:0; right:0; bottom:0; padding:4px 2px;
  font-style:normal; font-size:0.6667rem; color:#dbe4f7;
  background:linear-gradient(transparent,rgba(0,0,0,.55));
  border-radius:0 0 9px 9px;
}
.оф-обой.пусто{ border:2px dashed var(--край2); background:var(--поле); }
.оф-обой.пусто.фото{ color:var(--синий); }
/* Пустые плитки не должны быть просто дырой: в середине значок —
   перечёркнутый круг у «Без обоев» и камера у «Фото». */
.оф-обой .зн{
  position:absolute; inset:0; display:flex;
  align-items:center; justify-content:center; color:var(--текст3);
}
.оф-обой.пусто.фото .зн{ color:var(--синий); }
.оф-обой.пусто i{ background:none; color:var(--текст3); }
.оф-обой.пусто.фото i{ color:var(--синий); }
/* Полки в окне выбора: подпись над каждой сеткой. В окне отступы по
   бокам уже есть, поэтому подполоса тут без своих. */
.оф-обои-полки .оф-подполоса{ padding-left:0; margin-top:14px; }
.оф-обои-полки .оф-подполоса:first-child{ margin-top:0; }

/* ── образцы ────────────────────────────────────────────────────── */
.оф-образец{
  margin:9px 16px 0; padding:14px; border-radius:14px;
  background:var(--полоса); border:1px solid var(--край);
}
.оф-образец .пара{ display:flex; gap:8px; margin-bottom:10px; }
.оф-образец .мой{
  margin-left:auto; background:var(--пузырь); color:#fff;
  border-radius:14px 14px 4px 14px; padding:8px 12px;
  font-size:calc(0.9333rem * var(--пер-доля,1));
}
.оф-образец .чужой{
  background:var(--пузырь2); color:var(--текст);
  border-radius:14px 14px 14px 4px; padding:8px 12px;
  font-size:calc(0.9333rem * var(--пер-доля,1));
}
html[data-пер-цвет="свой"] .оф-образец .чужой{ color:var(--пер-цвет); }

.оф-курс{
  margin:9px 16px 0; padding:10px 14px; border-radius:12px;
  background:var(--полоса); border:1px solid var(--край);
  display:flex; gap:18px; font-size:0.7667rem; flex-wrap:wrap;
}
.оф-курс .сим{ color:var(--текст3); letter-spacing:.07em; font-weight:600;
  margin-right:6px; }
.оф-курс .цена{ color:var(--текст); font-weight:600; }
html[data-цена-цвет="свой"] .оф-курс .цена{ color:var(--цена-цвет); }
.оф-курс .вверх{ color:var(--зелёный); margin-left:6px; }
.оф-курс .вниз{ color:var(--красный); margin-left:6px; }

/* ── размер текста ──────────────────────────────────────────────── */
.оф-размеры{ display:flex; gap:9px; padding:0 16px; align-items:flex-end; }
.оф-размер{
  flex:1; border:1.5px solid var(--край); background:none; cursor:pointer;
  border-radius:12px; padding:12px 6px; color:var(--текст2);
  font-family:var(--шрифт);
}
.оф-размер:hover{ border-color:var(--край2); color:var(--текст); }
.оф-размер.выбран{ border-color:var(--синий); color:var(--синий); }
.оф-размер .А{ display:block; font-weight:600; margin-bottom:4px; }
.оф-размер .п{ display:block; font-size:0.7333rem; }

.оф-поле{ padding:0 16px; }
.оф-строка{ padding:0 16px; }

/* палитра в своём окошке */
.оф-палитра{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(26px,1fr));
  gap:7px; max-height:min(400px, calc(100vh - 260px)); overflow-y:auto; padding:2px;
}
.оф-капля{
  aspect-ratio:1; border-radius:50%; cursor:pointer; padding:0;
  border:2px solid transparent;
  box-shadow:inset 0 0 0 1px rgba(128,128,128,.25);
}
.оф-капля:hover{ transform:scale(1.12); }
.оф-капля.тут{ border-color:var(--текст); }

</style>

<script>
'use strict';

CW.оболочка('theme').then(function (место) {

var О = CW.оформление;

/* Название каждого языка пишем на нём самом: человек, ищущий турецкий,
   ищет глазами «Türkçe», а не «Турецкий». Список стоит здесь, наверху,
   а не рядом с функцией языки(): объявление ниже первого вызова — это
   undefined в самый нужный момент, и именно на этом окно и падало. */
/* Флажок перед названием: в списке из шестнадцати строк глаз цепляется
   за картинку раньше, чем читает слово, а «中文» и «한국어» без флага
   для непривычного глаза просто узор. Флаг — пара букв в особой
   азбуке, своего файла с картинками не надо. */
var ФЛАГИ = {
  en:'🇬🇧', ru:'🇷🇺', es:'🇪🇸', zh:'🇨🇳',
  fr:'🇫🇷', uk:'🇺🇦', de:'🇩🇪', it:'🇮🇹',
  pt:'🇵🇹', pl:'🇵🇱', tr:'🇹🇷', ar:'🇸🇦',
  vi:'🇻🇳', ja:'🇯🇵', ko:'🇰🇷', hi:'🇮🇳'
};

var ИМЕНА = {
  en:'English',  ru:'Русский',   es:'Español',   zh:'中文',
  fr:'Français', uk:'Українська', de:'Deutsch',  it:'Italiano',
  pt:'Português', pl:'Polski',   tr:'Türkçe',    ar:'العربية',
  vi:'Tiếng Việt', ja:'日本語',   ko:'한국어',     hi:'हिन्दी'
};

/* Какие створки открыты. Семь разделов из одиннадцати открыты сразу, а
   «Окна» и «Значки» свёрнуты: каждый из них — это семь и четырнадцать
   строк, и с ними открытыми всё остальное уезжает за край экрана. */
/* Какие разделы человек раскрыл. Пусто — значит все свёрнуты: окно
   открывается оглавлением. Раскрытые так и остаются, пока их не
   закроют, и их может быть сколько угодно сразу. */
var СТВОРКИ = {};

место.appendChild(ок('div', 'пусто-строка',
  'Оформление открыто отдельным окном. Закрой его, чтобы вернуться.'));

var ОКНО = CW.стойка({
  имя: 'оформление',
  знак: 'палитра',
  /* Знак голый, без квадратика, и подписи под названием нет: в шапке
     одно слово «Оформление». Что здесь видно сразу и сохранять не надо,
     человек понимает с первого же щелчка по цвету. */
  заголовок: 'Оформление',
  назад: уйти,
  /* Крестик, а не стрелка: окно открыто поверх своего же списка и
     закрывается на месте, никуда не уводя. */
  крест: true,
  /* Высота по содержимому: все разделы свёрнуты, и во всю высоту экрана
     под последней полосой оставалась пустая половина окна в рамке. */
  поРосту: true,
  поля: false,
  кнопки: [{ имя: 'сброс', зн: 'повтор', подсказка: 'Вернуть как было',
             делать: сбросить }]
});
ОКНО.открыть();

/* Выбор, сделанный на другом устройстве, подтягиваем молча: если здесь
   человек уже выбирал, его выбор главнее. */
О.сервером().then(нарисовать);
нарисовать();

/* ═══════════════════════════════════════════════════════════════════════
   ЧТО ВИДНО
   ═══════════════════════════════════════════════════════════════════════ */
function нарисовать() {
  var с = О.взять();
  var т = ОКНО.тело;
  var где = т.scrollTop;
  т.innerHTML = '';

  раздел(т, 'Язык приложения', язык(с));
  раздел(т, 'Тема',            тема(с));
  раздел(т, 'Цвет основной',   цветОсновной(с));
  раздел(т, 'Цвет значков',    цветЗначков(с));
  раздел(т, 'Окна',            окна(с));
  раздел(т, 'Значки',          значки(с));
  раздел(т, 'Обои',            обои(с));
  раздел(т, 'Текст в переписке', текстПереписки(с));
  раздел(т, 'Лента курса',     лента(с));
  раздел(т, 'Голосовой помощник', голос(с));
  /* Размер текста и движение стоят внизу нарочно: это две вещи, которые
     выбирают один раз и больше не трогают. */
  раздел(т, 'Размер текста',   размерТекста(с));
  раздел(т, 'Движение',        движение(с));
  раздел(т, 'Рекламы в блоках меню', полкаСправа(с));

  var хвост = ок('div');
  хвост.style.height = '18px';
  т.appendChild(хвост);
  т.scrollTop = где;
}

/* Кнопка «сбросить всё в этом разделе»: кружок с зелёным перечёркнутым
   значком, как в боевой. Стоит первой строкой раздела — до того, что
   она сбрасывает. */
function кнопкаСброса(подсказка, делать) {
  var б = ок('button', 'оф-сброс');
  б.title = подсказка;
  б.innerHTML = CW.значок('сброс', 17);
  б.onclick = делать;
  return б;
}

/* Полоса раздела со шевроном и створка под ней.

   Все разделы свёрнуты по умолчанию: окно открывается оглавлением, а не
   свитком в три экрана. Раскрыл один или сразу несколько — так и
   остаются, пока человек сам их не закроет: правило то же, что у полок
   в «Создать куб». */
function раздел(куда, имя, что) {
  var открыт = СТВОРКИ[имя] === true;
  /* Второй класс — общий на всю программу: он даёт полосе буквы, цвет
     и шеврон, одинаковые с полками в других окнах. */
  var полоса = ок('button', 'оф-полоса вщ-шапка' + (открыт ? '' : ' закрыт'));
  полоса.innerHTML = '<span>' + имя + '</span>'
                   + '<span class="шев">' + CW.значок('шеврон') + '</span>';
  var створка = ок('div', 'оф-створка' + (открыт ? '' : ' закрыта'));
  створка.appendChild(что);
  полоса.onclick = function () {
    СТВОРКИ[имя] = !открыт;
    полоса.classList.toggle('закрыт', открыт);
    створка.classList.toggle('закрыта', открыт);
    открыт = !открыт;
  };
  куда.appendChild(полоса);
  куда.appendChild(створка);
}

/* ═══════════════════════════════════════════════════════════════════════
   ЯЗЫК ПРИЛОЖЕНИЯ

   Словарь на 16 языков уже есть (shared/words.js) — им пользуются
   титулка и тарифы. Здесь он один на всю программу.
   ═══════════════════════════════════════════════════════════════════════ */
function язык(с) {
  var гнездо = ок('div', 'оф-поле');
  var поле = ок('div', 'ок-поле');
  /* Строки «Как в системе» нет: система говорит на чём угодно, а
     программа должна открыться на понятном языке. По умолчанию
     русский, остальные пятнадцать рядом. */
  var выбор = '<select>';
  языки().forEach(function (я) {
    выбор += '<option value="' + я.код + '"'
           + ((с.язык || 'ru') === я.код ? ' selected' : '') + '>'
           + (ФЛАГИ[я.код] ? ФЛАГИ[я.код] + ' ' : '') + я.имя + '</option>';
  });
  поле.innerHTML = выбор + '</select>';
  поле.querySelector('select').onchange = function () {
    /* Язык программа читает из своей памяти (CW.язык), а оформление
       помнит выбор для «Оформления». Пишем в оба, иначе список здесь
       показывает одно, а экраны говорят на другом. */
    CW.язык(this.value || 'ru');
    сменить({ язык: this.value });
    CW.сказать('Язык сменится на всех экранах после перезагрузки');
  };
  гнездо.appendChild(поле);
  return гнездо;
}

/* ═══════════════════════════════════════════════════════════════════════
   ТЕМА
   ═══════════════════════════════════════════════════════════════════════ */
function тема(с) {
  var гнездо = ок('div');
  var темы = ок('div', 'оф-темы');
  [['тёмная', 'Тёмная', 'луна'],
   ['светлая', 'Светлая', 'солнце'],
   ['камера', 'Камера', 'камера']].forEach(function (п) {
    var б = ок('button', 'оф-тема' + (с.тема === п[0] ? ' выбрана' : ''));
    б.innerHTML = CW.значок(п[2], 18) + '<span>' + п[1] + '</span>';
    б.onclick = function () { сменить({ тема: п[0] }); };
    темы.appendChild(б);
  });
  гнездо.appendChild(темы);

  if (с.тема !== 'камера') return гнездо;

  /* ── настройка камеры ──
     Всё в одном столбце с теми же полями по бокам, что у полосы тем
     выше: раньше карточки лежали без полей и были шире картинки, и
     левый край гулял по всему разделу. */
  var столб = ок('div', 'оф-камера');
  var ряд = ок('div', 'оф-гкарта');
  ряд.innerHTML = '<div class="текст"><b>Какая камера</b><span>'
                + ((с.камера.какая === 'задняя') ? 'Задняя' : 'Передняя')
                + '</span></div>';
  var пере = ок('button', 'кнопка');
  пере.textContent = 'Переключить';
  пере.onclick = function () {
    сменить({ камера: { какая: с.камера.какая === 'задняя' ? 'передняя' : 'задняя' } });
  };
  ряд.appendChild(пере);
  столб.appendChild(ряд);

  /* Затемнение своей карточкой: название сверху, ползунок во всю
     ширину под ним. Строчку «чем выше, тем лучше читается» убрала —
     это и так видно по картинке, которая теперь прямо здесь. */
  var вуаль = ок('div', 'оф-гкарта столбиком');
  вуаль.appendChild(ок('b', 'подпись', 'Затемнение поверх картинки'));
  var пв = ок('div', 'оф-вуаль');
  пв.appendChild(ползунок('', с.камера.вуаль, 10, 85, '%', function (в) {
    О.поставить({ камера: { вуаль: в } });
  }));
  вуаль.appendChild(пв);
  столб.appendChild(вуаль);

  /* Окошко с картинкой: тот же поток, что стоит за окнами. Второй раз
     камеру не открываем. Пока разрешения нет, вместо картинки честная
     строка, а не чёрный прямоугольник. */
  столб.appendChild(окошкоКамеры());
  гнездо.appendChild(столб);

  гнездо.appendChild(мелко('Камера сажает батарею, поэтому она сама выключается, '
    + 'когда вкладка уходит из виду, и включается обратно при возврате. '
    + 'Не использовать когда 1% и не заряжать с камерой при 1% заряда!'));
  return гнездо;
}

/* Живое окошко камеры. Поток берём у theme.js: он уже открыл камеру для
   фона. Пока потока нет (не дали разрешения или камера ещё заводится),
   показываем строку и ждём: проверяем раз в полсекунды, но не дольше
   десяти — незачем крутить таймер под закрытой створкой. */
function окошкоКамеры() {
  var рамка = ок('div', 'оф-камокно');
  var ждём = ок('div', 'ждём', 'Жду картинку с камеры…');
  рамка.appendChild(ждём);

  var видео = document.createElement('video');
  видео.muted = true;
  видео.playsInline = true;
  видео.setAttribute('playsinline', '');
  рамка.appendChild(видео);

  var попыток = 0;
  function взять() {
    var п = CW.оформление.потокКамеры && CW.оформление.потокКамеры();
    if (п) {
      видео.srcObject = п;
      var игра = видео.play();
      if (игра && игра.catch) игра.catch(function () {});
      рамка.classList.add('есть');
      ждём.remove();
      return;
    }
    if (++попыток > 20) {
      ждём.textContent = 'Камера не включилась: браузер не дал разрешения.';
      return;
    }
    setTimeout(взять, 500);
  }
  взять();
  return рамка;
}

/* ═══════════════════════════════════════════════════════════════════════
   ЦВЕТА

   Первый кружок — радуга: за ним палитра на 128, где берётся любой свой
   цвет. Дальше шесть готовых.
   ═══════════════════════════════════════════════════════════════════════ */
function цветОсновной(с) {
  var гнездо = ок('div');
  гнездо.appendChild(рядЦветов(с.цвет, false, function (знач) {
    сменить({ цвет: знач });
  }));
  return гнездо;
}

function цветЗначков(с) {
  var гнездо = ок('div');
  /* Серый кружок «как основной» убран: в обоих рядах по семь кружков,
     шесть готовых цветов и радуга. Вернуть значкам цвет кнопок можно
     зелёным кружком сброса, а не отдельной серой каплей. */
  гнездо.appendChild(рядЦветов(с.значки, false, function (знач) {
    сменить({ значки: знач });
  }));
  return гнездо;
}

function рядЦветов(выбран, сПустым, выбрать) {
  var ряд = ок('div', 'оф-цвета');

  /* Радуга — не цвет, а дверь в палитру. */
  var радуга = ок('button', 'оф-цвет радуга'
                 + (выбран && !О.ЦВЕТА[выбран] && выбран !== '' ? ' выбран' : ''));
  радуга.title = 'Свой цвет';
  радуга.innerHTML = '<span class="галка">' + CW.значок('галка') + '</span>';
  радуга.onclick = function () { палитра(выбран, выбрать); };
  ряд.appendChild(радуга);

  if (сПустым) {
    var пусто = ок('button', 'оф-цвет пусто' + (!выбран ? ' выбран' : ''));
    пусто.title = 'Как основной';
    пусто.innerHTML = '<span class="буква">A</span>'
                    + '<span class="галка">' + CW.значок('галка') + '</span>';
    пусто.onclick = function () { выбрать(''); };
    ряд.appendChild(пусто);
  }

  Object.keys(О.ЦВЕТА).forEach(function (имя) {
    var ц = О.ЦВЕТА[имя];
    var б = ок('button', 'оф-цвет' + (выбран === имя ? ' выбран' : ''));
    б.style.setProperty('--он', ц.знач);
    б.title = ц.подпись;
    б.innerHTML = '<span class="галка">' + CW.значок('галка') + '</span>';
    б.onclick = function () { выбрать(имя); };
    ряд.appendChild(б);
  });
  return ряд;
}

/* ── СВОЙ ЦВЕТ ────────────────────────────────────────────────────────
   Палитра тут та же, что в окне значка куба и в строке «Цвет куба»:
   квадрат насыщенности, радужный ползунок, пипетка, поля R, G, B и
   строка «#». Раньше здесь лежали 128 готовых капель — своего цвета в
   них не было, а называлось это «Свой цвет».

   Без шапки и без рамки: на экране только сама серая карточка палитры.
   Название «Свой цвет» и крестик были лишними — карточку видно, что
   она палитра, а закрывает её «Готово», касание мимо и Escape.

   Цвет применяется сразу, на каждое движение: окно «Оформление» тем и
   живёт, что видно без сохранения. «Вернуть» в палитре возвращает тот
   цвет, с которым её открыли, «Готово» закрывает.

   Палитра приезжает по просьбе: она лежит в общем файле выбора знака.
   Не приехала — честно говорим, а не молчим. */
function палитра(выбран, выбрать) {
  CW.нужен('shared/выбор-знака.js').then(function () {
    var П = CW.модалка({
      имя: 'палитра-оформления',
      шапка: false,
      поля: false,
      узкое: true
    });
    П.окно.classList.add('голое-окно');
    /* Палитра говорит «цвет поменялся» и в тот миг, когда её только
       собрали. Раньше от этого открытие окна само перекрашивало всё в
       свой запасной синий, хотя человек ещё ничего не трогал. Первый
       возглас пропускаем: красим только то, что двигали руками. */
    var первый = true;
    var п = CW.палитраЦвета(П.тело, {
      цвет: (выбран && String(выбран).charAt(0) === '#') ? выбран : '#0095F6',
      меняется: function (ц) {
        if (первый) { первый = false; return; }
        выбрать(ц);
      },
      закрыли: function () { П.убрать(); }
    });
    /* Вид «в окне»: карточка стоит в потоке и во всю ширину, с полями
       R, G, B. Всплывающей ей здесь не над чем висеть. */
    if (п && п.узел) п.узел.classList.add('в-окне');
    П.открыть();
  }).catch(function () { CW.сказать('Палитра не приехала'); });
}

/* ═══════════════════════════════════════════════════════════════════════
   ОКНА: СЕМЬ ЗОН, У КАЖДОЙ ЦВЕТ И ЧЕТЫРЕ ПОЛЗУНКА

   В боевой зон было три и один ползунок прозрачности на каждую. Стало
   семь, а у каждой: прозрачность, тонирование (темнее ↔ светлее),
   насыщенность и размытие за окном. Чтобы это помещалось, ряд — одна
   строка, а ползунки живут в створке: открыта всегда одна.
   ═══════════════════════════════════════════════════════════════════════ */
var ЗОНА_ОТКРЫТА = 0;

function окна(с) {
  var гнездо = ок('div');

  /* Кнопка сброса над списком: возвращает все семь зон «как есть».
     Абзац с объяснением убран — то же самое видно по самим строкам. */
  гнездо.appendChild(кнопкаСброса('Сбросить все зоны', function () {
    /* Чистим зону целиком: и краску, и все четыре ползунка. Если
       оставить одну краску, у зоны останется прозрачность или блюр от
       прежней затеи, и «как есть» будет неправдой. */
    var пусто = {};
    О.ЗОНЫ.forEach(function (з) {
      var з0 = { ц: '' };
      О.СВОЙСТВА.forEach(function (св) { з0[св.к] = св.по; });
      пусто[з.н] = з0;
    });
    ЗОНА_ОТКРЫТА = 0;
    сменить({ окна: пусто });
    CW.сказать('Окна как есть');
  }));

  var список = ок('div', 'оф-зоны');
  О.ЗОНЫ.forEach(function (з) {
    var своё = с.окна[з.н] || {};
    var есть = !!своё.ц;
    var открыта = ЗОНА_ОТКРЫТА === з.н;

    var ряд = ок('div', 'оф-зона' + (открыта ? ' открыта' : ''));
    ряд.innerHTML =
        '<button type="button" class="мазок' + (есть ? ' есть' : '') + '" title="Цвет"></button>'
      + '<span class="тк"><b>' + з.имя + '</b><span>' + з.что + '</span></span>'
      + '<button type="button" class="снять" title="Как есть">'
      +   CW.рисунок('M6 6 18 18M18 6 6 18', 13) + '</button>'
      + '<button type="button" class="шев" title="Ползунки">'
      +   CW.значок('шеврон') + '</button>';

    var мазок = ряд.querySelector('.мазок');
    if (есть) мазок.style.background = своё.ц;
    мазок.onclick = function (е) {
      е.stopPropagation();
      палитра(своё.ц, function (ц) { зону(з.н, { ц: ц }); });
    };
    ряд.querySelector('.снять').onclick = function (е) {
      е.stopPropagation();
      зону(з.н, { ц: '', a: 100, t: 0, s: 100, b: 0 });
    };
    ряд.onclick = function () {
      ЗОНА_ОТКРЫТА = открыта ? 0 : з.н;
      нарисовать();
    };
    список.appendChild(ряд);

    var полка = ок('div', 'оф-ползунки' + (открыта ? '' : ' нет')
                        + (есть ? '' : ' тускло'));
    О.СВОЙСТВА.forEach(function (п) {
      полка.appendChild(ползунок(п.имя, своё[п.к], п.мин, п.макс, п.ед,
        function (в) { О.поставить({ окна: подЗону(з.н, п.к, в) }); },
        п.к === 't'));
    });
    список.appendChild(полка);
  });
  гнездо.appendChild(список);

  /* Второй кнопки сброса внизу нет: ровно это делает зелёный кружок
     в начале раздела. */
  return гнездо;
}

function подЗону(н, ключ, знач) {
  var о = {}; о[н] = {}; о[н][ключ] = знач;
  return о;
}
function зону(н, что) {
  var о = {}; о[н] = что;
  /* Выбрал цвет — сразу открываем ползунки этой зоны: дальше человек
     почти всегда убавляет прозрачность, и лишний раз искать шеврон не
     нужно. Снял краску — створка закрывается, подгонять нечего. */
  ЗОНА_ОТКРЫТА = что.ц ? н : 0;
  сменить({ окна: о });
}

/* ═══════════════════════════════════════════════════════════════════════
   ЗНАЧКИ

   Наши значки нарисованы линиями, а не набраны шрифтом. Поэтому «набор»
   у нас — это толщина линии и заливка одного и того же рисунка, а не
   чужой шрифт с чужого сервера: в боевой девять плиток из десяти ждали
   Material Symbols — около десяти мегабайт, которые чаще не приезжали
   вовсе, и выбрать было нечего.
   ═══════════════════════════════════════════════════════════════════════ */
function значки(с) {
  var гнездо = ок('div');
  var зн = с.знаки;

  гнездо.appendChild(кнопкаСброса('Сбросить значки', function () {
    сменить({ знаки: { набор: 'простые', движение: 'нет', почерк: 'обычный',
                       размер: 100, скорость: 40, размах: 30, сила: 70 } });
    CW.сказать('Значки как были');
  }));

  гнездо.appendChild(подполоса('На месте'));
  var наборы = ок('div', 'оф-плитки');
  О.НАБОРЫ.forEach(function (н) {
    var б = ок('button', 'оф-плитка' + (зн.набор === н.к ? ' выбрана' : ''));
    б.innerHTML = образецЗнака(н.к) + '<span>' + н.имя + '</span>';
    б.onclick = function () { сменить({ знаки: { набор: н.к } }); };
    наборы.appendChild(б);
  });
  гнездо.appendChild(наборы);

  гнездо.appendChild(подполоса('В движении'));
  var движ = ок('div', 'оф-плитки');
  О.ДВИЖЕНИЯ.filter(function (д) { return д.к !== 'нет'; }).forEach(function (д) {
    var б = ок('button', 'оф-плитка' + (зн.движение === д.к ? ' выбрана' : ''));
    б.innerHTML = CW.значок('куб') + '<span>' + д.имя + '</span>';
    б.onclick = function () {
      /* Нажали на выбранное — движение выключается. Отдельной кнопки
         «без движения» нет нарочно: она занимала бы шестую плитку в
         ряду из пяти и ломала бы ряд. */
      сменить({ знаки: { движение: зн.движение === д.к ? 'нет' : д.к } });
    };
    движ.appendChild(б);
  });
  гнездо.appendChild(движ);

  гнездо.appendChild(подполоса('Почерк'));
  var поч = ок('div', 'оф-плитки четыре');
  О.ПОЧЕРКИ.forEach(function (п) {
    var б = ок('button', 'оф-плитка' + (зн.почерк === п.к ? ' выбрана' : ''));
    б.innerHTML = '<b>' + п.имя + '</b>';
    б.onclick = function () { сменить({ знаки: { почерк: п.к } }); };
    поч.appendChild(б);
  });
  гнездо.appendChild(поч);

  var полка = ок('div', 'оф-строка');
  О.ПОЛЗУНКИ.forEach(function (п) {
    полка.appendChild(ползунок(п.имя, зн[п.к], п.мин, п.макс, '%', function (в) {
      var о = {}; о[п.к] = в;
      О.поставить({ знаки: о });
    }));
  });
  гнездо.appendChild(полка);
  return гнездо;
}

/* Образец набора рисуем тем же значком, но с толщиной линии этого
   набора: иначе все пять плиток выглядят одинаково. */
function образецЗнака(набор) {
  var толщина = { простые: 1.7, контур: 1.1, жирные: 2.5,
                  залитые: 1.5, двойные: 1.2 }[набор] || 1.7;
  var заливка = { залитые: .22, двойные: .4 }[набор] || 0;
  return CW.значок('куб').replace('stroke-width="1.7"', 'stroke-width="' + толщина + '"')
         .replace(/<path /g, '<path fill="currentColor" fill-opacity="' + заливка + '" ');
}

/* ═══════════════════════════════════════════════════════════════════════
   ОБОИ

   Обои лежат за перепиской и не едут вместе с ней. Цвет зоны «Тело окна»
   остаётся сверху подкраской — поэтому у него и есть прозрачность.
   ═══════════════════════════════════════════════════════════════════════ */
function обои(с) {
  var гнездо = ок('div');
  var курок = ок('button', 'оф-курок');
  var свои = /^data:/.test(с.обои || '');

  курок.innerHTML = '<span class="пр' + (с.обои ? '' : ' нет') + '"></span>'
    + '<span class="тк"><b>Обои для чатов</b><span>' + имяОбоев(с) + '</span></span>'
    + '<span class="уг">' + CW.значок('шеврон') + '</span>';
  var пр = курок.querySelector('.пр');
  if (с.обои) пр.style.backgroundImage = с.обоиФон || ('url("' + с.обои + '")');
  курок.onclick = выбратьОбои;
  гнездо.appendChild(курок);
  if (свои) {
    гнездо.appendChild(мелко('Своё фото живёт только в этом браузере: это строка '
      + 'на полмегабайта и больше, и на сервер мелких настроек её не кладут. '
      + 'На другом устройстве обои придётся выбрать ещё раз.'));
  }
  return гнездо;
}

/* Имя выбранных обоев для строки под названием. Список может быть ещё
   не приехавшим — тогда честно говорим «Обои стоят», а не врём «Без
   обоев»: фон-то на экране есть. */
function имяОбоев(с) {
  if (!с.обои) return 'Без обоев';
  if (/^data:/.test(с.обои)) return 'Своё фото';
  var о = CW.обоиПо && CW.обоиПо(с.обои);
  return о ? о.имя : 'Обои стоят';
}

/* ── ОКНО ВЫБОРА ──────────────────────────────────────────────────────
   Полки те же, что в боевой: «Своё», «Тёмные», «Светлые», «Прежние».
   Сам список приезжает по просьбе: сто двадцать килобайт возить на
   каждой странице незачем. */
function выбратьОбои() {
  CW.нужен('shared/обои.js')
    .then(окноОбоев)
    .catch(function () { CW.сказать('Обои не приехали'); });
}

function окноОбоев() {
  var Б = CW.модалка({
    имя: 'обои',
    знак: 'картинка',
    заголовок: 'Обои для чатов',
    крест: true
    /* Кнопки «Своё фото» в шапке нет: ровно это делает плитка «+ Фото»
       на первой полке, а две двери в одно и то же только путают. */
  });

  Б.тело.innerHTML = '<div class="оф-обои-полки"></div>'
    + '<div class="кб-примечание">Обои лежат за перепиской и не едут вместе с ней. '
    + 'Своё фото обрежется по центру под 9:16 и ужмётся до 720 точек в ширину.</div>';

  var полки = Б.тело.querySelector('.оф-обои-полки');

  /* Плитку собираем узлом, а не строкой: в строке фона стоит
     url("data:…") со своими кавычками, и внутри атрибута style="…"
     такая строка рвёт разметку — картинка просто не появляется. */
  function плитка(о, что) {
    var б = ок('button', 'оф-обой' + (что === о.к ? ' тут' : '') + (о.к ? '' : ' пусто'));
    б.type = 'button';
    б.dataset.о = о.к;
    if (о.п) б.style.backgroundImage = о.п;
    б.innerHTML = (о.к ? '' : '<span class="зн">' + CW.значок('сброс', 26) + '</span>')
                + '<i>' + о.имя + '</i>';
    return б;
  }

  function своя(что, фото) {
    var б = ок('button', 'оф-обой' + (фото ? ' тут' : ' пусто фото'));
    б.type = 'button';
    б.dataset.о = фото ? 'своё' : '+фото';
    if (фото) б.style.backgroundImage = 'url("' + что + '")';
    б.innerHTML = (фото ? '' : '<span class="зн">' + CW.значок('камера', 26) + '</span>')
                + '<i>' + (фото ? 'Своё' : 'Фото') + '</i>';
    return б;
  }

  function нарисоватьОбои() {
    var с = О.взять();
    var что = с.обои;
    полки.innerHTML = '';
    [['своё', 'Своё'], ['тёмные', 'Тёмные'],
     ['светлые', 'Светлые'], ['прежние', 'Прежние']].forEach(function (п) {
      var свои = CW.ОБОИ.filter(function (о) { return о.г === п[0]; });
      if (!свои.length) return;
      полки.appendChild(ок('div', 'оф-подполоса', п[1]));
      var сетка = ок('div', 'оф-обои');
      свои.forEach(function (о) { сетка.appendChild(плитка(о, что)); });
      /* Своё фото встаёт второй плиткой на первой полке — рядом с
         «Без обоев», как в боевой. */
      if (п[0] === 'своё') сетка.appendChild(своя(что, /^data:/.test(что || '')));
      полки.appendChild(сетка);
    });
  }
  нарисоватьОбои();

  полки.onclick = function (е) {
    var к = е.target.closest('.оф-обой');
    if (!к) return;
    if (к.dataset.о === 'своё') return;
    if (к.dataset.о === '+фото') { поле.click(); return; }
    var о = CW.обоиПо(к.dataset.о);
    сменить({ обои: к.dataset.о, обоиФон: (о && о.п) || '' });
    нарисоватьОбои();
  };

  var поле = document.createElement('input');
  поле.type = 'file';
  поле.accept = 'image/*';
  поле.style.display = 'none';
  Б.тело.appendChild(поле);
  поле.onchange = function () {
    var ф = поле.files && поле.files[0];
    поле.value = '';
    if (!ф) return;
    ужать(ф, 720).then(function (адрес) {
      сменить({ обои: адрес, обоиФон: 'url("' + адрес + '")' });
      нарисоватьОбои();
      CW.сказать('Обои поставлены');
    }).catch(function () { CW.сказать('Эту картинку прочитать не вышло'); });
  };

  Б.открыть();
}

/* Своё фото ужимаем до 720 точек по ширине: обои лежат за перепиской,
   и полная фотография с телефона весила бы больше, чем вся программа. */
/* Общая: shared/ui.js. Обои ужимаем до 720 точек — полная фотография
   с телефона весила бы больше, чем вся программа. */
function ужать(файл, бок) { return CW.ужать(файл, бок, 0.72); }

/* ═══════════════════════════════════════════════════════════════════════
   ТЕКСТ В ПЕРЕПИСКЕ
   ═══════════════════════════════════════════════════════════════════════ */
function текстПереписки(с) {
  var гнездо = ок('div');

  /* Сначала цвет, под ним шкала размера: так просила хозяйка
     программы, и так же стоят ряды выше. */
  гнездо.appendChild(рядЦветов(с.переписка.цвет, false, function (знач) {
    сменить({ переписка: { цвет: знач } });
  }));

  var полоска = ок('div', 'оф-строка');
  полоска.appendChild(ползунок('Размер', с.переписка.размер, 85, 135, '%', function (в) {
    О.поставить({ переписка: { размер: в } });
  }, false, 5));
  гнездо.appendChild(полоска);

  var образец = ок('div', 'оф-образец');
  образец.innerHTML =
      '<div class="пара"><span class="чужой">Привет! Так будет выглядеть сообщение</span></div>'
    + '<div class="пара"><span class="мой">А так: твоё</span></div>';
  гнездо.appendChild(образец);
  return гнездо;
}

/* ═══════════════════════════════════════════════════════════════════════
   ЛЕНТА КУРСА

   Цены берём только у своего сервера: /prices для крипты и /markets для
   акций. Браузер наружу не ходит — у бесплатных источников нет ключей,
   зато есть ограничение частоты, и спрашивать с каждой вкладки нельзя.

   Про задержку говорим честно: бесплатные биржевые цены приходят с
   опозданием, обычно 15–20 минут. Это не наша задержка и убрать её
   нельзя: живые котировки стоят денег и требуют договора с биржей.
   ═══════════════════════════════════════════════════════════════════════ */
function лента(с) {
  var гнездо = ок('div');
  /* Третья плитка «Пустой» выключает ленту совсем: кому цены не нужны,
     тому не нужна и бегущая строка внизу экрана. */
  var плитки = ок('div', 'оф-плитки три');
  [['крипта', 'Крипта', 'BTC · ETH · SOL и ещё 27'],
   ['акции',  'Акции',  'GOLD · BRENT · DXY · AAPL'],
   ['пусто',  'Пустой', 'Без бегущей строки']].forEach(function (п) {
    var б = ок('button', 'оф-плитка' + (с.лента.вид === п[0] ? ' выбрана' : ''));
    б.innerHTML = '<b>' + п[1] + '</b><span>' + п[2] + '</span>';
    б.onclick = function () { сменить({ лента: { вид: п[0] } }); };
    плитки.appendChild(б);
  });
  гнездо.appendChild(плитки);

  if (с.лента.вид === 'пусто') return гнездо;

  гнездо.appendChild(подполоса('Цвет цены'));
  гнездо.appendChild(рядЦветов(с.лента.цвет, false, function (знач) {
    сменить({ лента: { цвет: знач } });
  }));

  var образец = ок('div', 'оф-курс');
  образец.innerHTML = с.лента.вид === 'акции'
    ? '<span><span class="сим">GOLD</span><span class="цена">2 412</span>'
      + '<span class="вверх">+0.41%</span></span>'
      + '<span><span class="сим">AAPL</span><span class="цена">214.60</span>'
      + '<span class="вниз">-0.35%</span></span>'
    : '<span><span class="сим">BTC</span><span class="цена">68 420</span>'
      + '<span class="вверх">+1.84%</span></span>'
      + '<span><span class="сим">ETH</span><span class="цена">3240.50</span>'
      + '<span class="вниз">-0.62%</span></span>';
  гнездо.appendChild(образец);

  return гнездо;
}

/* ═══════════════════════════════════════════════════════════════════════
   ГОЛОСОВОЙ ПОМОЩНИК
   ═══════════════════════════════════════════════════════════════════════ */
function голос(с) {
  var гнездо = ок('div', 'оф-голос');
  var беда = CW.голос && CW.голос.беда ? CW.голос.беда() : '';
  var идёт = !!(CW.голос && CW.голос.идёт && CW.голос.идёт());

  /* Карточка микрофона: кружок слева говорит состояние быстрее слова.
     Красный — молчит, зелёный — слушает. */
  var карта = ок('div', 'оф-гкарта' + (идёт ? ' слушает' : ''));
  карта.innerHTML = '<span class="точка"></span>'
                  + '<div class="текст"><b>Микрофон</b><span>'
                  + (идёт ? 'Слушает' : 'Выключен') + '</span></div>';
  гнездо.appendChild(карта);

  /* Язык команд той же карточкой: название слева, выбор справа. Строчку
     «Выбери тот, на котором произносишь команды» убрала — она говорит
     то же самое, что и название поля. */
  var карта2 = ок('div', 'оф-гкарта');
  var список = (CW.голос && CW.голос.ЯЗЫКИ) || [{ код: 'ru', имя: 'Русский' }];
  var текущий = (CW.голос && CW.голос.язык) ? CW.голос.язык() : (с.голос.язык || 'ru');
  карта2.innerHTML = '<b class="подпись">Язык команд</b><select>'
    + список.map(function (я) {
        return '<option value="' + я.код + '"'
             + (String(текущий).indexOf(я.код) === 0 ? ' selected' : '')
             + '>' + я.имя + '</option>';
      }).join('')
    + '</select>';
  карта2.querySelector('select').onchange = function () {
    if (CW.голос && CW.голос.язык) CW.голос.язык(this.value);
    сменить({ голос: { язык: this.value } });
  };
  гнездо.appendChild(карта2);

  /* Кнопки во всю ширину одна под другой: на телефоне в строку они
     ужимаются так, что «Выключить микрофон» переносится по слогам. */
  var список2 = ок('button', 'кнопка');
  список2.innerHTML = CW.значок('микрофон', 16) + '<span>Голосовые команды</span>';
  список2.onclick = function () { CW.уйти(CW.окно('voice')); };
  гнездо.appendChild(список2);

  var вкл = ок('button', 'кнопка главная');
  вкл.innerHTML = CW.значок('микрофон', 16)
                + '<span>' + (идёт ? 'Выключить микрофон' : 'Включить микрофон') + '</span>';
  вкл.onclick = function () {
    if (!CW.голос || !CW.голос.переключить) return;
    CW.голос.переключить();
    setTimeout(нарисовать, 400);
  };
  if (беда) вкл.disabled = true;
  гнездо.appendChild(вкл);

  if (беда) гнездо.appendChild(мелко(беда));
  return гнездо;
}

/* ═══════════════════════════════════════════════════════════════════════
   РАЗМЕР ТЕКСТА И ДВИЖЕНИЕ

   Это и был тот единственный блок прежнего окна, который стоило
   оставить: три ступени, двигающие весь экран сразу.
   ═══════════════════════════════════════════════════════════════════════ */
function размерТекста(с) {
  var гнездо = ок('div');
  var размеры = ок('div', 'оф-размеры');
  [['мелкий', 'Мелкий', 13], ['обычный', 'Обычный', 16], ['крупный', 'Крупный', 19]]
    .forEach(function (п) {
      var б = ок('button', 'оф-размер' + (с.текст === п[0] ? ' выбран' : ''));
      б.innerHTML = '<span class="А" style="font-size:' + п[2] + 'px">Аа</span>'
                  + '<span class="п">' + п[1] + '</span>';
      б.onclick = function () { сменить({ текст: п[0] }); };
      размеры.appendChild(б);
    });
  гнездо.appendChild(размеры);

  return гнездо;
}

/* ═══════════════════════════════════════════════════════════════════════
   РЕКЛАМЫ В БЛОКАХ МЕНЮ

   Это две рекламные полосы на полке справа в Ленте, Чатах и Группах:
   сверху три товара с маркетплейса, снизу три ролика «что ещё
   посмотреть». По умолчанию их нет: полка открывается чистой. Кому они
   нужны — включает здесь.

   «Добавить контент» и «Стримить» этой строке не подчиняются и стоят
   всегда: это не реклама, а работа.

   Пока только для большого экрана. На телефоне полка и так не
   помещается рядом с разделом, она уезжает под него, и отдельная
   строка в «Оформлении» там только путала бы. Строка для телефона
   написана ниже и закомментирована: скажет хозяйка — раскомментирую,
   переписывать ничего не придётся.
   ═══════════════════════════════════════════════════════════════════════ */
function полкаСправа(с) {
  var гнездо = ок('div', 'оф-строка');
  var строка = ок('div', 'ок-строка');
  строка.innerHTML = '<div class="текст"><b>Показывать рекламу</b>'
                   + '<span>Товары сверху и «Ещё» снизу на полке справа '
                   + 'в Ленте, Чатах и Группах</span></div>';
  var тумблер = ок('button', 'ок-тумблер' + (с.полка === 'да' ? ' вкл' : ''));
  тумблер.onclick = function () {
    сменить({ полка: с.полка === 'да' ? 'нет' : 'да' });
    CW.сказать(с.полка === 'да' ? 'Реклама убрана' : 'Реклама включена');
  };
  строка.appendChild(тумблер);
  гнездо.appendChild(строка);

  /* ── для телефона, пока не нужно ───────────────────────────────────
  var строка2 = ок('div', 'ок-строка');
  строка2.innerHTML = '<div class="текст"><b>И на телефоне</b>'
                    + '<span>Полосы встанут под разделом, а не сбоку</span></div>';
  var тумблер2 = ок('button', 'ок-тумблер' + (с.полкаТелефон === 'да' ? ' вкл' : ''));
  тумблер2.onclick = function () {
    сменить({ полкаТелефон: с.полкаТелефон === 'да' ? 'нет' : 'да' });
  };
  строка2.appendChild(тумблер2);
  гнездо.appendChild(строка2);
  ─────────────────────────────────────────────────────────────────── */

  return гнездо;
}

function движение(с) {
  var гнездо = ок('div', 'оф-строка');
  var строка = ок('div', 'ок-строка');
  строка.innerHTML = '<div class="текст"><b>Плавное появление</b></div>';
  var тумблер = ок('button', 'ок-тумблер' + (с.движение !== 'нет' ? ' вкл' : ''));
  тумблер.onclick = function () {
    сменить({ движение: с.движение === 'нет' ? 'да' : 'нет' });
  };
  строка.appendChild(тумблер);
  гнездо.appendChild(строка);
  return гнездо;
}

/* ═══════════════════════════════════════════════════════════════════════
   МЕЛОЧИ
   ═══════════════════════════════════════════════════════════════════════ */

/* Ползунок не перерисовывает окно на каждое движение пальца: перерисовка
   забирает у него фокус, и ползунок срывается после первого же шага.
   Поэтому он сам меняет свою подпись, а окно узнаёт о перемене потом. */
function ползунок(имя, знач, мин, макс, ед, делать, соЗнаком, шаг) {
  var ряд = ок('div', 'оф-ряд');
  var в = (знач === undefined || знач === null || isNaN(parseInt(знач, 10)))
        ? мин : parseInt(знач, 10);
  ряд.innerHTML = '<span class="им">' + имя + '</span>'
    + '<input type="range" min="' + мин + '" max="' + макс + '" step="' + (шаг || 1)
    + '" value="' + в + '">'
    + '<span class="чис"></span>';
  var поле = ряд.querySelector('input');
  var чис = ряд.querySelector('.чис');
  function подпись() {
    var з = parseInt(поле.value, 10);
    чис.textContent = (соЗнаком && з > 0 ? '+' : '') + з + ед;
  }
  подпись();
  поле.oninput = function () { подпись(); делать(parseInt(поле.value, 10)); };
  return ряд;
}

function мелко(текст) { return ок('div', 'оф-мелко', текст); }
function подполоса(текст) { return ок('div', 'оф-подполоса', текст); }

/* ═══════════════════════════════════════════════════════════════════════
   ПЕРЕМЕНА

   Применяем, запоминаем, перерисовываем это окно. Перерисовка нужна,
   чтобы галочки встали на новые места; само оформление уже сменилось —
   его поставил theme.js в ту же секунду.
   ═══════════════════════════════════════════════════════════════════════ */
function сменить(что) {
  О.поставить(что);
  нарисовать();
}

function сбросить() {
  CW.лист([
    { заголовок: 'Вернуть оформление как было?' },
    { зн: CW.значок('повтор', 16), подпись: 'Вернуть всё', делать: function () {
        О.сбросить();
        ЗОНА_ОТКРЫТА = 0;
        нарисовать();
        CW.сказать('Вернула');
      } },
    { зн: CW.значок('стрелка', 16), подпись: 'Оставить' }
  ]);
}

/* Список языков берём из самого словаря, а не пишем здесь второй раз:
   добавят язык в shared/words.js — он сам появится в этом окне. */
function языки() {
  var словарь = CW.СЛОВА || {};
  return Object.keys(словарь).map(function (к) {
    return { код: к, имя: ИМЕНА[к] || к.toUpperCase() };
  }).sort(function (а, б) { return а.имя.localeCompare(б.имя); });
}

function уйти() {
  var откуда = '';
  try { откуда = sessionStorage.getItem('cw_откуда') || ''; } catch (е) {}
  var ладно = /^(feed|chats|groups|signals|market|earn|wallet|stats|refs)$/;
  CW.уйти(CW.раздел(ладно.test(откуда) ? откуда : 'feed', CW.какойКуб()));
}

function ок(тег, класс, текст) { return CW.эл(тег, класс, текст); }

});
</script>
