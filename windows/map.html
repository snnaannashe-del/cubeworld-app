<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- Страница заходит ПОД полоску с часами, и красит это место наша же
     шапка: .об-верх держит под него env(safe-area-inset-top), поэтому
     её содержимое остаётся на прежнем месте экрана. В режиме камеры
     шапка прозрачна — значит сквозь полоску видно картинку. Метка
     обязана стоять в странице: iOS читает её при добавлении значка. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Карта · CubeWorld</title>
<link rel="icon" href="../icons/favicon.svg?v=20261128-545">
<link rel="stylesheet" href="../shared/style.css?v=20261128-545">
<link rel="stylesheet" href="../shared/window.css?v=20261128-545">
<link rel="stylesheet" href="../shared/account.css?v=20261128-545">
<script src="../shared/theme.js?v=20261128-545"></script>
<link rel="stylesheet" href="../shared/shell.css?v=20261128-545">
<!--
  ЖИВАЯ КАРТА — окно поверх программы, со своим адресом.

      windows/map.html

  Было: список кубов с подписью «пока это список, а не полотно карты».
  Честно, но это не карта. Теперь здесь настоящий шар: очертания стран,
  города, ночная сторона Земли, наши кубы и эфиры поверх.

  ── Из чего она собрана ───────────────────────────────────────────
      shared/карта-данные.js   очертания 177 стран и 1150 городов
      shared/карта.js          движок: проекции, рисование, тайлы
      shared/карта-жизнь.js    виды, слои, маршруты, метки, помощник

  Все три приезжают только сюда и только по открытию окна: 130 КБ
  очертаний Земли не должны лежать на ленте у того, кто карту не
  открывал.

  ── Наш размер окна ───────────────────────────────────────────────
  В боевой карта занимала весь экран. У нас окно одно на всё, 10 см, и
  карта не исключение. Полотно берёт ширину окна, под ним — полка со
  всем управлением: виды, путь, слои, метки.
-->
<style>
/* ── полотно ──
   Высота в долях ширины: окно у нас одной ширины, и шар в нём должен
   быть шаром, а не эллипсом в полоске. */
.кар-поле{
  position:relative; height:330px; overflow:hidden;
  background:#05060d; border-bottom:1px solid var(--край);
}
.кар-поле canvas{
  position:absolute; inset:0; width:100%; height:100%; display:block;
  cursor:grab; touch-action:none;
}
.кар-поле canvas.тащим{ cursor:grabbing; }

/* Подписи поверх полотна */
.mp-hud{
  position:absolute; left:10px; top:10px; z-index:2; pointer-events:none;
  display:flex; flex-direction:column; gap:5px; max-width:72%;
}
.mp-hud .стр{
  font-size:0.7333rem; line-height:1.45; color:rgba(255,255,255,.85);
  background:rgba(0,0,0,.45); border-radius:9px; padding:4px 9px;
  align-self:flex-start; backdrop-filter:blur(4px);
}
.mp-hud .стр b{ color:#fff; font-weight:700; }
.mp-hud .стр.важно{ background:rgba(248,113,113,.55); color:#fff; }

/* Карточка метки */
.mp-card{
  position:absolute; z-index:4; min-width:160px; max-width:240px;
  border-radius:13px; padding:10px 12px; display:none;
  background:rgba(12,12,22,.94); border:1px solid rgba(74,158,255,.5);
  box-shadow:0 10px 36px rgba(0,0,0,.6); backdrop-filter:blur(8px);
}
.mp-card.on{ display:block; }
.mp-card .зг{ font-size:0.8667rem; font-weight:800; color:#fff; margin-bottom:2px; }
.mp-card .пд{ font-size:0.7333rem; color:rgba(255,255,255,.65); line-height:1.5; }
.mp-card .кн{ display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
.mp-card button{
  border:1px solid rgba(255,255,255,.18); border-radius:9px;
  background:rgba(255,255,255,.08); color:#fff; font:inherit;
  font-size:0.7333rem; font-weight:700; padding:6px 10px; cursor:pointer;
}

/* ── строка состояния под полотном ── */
.кар-строка{
  display:flex; align-items:center; gap:7px; flex-wrap:wrap;
  padding:9px 12px 0;
}
.mp-chip{
  font-size:0.7rem; color:var(--текст2); padding:4px 9px; border-radius:999px;
  background:var(--поле); white-space:nowrap;
}
.mp-sub{
  font-size:0.7333rem; color:var(--текст3); flex:1 1 100%; min-width:0;
  line-height:1.4;
}

/* ── полка управления ── */
.кар-полка{ padding:10px 12px 14px; }
.mp-row{ display:flex; gap:7px; align-items:center; margin-bottom:9px; }
.mp-ask{
  flex:1; min-width:0; font:inherit; font-size:0.8667rem; color:var(--текст);
  background:var(--поле); border:1px solid var(--край); border-radius:11px;
  padding:9px 12px; outline:none;
}
.mp-ask:focus{ border-color:var(--синий); }
.mp-go{
  border:none; border-radius:11px; background:var(--синий); color:#fff;
  padding:0 14px; height:36px; font-size:0.9333rem; cursor:pointer; flex-shrink:0;
}
.mp-mic{
  width:36px; height:36px; border-radius:50%; flex-shrink:0; cursor:pointer;
  border:1px solid var(--край); background:var(--поле); color:var(--текст);
  font-size:0.9333rem;
}
.mp-mic.on{ background:var(--синий); border-color:transparent; color:#fff; }

/* Разделы: виды, путь, слои, метки */
.mp-sec{ margin:7px 0; }
.mp-h{
  display:flex; align-items:center; gap:9px; width:100%; padding:11px 12px;
  border-radius:12px; border:1px solid var(--край); background:var(--поле);
  color:var(--текст); font:inherit; font-size:0.8667rem; font-weight:800;
  cursor:pointer; text-align:start; transition:background .13s, border-color .13s;
}
.mp-h:hover{ background:rgba(74,158,255,.1); border-color:rgba(74,158,255,.4); }
.mp-h b{ font-size:1.1333rem; font-weight:400; line-height:1; flex-shrink:0; }
.mp-h span{ flex:1; min-width:0; }
.mp-h em{
  display:block; font-style:normal; font-weight:500; font-size:0.6667rem;
  color:var(--текст3); margin-top:2px; line-height:1.35;
}
.mp-h i{ font-style:normal; font-size:0.7333rem; color:var(--текст3);
  transition:transform .16s; }
.mp-sec.open .mp-h{
  border-color:rgba(74,158,255,.8); background:rgba(74,158,255,.15);
}
.mp-sec.open .mp-h i{ transform:rotate(180deg); }
.mp-tl{ display:none; padding:7px 0 2px; }
.mp-sec.open .mp-tl{ display:block; }

/* Кнопки видов и дорог: в 10 см помещается три в ряд. */
.mp-grid{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:6px;
}
.mp-b{
  border:1px solid var(--край); border-radius:11px; background:var(--поле);
  color:var(--текст); font:inherit; cursor:pointer; padding:8px 6px;
  text-align:center; display:flex; flex-direction:column; align-items:center;
  gap:3px; transition:background .12s, border-color .12s, transform .12s;
}
.mp-b:hover{
  background:rgba(74,158,255,.12); border-color:rgba(74,158,255,.45);
  transform:translateY(-1px);
}
.mp-b.on{ border-color:rgba(74,158,255,.85); background:rgba(74,158,255,.2); }
.mp-b b{ font-size:1.1333rem; font-weight:400; line-height:1;
  display:flex; align-items:center; justify-content:center; }
/* Значок вида рисуется линиями: в ряду из двадцати плиток смайлы были
   двадцатью разными шрифтами. */
.mp-b b svg{ width:18px; height:18px; }
.mp-b span{ font-size:0.6667rem; font-weight:700; color:var(--текст2); line-height:1.2; }
.mp-b.on span{ color:var(--текст); }
.mp-b em{ font-style:normal; font-size:0.6rem; color:var(--текст3); line-height:1.15; }

.mp-note{ font-size:0.7rem; color:var(--текст3); line-height:1.5; margin:7px 0 0; }
.mp-note.жёлтая{ color:var(--жёлтый); }

.mp-togs{ display:flex; flex-wrap:wrap; gap:6px; }
.mp-tog{
  border:1px solid var(--край); border-radius:999px; cursor:pointer;
  background:var(--поле); color:var(--текст2); font:inherit;
  font-size:0.7333rem; font-weight:700; padding:7px 12px;
}
.mp-tog.on{
  border-color:rgba(74,158,255,.85); background:rgba(74,158,255,.2);
  color:var(--текст);
}
</style>
</head>
<body>

<script src="../shared/api.js?v=20261128-545"></script>
<script src="../shared/ui.js?v=20261128-545"></script>
<script src="../shared/смайлы.js?v=20261128-545"></script>
<script src="../shared/лица.js?v=20261128-545"></script>
<script src="../shared/эфир.js?v=20261128-545"></script>
<script src="../shared/icons.js?v=20261128-545"></script>
<script src="../shared/window.js?v=20261128-545"></script>
<script src="../shared/без-копий.js?v=20261128-545"></script>
<script src="../shared/time.js?v=20261128-545"></script>
<script src="../shared/auth.js?v=20261128-545"></script>
<script src="../shared/lang.js?v=20261128-545"></script>
<script src="../shared/account.js?v=20261128-545"></script>
<script src="../shared/shell.js?v=20261128-545"></script>
<script>
'use strict';

CW.оболочка('feed').then(function (место) {

место.appendChild(ок('div', 'пусто-строка',
  Т('Карта открыта отдельным окном. Закрой его, чтобы вернуться.')));

var ОКНО = CW.стойка({
  имя: 'карта',
  /* Глобус одной линией, без квадратной подложки; название — одно
     слово. «Живая карта» и подпись «шар, ночная сторона и огни
     городов» рассказывали о том, что и так видно на шаре. */
  знак: 'глобус',
  заголовок: Т('Карта'),
  /* Крестик, а не стрелка: карта открыта отдельным окном поверх
     программы, и выход отсюда — именно закрытие, а не шаг назад. */
  назад: уйти,
  крест: true,
  /* Высота по содержимому: под полкой разделов у карты нет ничего, и
     во весь экран окно стояло с пустой нижней половиной. */
  поРосту: true,
  поля: false
});
ОКНО.открыть();

/* Разметку карты ставим сразу, до приезда движка: имена узлов внутри
   (mp-c, mp-hud, mp-sub, mp-secs…) те же, что были в боевой, — по ним
   движок и слой жизни находят друг друга. */
ОКНО.тело.innerHTML =
    '<div class="кар-поле">'
  +   '<canvas id="mp-c"></canvas>'
  +   '<div class="mp-hud" id="mp-hud"></div>'
  +   '<div class="mp-card" id="mp-card"></div>'
  + '</div>'
  /* Под шаром только две пилюли: время по Гринвичу с наклоном и счёт
     живого. Строки «Из космоса — Шар, звёзды…» больше нет: она
     повторяла словами то, что нарисовано выше, и менялась при каждом
     повороте, дёргая всю полку. Поля «Спроси карту» тоже нет — вопрос
     карте задают голосом из общего окна голоса, а строка с микрофоном
     и стрелкой занимала здесь целый ряд. */
  + '<div class="кар-строка">'
  +   '<span class="mp-chip" id="mp-chip-time">-</span>'
  +   '<span class="mp-chip" id="mp-chip-live">-</span>'
  + '</div>'
  + '<div class="кар-полка">'
  +   '<div id="mp-secs"></div>'
  + '</div>';

/* Три файла по очереди: данные, движок, жизнь. Порядок важен — движок
   без данных ничего не нарисует, а жизнь без движка не к кому
   прицепиться. */
CW.нужен('shared/карта-данные.js')
  .then(function () { return CW.нужен('shared/карта.js'); })
  .then(function () { return CW.нужен('shared/карта-жизнь.js'); })
  .then(function () {
    CW.карта.пуск();

    /* Карту могли открыть ИЗ чего-то: из геопозиции в переписке
       (windows/map.html?ш=50.45&д=30.52). Тогда ведём сразу туда и
       останавливаем кручение — иначе точка уедет из-под взгляда. */
    (function () {
      var ш = null, д = null;
      try {
        var п = new URLSearchParams(location.search);
        ш = п.get('ш'); д = п.get('д');
      } catch (е) {}
      if (ш === null || д === null) return;
      if (CW.карта.кМесту(ш, д, 7)) {
        /* Пришли по точке из переписки — говорим об этом подписью. */
        ОКНО.имя(Т('Карта'), Т.с('точка {ш}, {д}',
                 { ш: Number(ш).toFixed(3), д: Number(д).toFixed(3) }));
      }
    })();
    /* Окно может открыться раньше, чем браузер посчитает его размеры.
       Пересчитываем полотно, когда всё улеглось. */
    setTimeout(function () { CW.карта.размер(); }, 160);
    window.addEventListener('resize', function () { CW.карта.размер(); });
  })
  .catch(function (е) {
    /* Причину пишем в окно, а не только в консоль: «не приехала» без
       причины одинаково выглядит и когда нет сети, и когда файл сломан,
       а чинить это две разные вещи. */
    ОКНО.тело.innerHTML = '';
    ОКНО.пусто({ знак: 'внимание', заголовок: Т('Карта не приехала'),
                 текст: ((е && е.message) ? е.message + '. ' : '')
                      + 'Проверь связь и открой карту ещё раз.' });
  });

function уйти() {
  try { if (window.cwCloseMap) window.cwCloseMap(); } catch (е) {}
  var откуда = '';
  try { откуда = sessionStorage.getItem('cw_откуда') || ''; } catch (е) {}
  CW.уйти(откуда ? CW.раздел(откуда, CW.какойКуб()) : CW.раздел('world'));
}

function ок(тег, класс, текст) { return CW.эл(тег, класс, текст); }

});
</script>
</body>
</html>
