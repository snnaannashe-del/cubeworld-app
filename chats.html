<!--
  ЧАТЫ.

  Слева список переписок (/dm/inbox), справа полка со «Стримить» и
  «Добавить контент». Выбрал переписку — на месте списка открывается она
  сама (/dm/{id}), с отправкой через POST туда же.

  Про отправку. Сервер умеет и веб-сокет, и обычный запрос; здесь взят
  обычный. Сокет быстрее, но он один на всю программу и его нужно
  правильно закрывать при уходе со страницы — это отдельная работа, и
  пока лучше честный запрос, который точно доходит, чем сокет, который
  молча отвалился.

  Про удаление переписки: DELETE /dm/conversation/{id} убирает её
  навсегда, поэтому спрашиваем отдельным окном.
-->
<style>

/* ── шапка чатов ─────────────────────────────────────────────────────
   Шапка, кругляши, поиск, окно переписки, пузыри и менюшка ввода
   переехали в оболочку: они одинаковые у чатов, групп и избранного.
   Здесь осталось только то, чего больше нигде нет. */
.сторис-кн{
  margin-inline-start:auto; display:flex; align-items:center; gap:8px; cursor:pointer;
  background:none; border:none; color:var(--текст2); font-size:0.9333rem; padding:0;
  font-family:inherit;
}
.сторис-кн:hover{ color:var(--текст); }
.сторис-кн svg{ width:16px; height:16px; }

/* ── найденные люди ──────────────────────────────────────────────── */
.найдены{ border:1px solid var(--край); border-radius:12px; overflow:hidden;
  margin-bottom:18px; background:var(--окно); }
.найден{
  display:flex; align-items:center; gap:12px; width:100%; padding:12px 15px;
  background:none; border:none; border-bottom:1px solid var(--край);
  color:var(--текст); font-size:0.9667rem; cursor:pointer; text-align:start;
}
.найден:last-child{ border-bottom:none; }
.найден:hover{ background:var(--поле); }

/* ── список переписок ────────────────────────────────────────────── */
.переписки{ border:1px solid var(--край); border-radius:14px;
  overflow:hidden; background:var(--окно); }
.переписка{
  display:flex; align-items:center; gap:13px; width:100%;
  padding:14px 16px; border-bottom:1px solid var(--край);
  background:none; border-inline-start:none; border-inline-end:none; border-top:none;
  color:var(--текст); cursor:pointer; text-align:start;
}
.переписка:last-child{ border-bottom:none; }
.переписка:hover{ background:var(--поле); }
.переписка .кто{ flex:1; min-width:0; }
.переписка .имя{ font-size:0.9667rem; font-weight:600; }
.переписка .последнее{
  font-size:0.8667rem; color:var(--текст3); margin-top:3px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.переписка .справа{ text-align:end; flex:0 0 auto; }
.переписка .когда{ font-size:0.7667rem; color:var(--текст3); }
/* Галочки перед временем: одна «доставлено», две синие «прочитано».
   Знаки ставим вплотную друг к другу, иначе две галочки читаются как
   две отдельные. */
.переписка .когда .галки{ margin-inline-end:5px; letter-spacing:-2px; }
.переписка .когда .галки.прочитано{ color:var(--синий); }
.переписка .непрочитано{
  display:inline-block; margin-top:5px; min-width:20px; padding:2px 7px;
  border-radius:10px; background:var(--синий); color:#fff;
  font-size:0.7333rem; font-weight:700; text-align:center;
}


/* ── пусто ───────────────────────────────────────────────────────── */
/* Пустое состояние без рамки и подложки: в работающей программе это
   просто надпись посреди пустого места, а не карточка. */
/* Та же мера, что в группах: надпись посреди свободного места. */
.переписки.пусто{
  border:none; background:none;
  flex:1 1 auto; display:flex; align-items:center; justify-content:center;
  min-height:48vh;
}
.пусто-чаты{ text-align:center; padding:0 20px; }
.пусто-чаты .знак{ display:flex; justify-content:center; color:var(--синий);
  margin-bottom:18px; }
.пусто-чаты .знак svg{ width:44px; height:44px; }
.пусто-чаты .слова{ font-size:0.9667rem; color:var(--текст3); }

/* ── лента сторис ──────────────────────────────────────────────────
   Кружок ровно того же размера, что лицо в строке переписки (42), и
   без обводки: кольцо вокруг круга было единственной рамкой в списке и
   спорило со строками под ним. Высота полосы — как у строки чата (70),
   и снизу та же черта: полоса читается первой строкой списка, а не
   отдельной коробкой над ним.

   Непросмотренное отмечает синяя точка в углу кружка, а не кольцо:
   кольцо и есть та обводка, которую просили убрать. Просмотренные
   приглушены.

   Черты под полосой нет: её никто не просил, и в списке без рамок она
   была единственной линией. Вместо неё список отодвинут на 11 точек
   (те самые 3 мм), чтобы полоса и строки не слипались. */
/* Полоса сторис — такая же карточка, как строка переписки под ней:
   та же подложка, та же рама и то же скругление. Прежде она висела
   прямо на фоне и читалась чужой строкой среди своих. */
.сторис-полка{
  border:none; border-radius:14px; background:var(--окно);
  margin-bottom:11px; overflow:hidden;
}
.сторис-лента{
  display:flex; align-items:center; gap:14px;
  box-sizing:border-box; padding:8px 16px;
  /* Вбок — да, вверх-вниз — нет. Если не сказать «hidden», браузер
     делает прокрутку по ОБЕИМ осям: достаточно лишней точки высоты,
     и полосу можно потянуть вверх, а строки уедут под край. */
  overflow-x:auto; overflow-y:hidden; scrollbar-width:none;
}
.сторис-лента::-webkit-scrollbar{ display:none; }
/* Ширина столбика ровно по кружку, 42. Было 54 ради подписи, и
   кружок вставал по центру столбика — на шесть точек правее лица в
   строке переписки под ним. Подпись шире кружка и так не обрежется:
   она висит над ним по центру и может чуть выйти за края. */
.сторис-человек{
  flex:0 0 auto; display:flex; flex-direction:column; align-items:center;
  gap:5px; cursor:pointer; background:none; border:none; padding:0;
  color:var(--текст2); font-size:0.7667rem; width:42px;
}
/* Кружок — тот же аватар, что в строке переписки: 42 точки, круглый,
   кадр ложится во весь круг по центру (object-fit:cover у картинки
   ниже). Раньше он был той же ширины, но стоял в полосе без подложки
   и выглядел меньше и выше соседнего. */
.сторис-человек .круг{
  position:relative; width:42px; height:42px; border-radius:50%; border:none;
  display:flex; align-items:center; justify-content:center; overflow:hidden;
  font-size:1.2rem; font-weight:300;
  /* Краска заглушки общая: shared/style.css. */
  background:var(--лицо-заливка); color:var(--лицо-краска);
}
/* Кадр ложится во весь круг и по центру. Раньше здесь стояли
   проценты без упора — кружок же устроен флексом, и широкий снимок
   он ужимал: картинка 400×260 становилась 30×40, и вместо круга на
   экране был скруглённый прямоугольник. Упираем картинку в края
   кружка, и обрезка идёт по кругу, как у лица в строке переписки. */
.сторис-человек .круг img{
  position:absolute; inset:0; width:100%; height:100%;
  object-fit:cover; object-position:center; display:block;
}
/* Доля та же, что у всех кружков программы (shared/style.css). */
.сторис-человек .круг svg{ width:60%; height:60%; }
.сторис-человек.своя .круг{ background:rgba(0,153,255,.12); }
/* Здесь стояла синяя точка «не смотрел» в углу кружка. У кружка
   overflow:hidden, и точка обрезалась его круглым краем — на экране
   оставался кусок синего круга, похожий на брак отрисовки. Убрана по
   слову Анны. Непросмотренное и без неё видно: просмотренные кружки
   приглушены (.смотрели ниже). */
.сторис-человек.смотрели{ opacity:.55; }
/* Своя сторис уже есть: в кружке её кадр, а добавить новую — плюсом в
   углу. Он маленький нарочно: нажимают его реже, чем смотрят своё. */
.сторис-человек.своя{ position:relative; }
.сторис-человек .добавить{
  position:absolute; right:3px; top:28px; width:18px; height:18px; padding:0;
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  border-radius:50%; border:2px solid var(--фон);
  background:var(--синий); color:#fff;
}
.сторис-человек .добавить svg{ width:11px; height:11px; }
.сторис-человек .имя{
  max-width:54px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.сторис-человек:hover{ color:var(--текст); }
.сторис-пусто{ align-self:center; font-size:0.8667rem; color:var(--текст3); }


</style>
</head>

<script>
'use strict';

CW.оболочка('chats').then(function (место) {

var С = { входящие: [], ищем: '', сторис: false, люди: null, искать: false, сбой: null };

var две = document.createElement('div');
две.className = 'две-колонки';
место.appendChild(две);

var левая = document.createElement('div');
/* Содержимое раздела стоит в скруглённой рамке — той же, что у
   колонки ленты. Разница одна и нарочная: у ленты внутри чёрное, там
   ждут ролик, а здесь фон тот же, что у окна: это список, а не экран
   показа. */
левая.className = 'левая в-рамке';
две.appendChild(левая);

var правая = document.createElement('div');
правая.className = 'правая';
две.appendChild(правая);

правая.appendChild(CW.полка());

CW.ждём(левая);
загрузить();

/* Архив приезжает с сервера: убранное на телефоне должно быть убрано и
   здесь. Пока не приехал — рисуем по памяти браузера, чтобы список не
   мигал пустотой. */
if (CW.архив) CW.архив.загрузить().then(function () { показатьСписок(); });

/* ═══════════════════════════════════════════════════════════════════════
   ЗАГРУЗКА
   ═══════════════════════════════════════════════════════════════════════ */
/* ── «ДИАЛОГОВ НЕТ» — ЭТО БЫЛА НЕПРАВДА ──────────────────────────────
   Когда сервер молчал, список чатов писал «Диалогов нет» и так и
   стоял. Человеку сообщали, что его переписки пропали, хотя они на
   месте — просто ответ не доехал. Это хуже молчания: пустой список
   читается как потеря.

   Беду ловил и этот самый загрузить(), и писал «Нет связи с
   сервером» — но её тут же затирал архив. Архив приезжает своим
   запросом и, приехав, зовёт показатьСписок() ещё раз; тот рисует
   список из С.входящие, а там пусто, потому что входящие не пришли.
   Красная строка пропадала, и на её месте выходило «Диалогов нет».

   Поэтому неудачу теперь помним в С.сбой, и показатьСписок() на неё
   смотрит: пока входящих нет и сбой стоит — рисуем беду с кнопкой
   «Повторить», а не выдуманную пустоту. */
function загрузить() {
  С.сбой = null;
  CW.спросить('/dm/inbox', { сроком: 20000 })
    .then(function (д) {
      С.входящие = Array.isArray(д) ? д : ((д && д.items) || []);
      С.сбой = null;
      показатьСписок();
    })
    .catch(function (е) {
      С.сбой = е || true;
      показатьБеду();
    });
}

function показатьБеду() {
  левая.innerHTML = '';
  var е = С.сбой;
  var б = document.createElement('div');
  б.className = 'беда';
  б.textContent = (е && е.сеть) ? Т('Нет связи с сервером')
                                : ((е && е.message) || Т('Не вышло открыть чаты'));
  левая.appendChild(б);

  /* Кнопка нужна: обновлять всю страницу ради одного запроса — лишняя
     работа, и человек теряет место, на котором стоял. */
  var ещё = document.createElement('button');
  ещё.type = 'button';
  ещё.className = 'кнопка';
  ещё.style.cssText = 'margin:12px auto 0;display:block';
  ещё.textContent = Т('Повторить');
  ещё.onclick = function () {
    левая.innerHTML = '';
    CW.ждём(левая);
    загрузить();
  };
  левая.appendChild(ещё);
}

function кусок(класс, внутри) { return CW.кусок(класс, внутри); }

/* ═══════════════════════════════════════════════════════════════════════
   СПИСОК ПЕРЕПИСОК
   ═══════════════════════════════════════════════════════════════════════ */
function показатьСписок() {
  /* Входящие не доехали — беду не затираем (см. загрузить). */
  if (С.сбой && !(С.входящие && С.входящие.length)) { показатьБеду(); return; }

  левая.innerHTML = '';

  /* шапка */
  var шапка = кусок('раздел-верх',
      '<h1>' + CW.безопасно(Т('Чаты')) + '</h1>'
    + '<button class="кругляш голый" data-что="избранное" title="' + CW.безопасно(Т('Избранные')) + '">'
    +   CW.значок('звезда') + '</button>'
    + '<button class="кругляш голый" data-что="папки" title="' + CW.безопасно(Т('Папки')) + '">'
    +   CW.значок('папка') + '</button>'
    + '<button class="кругляш голый" data-что="архив" title="' + CW.безопасно(Т('Архив')) + '">'
    +   CW.значок('архив') + '</button>'
    + '<button class="кругляш голый" data-что="звуки" title="' + CW.безопасно(Т('Звуки')) + '">'
    +   CW.значок('нота') + '</button>'
    + '<button class="сторис-кн" data-что="сторис">'
    +   (С.сторис ? ('✕ ' + CW.безопасно(Т('Закрыть')))
                  : (CW.значок('люди') + CW.безопасно(Т('Сторис')))) + '</button>'
    /* Кнопка поиска — такая же, как в группах: обычный кругляш с
       лупой, и синим он не загорается. Работает так же: нажал —
       строка поиска открылась, нажал ещё раз — закрылась. */
    + '<button class="кругляш лупа" data-что="поиск" title="' + CW.безопасно(Т('Поиск')) + '">'
    +   CW.значок('лупа') + '</button>');

  шапка.querySelectorAll('[data-что]').forEach(function (б) {
    var что = б.getAttribute('data-что');
    б.onclick = function () {
      /* Поиск открывается и закрывается этой же кнопкой — как в
         группах. Закрыли — забыли и запрос: оставленное слово тихо
         прячет половину переписок, и человек их не находит. */
      if (что === 'поиск') {
        С.искать = !С.искать;
        if (!С.искать) С.ищем = '';
        показатьСписок();
        if (С.искать) {
          var п = document.getElementById('поиск-чатов');
          if (п) п.focus();
        }
        return;
      }
      if (что === 'сторис') { С.сторис = !С.сторис; показатьСписок(); return; }
      if (что === 'избранное') {
        try { sessionStorage.setItem('cw_откуда', 'chats'); } catch (е) {}
        CW.уйти(CW.окно('favorites', CW.какойКуб()));
        return;
      }
      /* Папки — своё хранилище человека: папки, а в них файлы. Живут
         на сервере, открываются окном поверх чатов. */
      if (что === 'папки') { CW.открыть('folders'); return; }
      /* Архив — убранные из списка переписки. Ничего не удалено, и
         окно умеет вернуть их обратно. */
      if (что === 'архив') {
        CW.открыть('archive', { открыть: открыть, потом: показатьСписок });
        return;
      }
      /* Звуки — полка музыки со своим проигрывателем. Музыка не
         обрывается на закрытии окна: звук живёт на странице. */
      if (что === 'звуки') { CW.открыть('sounds'); return; }
      CW.сказать(Т.с('{имя}: отдельное окно, его ещё нет', { имя: имяРаздела(что) }));
    };
  });
  левая.appendChild(шапка);

  /* сторис: показываем только когда их открыли */
  if (С.сторис) {
    var полка = кусок('сторис-полка');
    var лента = кусок('сторис-лента');
    лента.id = 'сторис-лента';
    полка.appendChild(лента);
    левая.appendChild(полка);
    нарисоватьСторис(лента);
  }

  /* Поиск. Поле собирает CW.строкаПоиска — одно на всю программу:
     свой кусок разметки здесь больше не живёт, иначе вид поиска в
     чатах однажды разъедется с видом в группах и в ленте. */
  var найдены = кусок('найдены');
  найдены.style.display = 'none';

  var поиск = CW.строкаПоиска({
    подпись: Т('Поиск или новый чат…'),
    значение: С.ищем,
    спрятан: !С.искать,
    стереть: true,
    искать: function (текст) {
      С.ищем = текст;
      отобрать();
      clearTimeout(часы);
      if (С.ищем.length < 2) { найдены.style.display = 'none'; return; }
      часы = setTimeout(function () { искатьЛюдей(С.ищем, найдены); }, 300);
    }
  });
  поиск.поле.id = 'поиск-чатов';
  var часы = null;
  левая.appendChild(поиск);
  левая.appendChild(найдены);

  /* список */
  var список = кусок('переписки');
  список.id = 'переписки';
  левая.appendChild(список);

  отобрать();

  function отобрать() {
    /* Одна мерка со всей программой: без регистра и без ё. По-простому
       «пет» не находило «Пётр» — и переписка с ним исчезала из списка,
       хотя в окне поиска тот же запрос его находил. */
    var что = CW.ровно(С.ищем);
    var ряды = С.входящие.filter(function (п) {
      /* Убранное в архив не показываем — в том и смысл архива. При
         поиске тоже: человек ищет среди того, что у него в списке. */
      if (CW.архив && CW.архив.внутри(п.peer_id)) return false;
      if (!что) return true;
      return CW.ровно(п.display_name).indexOf(что) >= 0;
    });

    список.innerHTML = '';
    if (!ряды.length) {
      список.classList.add('пусто');
      /* Только строка, как в группах: значок речи и объяснение, откуда
         берутся переписки, занимали пол-экрана и говорили то, что и так
         понятно по названию раздела. */
      список.appendChild(кусок('пусто-чаты',
        '<div class="слова">'
        + Т(С.ищем ? 'Ничего не нашлось' : 'Диалогов нет') + '</div>'));
      return;
    }
    список.classList.remove('пусто');

    ряды.forEach(function (п) {
      var б = document.createElement('button');
      б.className = 'переписка';
      б.innerHTML =
          '<span class="лицо cw-кружок">' + CW.значок('человек') + '</span>'
        + '<span class="кто">'
        +   '<div class="имя" data-имя="' + CW.безопасно(String(п.peer_id)) + '">'
        +     CW.безопасно(CW.имяЧеловека(п)) + '</div>'
        +   '<div class="последнее">' + CW.безопасно(последнее(п)) + '</div>'
        + '</span>'
        + '<span class="справа">'
        +   '<div class="когда">' + галочки(п) + CW.безопасно(когдаБыло(п)) + '</div>'
        +   (Number(п.unread || 0) ? '<div class="непрочитано">' + п.unread + '</div>' : '')
        + '</span>';
      /* Настоящее лицо вместо общего значка. Сервер в списке переписок
         снимка не отдаёт — он лежит по адресу /users/{номер}/avatar, и
         помощник заберёт его, когда строка доедет до глаз. Нет снимка —
         остаётся наш значок. */
      CW.лицоЧеловека(б.querySelector('.лицо'), п.peer_id, п.avatar_ver);
      /* Имя тоже через склад: он помнит, как зовут человека, и ставит
         имя сразу — без скачка «Участник #16» → настоящее имя. */
      if (CW.лица) CW.лица.подписать(б.querySelector('.имя'), п.peer_id,
                                     CW.имяЧеловека(п));

      б.onclick = function () { открыть(п.peer_id, п.display_name); };
      /* ── УБРАТЬ В АРХИВ ──
         Долгое нажатие пальцем и правая кнопка мышью — два разных
         способа сказать одно и то же, и оба должны работать: на
         телефоне правой кнопки нет, на компьютере долгое нажатие
         никто не делает. Кнопки в строке нет нарочно: она висела бы у
         каждой переписки ради действия, которое делают раз в месяц. */
      убратьПоДолгому(б, п);
      список.appendChild(б);
    });
  }
}

/* Долгое нажатие (650 мс) и правая кнопка. Если палец за это время
   уехал больше чем на десять точек — это была прокрутка, а не нажатие,
   и архив ни при чём. */
function убратьПоДолгому(узел, п) {
  var часы = null, X = 0, Y = 0, двинулся = false;

  узел.oncontextmenu = function (е) { е.preventDefault(); спросить(); };

  узел.addEventListener('touchstart', function (е) {
    var т = е.touches && е.touches[0];
    X = т ? т.clientX : 0; Y = т ? т.clientY : 0; двинулся = false;
    часы = setTimeout(function () { if (!двинулся) спросить(); }, 650);
  }, { passive: true });

  узел.addEventListener('touchmove', function (е) {
    var т = е.touches && е.touches[0];
    if (!т) return;
    if (Math.abs(т.clientX - X) > 10 || Math.abs(т.clientY - Y) > 10) {
      двинулся = true; clearTimeout(часы);
    }
  }, { passive: true });

  узел.addEventListener('touchend', function () { clearTimeout(часы); });
  узел.addEventListener('touchcancel', function () { clearTimeout(часы); });

  function спросить() {
    if (!CW.архив) return;
    /* Строка уходит в архив не щелчком, а пылью: человек видит, ЧТО
       именно он убрал. Данные трогаем после — иначе список
       перерисуется раньше, чем пыль улетит. */
    (CW.нужен ? CW.нужен('shared/развеять.js') : Promise.reject())
      .then(function () { return CW.развеять(узел); })
      .catch(function () {})
      .then(function () {
        CW.архив.положить(п.peer_id, CW.имяЧеловека(п));
        CW.сказать(Т('Убрано в архив'));
        показатьСписок();
      });
  }
}

function имяРаздела(что) {
  return Т({ избранное: 'Избранные', папки: 'Папки', архив: 'Архив',
             звуки: 'Звуки', сторис: 'Сторис' }[что] || что);
}

/* ── ГАЛОЧКИ В СПИСКЕ ──
   Стоят ПЕРЕД временем и только тогда, когда последнее слово в
   переписке твоё: одна «доставлено», две синие «прочитано». Чужое
   последнее сообщение галочек не носит — у него их носит собеседник
   на своей стороне.

   Поля «last_from_me» и «last_read» отдаёт сервер вместе со списком.
   Старый сервер их не знает — тогда галочек просто нет, и это лучше
   выдуманной галочки. */
function галочки(п) {
  if (!п.last_from_me) return '';
  var прочитано = !!п.last_read;
  return '<span class="галки' + (прочитано ? ' прочитано' : '') + '">'
       + (прочитано ? '✔✔' : '✔') + '</span>';
}

/* Сервер зовёт последнее сообщение «last_msg», а время отдаёт уже
   готовой строкой в «time» и полным видом в «last_time_iso». Имена
   сверены с ответом, а не угаданы: с «last_content» строка была бы
   пустой у всех. */
function последнее(п) {
  var текст = п.last_msg || п.last_content || '';
  var вид = п.last_type || 'text';
  /* Пометки формата в строке списка не рисуются, поэтому и знаки их
     здесь ни к чему: человек видел «**вывыва**» и справедливо считал
     это мусором. Сам текст сообщения не трогаем — только показ. */
  if (вид === 'text') return CW.безМеток ? CW.безМеток(текст) : текст;
  /* Звонок разбирает общая рука из shared/chat.js - та же, что рисует
     карточку звонка в самой переписке. Без неё в списке стояла
     служебная строка «call:аудио:занято:0». */
  if (вид === 'call') return CW.звонокСловами(текст, false).строкой;
  /* У вложения в «тексте» лежит адрес файла. Показывать его в списке
     нельзя: человек видел строку «/uploads/clip/2026/11/19/acaad1b…»
     вместо «Видео» и не понимал, что ему прислали. Названия те же, что
     в боевой, и для новых видов — кружка, места — тоже. */
  var имя = { image: 'Снимок', photo: 'Снимок', video: 'Видео',
              voice: 'Голосовое сообщение', audio: 'Аудиозапись',
              circle: 'Видеокружок', geo: 'Геопозиция',
              file: 'Файл' }[вид];
  if (имя) return Т(имя);
  return /^\//.test(текст) ? Т('Вложение') : текст;
}

function когдаБыло(п) {
  if (п.last_time_iso) return CW.когда(п.last_time_iso);
  return п.time || '';
}

/* ── поиск людей: с кем ещё не переписывались ── */
function искатьЛюдей(что, куда) {
  /* Поиск людей — общая рука из shared/api.js: один разбор ответа на
     чаты, кошелёк и окно перевода. */
  CW.найтиЛюдей(что)
    .then(function (люди) {
      /* тех, с кем переписка уже есть, второй раз не показываем */
      var есть = {};
      С.входящие.forEach(function (п) { есть[п.peer_id] = 1; });
      люди = люди.filter(function (ч) { return !есть[ч.id]; });

      куда.innerHTML = '';
      куда.style.display = люди.length ? 'block' : 'none';
      люди.forEach(function (ч) {
        var б = document.createElement('button');
        б.className = 'найден';
        var имя = CW.имяЧеловека(ч);
        б.innerHTML = '<span class="лицо мал cw-кружок">' + CW.значок('человек')
                    + '</span><span>' + CW.безопасно(имя) + '</span>';
        б.onclick = function () { открыть(ч.id, имя); };
        куда.appendChild(б);
      });
    });
}


/* ═══════════════════════════════════════════════════════════════════════
   СТОРИС.

   Лента людей с /stories. Свой кружок стоит первым всегда, даже когда
   ничего не выложено: это кнопка «добавить». Непросмотренное отмечено
   синей точкой в углу кружка, просмотренное приглушено.

   В кружке — первый кадр сторис. Адрес /stories/{id}/media сервер
   отдаёт без ключа (он и в боевой открыт), поэтому обычный <img>.
   ═══════════════════════════════════════════════════════════════════════ */
function нарисоватьСторис(куда) {
  куда.innerHTML = '';

  /* ── СВОЙ КРУЖОК ───────────────────────────────────────────────
     Пока своих сторис нет — это кнопка «добавить» с плюсом. Как
     только выложил, в кружке стоит твой первый кадр, нажатие его
     открывает, а добавить новую можно маленьким плюсом в углу.

     Прежде свой кружок всегда был плюсом, а свои сторис в полосу не
     попадали вовсе (показывались только чужие). Человек выкладывал
     сторис, возвращался в чаты и видел ровно то же, что до этого, —
     выглядело так, будто ничего не произошло.

     «+» ведёт сразу в галерею: выбрать снимок или снять на месте.
     Поле выбора нажимаем здесь, прямо в нажатии человека, — окно
     сторис приезжает отдельным файлом, и к моменту его загрузки
     браузер уже не считает нажатие «живым» и галерею не откроет.
     Телефон на image/*,video/* сам предложит и камеру, и галерею;
     capture мы не ставим нарочно — он отнимает выбор. */
  var своя = document.createElement('div');
  своя.className = 'сторис-человек своя';
  var кругСвой = document.createElement('button');
  кругСвой.type = 'button';
  кругСвой.className = 'круг';
  кругСвой.innerHTML = CW.значок('плюс', 16);
  кругСвой.onclick = function () { полеСторис().click(); };
  своя.appendChild(кругСвой);
  своя.appendChild(CW.эл('span', 'имя', Т('Моя')));
  куда.appendChild(своя);

  var ждём = кусок('сторис-пусто', Т('Загрузка…'));
  куда.appendChild(ждём);

  CW.спросить('/stories', { тихо: true }).then(function (д) {
    С.люди = (д && д.people) || [];
    var чужие = С.люди.filter(function (ч) { return !ч.mine; });
    var моё = С.люди.filter(function (ч) { return ч.mine; })[0];

    if (ждём.parentNode) ждём.parentNode.removeChild(ждём);

    /* Свои сторис есть — кружок показывает их, а не плюс. */
    if (моё && (моё.items || []).length) {
      своя.classList.add('есть-своя');
      кругСвой.onclick = function () { смотретьСторис(моё); };
      кругСвой.title = Т('Смотреть свою сторис');
      картинкуВКруг(кругСвой, моё.items[0]);

      var ещё = document.createElement('button');
      ещё.type = 'button';
      ещё.className = 'добавить';
      ещё.title = Т('Добавить ещё');
      ещё.innerHTML = CW.значок('плюс', 11);
      ещё.onclick = function () { полеСторис().click(); };
      своя.appendChild(ещё);
    }

    if (!чужие.length) {
      куда.appendChild(кусок('сторис-пусто', Т('Чужих сторис пока нет')));
      return;
    }

    чужие.forEach(function (ч) {
      var б = document.createElement('button');
      б.className = 'сторис-человек ' + (ч.unseen ? 'есть' : 'смотрели');
      б.innerHTML =
          '<span class="круг">' + CW.значок('человек', 16) + '</span>'
        + '<span class="имя">' + CW.безопасно(ч.display_name) + '</span>';
      б.onclick = function () { смотретьСторис(ч); };
      куда.appendChild(б);

      картинкуВКруг(б.querySelector('.круг'), (ч.items || [])[0]);
    });
  }).catch(function () {
    if (ждём.parentNode) ждём.textContent = Т('Сторис не ответили');
  });
}

/* В кружке — первый кадр самой сторис, а не цифра непрочитанных и не
   смайл. Адрес /stories/{id}/media сервер отдаёт без ключа, поэтому
   обычный <img>. У ролика первого кадра без загрузки всего файла нет —
   там остаётся наш человек линиями. */
function картинкуВКруг(круг, шт) {
  if (!круг || !шт) return;
  if ((шт.kind === 'video') || /video/.test(шт.mime || '')) return;
  var и = document.createElement('img');
  и.alt = '';
  и.onload = function () { круг.innerHTML = ''; круг.appendChild(и); };
  и.src = CW.адрес + шт.url;
}

/* Поле выбора для сторис держим в разметке заранее: созданное по
   нажатию, в части браузеров оно окно выбора не открывает — нажатие
   уже потрачено на создание узла. */
var полеДляСторис = null;
function полеСторис() {
  if (полеДляСторис) return полеДляСторис;
  полеДляСторис = document.createElement('input');
  полеДляСторис.type = 'file';
  полеДляСторис.accept = 'image/*,video/*';
  полеДляСторис.style.cssText =
    'position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none';
  полеДляСторис.onchange = function () {
    var ф = полеДляСторис.files && полеДляСторис.files[0];
    полеДляСторис.value = '';
    CW.открыть('create-story', { файл: ф || null, потом: загрузить });
  };
  document.body.appendChild(полеДляСторис);
  return полеДляСторис;
}

/* Окно истории — отдельным файлом (modals/story.js): полоски кадров,
   глазок «кто смотрел», сердце, разговор, подарки и монеты. Здесь
   остаётся только позвать его: то же окно открывают из портфолио, и
   держать его в этой странице значило бы, что портфолио открывает
   чужую страницу ради одного окна. */
function смотретьСторис(человек, кадр) {
  if (!((человек.items || []).length)) {
    CW.сказать(Т.с('У {кто} нечего смотреть', { кто: CW.имяЧеловека(человек) || Т('него') }));
    return;
  }
  CW.открыть('story', {
    человек: человек,
    кадр: кадр || 0,
    /* Закрыли историю — полоса пересчитает просмотренное: кружок
       должен погаснуть сразу, а не после перезагрузки. */
    потом: function () {
      var л = document.getElementById('сторис-лента');
      if (л) нарисоватьСторис(л);
    }
  });
}

/* ═══════════════════════════════════════════════════════════════════════
   ПЕРЕПИСКА
   ═══════════════════════════════════════════════════════════════════════ */
/* ═══════════════════════════════════════════════════════════════════════
   ОТКРЫТЬ ПЕРЕПИСКУ

   Переписка — отдельное окно со своим адресом (windows/dm.html). Раньше
   она жила здесь, в левой колонке, и это стоило двух неприятностей:
   перезагрузка возвращала в список вместо разговора, а на переписку
   нельзя было дать ссылку. Имя передаём в адресе, чтобы окно встало с
   ним сразу, не дожидаясь ответа сервера.
   ═══════════════════════════════════════════════════════════════════════ */
function открыть(кто, имя) {
  CW.уйти(CW.окно('dm') + '?user=' + кто
          + (имя ? '&имя=' + encodeURIComponent(имя) : ''));
}

});
</script>
