<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- Полоска с часами: страница заходит ПОД неё, и красит это место наша
     же шапка — она держит под него env(safe-area-inset-top). Поэтому в
     тёмной теме полоска тёмная, в светлой светлая, под камерой сквозь
     неё видно картинку. Метка обязана стоять в самой странице: iOS
     читает её один раз, когда значок добавляют на экран. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Маркетплейс · CubeWorld</title>
<link rel="icon" href="icons/favicon.svg?v=20261128-532">
<link rel="stylesheet" href="shared/style.css?v=20261128-532">
<link rel="stylesheet" href="shared/window.css?v=20261128-532">
<link rel="stylesheet" href="shared/account.css?v=20261128-532">
<script src="shared/theme.js?v=20261128-532"></script>
<link rel="stylesheet" href="shared/shell.css?v=20261128-532">
<!--
  МАРКЕТПЛЕЙС.

  Два разных мира под одним именем, и у сервера они тоже разные:

      Цифровой  — /market — файлы, ключи, доступы. Покупка списывает CUBE
                  и открывает покупателю текст доставки и файлы. Файлы
                  закрыты до покупки: за ними ходят с ключом.
      Шопинг    — /shop   — вещи. Снимки открыты всем, это и есть витрина.
                  Покупка — заказ с адресом: деньги лежат у площадки, пока
                  покупатель не скажет «получил».

  Разделы, подразделы и состояния НЕ придуманы здесь: их отдаёт сервер в
  том же ответе, что и товары. Напишешь свой список — он разойдётся с тем,
  что сервер принимает, и половина разделов окажется пустой навсегда.

  Чего нет и почему: переписка с продавцом. Чаты — отдельное окно, и
  открыть в нём нужного человека по ссылке оно пока не умеет. Обещать
  кнопку, которая никуда не ведёт, не будем.
-->
<style>

/* ── шапка ───────────────────────────────────────────────────────── */
.верх-рынка{ display:flex; align-items:center; gap:12px; margin-bottom:18px; }
.верх-рынка h1{ margin:0; font-size:1.4rem; font-weight:700; letter-spacing:-.02em; }

/* ── два раздела ─────────────────────────────────────────────────── */
/* Кнопки по содержимому, а не во всю ширину. Прежде у каждой стояло
   flex:1, они растягивались на пол-экрана, и внутри оставалось по
   ладони пустоты с каждой стороны от слов. */
.режимы{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
.режим{
  flex:0 0 auto; display:flex; align-items:center; gap:8px;
  padding:9px 14px; cursor:pointer; font-family:inherit;
  border-radius:11px; border:1px solid transparent; background:none;
  color:var(--текст3); font-size:0.8667rem; font-weight:800;
  transition:background .13s ease, color .13s ease, transform .1s ease;
}
.режим:hover{ background:var(--поле); color:var(--текст); }
.режим:active{ transform:scale(.97); }
.режим.тут{ color:var(--текст); background:rgba(var(--синий-ргб), .18); }
.режим .зн{ display:flex; color:var(--синий); }
.режим .зн svg{ width:17px; height:17px; }
.режим em{ font-style:normal; font-size:0.7rem; font-weight:600; color:var(--текст3); }

/* ── разделы и подразделы ────────────────────────────────────────── */
.катряд{
  display:flex; gap:7px; scrollbar-width:none; padding-bottom:8px;
  /* Вбок — да, вверх-вниз — нет. Браузер, увидев прокрутку по одной
     оси, разрешает её и по другой: ряд разделов можно было зажать и
     подтянуть вверх, и фишки уезжали под край. */
  overflow-x:auto; overflow-y:hidden;
}
.катряд::-webkit-scrollbar{ display:none; }
.кат{
  flex:0 0 auto; display:flex; align-items:center; gap:6px; cursor:pointer;
  padding:6px 12px; border-radius:var(--радиус-круг); font-family:inherit;
  border:1px solid transparent; background:none;
  color:var(--текст3); font-size:0.8rem; font-weight:700; white-space:nowrap;
  transition:background .13s ease, color .13s ease;
}
.кат:hover{ background:var(--поле); color:var(--текст); }
.кат.тут{ color:var(--текст); background:rgba(var(--синий-ргб), .18); }
.кат .зн{ display:flex; }
.кат .зн svg{ width:15px; height:15px; }

.подряд{ display:flex; gap:6px; scrollbar-width:none; padding-bottom:10px;
  overflow-x:auto; overflow-y:hidden; }
.подряд::-webkit-scrollbar{ display:none; }
/* Имя «под» занято: так в оболочке зовётся подзаголовок окна. Фишка
   подраздела, названная так же, получала рамку от чужого правила —
   подзаголовок окна «Новый товар» оказывался в рамке поля ввода. */
.подраздел{
  flex:0 0 auto; cursor:pointer; padding:6px 12px; font-family:inherit;
  border-radius:var(--радиус-круг); border:1px solid transparent;
  background:none; color:var(--текст3); font-size:0.7667rem; white-space:nowrap;
  transition:background .13s ease, color .13s ease;
}
.подраздел:hover{ background:var(--поле); color:var(--текст2); }
.подраздел.тут{ color:var(--текст); background:rgba(0,153,255,.18); }

/* ── вкладки витрины ─────────────────────────────────────────────── */
/* Вкладки витрины - ОДНИМ рядом, как разделы над ними. Пять слов
   («Витрина · Корзина · Мои товары · Мои покупки · Мои продажи») на
   телефоне переносились на вторую строку, и ряд съедал два сантиметра
   экрана. Теперь они едут вбок, а полосы прокрутки не видно. */
.виды{
  display:flex; gap:16px; margin:4px 0 14px; flex-wrap:nowrap;
  overflow-x:auto; overflow-y:hidden; scrollbar-width:none;
}
.виды::-webkit-scrollbar{ display:none; }
.вид{
  flex:0 0 auto; white-space:nowrap;
  display:flex; align-items:center; gap:7px; cursor:pointer; padding:0 0 3px;
  background:none; border:none; border-bottom:1.5px solid transparent;
  color:var(--текст3); font-family:inherit; font-size:0.9rem; font-weight:600;
}
.вид:hover{ color:var(--текст2); }
.вид.тут{ color:var(--жёлтый); border-bottom-color:rgba(251,191,36,.55); }
.вид .зн{ display:flex; }
.вид .зн svg{ width:16px; height:16px; }

/* ── поиск и кнопка ──────────────────────────────────────────────── */
.поискряд{ display:flex; gap:10px; align-items:center; margin-bottom:18px; }
.поискряд input{
  flex:1; min-width:0; padding:12px 18px; font-size:0.9333rem; font-family:inherit;
  background:var(--поле); border:none; color:var(--текст);
  border-radius:var(--радиус-круг); outline:none;
}
.поискряд input:hover{ background:var(--край); }
.поискряд input:focus{ box-shadow:0 0 0 2px rgba(var(--синий-ргб),.45); }
.поискряд input::placeholder{ color:var(--текст3); }
.кн-добавить{
  flex:0 0 auto; cursor:pointer; padding:12px 22px; font-family:inherit;
  border-radius:var(--радиус-круг); border:none; background:var(--синий);
  color:#fff; font-size:0.9333rem; font-weight:700;
}
.кн-добавить:hover{ filter:brightness(1.1); }

/* ── сетка товаров ───────────────────────────────────────────────── */
.сетка{ display:grid; gap:14px;
  grid-template-columns:repeat(auto-fill,minmax(184px,1fr)); }
.карта{
  display:flex; flex-direction:column; cursor:pointer; text-align:start;
  background:var(--окно); border:1px solid var(--край); border-radius:16px;
  overflow:hidden; padding:0; font-family:inherit; color:var(--текст);
}
.карта:hover{ border-color:var(--край2); transform:translateY(-2px); }
/* У вещи снимок квадратный — это витрина, её и смотрят. У цифрового
   товара обложка есть не всегда, и квадрат пустого места на полэкрана
   выглядит поломкой; ему хватает полосы. */
.сетка.цифра .карта .пик{ aspect-ratio:auto; height:132px; }
.карта .пик{
  position:relative; aspect-ratio:1; overflow:hidden;
  display:flex; align-items:center; justify-content:center;
  background:linear-gradient(135deg,rgba(0,149,246,.16),rgba(167,139,250,.12));
}
.карта .пик img{ width:100%; height:100%; object-fit:cover; display:block; }
.карта .пик .зн{ display:flex; opacity:.75; }
.карта .пик .зн svg{ width:38px; height:38px; }
.карта.снят .пик img{ filter:grayscale(.7) brightness(.6); }

.метка-угол{
  position:absolute; top:8px; left:8px; font-size:0.6333rem; font-weight:700;
  padding:3px 9px; border-radius:var(--радиус-круг);
  /* Подложка тёмная ВСЕГДА: ярлык лежит на снимке товара, а снимок
     бывает любым. Значит и буквы на нём всегда светлые. Стояло
     var(--текст), и в светлом оформлении слово «Обувь» выходило тёмным
     на тёмном - Анна прислала это снимком. */
  background:rgba(2,2,17,.72); color:#fff;
  display:flex; align-items:center; gap:5px; max-width:calc(100% - 16px);
}
.метка-угол .зн{ display:flex; }
.метка-угол .зн svg{ width:12px; height:12px; }
.метка-угол .имя{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.метка-право{
  position:absolute; top:8px; right:8px; font-size:0.6333rem; font-weight:800;
  padding:3px 9px; border-radius:var(--радиус-круг); color:#101018;
}
.метка-право.моё{ background:rgba(251,191,36,.92); }
.метка-право.куплено{ background:rgba(74,222,128,.92); color:#06210f; }
.метка-низ{
  position:absolute; bottom:8px; left:8px; font-size:0.6333rem; font-weight:700;
  padding:3px 9px; border-radius:var(--радиус-круг);
  background:rgba(248,113,113,.88); color:#2a0b0b;
}
/* Фигура вещи — в нижнем правом углу снимка, как в боевой: кружок с
   самой фигурой и надпись рядом. Холст рисуем вдвое крупнее, чем он
   стоит на экране, иначе на хорошем экране грани лохматятся. */
/* Значок фигуры - ОДИН предмет, а не два. Прежде это были кружок с
   фигурой и отдельная тёмная плашка с надписью рядом: на карточке они
   читались как две разные метки, и Анна так и сказала - «распадается
   на две части». Теперь это одна капсула: в ней фигура и её надпись,
   одна подложка, одно скругление - как табличка на кубе в мире. */
.метка-фигура{
  position:absolute; right:7px; bottom:7px;
  display:flex; align-items:center; gap:6px;
  max-width:calc(100% - 14px); pointer-events:none;
  padding:3px 9px 3px 3px; border-radius:var(--радиус-круг);
  background:rgba(2,2,17,.72);
}
/* Надписи нет - капсула превращается в кружок вокруг одной фигуры. */
.метка-фигура.без-слова{ padding:3px; }
.метка-фигура canvas{
  width:30px; height:30px; flex:0 0 30px; display:block;
}
.метка-фигура .слово{
  font-size:0.6333rem; font-weight:700; color:#fff;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}

.карта .низ{ padding:11px 13px 13px; display:flex; flex-direction:column;
  gap:4px; flex:1; }
.карта .бренд{ font-size:0.6667rem; font-weight:800; letter-spacing:.09em;
  text-transform:uppercase; color:var(--синий); }
.карта .имя{ font-size:0.9rem; font-weight:700; line-height:1.35;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  overflow:hidden; }
.карта .кто{ font-size:0.7333rem; color:var(--текст3); }
.карта .подвал{ display:flex; align-items:center; gap:8px; margin-top:auto;
  padding-top:8px; }
.цена{ font-size:0.9333rem; font-weight:800; color:var(--жёлтый);
  font-family:ui-monospace,Menlo,monospace; white-space:nowrap; }
.цена.даром{ color:var(--зелёный); font-family:inherit; font-size:0.8667rem; }
.карта .мелко{ margin-inline-start:auto; font-size:0.6667rem; color:var(--текст3);
  text-align:end; line-height:1.45; }

/* На телефоне в одну колонку витрина выглядит лентой объявлений, а не
   витриной: карточки делаем мельче, чтобы встали по две. */
@media (max-width:640px){
  .сетка{ grid-template-columns:repeat(auto-fill,minmax(146px,1fr)); gap:10px; }
  .сетка.цифра .карта .пик{ height:104px; }
  .карта .имя{ font-size:0.8333rem; }
  .режимы{ gap:6px; }
  .режим{ padding:8px 11px; font-size:0.8rem; }
  .режим em{ display:none; }
  .метка-фигура canvas{ width:26px; height:26px; flex:0 0 26px; }
}

/* ── карточка товара ─────────────────────────────────────────────── */
.назад-строка{ margin-bottom:16px; }
.кн-назад{
  display:inline-flex; align-items:center; gap:8px; cursor:pointer;
  background:none; border:none; color:var(--текст2); font-family:inherit;
  font-size:0.9333rem; padding:0;
}
.кн-назад:hover{ color:var(--текст); }
.кн-назад svg{ width:17px; height:17px; }

.товар{ display:flex; gap:24px; align-items:flex-start; }
.товар .слева{ flex:0 0 46%; min-width:0; }
.товар .справа{ flex:1; min-width:0; }
@media (max-width:860px){
  .товар{ flex-direction:column; }
  .товар .слева{ flex:1 1 auto; width:100%; }
}
.большой{
  position:relative;
  width:100%; aspect-ratio:1; border-radius:16px; overflow:hidden;
  background:linear-gradient(135deg,rgba(0,149,246,.16),rgba(167,139,250,.12));
  border:1px solid var(--край);
  display:flex; align-items:center; justify-content:center;
}
/* На раскрытой карточке фигура крупнее: снимок во всю ширину окна, и
   значок с витрины на нём потерялся бы. */
.большой .метка-фигура{ right:12px; bottom:12px; }
.большой .метка-фигура{ padding:5px 14px 5px 5px; gap:9px; }
.большой .метка-фигура canvas{ width:54px; height:54px; flex:0 0 54px; }
.большой .метка-фигура .слово{ font-size:0.8rem; }
.большой img,.большой video{ width:100%; height:100%; object-fit:cover; display:block; }
.большой .зн{ display:flex; opacity:.7; }
.большой .зн svg{ width:64px; height:64px; }
.лента-снимков{ display:flex; gap:8px; margin-top:10px;
  overflow-x:auto; overflow-y:hidden;
  scrollbar-width:none; }
.лента-снимков::-webkit-scrollbar{ display:none; }
.снимочек{
  flex:0 0 auto; width:62px; height:62px; border-radius:11px; cursor:pointer;
  overflow:hidden; border:1px solid var(--край); background:var(--поле); padding:0;
}
.снимочек.тут{ border-color:var(--синий); }
.снимочек img,.снимочек video{ width:100%; height:100%; object-fit:cover; display:block; }

.товар h2{ margin:0 0 6px; font-size:1.4667rem; font-weight:700; line-height:1.25; }
.товар .бренд{ font-size:0.7333rem; font-weight:800; letter-spacing:.1em;
  text-transform:uppercase; color:var(--синий); margin-bottom:6px; }
.товар .кто{ font-size:0.8667rem; color:var(--текст3); margin-bottom:16px; }
.товар .ценник{ display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  margin-bottom:16px; }
.товар .ценник .цена{ font-size:1.6rem; }
.знач-состояния{
  font-size:0.7667rem; padding:4px 11px; border-radius:var(--радиус-круг);
  border:1px solid var(--край2); color:var(--текст2);
}
.товар .текст{ font-size:0.9333rem; line-height:1.7; color:var(--текст2);
  white-space:pre-wrap; word-break:break-word; margin-bottom:16px; }
.свойства{ border:1px solid var(--край); border-radius:12px; overflow:hidden;
  margin-bottom:16px; }
.свойство{ display:flex; gap:12px; padding:10px 14px; font-size:0.9rem;
  border-bottom:1px solid var(--край); }
.свойство:last-child{ border-bottom:none; }
.свойство .к{ color:var(--текст3); flex:0 0 40%; }
.теги{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
.тег{ font-size:0.7333rem; color:var(--текст3); background:var(--поле);
  border:1px solid var(--край); border-radius:var(--радиус-круг); padding:3px 10px; }

.доставка-текст{
  background:rgba(74,222,128,.07); border:1px solid rgba(74,222,128,.25);
  border-radius:12px; padding:14px 16px; margin-bottom:16px;
  font-size:0.9rem; line-height:1.7; color:var(--текст2);
  white-space:pre-wrap; word-break:break-word;
}
.файлы{ display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
.файл{
  display:flex; align-items:center; gap:11px; padding:10px 13px;
  background:var(--поле); border:1px solid var(--край); border-radius:11px;
  font-size:0.8667rem;
}
.файл .зн{ display:flex; color:var(--сирень); }
.файл .зн svg{ width:16px; height:16px; }
.файл .нм{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap; }
.файл .рз{ font-size:0.7333rem; color:var(--текст3); white-space:nowrap; }
.файл button{
  flex:0 0 auto; cursor:pointer; padding:5px 12px; font-family:inherit;
  border-radius:8px; border:1px solid var(--край2); background:none;
  color:var(--текст2); font-size:0.8rem;
}
.файл button:hover{ color:var(--текст); border-color:var(--синий); }

.действия{ display:flex; gap:10px; flex-wrap:wrap; margin-top:4px; }
.замечание{
  background:rgba(251,191,36,.07); border:1px solid rgba(251,191,36,.28);
  border-radius:12px; padding:12px 15px; font-size:0.8667rem; line-height:1.65;
  color:var(--текст2); margin-bottom:14px;
}

/* ── заказы ──────────────────────────────────────────────────────── */
.заказы{ display:flex; flex-direction:column; gap:12px; }
.заказ{
  background:var(--окно); border:1px solid var(--край); border-radius:14px;
  padding:15px 17px;
}
.заказ .строка{ display:flex; align-items:center; gap:12px; }
.заказ .имя{ font-size:1rem; font-weight:600; flex:1; min-width:0; }
.заказ .когда{ font-size:0.8rem; color:var(--текст3); margin-top:4px; }
.заказ .адрес{ font-size:0.8667rem; color:var(--текст2); margin-top:8px;
  line-height:1.6; white-space:pre-wrap; word-break:break-word; }
.шаг{
  font-size:0.7333rem; font-weight:700; padding:4px 11px;
  border-radius:var(--радиус-круг); white-space:nowrap;
}
.шаг.paid{ background:rgba(0,153,255,.16); color:#7fb9ff; }
.шаг.sent{ background:rgba(251,191,36,.16); color:var(--жёлтый); }
.шаг.done{ background:rgba(52,211,153,.16); color:var(--зелёный); }
.шаг.cancelled{ background:rgba(248,113,113,.14); color:var(--красный); }
.заказ .кнопки{ display:flex; gap:9px; margin-top:12px; flex-wrap:wrap; }
.заказ .кнопки .кнопка{ padding:9px 16px; font-size:0.8667rem; }

/* ── пусто ───────────────────────────────────────────────────────── */
/* ── корзина ──────────────────────────────────────────────────────
   Список, а не карточки: человек уже выбрал и смотрит на итог. */
.крз-страница{ display:flex; flex-direction:column; gap:8px; max-width:720px; }
.крз-ряд{
  display:flex; align-items:center; gap:11px;
  padding:9px 12px; border-radius:14px; background:var(--окно);
  border:1px solid var(--край);
}
.крз-ряд .крз-кадр{
  flex:0 0 48px; width:48px; height:48px; border-radius:11px; overflow:hidden;
  background:var(--поле); display:grid; place-items:center; color:var(--текст3);
}
.крз-ряд .крз-кадр img{ width:100%; height:100%; object-fit:cover; display:block; }
.крз-ряд .крз-имя{ flex:1; min-width:0; display:flex; flex-direction:column;
  gap:3px; cursor:pointer; }
.крз-ряд .крз-имя b{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.крз-ряд .крз-мелко{ font-size:0.7667rem; color:var(--текст3); }
.крз-счёт{ display:flex; align-items:center; gap:7px; flex:0 0 auto; }
.крз-кн{
  width:26px; height:26px; border-radius:50%; border:1px solid var(--край);
  background:var(--поле); color:var(--текст2); cursor:pointer;
  display:grid; place-items:center; line-height:0;
}
.крз-кн:hover{ color:var(--текст); border-color:var(--край2); }
.крз-число{ min-width:18px; text-align:center; font-weight:700;
  font-size:0.8667rem; }
.крз-ряд .крз-цена{ flex:0 0 auto; font-weight:800; font-size:0.9rem;
  color:var(--жёлтый); }
.крз-ряд .крз-убрать{
  flex:0 0 auto; padding:6px; border:none; background:none; cursor:pointer;
  color:var(--текст3); line-height:0; border-radius:9px;
}
.крз-ряд .крз-убрать:hover{ color:var(--красный); background:var(--поле); }
.крз-низ{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  margin-top:6px; padding:12px; border-radius:14px; background:var(--окно);
  border:1px solid var(--край);
}
.крз-сумма{ flex:1; display:flex; align-items:baseline; gap:9px; }
.крз-сумма span{ color:var(--текст3); font-size:0.8667rem; }
.крз-сумма b{ font-size:1.15rem; color:var(--жёлтый); }

.пусто-рынка{ text-align:center; padding:64px 24px; }
.пусто-рынка .зн{ display:flex; justify-content:center; color:var(--сирень);
  margin-bottom:18px; }
.пусто-рынка .зн svg{ width:44px; height:44px; }
.пусто-рынка .слова{ font-size:0.9667rem; color:var(--текст3); line-height:1.8; }

/* ── окно нового товара ──────────────────────────────────────────── */
.знаки-разделов{ display:flex; gap:8px; flex-wrap:wrap; }
.выбор-файла{
  width:100%; font-size:0.8667rem; color:var(--текст3); padding:10px 0;
  font-family:inherit;
}
.выбор-файла::-webkit-file-upload-button,
.выбор-файла::file-selector-button{
  margin-inline-end:12px; cursor:pointer; padding:9px 16px; font-family:inherit;
  font-size:0.8667rem; font-weight:600; border-radius:var(--радиус-мал);
  border:1px solid var(--край2); background:var(--поле); color:var(--текст);
}
.выбор-файла::-webkit-file-upload-button:hover,
.выбор-файла::file-selector-button:hover{ border-color:var(--синий); }
.предпросмотр{ width:100%; height:130px; object-fit:cover; border-radius:11px;
  margin-top:8px; display:block; border:1px solid var(--край); }

})();

   ВЕРХ: разделы, подразделы, вкладки
   ═══════════════════════════════════════════════════════════════════════ */
function кнРежим(имя, знак, подпись, под) {
  var б = ок('button', 'режим' + (С.режим === имя ? ' тут' : ''));
  б.dataset.режим = имя;
  б.innerHTML = '<span class="зн">' + CW.значок(знак) + '</span>'
              + '<span>' + подпись + '</span>'
              + '<em>' + под + '</em>';
  б.onclick = function () { сменитьРежим(имя); };
  return б;
}

function сменитьРежим(имя) {
  if (имя === С.режим) return;
  С.режим = имя; С.кат = ''; С.под = ''; С.открыт = null;
  if (имя === 'digital' && С.вид === 'sold') С.вид = 'all';
  try { localStorage.setItem('cw_рынок', имя); } catch (е) {}
  [].slice.call(режимы.children).forEach(function (б) {
    б.classList.toggle('тут', б.dataset.режим === имя);
  });
  поле.value = ''; С.ищем = '';
  нарисоватьВерх();
  загрузить();
}

function вспомнитьРежим() {
  var н = null;
  try { н = localStorage.getItem('cw_рынок'); } catch (е) {}
  if (н === 'shop' || н === 'services') return н;
  return 'digital';
}

function нарисоватьВерх() {
  var вещи = С.режим === 'shop';
  var услуги = С.режим === 'services';
  поле.placeholder = услуги ? Т('Поиск по названию и описанию')
                   : вещи   ? Т('Поиск по названию, бренду, описанию')
                            : Т('Поиск по названию, описанию, тегам');
  кнДобавить.textContent = услуги ? Т('Добавить услугу') : Т('Добавить товар');

  /* разделы */
  катряд.innerHTML = '';
  катряд.appendChild(кнКата('', Т('Все'), null));
  (С.коты[С.режим] || []).forEach(function (к) {
    катряд.appendChild(кнКата(к.id, Т(к.name), к));
  });

  /* подразделы — только у вещей и только когда раздел выбран */
  подряд.innerHTML = '';
  var текущий = (С.коты[С.режим] || []).filter(function (к) {
    return к.id === С.кат; })[0];
  var субы = (текущий && текущий.subs) || [];
  подряд.style.display = субы.length ? 'flex' : 'none';
  if (субы.length) {
    подряд.appendChild(кнПода('', Т('Любой')));
    субы.forEach(function (с) { подряд.appendChild(кнПода(с, Т(с))); });
  }

  /* вкладки */
  виды.innerHTML = '';
  ВИДЫ.forEach(function (в) {
    /* «Мои продажи» есть только у вещей: у цифрового товара продажа —
       это мгновенная выдача файла, отслеживать нечего. */
    if (в.имя === 'sold' && С.режим === 'digital') return;
    /* У услуг «Мои товары» читается неправильно: это не товары, а то,
       что человек умеет делать. */
    var подпись = (услуги && в.имя === 'mine') ? Т('Мои услуги') : в.подпись;
    var б = ок('button', 'вид' + (С.вид === в.имя ? ' тут' : ''));
    /* У корзины на вкладке стоит число: сколько уже набрано. Без него
       человек не видит, что в ней что-то лежит, и собирает заново. */
    var сколькоВКорзине = (в.имя === 'cart' && CW.корзина) ? CW.корзина.сколько() : 0;
    б.innerHTML = '<span class="зн" style="color:' + в.цвет + '">'
                + CW.значок(в.зн) + '</span><span>' + подпись
                + (сколькоВКорзине ? ' · ' + сколькоВКорзине : '') + '</span>';
    б.onclick = function () {
      if (С.вид === в.имя) return;
      С.вид = в.имя; С.открыт = null;
      нарисоватьВерх();
      /* Корзина лежит в браузере - ходить за ней на сервер незачем. */
      if (С.вид === 'cart') нарисоватьСписок(); else загрузить();
    };
    виды.appendChild(б);
  });

  /* в корзине, в покупках и в продажах искать по витрине нечего */
  if (С.вид === 'cart') {
    поискряд.style.display = 'none';
    катряд.style.display = 'none';
    подряд.style.display = 'none';
    return;
  }
  var своё = (С.вид === 'bought' || С.вид === 'sold');
  var заказы = своё && С.режим !== 'digital';
  поискряд.style.display = заказы ? 'none' : 'flex';
  катряд.style.display = заказы ? 'none' : 'flex';
  if (заказы) подряд.style.display = 'none';
}

function кнКата(ид, имя, кот) {
  var б = ок('button', 'кат' + (С.кат === ид ? ' тут' : ''));
  var линия = линияРаздела(ид);
  б.innerHTML = (линия
      ? '<span class="зн" style="color:' + (ЦВЕТА[ид] || 'currentColor') + '">'
        + CW.рисунок(линия) + '</span>'
      : (кот && кот.icon ? '<span class="зн">' + CW.безопасно(кот.icon) + '</span>' : ''))
    + '<span>' + CW.безопасно(имя) + '</span>';
  б.onclick = function () {
    if (С.кат === ид) return;
    С.кат = ид; С.под = ''; С.открыт = null;
    нарисоватьВерх(); загрузить();
  };
  return б;
}

function кнПода(значение, подпись) {
  var б = ок('button', 'подраздел' + (С.под === значение ? ' тут' : ''));
  б.textContent = подпись;
  б.onclick = function () {
    С.под = значение; С.открыт = null;
    нарисоватьВерх(); нарисоватьСписок();
  };
  return б;
}

/* ═══════════════════════════════════════════════════════════════════════
   ЗАГРУЗКА.

   Нажали подряд две кнопки — ответ показываем только на последнюю.
   Иначе медленный первый ответ перетирает быстрый второй, и на экране
   оказывается не тот раздел, что выбран.
   ═══════════════════════════════════════════════════════════════════════ */
function загрузить() {
  var мой = ++С.шаг;
  С.открыт = null;
  CW.ждём(списком);

  var путь = собратьПуть();
  CW.спросить(путь, { сроком: 25000 })
    .then(function (д) {
      if (мой !== С.шаг) return;
      запомнитьРазделы(д);
      if (С.вид === 'bought' && С.режим === 'shop') {
        С.заказы = (д && д.orders) || [];
      } else if (С.вид === 'sold') {
        С.заказы = (д && д.orders) || [];
      } else {
        С.товары = (д && д.items) || [];
      }
      нарисоватьВерх();
      нарисоватьСписок();
    })
    .catch(function (е) {
      if (мой !== С.шаг) return;
      списком.innerHTML = '';
      var б = ок('div', 'беда');
      б.textContent = е.сеть ? Т('Нет связи с сервером')
                             : (е.message || Т('Маркетплейс не ответил'));
      списком.appendChild(б);
    });
}

function собратьПуть() {
  /* Заказы у вещей и услуг общие: они лежат в одной таблице заказов, и
     человеку полезнее один список «что я заказал», чем два. */
  if (С.режим !== 'digital' && С.вид === 'bought') return '/shop/me/orders';
  if (С.режим !== 'digital' && С.вид === 'sold')   return '/shop/me/sales';

  var куски = ['limit=60'];
  if (С.кат) куски.push('cat=' + encodeURIComponent(С.кат));
  if (С.ищем) куски.push('q=' + encodeURIComponent(С.ищем));
  if (С.вид === 'mine') куски.push('mine=1');
  if (С.вид === 'bought') куски.push('bought=1');
  return (С.режим === 'shop' ? '/shop?'
        : С.режим === 'services' ? '/services?' : '/market?') + куски.join('&');
}

/* Разделы приходят вместе с товарами. Держим их у себя, чтобы при
   переходе между вкладками ряд не моргал пустотой. */
function запомнитьРазделы(д) {
  if (!д) return;
  if (Array.isArray(д.cats) && д.cats.length) С.коты[С.режим] = д.cats;
  if (Array.isArray(д.conds) && д.conds.length) С.состояния = д.conds;
  if (Array.isArray(д.places) && д.places.length) С.места = д.places;
}

/* ═══════════════════════════════════════════════════════════════════════
   СПИСОК
   ═══════════════════════════════════════════════════════════════════════ */
function нарисоватьСписок() {
  CW.гдеБыл(null);
  списком.innerHTML = '';

  if (С.вид === 'cart') { нарисоватьКорзину(); return; }

  if (С.вид === 'sold' || (С.вид === 'bought' && С.режим !== 'digital')) {
    нарисоватьЗаказы();
    return;
  }

  var ряды = С.товары;
  if (С.под) {
    ряды = ряды.filter(function (т) { return т.subcategory === С.под; });
  }

  if (!ряды.length) { списком.appendChild(пустое()); return; }

  var сетка = ок('div', 'сетка' + (С.режим === 'digital' ? ' цифра' : ''));
  ряды.forEach(function (т) { сетка.appendChild(карта(т)); });
  списком.appendChild(сетка);
}

/* ── ПУСТАЯ ПОЛКА ──
   Два слова и значок. Длинных объяснений здесь больше нет: Анна
   попросила убрать. Человек и так видит, что полка пустая, а второй
   строкой его держат в экране, из которого он уже уходит. Одно и то
   же слово во всех разделах и на всех витринах — «Пока пусто».

   Поиск — единственное исключение: там важно, ЧТО именно не нашлось,
   иначе человек решит, что сломалась вся витрина. */
function пустое() {
  var знак = 'сумка', слова = Т('Пока пусто');

  if (С.вид === 'mine') знак = 'ящик';
  else if (С.вид === 'bought') знак = 'тележка';
  else if (С.ищем) {
    знак = 'лупа';
    слова = CW.безопасно(Т.с('По запросу «{что}» ничего не нашлось.', { что: С.ищем }));
  } else if (С.режим !== 'shop') знак = 'дискета';

  var у = ок('div', 'пусто-рынка');
  у.innerHTML = '<div class="зн">' + CW.значок(знак) + '</div>'
              + '<div class="слова">' + слова + '</div>';
  return у;
}

function карта(т) {
  var б = ок('button', 'карта' + (т.status && т.status !== 'active' ? ' снят' : ''));
  var кот = разделПо(т.category);

  var пик = покрышка(т, кот);
  var метки = '<span class="метка-угол"><span class="зн" style="color:'
            + (ЦВЕТА[т.category] || 'currentColor') + '">'
            + значокРаздела(кот) + '</span>'
            + '<span class="имя">' + CW.безопасно(Т(кот.name)) + '</span></span>'
    + (т.mine ? '<span class="метка-право моё">' + CW.безопасно(Т('моё')) + '</span>'
      : т.bought ? '<span class="метка-право куплено">' + CW.безопасно(Т('куплено')) + '</span>' : '')
    + (т.status && т.status !== 'active'
        ? '<span class="метка-низ">' + состояниеТовара(т.status) + '</span>' : '');

  б.innerHTML =
      '<span class="пик">' + пик + метки + значокФигуры(т) + '</span>'
    + '<span class="низ">'
    +   (т.brand ? '<span class="бренд">' + CW.безопасно(т.brand) + '</span>' : '')
    +   '<span class="имя">' + CW.безопасно(т.title || Т('Без названия')) + '</span>'
    +   '<span class="кто">' + CW.безопасно(т.seller || '') + '</span>'
    +   '<span class="подвал">' + ценник(т) + мелочь(т) + '</span>'
    + '</span>';

  нарисоватьФигуру(б, т);
  б.onclick = function () { открыть(т.id); };

  /* Имя продавца и на самой плитке витрины: навёл — карточка с
     рейтингом, нажал — окно отзывов. Нажатие по имени до товара не
     доходит: это разные двери, и открывать обе разом незачем. */
  var ктоНаПлитке = б.querySelector('.кто');
  if (ктоНаПлитке && т.seller_id && CW.продавец) {
    CW.продавец.привязать(ктоНаПлитке, т.seller_id);
  }
  return б;
}

/* ── фигура вещи на карточке ───────────────────────────────────────
   Когда вещь выставляют, хозяин выбирает ей фигуру, краску и надпись
   (shape, shape_color, shape_text — они приходят в том же ответе, что
   и сама вещь). На витрине этого не было видно вовсе, хотя выбор
   делается руками и человек ждёт его увидеть.

   Рисуем настоящую фигуру, а не смайл: тот же меш, которым мир рисует
   куб, в выбранной краске. Смайл обещает не то — «🔻» и конус разные
   вещи, а «⬡» на одной системе шестиугольник, на другой кружок.

   Холст лёгкий (34 точки) и рисуется один раз. Сам движок форм
   подтягиваем по надобности: на витрине цифровых товаров фигур нет, и
   возить файл зря незачем. */
function значокФигуры(т) {
  if (!т.shape) return '';
  var подпись = String(т.shape_text || '').trim();
  return '<span class="метка-фигура' + (подпись ? '' : ' без-слова') + '">'
       + '<canvas width="68" height="68" data-ф="' + CW.безопасно(т.shape) + '"'
       + ' data-к="' + CW.безопасно(т.shape_color || '') + '"></canvas>'
       + (подпись ? '<span class="слово">' + CW.безопасно(подпись) + '</span>' : '')
       + '</span>';
}

function нарисоватьФигуру(где, т) {
  if (!т.shape) return;
  var холст = где.querySelector('.метка-фигура canvas');
  if (!холст) return;
  CW.нужен('shared/формы.js').then(function () {
    /* Сперва рисуем фигуру краской — она видна сразу. Если на неё
       натянута картинка, та приедет следом и перерисует. Ждать
       картинку, чтобы показать хоть что-то, нельзя: на витрине их
       столько же, сколько вещей. */
    CW.формы.образец(холст, холст.dataset['ф'], холст.dataset['к']);
    картинкаФигуры(т.id).then(function (кадр) {
      if (кадр) CW.формы.образец(холст, холст.dataset['ф'], холст.dataset['к'], кадр);
    });
  }).catch(function () {
    /* Движок форм не приехал — значок просто не появится. Ломать из-за
       украшения всю витрину нельзя. */
  });
}

/* ── картинка, натянутая на фигуру ─────────────────────────────────
   Когда вещь выставляют, на фигуру можно натянуть своё фото или ролик
   («Натянется на фигуру вместо цвета»). Лежит оно отдельно от снимков
   товара и в списке витрины не приходит: сервер нарочно не кладёт его
   в media, чтобы оно не попало в ленту снимков. Поэтому спрашиваем
   его по номеру вещи — ровно так же делает боевая.

   Спрашиваем один раз на вещь и держим ответ у себя: витрину
   перерисовывают при каждом поиске, а картинка не меняется. */
var ФИГ = {};

function картинкаФигуры(ид) {
  if (!ид) return Promise.resolve(null);
  if (ФИГ[ид]) return ФИГ[ид];
  ФИГ[ид] = CW.спросить('/shop/' + ид + '/shape-media', { тихо: true })
    .then(function (д) {
      if (!д || !д.url) return null;
      return загрузитьКадр(CW.адрес + д.url, /^video\//.test(д.mime || ''));
    })
    .catch(function () { return null; });
  return ФИГ[ид];
}

/* Из ролика берём один кадр: крутить видео в значке размером с ноготь
   незачем, а первый кадр говорит о товаре ровно то же. */
function загрузитьКадр(адрес, ролик) {
  return new Promise(function (готово) {
    if (!ролик) {
      var и = new Image();
      и.crossOrigin = 'anonymous';
      и.onload = function () { готово(и); };
      и.onerror = function () { готово(null); };
      и.src = адрес;
      return;
    }
    var в = document.createElement('video');
    в.crossOrigin = 'anonymous';
    в.muted = true; в.playsInline = true; в.preload = 'metadata';
    в.onloadeddata = function () { готово(в); };
    в.onerror = function () { готово(null); };
    в.src = адрес + '#t=0.1';
  });
}

function покрышка(т, кот) {
  if (С.режим !== 'digital') {
    var первый = (т.media || [])[0];
    if (первый && первый.kind !== 'video') {
      return '<img loading="lazy" alt="" src="' + CW.адрес + первый.url + '">';
    }
  } else if (т.cover) {
    return '<img loading="lazy" alt="" src="' + CW.безопасно(CW.файл(т.cover)) + '">';
  }
  return '<span class="зн" style="color:' + (ЦВЕТА[т.category] || 'currentColor')
       + '">' + значокРаздела(кот, 38) + '</span>';
}

function значокРаздела(кот, размер) {
  var линия = линияРаздела(кот.id);
  if (линия) return CW.рисунок(линия, размер);
  return CW.безопасно(кот.icon || '');
}

/* Корень ручек текущей стороны. Статус и удаление у услуги идут по
   шопинговым ручкам: услуга лежит в той же таблице, что и вещь. */
function корень() {
  if (С.режим === 'digital') return '/market/';
  if (С.режим === 'services') return '/services/';
  return '/shop/';
}

function разделПо(ид) {
  var с = (С.коты[С.режим] || []).filter(function (к) { return к.id === ид; })[0];
  return с || { id: ид || 'other', name: ид || Т('Разное'), icon: '📦' };
}

function ценник(т) {
  var цена = Number(т.price || 0);
  if (цена <= 0) {
    return '<span class="цена даром">'
         + CW.безопасно(С.режим === 'digital' ? Т('Бесплатно')
                      : С.режим === 'services' ? Т('Цена по договору') : Т('Цены нет'))
         + '</span>';
  }
  /* У работы цена редко точная, поэтому у услуги бывает «от». Слово
     стоит ПЕРЕД числом: человек читает цену слева направо и должен
     узнать про «от» раньше, чем запомнит сумму. */
  return '<span class="цена">' + (т.price_from ? CW.безопасно(Т('от')) + ' ' : '')
       + деньги(цена) + ' ' + CW.безопасно(т.currency || 'CUBE') + '</span>';
}

function мелочь(т) {
  var части = [];
  if (С.режим === 'services') {
    if (т.term) части.push(т.term);
    if (т.place) части.push(имяМеста(т.place));
    /* Страна и город идут сразу на карточке: человеку важно понять,
       откуда везут и где делают, не открывая товар. */
    if (т.geo) части.push(т.geo);
  } else if (С.режим === 'shop') {
    if (т.condition) части.push(имяСостояния(т.condition));
    if (т.qty > 1) части.push(Т.с('{н} шт', { н: т.qty }));
    if (т.geo) части.push(т.geo);
  } else {
    if (т.files_count) части.push(т.files_count + ' ' + склонение(т.files_count, 'файл', 'файла', 'файлов'));
    if (т.sales) части.push(т.sales + ' ' + склонение(т.sales, 'продажа', 'продажи', 'продаж'));
  }
  if (!части.length) return '';
  return '<span class="мелко">' + CW.безопасно(части.join(' · ')) + '</span>';
}

function состояниеТовара(с) {
  return { hidden: Т('скрыт'), removed: Т('снят с витрины'), sold: Т('разобрали') }[с] || с;
}

/* Место встречи приезжает с сервера вместе с разделами, как и
   состояние вещи. Пока список не приехал — показываем русское слово по
   запасной карте, а не голый «online». */
var МЕСТА_ЗАПАС = { online: 'Онлайн', mine: 'У меня', yours: 'У тебя' };

function имяМеста(ид) {
  var м = (С.места || []).filter(function (х) { return х.id === ид; })[0];
  return Т((м && м.name) || МЕСТА_ЗАПАС[ид] || ид);
}

function имяСостояния(ид) {
  var с = С.состояния.filter(function (х) { return х.id === ид; })[0];
  return с ? Т(с.name) : ид;
}

function деньги(ч) {
  ч = Number(ч) || 0;
  return CW.число(Math.round(ч * 100) / 100);
}

function склонение(н, один, два, много) {
  return CW.склонение(н, один, два, много);
}

/* ═══════════════════════════════════════════════════════════════════════
   КАРТОЧКА ТОВАРА
   ═══════════════════════════════════════════════════════════════════════ */
function открыть(ид) {
  var мой = ++С.шаг;
  CW.ждём(списком);

  CW.спросить(корень() + ид, { сроком: 20000 })
    .then(function (т) {
      if (мой !== С.шаг) return;
      С.открыт = т; С.снимок = 0;
      CW.гдеБыл({ окно: 'товар', режим: С.режим, ид: ид });
      нарисоватьТовар();
    })
    .catch(function (е) {
      if (мой !== С.шаг) return;
      списком.innerHTML = '';
      var б = ок('div', 'беда');
      б.textContent = е.message || Т('Товар не открылся');
      списком.appendChild(б);
      списком.appendChild(кнопкаНазад());
    });
}

function кнопкаНазад() {
  var строка = ок('div', 'назад-строка');
  var б = ок('button', 'кн-назад');
  б.innerHTML = CW.значок('стрелка') + CW.безопасно(Т('К витрине'));
  б.onclick = function () { С.открыт = null; нарисоватьСписок(); };
  строка.appendChild(б);
  return строка;
}

function нарисоватьТовар() {
  var т = С.открыт;
  списком.innerHTML = '';
  списком.appendChild(кнопкаНазад());

  var обёртка = ок('div', 'товар');
  var слева = ок('div', 'слева');
  var справа = ок('div', 'справа');
  обёртка.appendChild(слева); обёртка.appendChild(справа);
  списком.appendChild(обёртка);

  нарисоватьСнимки(слева, т);
  нарисоватьОписание(справа, т);
}

function нарисоватьСнимки(куда, т) {
  куда.innerHTML = '';
  var кот = разделПо(т.category);
  var большой = ок('div', 'большой');

  if (С.режим !== 'digital') {
    var медиа = т.media || [];
    var ш = медиа[С.снимок] || медиа[0];
    if (ш) {
      большой.innerHTML = ш.kind === 'video'
        ? '<video src="' + CW.адрес + ш.url + '" controls playsinline></video>'
        : '<img alt="" src="' + CW.адрес + ш.url + '">';
    } else {
      большой.innerHTML = '<span class="зн" style="color:'
        + (ЦВЕТА[т.category] || 'currentColor') + '">'
        + значокРаздела(кот, 64) + '</span>';
    }
    /* Фигура вещи стоит и на раскрытой карточке — в том же углу
       снимка, что на витрине, только крупнее. Раньше при раскрытии
       она пропадала вовсе. */
    большой.insertAdjacentHTML('beforeend', значокФигуры(т));
    нарисоватьФигуру(большой, т);
    куда.appendChild(большой);

    if (медиа.length > 1) {
      var лента = ок('div', 'лента-снимков');
      медиа.forEach(function (м, и) {
        var б = ок('button', 'снимочек' + (и === С.снимок ? ' тут' : ''));
        б.innerHTML = м.kind === 'video'
          ? '<video src="' + CW.адрес + м.url + '" muted></video>'
          : '<img alt="" loading="lazy" src="' + CW.адрес + м.url + '">';
        б.onclick = function () { С.снимок = и; нарисоватьСнимки(куда, т); };
        лента.appendChild(б);
      });
      куда.appendChild(лента);
    }
    return;
  }

  большой.innerHTML = т.cover
    ? '<img alt="" src="' + CW.безопасно(CW.файл(т.cover)) + '">'
    : '<span class="зн" style="color:' + (ЦВЕТА[т.category] || 'currentColor')
      + '">' + значокРаздела(кот, 64) + '</span>';
  куда.appendChild(большой);
}

function нарисоватьОписание(куда, т) {
  куда.innerHTML = '';
  var вещь = (С.режим === 'shop');
  var услуга = (С.режим === 'services');

  if (т.brand) куда.appendChild(ок('div', 'бренд', CW.безопасно(т.brand)));

  var з = document.createElement('h2');
  з.textContent = т.title || 'Без названия';
  куда.appendChild(з);

  /* ── ИМЯ ПРОДАВЦА — ДВЕРЬ ──
     Наведение показывает карточку с рейтингом, нажатие открывает окно
     с отзывами (shared/продавец.js). Раньше имя было просто словом, и
     про продавца нельзя было узнать ничего. */
  var ктоСтрока = ок('div', 'кто', Т('Продавец: '));
  var имяПродавца = document.createElement('span');
  имяПродавца.textContent = т.seller || '-';
  ктоСтрока.appendChild(имяПродавца);
  ктоСтрока.appendChild(document.createTextNode(
      ' · ' + Т(разделПо(т.category).name)
    + (т.subcategory ? ' · ' + Т(т.subcategory) : '')));
  куда.appendChild(ктоСтрока);
  if (т.seller_id && CW.продавец) CW.продавец.привязать(имяПродавца, т.seller_id);

  var ценаСтрока = ок('div', 'ценник', ценник(т));
  /* У услуги вместо состояния и количества — срок и место: ровно то,
     что спрашивают первым делом. */
  if (услуга) {
    if (т.term) ценаСтрока.appendChild(ок('span', 'знач-состояния', т.term));
    if (т.place) ценаСтрока.appendChild(ок('span', 'знач-состояния', имяМеста(т.place)));
  }
  if (вещь && т.condition) {
    ценаСтрока.appendChild(ок('span', 'знач-состояния', имяСостояния(т.condition)));
  }
  if (вещь) {
    ценаСтрока.appendChild(ок('span', 'знач-состояния',
      т.qty > 0 ? Т.с('осталось {н} шт', { н: т.qty })
                : Т('разобрали')));
  }
  куда.appendChild(ценаСтрока);

  if (т.description) куда.appendChild(ок('div', 'текст', CW.безопасно(т.description)));

  if ((т.tags || []).length) {
    куда.appendChild(ок('div', 'теги', т.tags.map(function (г) {
      return '<span class="тег">' + CW.безопасно(г) + '</span>';
    }).join('')));
  }

  if (вещь && (т.specs || []).length) {
    куда.appendChild(ок('div', 'свойства', т.specs.map(function (п) {
      return '<div class="свойство"><span class="к">' + CW.безопасно(п.k || '')
           + '</span><span>' + CW.безопасно(п.v || '') + '</span></div>';
    }).join('')));
  }

  /* Страна и город — своей строкой и у вещи, и у услуги. Текст пишет
     продавец, поэтому через машинку он не идёт: это его слова. */
  if (т.geo) {
    куда.appendChild(ок('div', 'замечание',
      '<b>' + CW.безопасно(Т('Страна / Город.')) + '</b> '
      + CW.безопасно(т.geo)));
  }

  if (вещь && т.shipping) {
    куда.appendChild(ок('div', 'замечание',
      '<b>' + CW.безопасно(Т('Доставка.')) + '</b> '
      + CW.безопасно(т.shipping)));   /* текст доставки пишет продавец */
  }

  /* цифровой товар: что получено */
  if (!вещь && (т.bought || т.mine)) {
    if (т.delivery) {
      куда.appendChild(ок('div', 'доставка-текст', CW.безопасно(т.delivery)));
    }
    var файлы = т.files || [];
    if (файлы.length) {
      var список = ок('div', 'файлы');
      файлы.forEach(function (ф) {
        var строка = ок('div', 'файл',
            '<span class="зн">' + CW.значок('лист') + '</span>'
          + '<span class="нм">' + CW.безопасно(ф.name) + '</span>'
          + '<span class="рз">' + размер(ф.size) + '</span>'
          + '<button>' + CW.безопасно(Т('Скачать')) + '</button>');
        строка.querySelector('button').onclick = function () { скачать(т, ф, this); };
        список.appendChild(строка);
      });
      куда.appendChild(список);
    }
  }

  куда.appendChild(действия(т));
}

function размер(б) {
  б = Number(б) || 0;
  if (б >= 1048576) return (б / 1048576).toFixed(1) + ' МБ';
  if (б >= 1024) return Math.round(б / 1024) + ' КБ';
  return б + ' Б';
}

/* ═══════════════════════════════════════════════════════════════════════
   ДЕЙСТВИЯ НАД ТОВАРОМ
   ═══════════════════════════════════════════════════════════════════════ */
function действия(т) {
  var ряд = ок('div', 'действия');
  var вещь = (С.режим === 'shop');
  var услуга = (С.режим === 'services');

  if (т.mine) {
    ряд.appendChild(кнопка(т.status === 'active' ? Т('Снять с витрины') : Т('Вернуть в продажу'),
      '', function () { переключитьПродажу(т); }));
    /* Поднять наверх витрины. Только то, что стоит в продаже: поднимать
       снятое бессмысленно, и сервер такое не примет. Сколько поднятий
       осталось в этом месяце, говорит сам ответ. */
    if (т.status === 'active') {
      ряд.appendChild(кнопка(Т('Поднять'), '', function () { поднять(т); }));
    }
    if (услуга) {
      ряд.appendChild(кнопка(Т('Добавить снимок'), '', function () { приложитьСнимок(т); }));
      ряд.appendChild(кнопка(Т('Удалить'), 'опасная', function () { удалить(т); }));
      return ряд;
    }
    if (!вещь) {
      ряд.appendChild(кнопка(Т('Приложить файл'), '', function () { приложитьФайл(т); }));
    } else {
      ряд.appendChild(кнопка(Т('Добавить снимок'), '', function () { приложитьСнимок(т); }));
    }
    ряд.appendChild(кнопка(Т('Удалить'), 'опасная', function () { удалить(т); }));
    return ряд;
  }

  if (!вещь) {
    if (т.bought) {
      ряд.appendChild(ок('div', 'замечание', Т('Товар у тебя. Файлы и текст выше.')));
      return ряд;
    }
    var цена = Number(т.price || 0);
    ряд.appendChild(кнопка(цена > 0
        ? Т.с('Купить за {цена} CUBE', { цена: деньги(цена) })
        : Т('Забрать бесплатно'),
      'главная', function () { купить(т); }));
    ряд.appendChild(вКорзину(т, 'market'));
    return ряд;
  }

  /* ── УСЛУГА ──
     Цена «от» — это приглашение к разговору, а не ценник. Платить по
     ней нельзя: заказчик и мастер сперва договариваются об объёме.
     Поэтому вместо кнопки «Заказать» здесь честная строка. */
  if (услуга) {
    if (т.status !== 'active') {
      ряд.appendChild(ок('div', 'замечание', Т('Эту услугу сейчас не оказывают.')));
      return ряд;
    }
    var ц = Number(т.price || 0);
    if (т.price_from || ц <= 0) {
      ряд.appendChild(ок('div', 'замечание',
        Т('Цена зависит от работы: напиши мастеру и договорись.')));
      return ряд;
    }
    if (String(т.currency || 'CUBE').toUpperCase() !== 'CUBE') {
      ряд.appendChild(ок('div', 'замечание',
        Т.с('Цена выставлена в {валюта}, а площадка считает в CUBE. Заказать отсюда нельзя, договаривайтесь с мастером.',
            { валюта: т.currency })));
      return ряд;
    }
    ряд.appendChild(кнопка(Т.с('Заказать за {сколько} CUBE', { сколько: деньги(ц) }),
      'главная', function () { купить(т); }));
    return ряд;
  }

  /* вещь */
  if (т.status !== 'active' || !т.qty) {
    ряд.appendChild(ок('div', 'замечание', Т('Этого товара сейчас нет в продаже.')));
    return ряд;
  }
  if (Number(т.price || 0) <= 0) {
    ряд.appendChild(ок('div', 'замечание',
      Т('У товара не проставлена цена, купить через площадку нельзя. ')
      + Т('Это вопрос к продавцу.')));
    return ряд;
  }
  /* Площадка считает только в CUBE. Если продавец выставил цену в другой
     валюте, кнопка «купить» списала бы столько же CUBE — молча и не по
     той цене. Честнее не показывать кнопку вовсе. */
  if (String(т.currency || 'CUBE').toUpperCase() !== 'CUBE') {
    ряд.appendChild(ок('div', 'замечание',
      Т.с('Цена выставлена в {валюта}, а площадка считает в CUBE. '
        + 'Купить отсюда нельзя, договаривайтесь с продавцом.',
          { валюта: CW.безопасно(т.currency) })));
    return ряд;
  }
  ряд.appendChild(кнопка(Т.с('Купить за {цена} CUBE',
                            { цена: деньги(т.price) }), 'главная',
    function () { купить(т); }));
  ряд.appendChild(вКорзину(т, 'shop'));
  return ряд;
}

/* ── «В КОРЗИНУ» РЯДОМ С «КУПИТЬ» ──
   Купить сразу - по-прежнему первым делом: чаще всего берут одну вещь
   и не хотят лишних шагов. Корзина - для тех, кто набирает несколько.

   Кнопка знает, лежит ли товар в корзине, и вторым нажатием его
   оттуда убирает: иначе человек жмёт её дважды и не понимает, стало
   ли их два. */
function вКорзину(т, род) {
  var есть = CW.корзина && CW.корзина.есть(род, т.id);
  var б = кнопка(Т(есть ? 'Убрать из корзины' : 'В корзину'), '', function () {
    if (!CW.корзина) return;
    if (CW.корзина.есть(род, т.id)) {
      CW.корзина.убрать(род + ':' + т.id);
      CW.сказать(Т('Убрано из корзины'), 2000);
    } else {
      var о = CW.корзина.положить(т, род, 1);
      CW.сказать(о.беда ? о.беда
               : (о.добавлено ? 'В корзине' : Т('Уже в корзине')), 2500);
    }
    нарисоватьВерх();
    нарисоватьТовар();
  });
  if (есть) б.classList.add('вкорзине');
  return б;
}

function кнопка(подпись, вид, что) {
  var б = ок('button', 'кнопка' + (вид ? ' ' + вид : ''));
  б.textContent = подпись;
  б.onclick = что;
  return б;
}



/* ── покупка и создание — общими окнами (modals/) ──────────────────
   Раньше эти четыре окна жили здесь, и потому купить вещь можно было
   только с витрины. Теперь они общие: покупка открывается и из
   профиля продавца, и по прямой ссылке на товар. */
function купить(т) {
  CW.открыть('purchase', {
    товар: т,
    род: С.режим === 'digital' ? 'market' : 'shop',
    потом: function (о) {
      if (С.режим !== 'digital') { С.вид = 'bought'; нарисоватьВерх(); загрузить(); }
      else if (о && о.item) { С.открыт = о.item; С.снимок = 0; нарисоватьТовар(); }
      else открыть(т.id);
    }
  });
}

function послеСоздания(о) {
  CW.сказать(С.режим === 'digital' ? Т('Товар на витрине')
                                   : Т('Выложено. Теперь добавь снимки'));
  С.вид = 'mine';
  нарисоватьВерх();
  if (о && о.id) открыть(о.id); else загрузить();
}

/* ── ПОДНЯТЬ ОБЪЯВЛЕНИЕ ──
   Витрина сортируется по дате поднятия, поэтому поднятие — это просто
   новая дата. Сколько раз в месяц можно, решает тариф; отказ приезжает
   понятной фразой (402 «нужен тариф» или 429 «на этот месяц всё»), и
   показываем её как есть, не пересказывая своими словами. */
function поднять(т) {
  CW.спросить(корень() + т.id + '/bump', { способ: 'POST' })
    .then(function (о) {
      var осталось = (о && о.left != null) ? Number(о.left) : null;
      CW.сказать(осталось == null ? Т('Поднято')
                 : Т('Поднято') + '. ' + Т.с('Осталось поднятий: {н}', { н: осталось }));
      загрузить();
    })
    .catch(function (е) { CW.сказать(е.message || 'Не вышло'); });
}

function переключитьПродажу(т) {
  var куда = т.status === 'active' ? 'hidden' : 'active';
  CW.спросить(корень() + т.id + '/status', {
    способ: 'POST', тело: { status: куда }
  }).then(function () {
    CW.сказать(куда === 'active' ? Т('Товар снова на витрине') : Т('Снят с витрины'));
    открыть(т.id);
  }).catch(function (е) { CW.сказать(е.message || 'Не вышло'); });
}

function удалить(т) {
  CW.лист([
    { заголовок: Т.с('Удалить «{что}»?', { что: т.title || '' }) },
    { зн: CW.значок('урна', 16), подпись: Т('Удалить'), опасная: true, делать: function () {
        CW.спросить(корень() + т.id, { способ: 'DELETE' })
          .then(function (о) {
            CW.сказать(о && о.reason ? Т(о.reason) : Т('Удалён'));
            С.открыт = null; загрузить();
          })
          .catch(function (е) { CW.сказать(е.message || Т('Не вышло удалить')); });
      } },
    { зн: CW.значок('стрелка', 16), подпись: Т('Оставить') }
  ]);
}

/* Файл лежит за ключом: обычной ссылкой его не взять — к адресу
   /market/{id}/files/{file} браузер наш ключ не приложит. Поэтому берём
   запросом и отдаём из памяти браузера. */
function скачать(т, ф, кн) {
  var было = кн.textContent;
  кн.textContent = Т('Беру…'); кн.disabled = true;

  fetch(CW.адрес + '/market/' + т.id + '/files/' + ф.id, {
    headers: { Authorization: 'Bearer ' + CW.токен() }
  }).then(function (о) {
    if (!о.ok) throw new Error(Т('не отдалось'));
    return о.blob();
  }).then(function (б) {
    /* Файл уже у нас в памяти — отдаём его тем же общим способом, что
       и везде. Адрес из памяти отпускаем через полминуты: раньше нельзя,
       браузер ещё не дописал, позже незачем. */
    var адрес = URL.createObjectURL(б);
    CW.скачать(адрес, ф.name || 'файл');
    setTimeout(function () { URL.revokeObjectURL(адрес); }, 30000);
    кн.textContent = было; кн.disabled = false;
  }).catch(function () {
    кн.textContent = было; кн.disabled = false;
    CW.сказать(Т('Файл не скачался'));
  });
}

/* ═══════════════════════════════════════════════════════════════════════
   ЗАКАЗЫ
   ═══════════════════════════════════════════════════════════════════════ */
/* ═══════════════════════════════════════════════════════════════════════
   КОРЗИНА НА СТРАНИЦЕ

   Собрали несколько товаров - вот они списком, с итогом внизу. Что-то
   передумал - убрал урной, количество у вещи правится тут же. Кнопка
   внизу открывает окно оплаты (modals/cart.js): там цены спрашиваются
   у сервера заново, сверяется баланс и один раз спрашивается адрес.

   Сама корзина живёт в shared/корзина.js - одна на обе половины рынка
   и на все окна, которые её когда-нибудь позовут.
   ═══════════════════════════════════════════════════════════════════════ */
function нарисоватьКорзину() {
  var сп = CW.корзина ? CW.корзина.список() : [];
  if (!сп.length) {
    var у = ок('div', 'пусто-рынка');
    у.innerHTML = '<div class="зн">' + CW.значок('тележка')
                + '</div><div class="слова">' + CW.безопасно(Т('Корзина пуста.')) + '<br>'
                + '' + CW.безопасно(Т('У товара на витрине есть кнопка «В корзину».')) + '</div>';
    списком.appendChild(у);
    return;
  }

  var коробка = ок('div', 'крз-страница');
  сп.forEach(function (з) {
    var р = ок('div', 'крз-ряд');

    var кадр = ок('span', 'крз-кадр');
    if (з.снимок) кадр.innerHTML = '<img src="' + CW.безопасно(CW.файл(з.снимок)) + '" alt="">';
    else кадр.innerHTML = CW.значок(з.род === 'shop' ? 'сумка' : 'дискета', 18);
    р.appendChild(кадр);

    var имя = ок('span', 'крз-имя');
    имя.innerHTML = '<b>' + CW.безопасно(з.имя) + '</b>'
      + '<span class="крз-мелко">' + CW.безопасно(з.продавец || '')
      + (з.род === 'shop' ? ' · вещь' : ' · цифровой') + '</span>';
    имя.onclick = function () {
      С.режим = з.род === 'shop' ? 'shop' : 'digital';
      С.вид = 'all';
      запомнитьРежим(С.режим);
      нарисоватьВерх();
      открыть(з.ид);
    };
    р.appendChild(имя);

    /* Количество - только у вещей: цифровой товар один и тот же файл,
       двух штук у него не бывает. */
    if (з.род === 'shop') {
      var счёт = ок('span', 'крз-счёт');
      счёт.appendChild(кнСчёта('минус', function () {
        CW.корзина.поправить(з.ключ, (з.сколько || 1) - 1);
        нарисоватьВерх(); нарисоватьСписок();
      }));
      var ч = ок('span', 'крз-число'); ч.textContent = з.сколько || 1;
      счёт.appendChild(ч);
      счёт.appendChild(кнСчёта('плюс', function () {
        CW.корзина.поправить(з.ключ, (з.сколько || 1) + 1);
        нарисоватьВерх(); нарисоватьСписок();
      }));
      р.appendChild(счёт);
    }

    var цена = ок('span', 'крз-цена');
    цена.textContent = String(з.валюта || 'CUBE').toUpperCase() !== 'CUBE'
      ? (з.цена + ' ' + з.валюта)
      : (з.цена ? (деньги(з.цена * (з.сколько || 1)) + ' CUBE') : 'даром');
    р.appendChild(цена);

    var урна = ок('button', 'крз-убрать');
    урна.title = Т('Убрать из корзины');
    урна.innerHTML = CW.значок('урна', 16);
    урна.onclick = function () {
      CW.корзина.убрать(з.ключ);
      нарисоватьВерх(); нарисоватьСписок();
    };
    р.appendChild(урна);

    коробка.appendChild(р);
  });

  var низ = ок('div', 'крз-низ');
  var итог = CW.корзина.итог();
  низ.innerHTML = '<div class="крз-сумма"><span>' + CW.безопасно(Т('Итого')) + '</span><b>'
                + деньги(итог) + ' CUBE</b></div>';
  var оплатить = ок('button', 'кнопка главная');
  оплатить.textContent = Т('Оплатить всё');
  оплатить.onclick = function () {
    CW.открыть('cart', { потом: function () {
      нарисоватьВерх(); нарисоватьСписок();
    } });
  };
  низ.appendChild(оплатить);
  var очистить = ок('button', 'кнопка');
  очистить.textContent = Т('Очистить');
  очистить.onclick = function () {
    CW.лист([
      { заголовок: Т('Убрать всё из корзины?') },
      { зн: CW.значок('урна', 16), подпись: Т('Убрать всё'), делать: function () {
          CW.корзина.очистить(); нарисоватьВерх(); нарисоватьСписок();
        } },
      { зн: CW.значок('стрелка', 16), подпись: Т('Передумать') }
    ]);
  };
  низ.appendChild(очистить);
  коробка.appendChild(низ);

  списком.appendChild(коробка);
}

function кнСчёта(знак, что) {
  var б = ок('button', 'крз-кн');
  б.innerHTML = CW.значок(знак, 14) || (знак === 'плюс' ? '+' : '-');
  б.onclick = что;
  return б;
}

function нарисоватьЗаказы() {
  if (!С.заказы.length) {
    var у = ок('div', 'пусто-рынка');
    у.innerHTML = '<div class="зн">' + CW.значок(С.вид === 'sold' ? 'монета' : 'тележка')
                + '</div><div class="слова">'
                + CW.безопасно(Т(С.вид === 'sold'
                    ? 'Твои вещи пока никто не заказывал.'
                    : 'Ты пока ничего здесь не покупал.'))
                + '</div>';
    списком.appendChild(у);
    return;
  }

  var где = ок('div', 'заказы');
  С.заказы.forEach(function (з) { где.appendChild(заказ(з)); });
  списком.appendChild(где);
}

function заказ(з) {
  var у = ок('div', 'заказ');
  var продавец = (з.role === 'seller');

  у.innerHTML =
      '<div class="строка">'
    +   '<div class="имя">' + CW.безопасно(з.title || 'Товар') + '</div>'
    +   '<span class="шаг ' + CW.безопасно(з.status) + '">' + шагЗаказа(з.status) + '</span>'
    + '</div>'
    + '<div class="когда">' + деньги(з.total) + ' CUBE · ' + (з.qty || 1) + ' шт · '
    +   CW.безопасно(CW.подпись(з.created_at)) + ' · '
    +   (продавец ? 'покупатель ' + CW.безопасно(з.buyer)
                  : 'продавец ' + CW.безопасно(з.seller)) + '</div>'
    + (з.address ? '<div class="адрес">' + CW.безопасно(Т('Куда:')) + ' ' + CW.безопасно(з.address) + '</div>' : '')
    + (з.note ? '<div class="адрес">' + CW.безопасно(Т('Записка:')) + ' ' + CW.безопасно(з.note) + '</div>' : '');

  var кнопки = ок('div', 'кнопки');
  if (продавец && з.status === 'paid') {
    кнопки.appendChild(кнопка('Отправил', 'главная', function () { двинуть(з, 'sent'); }));
    кнопки.appendChild(кнопка('Отменить', 'опасная', function () { двинуть(з, 'cancelled'); }));
  } else if (продавец && з.status === 'sent') {
    кнопки.appendChild(кнопка('Отменить', 'опасная', function () { двинуть(з, 'cancelled'); }));
  } else if (!продавец && з.status === 'paid') {
    кнопки.appendChild(кнопка(Т('Отменить заказ'), 'опасная', function () { двинуть(з, 'cancelled'); }));
  } else if (!продавец && з.status === 'sent') {
    кнопки.appendChild(кнопка('Получил', 'главная', function () { двинуть(з, 'done'); }));
  }
  if (кнопки.children.length) у.appendChild(кнопки);
  return у;
}

function шагЗаказа(с) {
  return { paid: 'оплачен, ждёт отправки', sent: 'в пути',
           done: 'получен', cancelled: 'отменён' }[с] || с;
}

function двинуть(з, куда) {
  var спросить = function () {
    CW.спросить('/shop/orders/' + з.id + '/status', {
      способ: 'POST', тело: { status: куда }
    }).then(function () {
      CW.сказать({ sent: Т('Отмечено: отправлено'), done: Т('Готово, деньги у продавца'),
                   cancelled: Т('Заказ отменён, деньги вернулись') }[куда]);
      /* Деньги шевельнулись — спрашиваем, сколько их теперь, и правим
         верхнюю полосу: своего счёта ответ о заказе не содержит. */
      CW.кто(true).then(function (я) { CW.обновитьБаланс(я && я.cube_balance); });
      загрузить();
    }).catch(function (е) { CW.сказать(е.message || 'Не вышло'); });
  };

  if (куда === 'done') {
    CW.лист([
      { заголовок: Т('Вещь получена?') },
      { зн: CW.значок('галка', 16), подпись: Т('Да, получил'), делать: спросить },
      { зн: CW.рисунок('M6 6 18 18M18 6 6 18', 15), подпись: Т('Ещё нет') }
    ]);
    return;
  }
  if (куда === 'cancelled') {
    CW.лист([
      { заголовок: Т('Отменить заказ?') },
      { зн: CW.значок('урна', 16), подпись: Т('Отменить'), опасная: true, делать: спросить },
      { зн: CW.значок('стрелка', 16), подпись: Т('Оставить') }
    ]);
    return;
  }
  спросить();
}

/* ═══════════════════════════════════════════════════════════════════════
   НОВЫЙ ТОВАР
   ═══════════════════════════════════════════════════════════════════════ */
function новыйТовар() {
  /* Окна создания и покупки живут в modals/ — они нужны не только
     здесь: выложить вещь хочется и из профиля, и из поиска. */
  /* Вместе со списком разделов отдаём и наши линии: окно рисует ими
     значки в выборе категории. Держать второй такой же список внутри
     окна нельзя — однажды они разойдутся, и в выборе будет одно, а на
     витрине другое. */
  function сЛиниями(список) {
    return (список || []).map(function (к) {
      var с = {};
      Object.keys(к).forEach(function (п) { с[п] = к[п]; });
      с.линия = ЛИНИИ[к.id] || '';
      return с;
    });
  }

  if (С.режим === 'services') {
    CW.открыть('create-service', {
      разделы: (С.коты.services || []).map(function (к) {
        var с = {};
        Object.keys(к).forEach(function (п) { с[п] = к[п]; });
        с.линия = ЛИНИИ_УСЛУГ[к.id] || '';
        return с;
      }),
      места: С.места || [],
      потом: послеСоздания
    });
  } else if (С.режим === 'shop') {
    CW.открыть('create-item', {
      разделы: сЛиниями(С.коты.shop),
      состояния: С.состояния || [],
      потом: послеСоздания
    });
  } else {
    /* Разделы лежат под именем режима — «digital», а не «market».
       С чужим ключом сюда приезжал пустой список, и в окне товара
       оставалась одна выдуманная категория «Прочее»: восьми настоящих
       («Ключи и коды», «NFT и коллекции», …) человек не видел вовсе. */
    CW.открыть('create-product', {
      разделы: сЛиниями(С.коты.digital),
      потом: послеСоздания
    });
  }
}



/* ── приложить файл к своему товару ── */
function приложитьФайл(т) { взятьФайл('*/*', function (ф) {
  послатьФайл('/market/' + т.id + '/files', ф, т);
}); }

function приложитьСнимок(т) { взятьФайл('image/*,video/*', function (ф) {
  послатьФайл('/shop/' + т.id + '/media', ф, т);
}); }

/* Одно поле выбора файла на весь экран, и оно стоит в разметке с самого
   начала. Создавать его на каждое нажатие нельзя: поле, которого нет в
   разметке, в части браузеров молча не сообщает о выборе — человек
   выбирает файл, а ничего не происходит. */
var полеФайла = document.createElement('input');
полеФайла.type = 'file';
полеФайла.id = 'выбор-файла-рынка';
полеФайла.style.cssText =
  'position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none';
document.body.appendChild(полеФайла);
var кудаФайл = null;

полеФайла.onchange = function () {
  var ф = полеФайла.files && полеФайла.files[0];
  полеФайла.value = '';
  if (ф && кудаФайл) кудаФайл(ф);
  кудаФайл = null;
};

function взятьФайл(что, дальше) {
  кудаФайл = дальше;
  полеФайла.accept = что;
  полеФайла.click();
}

function послатьФайл(путь, ф, т) {
  CW.сказать(Т.с('Загружаю {имя}…', { имя: ф.name }), 8000);
  var пачка = new FormData();
  пачка.append('file', ф);
  CW.спросить(путь, { способ: 'POST', тело: пачка, сроком: 120000 })
    .then(function () { CW.сказать(Т('Готово')); открыть(т.id); })
    .catch(function (е) {
      CW.сказать(е.сеть ? 'Нет связи с сервером' : (е.message || 'Не загрузилось'));
    });
}

/* ═══════════════════════════════════════════════════════════════════════
   МЕЛОЧЬ
   ═══════════════════════════════════════════════════════════════════════ */
/* Собственных окон у маркетплейса больше нет: и создание, и покупка
   живут в modals/ и выглядят так же, как остальные тридцать с лишним
   окон программы. Здесь остались только витрина и карточка товара. */

function ок(тег, класс, внутри) { return CW.элВ(тег, класс, внутри); }

});
</script>
