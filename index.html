<!doctype html>
<html lang="ru" data-тема-замок="тёмная">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>CubeWorld</title>
<meta name="description" content="Временные зашифрованные пространства в трёхмерном мире. Без почты, без телефона, только ключ.">
<link rel="icon" href="icons/favicon.svg?v=20261128-513">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="shared/style.css?v=20261128-513">
<link rel="stylesheet" href="shared/window.css?v=20261128-513">
<link rel="stylesheet" href="shared/lang.css?v=20261128-513">
<link rel="stylesheet" href="shared/ключ-окно.css?v=20261128-513">
<script src="shared/theme.js?v=20261128-513"></script>
<!--
  ТИТУЛКА. Та же, что на сайте: звёздное небо, знак с крутящимся кубом,
  выбор языка, заголовок, вход по ключу, три тарифа, счётчики.

  Что изменилось против прежней:
    слова живут в общем словаре (shared/words.js), а не внутри страницы —
      раньше титулка и страница тарифов держали по своей копии и
      расходились;
    цены берутся с сервера (/plans) и показываются только когда пришли,
      а не подставляются вручную в двух местах;
    разговор с сервером идёт через shared/api.js — один apiCall на всю
      программу.

  Экранов два, они переключаются без перезагрузки:
    «главный» — всё, что выше;
    «ключ»    — выданный ключ, предупреждение и вход.
-->
<style>
.рама{ background:#020211; }
.рама-прокрутка{ position:relative; }

#небо{ position:absolute; inset:0; z-index:0; pointer-events:none; }
.рама{ position:fixed; }  /* небо считает размер от рамы */
.свечение{
  position:absolute; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(760px 560px at 22% 16%, rgba(0,153,255,.10), transparent 62%),
    radial-gradient(680px 520px at 80% 78%, rgba(139,124,246,.09), transparent 60%);
}

/* ── ВСЁ ДОЛЖНО ПОМЕЩАТЬСЯ В ОДИН ЭКРАН ───────────────────────────
   Титулку человек видит первой, и прокрутка на ней — это признание,
   что показать сразу нечего. Поэтому лист — колонка на всю высоту
   рамы, а воздух между частями берётся из остатка, а не задан
   числами: на высоком окне он сам становится больше, на низком —
   меньше, и ничего не уезжает вниз.

   Числа ниже (поля, кегли, карточки) уменьшены против прежних ровно
   настолько, чтобы на окне 1280×800 — самом низком из настольных —
   последняя строка счётчиков оставалась видна. */
.лист{ position:relative; z-index:1; max-width:1120px; margin:0 auto;
  padding:0 20px 19px; min-height:100%;
  display:flex; flex-direction:column; }
/* ── РИТМ СТРАНИЦЫ ──
   Страница — одна колонка: заглавие с кнопкой, карточки, счётчики. Она
   стоит по середине листа, и между её частями один и тот же промежуток,
   который растёт вместе с высотой окна, но не больше сорока двух точек.

   Ни верх, ни низ ни к чему не приклеены. Когда низ был прижат к нижнему
   краю, а верх к верхнему, на высоком окне посередине зияла дыра в две
   ладони; когда всё делилось поровну (space-evenly), под счётчиками
   оставалась ладонь пустого места. Одна колонка по середине — и ни того,
   ни другого.

   safe center: если на низком окне колонка всё же выше листа, она
   прижимается к верху, а не вылезает за шапку, куда не долистать. */
#экран-главный.открыт{ flex:1; display:flex; flex-direction:column;
  justify-content:safe center; gap:clamp(20px,3.4vh,42px);
  padding:clamp(8px,1.6vh,22px) 0; }
/* align-items:center обязателен: без него колонка растягивает детей по
   ширине, и кнопка «Авторизация ключом» вытягивается во весь лист. */
/* Заглавие поднято на сантиметр (38 точек) выше середины: верхний
   отступ на столько же уменьшен, нижний — на столько же увеличен, так
   что общая высота колонки та же и карточки со счётчиками не двигаются.

   На низком окне поднимать некуда: между шапкой и заглавием там и так
   меньше сантиметра. Поэтому подъём считается от высоты окна —
   calc(303px - 47vh) — и обрезается нулём снизу и 38 точками сверху:
   при 726 точках высоты и выше поднимаем на полный сантиметр, ниже —
   ровно настолько, чтобы над заглавием осталось 20 точек. */
#экран-главный.открыт > .заглавие{ flex:0 0 auto; display:flex;
  flex-direction:column; align-items:center;
  margin-top:clamp(-38px, calc(307px - 47vh), 0px);
  margin-bottom:clamp(0px, calc(47vh - 307px), 38px); }
/* Карточки идут сразу за кнопкой, счётчики — за карточками. Когда форма
   ключа раскрывается, она занимает место, и обе части сами уходят ниже. */
.низ-страницы{ flex:0 0 auto; margin-top:0; display:flex;
  flex-direction:column; gap:clamp(16px,2.6vh,30px); }

/* ── верх ────────────────────────────────────────────────────────── */
/* ── ШАПКА КАК В БОЕВОЙ ──
   Те же числа, что в работающей программе (index.html, #topbar): поля
   8 и 20, тонкая черта снизу, полупрозрачная тёмная подложка с
   размытием. Без черты шапка сливалась со звёздным небом, и её было
   попросту не видно.

   Отрицательные поля по бокам — чтобы черта шла во всю ширину листа, а
   не обрывалась за двадцать точек до края. */
.шапка{ display:flex; align-items:center; justify-content:space-between;
  padding:8px 20px; margin:0 -20px; flex:0 0 auto;
  border-bottom:1px solid rgba(255,255,255,.07);
  background:rgba(4,5,20,.9);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  position:relative; z-index:20;
}
.знак{ display:flex; align-items:center; gap:10px; }
/* Размер тот же, что в работающей программе: 36 точек, на узком
   экране 28 — там это записано тем же правилом. */
#знак-куб{ width:36px; height:36px; display:block; }
@media (max-width:480px){ #знак-куб{ width:28px; height:28px; } }
/* 17 точек и −0.3 — ровно как в боевой; «World» тем же синим, что и
   куб рядом. */
.знак .слово{ font-size:1.1333rem; font-weight:700; letter-spacing:-.3px; }
.знак .слово span{ color:#0095F6; }
/* Значок внутри строки: линия стоит на одной высоте с буквами и не
   растягивает строку собой. */
.зн{ display:inline-flex; align-items:center; line-height:0; }
.кн-вход .зн{ margin-inline-end:-1px; }

/* ── заглавие ────────────────────────────────────────────────────── */
.заглавие{ text-align:center; padding:0; }
.надпись{
  font-size:0.7667rem; letter-spacing:.22em; color:var(--синий);
  text-transform:uppercase; margin-bottom:12px;
}
.заглавие h1{
  margin:0; font-size:clamp(30px,4.6vw,46px); line-height:1.08;
  font-weight:800; letter-spacing:-.025em;
  background:linear-gradient(100deg,#ffffff 18%,#4a9eff 92%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
/* Одна строка на обе мысли: про пространства и про то, что входа без
   почты и телефона нет. Ширину даём побольше — чтобы она ложилась в две
   строки, а не в четыре. */
/* Две строки, а не одна: во всю ширину она читается как бегущая
   строка, и глаз не находит, где её конец. Ширина подобрана так, чтобы
   обе строки вышли примерно равными; text-wrap:balance доводит это там,
   где браузер умеет. */
.пояснение{ max-width:560px; margin:14px auto 0; font-size:0.9667rem;
  line-height:1.6; color:var(--текст2); text-wrap:balance; }

/* ── КНОПКА «АВТОРИЗАЦИЯ КЛЮЧОМ» КАК В БОЕВОЙ ──
   Числа взяты из работающей программы (index.html, .btn-cta) точка в
   точку: заливка синим в пятнадцать сотых, рамка в шестьдесят пять,
   скругление 24, поля 14 и 32, буквы 15 точек жирностью 700 с разрядкой
   в полточки. При наведении синего становится вдвое больше, а рамка
   почти сплошная — никакого подпрыгивания вверх, его в боевой нет. */
.кн-вход{
  display:inline-flex; align-items:center; gap:8px; margin-top:20px;
  /* 1.0714rem — это ровно 15 точек при нашей основе в 14, как в боевой;
     долей, а не точками, чтобы кнопка росла вместе с размером текста,
     который человек выбирает в оформлении. */
  padding:14px 32px; font-size:1.0714rem; font-weight:700; letter-spacing:.5px;
  cursor:pointer; color:#fff; border-radius:24px;
  border:1px solid rgba(0,149,246,.65);
  background:rgba(0,149,246,.15);
  transition:background .2s, border-color .2s;
}
.кн-вход:hover{ background:rgba(0,149,246,.32);
  border-color:rgba(0,149,246,.95); }

/* ── вход по ключу ───────────────────────────────────────────────── */
/* Коробка ключа в полтора раза уже: 430 точек под строку из
   девятнадцати знаков — это поле шире самого ключа вдвое, и оно
   перетягивало на себя весь экран. */
.вход{ max-width:290px; margin:16px auto 0; overflow:hidden;
  max-height:0; opacity:0; transition:max-height .3s, opacity .25s; }
.вход.раскрыт{ max-height:300px; opacity:1; }
.вход-коробка{
  background:rgba(255,255,255,.035); border:1px solid var(--край);
  border-radius:14px; padding:12px 13px; text-align:start;
}
.вход-коробка label{ display:block; font-size:0.7333rem; letter-spacing:.14em;
  text-transform:uppercase; color:var(--текст3); margin-bottom:6px; }
.поле-ключа{
  width:100%; text-align:center; letter-spacing:.1em; font-size:0.9rem;
  text-transform:uppercase; padding:11px 10px; margin-bottom:9px;
  background:var(--фон); border:1px solid var(--край); color:var(--текст);
  border-radius:var(--радиус); outline:none;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
}
.поле-ключа:focus{ border-color:var(--синий); }
.поле-ключа::placeholder{ letter-spacing:.05em; text-transform:none;
  font-family:var(--шрифт); color:var(--текст3); }
.широкая{ width:100%; padding:11px; font-size:0.9333rem; }
.весть{ min-height:16px; font-size:0.8333rem; margin-top:8px; text-align:center; }
/* Пока сказать нечего — строки нет вовсе. Пустая она всё равно держала
   под кнопкой «Войти» 24 точки (16 своей высоты и 8 отступа), и коробка
   ключа снизу выглядела растянутой. Появится весть — коробка подрастёт
   ровно на неё. */
.вход-коробка .весть:empty{ display:none; }
.весть.плохо{ color:var(--красный); }
.весть.ждём{ color:var(--текст3); }
.весть.хорошо{ color:var(--зелёный); }

/* ── КОГДА ФОРМА КЛЮЧА РАСКРЫТА ───────────────────────────────────
   Ничего не уменьшается: ни заголовок, ни пояснение, ни карточки. Текст,
   который мельчает от нажатия на кнопку, — это дёрганье страницы, и
   выглядит оно криво. Форма просто встаёт под кнопкой и сдвигает
   карточки со счётчиками вниз, а колонка целиком остаётся по середине
   листа. Всё помещается: проверено на 1440×900, 1280×800 и 1210×680.

   Единственное, что меняется, — промежутки между частями: форма занимает
   место, и воздух между ними уже не растягивают. */
#экран-главный.вход-открыт{ gap:clamp(14px,2.2vh,26px); }
#экран-главный.вход-открыт .низ-страницы{ gap:clamp(10px,1.6vh,18px); }
/* Поджимаются только отступы между строками заглавия — сами строки
   остаются того же размера. */
#экран-главный.вход-открыт .надпись{ margin-bottom:7px; }
#экран-главный.вход-открыт .пояснение{ margin-top:8px; }
#экран-главный.вход-открыт .кн-вход{ margin-top:12px; }
#экран-главный.вход-открыт .вход{ margin-top:10px; }
/* С раскрытой формой места над заглавием меньше, и сантиметр подъёма
   съел бы его целиком: считаем по своей мерке, тем же способом. */
#экран-главный.вход-открыт > .заглавие{
  margin-top:clamp(-38px, calc(331px - 43vh), 0px);
  margin-bottom:clamp(0px, calc(43vh - 331px), 38px); }

/* На низком окне (ноутбук, а форма ключа раскрыта) ужимаются только
   промежутки. Сузить карточки тут нельзя: они квадраты по тексту внутри,
   и от сужения становятся выше, а не ниже. */
@media (max-height:780px){
  #экран-главный.вход-открыт{ gap:clamp(10px,1.6vh,18px); }
  #экран-главный.вход-открыт .низ-страницы{ gap:clamp(8px,1.2vh,14px); }
}

/* ── тарифы ──────────────────────────────────────────────────────── */
/* ── КАРТОЧКИ-КВАДРАТЫ ──
   Три ровных квадрата по центру. Прежде это были стоячие прямоугольники
   9:16, но строки внутри стали короче («3 куба / Лента / Игры / Чаты /
   Группы» вместо длинного перечня) — и нижняя половина карточки стояла
   пустой. Квадрат ровно по тексту: ни пустоты, ни тесноты.

   Ширина в долях экрана, высота — из неё же: на низком окне карточки
   сами становятся меньше, и ничего не уезжает за нижний край. */
.тарифы{ display:flex; flex-wrap:wrap; justify-content:center; gap:14px;
  margin:0 auto; }
.тариф{ flex:0 0 auto; width:clamp(158px,13.7vw,202px); aspect-ratio:1/1;
  display:flex; flex-direction:column; }
.тариф p{ overflow:hidden; }
.тариф{
  background:rgba(255,255,255,.035); border:1px solid var(--край);
  border-radius:16px; padding:15px 16px; cursor:pointer;
  transition:border-color .16s, transform .16s;
}
.тариф:hover{ border-color:var(--край2); transform:translateY(-2px); }
.тариф.силвер{ border-color:rgba(74,158,255,.3); }
.тариф.голд{ border-color:rgba(251,191,36,.3); }
/* Бесплатный — зелёный. Краска та же, что у метки «post» в оболочке
   (shared/shell.css): это наш зелёный для записей, и второго зелёного
   заводить незачем. Теперь у каждой карточки свой цвет: зелёный,
   синий, золотой. */
.тариф.бесплатный{ border-color:rgba(99,220,120,.3); }
.тариф .значок{ color:var(--жёлтый); margin-bottom:7px; line-height:0; }
.тариф.силвер .значок{ color:var(--премиум,#40c4ff); }
.тариф.бесплатный .значок,
.тариф.бесплатный .бирка{ color:#63dc78; }
.тариф .бирка{ font-size:0.6667rem; letter-spacing:.18em; text-transform:uppercase;
  color:var(--жёлтый); margin-bottom:5px; }
.тариф.силвер .бирка{ color:#40c4ff; }
.цена{ display:flex; align-items:baseline; gap:7px; margin-bottom:8px;
  min-height:26px; }
.цена b{ font-size:1.2667rem; font-weight:700; letter-spacing:-.02em; }
/* «в месяц» рядом с ценой не разрываем: в узкой карточке он ломался
   на «в» и «месяц» двумя строками. */
.цена span{ font-size:0.8rem; color:var(--текст3); white-space:nowrap; }
.цена{ flex-wrap:wrap; }
.тариф p{ margin:0 0 10px; font-size:0.7667rem; line-height:1.5; color:var(--текст2); }
/* Ссылки прижаты к низу карточки и стоят столбиком: у трёх карточек
   текст разной длины, и без этого «Получить ключ» оказывалось на трёх
   разных высотах, а рядом с «Подробнее» в узкой карточке оба слова
   ломались пополам. */
.тариф .низ{ display:flex; flex-direction:column; align-items:flex-start;
  gap:5px; margin-top:auto; }
/* В одну строку: «Получить бесплатно» ломалось пополам, и стрелка
   уезжала на вторую строку одна. */
.тариф .взять{ color:var(--зелёный); font-size:0.8rem; font-weight:600;
  white-space:nowrap; }
/* «Подробнее» — вторая строка под кнопкой. Стрелочки у него больше нет:
   серая стрелка в углу карточки была лишней, а само слово ведёт туда же,
   на страницу тарифа. */
.тариф .ещё{ color:var(--текст3); font-size:0.7667rem; }
.тариф .ещё:hover{ color:var(--текст2); }

/* ── счётчики ────────────────────────────────────────────────────── */
/* Три числа стоят кучкой по центру, а не растянуты на всю ширину:
   растянутые, они читались как три отдельных столбца таблицы, хотя это
   одна короткая строка о площадке. */
.счётчики{ display:flex; justify-content:center; flex-wrap:wrap;
  gap:clamp(24px,4vw,56px); margin:0 auto; text-align:center; }
/* ── СЧЁТЧИКИ ПРИЖАТЫ К НИЗУ ──
   Это единственная часть страницы, которая стоит у нижнего края — в
   полусантиметре от него. Чтобы прижать её, не сдвинув ничего выше,
   строка вынута из потока (absolute), а на её месте оставлен отступ
   ровно той же высоты: 3.36rem — это высота самой строки (число и
   подпись под ним), плюс тот же промежуток, что был между нею и
   карточками. Заглавие, кнопка и карточки от этого не двигаются ни на
   точку. */
@media (min-width:641px){
  .счётчики{ position:absolute; left:20px; right:20px; bottom:19px;
    margin:0; }
  .низ-страницы{ padding-bottom:calc(3.36rem + clamp(16px,2.6vh,30px)); }
}
.счётчики .число{ font-size:1.4rem; font-weight:700; letter-spacing:-.02em; }
.счётчики .подпись{ margin-top:3px; font-size:0.7667rem; color:var(--текст3); }

/* ── ЭКРАН ВЫДАННОГО КЛЮЧА — ОДНА РАМКА 9:16 ──
   Та же стоячая плитка, что на странице тарифа: высота от окна, ширина
   из соотношения 9:16, внутри три части — бирка с заголовком сверху,
   ключ посередине, кнопки и «Назад» снизу.

   Прежде это был столбец на 560 точек в ширину: «Назад» сверху, под ним
   бирка, заголовок, строка-повтор, рамка ключа, жёлтое предупреждение в
   треть окна и только потом кнопки. */
.экран{ display:none; }
.экран.открыт{ display:flex; flex:1; align-items:center;
  justify-content:center; padding:clamp(10px,2vh,24px) 0; }
/* Вид окна ключа — в shared/ключ-окно.css, он общий с тарифом. */

/* ── НИЗКОЕ ОКНО ──
   На окне ниже 760 точек (ноутбук с открытой панелью вкладок, половина
   экрана) прежние промежутки не умещались, и страница начинала
   прокручиваться. Здесь они поджимаются — но только они: буквы и
   карточки остаются того же размера. */
@media (max-height:760px){
  #экран-главный.открыт{ gap:clamp(14px,2.6vh,28px);
    padding:clamp(6px,1.2vh,14px) 0; }
  #экран-главный.открыт > .заглавие{ margin-top:clamp(8px,2.4vh,26px); }
  .низ-страницы{ gap:clamp(10px,1.8vh,18px); }
}

/* На телефоне в один экран всё не уложить честно: три карточки тарифов
   встают столбиком, и либо они нечитаемо мелкие, либо страница длиннее
   экрана. Выбираем читаемость — там прокрутка остаётся. */
@media (max-width:640px){
  #экран-главный.открыт{ justify-content:flex-start; gap:18px;
    padding-top:26px; }
  .лист{ padding-bottom:40px; }
  .счётчики{ grid-template-columns:repeat(3,1fr); gap:10px; }
  /* Квадрат на телефоне в ряд из трёх не встанет: каждая карточка
     вышла бы шириной в палец. Там они ложатся друг под другом обычными
     полосками, и соотношение не держим. */
  .тариф{ width:100%; aspect-ratio:auto; }
}
</style>

<body class="в-раме">
<div class="рама">

<div class="рама-прокрутка">

<div class="лист">

  <div class="шапка">
    <div class="знак">
      <canvas id="знак-куб" width="36" height="36"></canvas>
      <div class="слово">Cube<span>World</span></div>
    </div>

    <div class="язык">

        <span id="язык-код">RU</span>

      </button>
      <div class="язык-список" id="язык-список"></div>
    </div>
  </div>

  <!-- ─────────────────────────── главный экран ─────────────────── -->
  <div class="экран открыт" id="экран-главный">

    <div class="заглавие">
      <div class="надпись" data-сл="lbl"></div>
      <h1 data-сл="h1" data-сл-как="html"></h1>
      <!-- Две строки объединены в одну: «Временные зашифрованные
           пространства…» и «Без почты, без телефона, только ключ.» стояли
           друг под другом и съедали высоту, а читаются как одна мысль.
           Остались двумя кусками словаря: второй кусок переведён на все
           шестнадцать языков, и склеивать их в один в каждом языке
           значило бы переписать шестнадцать строк ради одной. -->
      <p class="пояснение"><span data-сл="tag"></span> <span data-сл="s1"></span></p>

      <!-- Замок — наша линия, а не смайл 🔒 из словаря: смайл рисовала
           система, и на маке он был цветной и объёмный, а в Windows
           плоский. Слово в словаре теперь без значка. -->
      <!-- Ни замка, ни стрелки: одно слово на кнопке. Замок повторял то,
           что и так написано, а стрелка обещала переход на другую
           страницу, хотя форма открывается тут же. -->
      <button class="кн-вход" id="кн-открыть-вход">
        <span data-сл="ab"></span>
      </button>

      <div class="вход" id="вход">
        <div class="вход-коробка">
          <label data-сл="sl"></label>
          <input class="поле-ключа" id="ключ" type="text" inputmode="text"
                 autocomplete="off" autocapitalize="characters" spellcheck="false"
                 placeholder="CUBE-XXXX-XXXX-XXXX" maxlength="19">
          <button class="кнопка главная широкая" id="кн-войти" data-сл="eb"></button>
          <div class="весть" id="весть"></div>
        </div>
      </div>
    </div>

    <!-- Тарифы и счётчики — одним нижним блоком. Он прижат к низу
         страницы, заглавие — к верху, и пустота между ними
         распределяется сама: страница заполнена целиком, а не собрана
         комком посередине. -->
    <div class="низ-страницы">
    <div class="тарифы">
      <div class="тариф бесплатный" data-тариф="free">
        <!-- Значок рисуется нашей линией из shared/icons.js, а не смайлом:
             смайл рисует система, и 🔑 на маке, на телефоне и в Windows
             выглядел тремя разными картинками. Имя значка лежит в
             data-знак, а линию подставляет код ниже. -->
        <div class="значок" data-знак="ключик" data-размер="22"></div>
        <!-- Имя тарифа стоит один раз. Прежде оно было и биркой
             сверху, и заголовком под ней — одно слово, набранное
             дважды, съедало строку в каждой из трёх карточек.
             Само слово лежит в словах (t1b) и теперь читается «ВИП»;
             класс «бесплатный» остался прежним — он красит карточку
             зелёным и в глаза никому не попадает. -->
        <div class="бирка" data-сл="t1b"></div>
        <div class="цена"><b id="цена-free">-</b><span id="срок-free"></span></div>
        <p data-сл="t1d"></p>
        <div class="низ">
          <span class="взять" data-сл="gk"></span>
          <span class="ещё" data-сл="tmore"></span>
        </div>
      </div>

      <div class="тариф силвер" data-тариф="silver">
        <div class="значок" data-знак="алмаз" data-размер="22"></div>
        <div class="бирка" data-сл="t2b"></div>
        <div class="цена"><b id="цена-silver">-</b><span id="срок-silver"></span></div>
        <p data-сл="t2d"></p>
        <div class="низ">
          <span class="взять" data-сл="tget"></span>
          <span class="ещё" data-сл="tmore"></span>
        </div>
      </div>

      <div class="тариф голд" data-тариф="gold">
        <div class="значок" data-знак="медаль" data-размер="22"></div>
        <div class="бирка" data-сл="t3b"></div>
        <div class="цена"><b id="цена-gold">-</b><span id="срок-gold"></span></div>
        <p data-сл="t3d"></p>
        <div class="низ">
          <span class="взять" data-сл="tget"></span>
          <span class="ещё" data-сл="tmore"></span>

    </div>

    <div class="счётчики">
      <div><div class="число" id="ч-кубов">-</div><div class="подпись" data-сл="sc"></div></div>
      <div><div class="число" id="ч-людей">-</div><div class="подпись" data-сл="sm"></div></div>
      <div><div class="число" id="ч-онлайн">-</div><div class="подпись" data-сл="so"></div></div>
    </div>
    </div>

    <!-- Подвала «Тарифы · Политика · Условия» здесь больше нет.
         Тарифы и так стоят выше тремя карточками, а Политика с Условиями
         вели в документы, которых ещё нет, и честно об этом сообщали —
         строка, которая существует, чтобы сказать «этого нет», занимала
         место на экране, который должен помещаться целиком.
         Документы, когда будут, живут в кабинете: меню → «Документы». -->
  </div>

  <!-- ─────────────────────────── экран ключа ───────────────────── -->
  <!-- Экран выданного ключа — одна рамка 9:16, как на странице тарифа:
       бирка, заголовок, сам ключ, две кнопки и «Назад» под ними. Строка
       «Этот ключ — ваша анонимная личность» и предупреждение с жёлтой
       подложкой отсюда убраны: первая повторяла заголовок, вторая
       занимала треть окна, а прочитать её всё равно не успевали. -->
  <!-- Окно выданного ключа строит shared/ключ-окно.js — одно и то же
       окно на титулке и на странице тарифа. Здесь только место. -->
  <div class="экран" id="экран-ключ"></div>

<script>
'use strict';

var $ = function (и) { return document.getElementById(и); };

/* ── ЗНАЧКИ В РАЗМЕТКЕ ──
   Где в разметке стоит <span data-знак="замок"></span>, туда ложится
   наша линия из shared/icons.js. Размер — data-размер, по умолчанию 16.

   Так на титулке не осталось ни одного смайла-значка: замок у кнопки
   входа, восклицательный знак у предупреждения о ключе, уголок выбора
   языка и три значка тарифов рисуются одним набором линий. Флаги языков
   остаются смайлами — флага шестнадцати стран одной линией у нас нет, и
   рисовать их значит рисовать флаги, а не значки. */
CW.расставитьЗначки(document);

/* Уже входили — показываем это кнопкой, а не выбрасываем со страницы.

   Прежде здесь стояло безусловное CW.уйти('world.html'): человек
   открывал титулку и через полсекунды оказывался в мире, не успев ни
   прочитать её, ни долистать до тарифов. Выйти из этого было нельзя —
   титулка сама себя закрывала. */
var ВОШЛИ = CW.вошли();

/* Небо и куб у надписи — общие, из shared/небо.js: на титулке и на
   странице тарифа они одинаковые, и рисовалка у них одна. */
CW.небо($('небо'));

CW.кубНадписи($('знак-куб'));

/* ═══════════════════════════════════════════════════════════════════════
   ЯЗЫК. Список и выпадающий — общие, из shared/lang.js. Здесь только то,
   что после смены языка надо перерисовать именно на титулке.
   ═══════════════════════════════════════════════════════════════════════ */
function применитьЯзык() {
  CW.выборЯзыка.обновить();
  CW.перевести(document);
  CW.ключОкно.обновить();
  показатьЦены();
  показатьЧтоВошли();
  $('ключ').placeholder = 'CUBE-XXXX-XXXX-XXXX';
}

/* ═══════════════════════════════════════════════════════════════════════
   ЦЕНЫ. Берём у сервера: тарифы считает он, и расходиться им нельзя.
   Пока не пришли — в карточке прочерк, а не выдуманное число.
   ═══════════════════════════════════════════════════════════════════════ */
var ТАРИФЫ = null;

function показатьЦены() {
  ['free', 'silver', 'gold'].forEach(function (имя) {
    var ц = $('цена-' + имя), с = $('срок-' + имя);
    if (!ТАРИФЫ || !ТАРИФЫ[имя]) { ц.textContent = '-'; с.textContent = ''; return; }
    /* В CUBE, а не в долларах: площадка считает своей валютой, и на
       витрине должна стоять она. Доллар остался внутри — им платит
       провайдер, человеку его знать незачем. */
    var вМесяц = ТАРИФЫ[имя].month_cube;
    if (!вМесяц) { ц.textContent = CW.сл('tfr'); с.textContent = ''; }
    else { ц.textContent = вМесяц + ' CUBE'; с.textContent = CW.сл('tmo'); }
  });
}

CW.спросить('/plans', { тихо: true, сроком: 12000 }).then(function (д) {
  if (д && д.plans) { ТАРИФЫ = д.plans; показатьЦены(); }
}).catch(function () {});

/* ═══════════════════════════════════════════════════════════════════════
   СЧЁТЧИКИ
   ═══════════════════════════════════════════════════════════════════════ */
CW.спросить('/stats', { тихо: true, сроком: 9000 }).then(function (д) {
  if (!д) return;
  /* Поля сервера: total_cubes, total_users, online_users. */
  if (д.total_cubes  != null) $('ч-кубов').textContent  = д.total_cubes.toLocaleString('ru');
  if (д.total_users  != null) $('ч-людей').textContent  = д.total_users.toLocaleString('ru');
  if (д.online_users != null) $('ч-онлайн').textContent = д.online_users.toLocaleString('ru');
}).catch(function () {});

/* ═══════════════════════════════════════════════════════════════════════
   ВХОД ПО КЛЮЧУ
   ═══════════════════════════════════════════════════════════════════════ */
function весть(куда, текст, вид) {
  var в = $(куда);
  в.textContent = текст || '';
  в.className = 'весть' + (вид ? ' ' + вид : '');
}

$('кн-открыть-вход').onclick = function () {
  if (ВОШЛИ) { CW.уйти('world.html'); return; }
  var в = $('вход');
  в.classList.toggle('раскрыт');
  /* Пометку ставим и на весь экран: по ней стили поджимают заглавие и
     карточки, чтобы раскрытая форма ключа не выталкивала тарифы и
     счётчики за нижний край. Иначе «одна страница» держится ровно до
     первого нажатия «Авторизация ключом». */
  $('экран-главный').classList.toggle('вход-открыт', в.classList.contains('раскрыт'));
  if (в.classList.contains('раскрыт')) setTimeout(function () { $('ключ').focus(); }, 320);
};

/* Уже вошли — меняем надпись на кнопке, и только.

   Здесь же раньше дорисовывалась строка «Войти другим ключом». В боевой
   её нет, и появлялась она лишь иногда — у того, кто уже входил, — так
   что на титулке то была одна кнопка, то вдруг две. Выход и смена ключа
   живут в самой программе: меню → выход. */
function показатьЧтоВошли() {
  if (!ВОШЛИ) return;
  $('кн-открыть-вход').querySelector('span[data-сл]').textContent = CW.сл('wc');
}

/* Ключ набирают по-разному: с чёрточками и без, целиком вставляют или
   печатают по букве. Расставим сами.

   «CUBE» срезаем в цикле, а не один раз: приставку мы сами же
   дописываем в поле, и при наборе по букве она накапливалась —
   выходило «CUBE-CUBE-O1CT-3ZTB». */
$('ключ').oninput = function () {
  var голый = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
  while (голый.indexOf('CUBE') === 0) голый = голый.slice(4);
  var куски = голый.match(/.{1,4}/g) || [];
  this.value = куски.length ? 'CUBE-' + куски.slice(0, 3).join('-') : '';
  весть('весть', '');
};

var идём = false;
function войти() {
  if (идём) return;
  var ключ = $('ключ').value.trim();
  if (!/^CUBE-[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(ключ)) {
    весть('весть', CW.сл('mFull'), 'плохо');
    $('ключ').focus();
    return;
  }

  идём = true;
  $('кн-войти').disabled = true;
  весть('весть', CW.сл('mConn'), 'ждём');

  /* Сервер мог уснуть — через пять секунд честно об этом говорим,
     а не оставляем человека смотреть на «Соединяюсь…». */
  var будильник = setTimeout(function () {
    весть('весть', CW.сл('mWake'), 'ждём');
  }, 5000);

  CW.войти(ключ).then(function () {
    clearTimeout(будильник);
    весть('весть', CW.сл('mOk'), 'хорошо');
    CW.уйти('world.html');
  }).catch(function (е) {
    clearTimeout(будильник);
    идём = false;
    $('кн-войти').disabled = false;
    весть('весть',
      е.сеть ? CW.сл('mNet')
             : (е.код === 404 || е.код === 401 ? CW.сл('mNoKey') : е.message),
      'плохо');
  });
}

$('кн-войти').onclick = войти;
$('ключ').onkeydown = function (е) { if (е.key === 'Enter') войти(); };

/* ═══════════════════════════════════════════════════════════════════════
   НОВЫЙ КЛЮЧ: отдельный экран, как в работающей программе.
   ═══════════════════════════════════════════════════════════════════════ */
function показатьЭкран(какой) {
  $('экран-главный').classList.toggle('открыт', какой === 'главный');
  $('экран-ключ').classList.toggle('открыт', какой === 'ключ');
  window.scrollTo(0, 0);
}

/* ── ОКНО КЛЮЧА ──
   Само окно — общее, из shared/ключ-окно.js: та же рамка, что на
   странице тарифа. Титулка даёт ему экран и говорит, что делать по
   стрелке «Назад»: вернуться на главный экран. */
CW.ключОкно.собрать($('экран-ключ'), {
  назад: function () { показатьЭкран('главный'); }
});

function завести() {
  показатьЭкран('ключ');
  CW.ключОкно.завести();
}

/* Нажатие по карточке тарифа.
   «Подробнее» ведёт на страницу тарифа; нажатие по самой карточке
   у бесплатного сразу заводит ключ, у платных — туда же, на страницу
   тарифа. */
document.querySelectorAll('.тариф').forEach(function (к) {
  var какой = к.getAttribute('data-тариф');

  к.querySelector('.ещё').onclick = function (е) {
    е.stopPropagation();
    CW.уйти('tariff.html?p=' + какой + '&lang=' + CW.язык());
  };

  к.onclick = function () {
    if (какой === 'free') завести();
    else CW.уйти('tariff.html?p=' + какой + '&lang=' + CW.язык());
  };
});

/* Значки «Копировать» и «Назад», кнопка «В мир» и подписи к ним живут
   внутри общего окна ключа — здесь их обработчиков больше нет.

   Обработчика «Политики» и «Условий» здесь тоже нет: вместе с подвалом
   ушли и кнопки. Код, который ищет кнопку, которой нет, не ломается — он
   просто лежит и однажды сбивает с толку того, кто станет искать, откуда
   эти кнопки берутся. */

/* ═══════════════════════════════════════════════════════════════════════
   ПРИГЛАШЕНИЕ ПО ССЫЛКЕ: index.html?key=… или ?ref=…
   ═══════════════════════════════════════════════════════════════════════ */
(function (){
  var п = new URLSearchParams(location.search);
  var к = п.get('key');
  if (к) {
    $('вход').classList.add('раскрыт');
    $('ключ').value = к.toUpperCase();
  }
  var реф = п.get('ref');
  if (реф) CW.положить('cw_ref_code', реф);

  /* ── ПРИГЛАШЕНИЕ В КУБ: index.html?cubes=CK-… ──
     Ключ куба (Key 2) — не ключ входа, и в поле «ключ» ему нельзя:
     там ждут CUBE-XXXX-XXXX-XXXX и отказали бы. Поэтому ключ куба мы
     запоминаем, а открывает им куб уже мир — сразу после входа.
     Кто уже вошёл — уходит туда немедленно: он пришёл по ссылке в
     куб, а не читать титулку. */
  /* Имя довода латиницей - «cubes»: русское «куб» в пересланной
     ссылке превращалось в «%D0%BA%D1%83%D0%B1». Старые написания
     понимаем по-прежнему: ссылки, разосланные раньше, должны
     работать. */
  var куб = п.get('cubes') || п.get('куб') || п.get('cube');
  if (куб) {
    CW.положить('cw_ключ_куба', куб.trim());
    if (ВОШЛИ) { CW.уйти('world.html'); return; }
    $('вход').classList.add('раскрыт');
    весть('весть', Т('Тебя позвали в куб. Войди своим ключом, '
                 + 'и я открою его сразу.'), 'ждём');
  }
})();

CW.выборЯзыка.подключить({
  /* Это имена узлов в разметке, а не фразы: через Т() их
     пропускать нельзя — перевод сломал бы поиск узла. */
  кнопка: 'язык-кнопка', список: 'язык-список', код: 'язык-код',
  после: применитьЯзык
});
применитьЯзык();
</script>
</body>
