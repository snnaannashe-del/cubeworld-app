<!-- ═══════════════════════════════════════════════════════════════════════
     СТРАНИЦА ТАРИФА: ?p=free | silver | gold

     Одна страница на три тарифа: что входит, что скоро, чего нет, и
     сколько это стоит в месяц и за год.

     Цены и права берём с сервера (GET /plans): там они живут в
     database.ТАРИФЫ, в одном месте. Нет сети — показываем те же числа из
     ЗАПАС, честно подписанные, а не прочерк вместо цены.

     Словарь ниже — выжимка из словаря титульной (index.html, блок с
     переводами), те же языки и те же строки. Пересобрать:
     python3 tarif_page.py — он берёт ключи из index.html и кладёт их
     сюда, чтобы перевод не разъехался между двумя страницами.

     «Скоро» — не хитрость, а честность: эти права тариф уже даёт, но в
     приложении они пока не включены, и обещать их как готовые нельзя.
     ═══════════════════════════════════════════════════════════════════════ -->
<style>
:root{--bg:#020211;--surface:rgba(255,255,255,0.04);--border:rgba(255,255,255,0.08);--accent:#0099ff;--gold:#f5c842;--silver:#cfd6e4;--text:#e8e8f0;--muted:rgba(232,232,240,0.45);--radius:16px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#020211;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;min-height:100vh;overflow-x:hidden;}
.amb{position:fixed;top:24%;left:50%;transform:translate(-50%,-50%);width:620px;height:620px;background:radial-gradient(ellipse at center,rgba(124,106,255,0.07) 0%,transparent 70%);z-index:0;pointer-events:none;}
.wrap{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:18px 20px 64px;}

/* Шапка: слева домой, справа язык — как на титульной */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px;}
.home{color:var(--muted);font-size:13px;font-weight:600;text-decoration:none;}
.home:hover{color:#fff;}
.ldd{position:relative;z-index:100;}
.ldb{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:8px 12px;color:var(--text);font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;}
.ldb:hover{background:rgba(255,255,255,0.1);}
.lfi{font-size:18px;line-height:1;}
.ldarr{font-size:10px;color:var(--muted);margin-left:2px;transition:transform .2s;}
.ldd.open .ldarr{transform:rotate(180deg);}
.ldm{max-height:min(70vh,520px);overflow-y:auto;display:none;flex-direction:column;gap:2px;background:rgba(16,20,40,0.96);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:6px;margin-top:6px;backdrop-filter:blur(12px);position:absolute;right:0;top:100%;z-index:200;min-width:150px;}
.ldd.open .ldm{display:flex;}
.ldm button{background:none;border:none;color:var(--text);font-size:13px;padding:8px 12px;border-radius:8px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:8px;width:100%;}
.ldm button:hover,.ldm button.cur{background:rgba(124,106,255,0.2);}

/* Три закладки: можно ходить между тарифами, не возвращаясь назад */
.tabs{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;}
.tab{flex:1;min-width:92px;text-align:center;padding:10px 8px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:13px;font-weight:700;cursor:pointer;text-decoration:none;}
.tab:hover{color:#fff;border-color:rgba(255,255,255,.18);}
.tab.cur{color:#fff;border-color:rgba(0,149,246,.55);background:rgba(0,149,246,.12);}

.badge{font-size:10px;font-weight:800;letter-spacing:3px;text-transform:uppercase;margin-bottom:10px;}
.badge.free{color:var(--gold);}
.badge.silver{color:var(--silver);}
.badge.gold{color:var(--gold);}
h1{font-size:clamp(28px,6vw,42px);font-weight:800;line-height:1.1;margin-bottom:14px;}
.kick{color:var(--muted);font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;}
.note{color:var(--muted);font-size:14px;line-height:1.7;margin-bottom:24px;}

.pricebox{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:24px;}
.price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
.price b{font-size:40px;font-weight:800;line-height:1;}
.price span{color:var(--muted);font-size:14px;}
.save{color:#4af0a0;font-size:12px;font-weight:700;margin-top:8px;min-height:16px;}
.per{display:flex;gap:8px;margin-top:16px;}
.per button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--muted);font-size:13px;font-weight:700;cursor:pointer;}
.per button.cur{color:#fff;border-color:rgba(0,149,246,.55);background:rgba(0,149,246,.12);}

.grp{margin-bottom:22px;}
.grp h2{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
.row{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:15px;line-height:1.45;}
.row:last-child{border-bottom:none;}
.row .mk{flex:none;width:18px;text-align:center;font-size:14px;font-weight:800;}
.row.in .mk{color:#4af0a0;}
.row.soon .mk{color:var(--gold);}
.row.out{color:var(--muted);}
.row.out .mk{color:rgba(255,255,255,.22);}
.soonnote{color:var(--muted);font-size:12px;line-height:1.6;margin-top:8px;}

.cta{background:rgba(0,149,246,0.15);color:#fff;border:1px solid rgba(0,149,246,0.65);border-radius:24px;padding:14px 30px;font-size:15px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none;}
.cta:hover{background:rgba(0,149,246,0.32);border-color:rgba(0,149,246,0.95);}
.pay{color:var(--muted);font-size:12px;line-height:1.7;margin-top:14px;}
.back{display:inline-block;margin-top:26px;color:var(--muted);font-size:13px;font-weight:600;text-decoration:none;}
.back:hover{color:#fff;}
@media(max-width:520px){.wrap{padding:14px 16px 56px;}.price b{font-size:34px;}}
</style>

  {к:'fsignal',   поле:'signals'},
  {к:'fanalytics',поле:'analytics'},
  {к:'fbadge',    поле:'badge',        скоро:true},
  {к:'fprio',     поле:'priority',     скоро:true},
  {к:'ffund',     поле:'fund',         скоро:true},
  {к:'fclosed',   поле:'closed_cubes', скоро:true},
  {к:'fapi',      поле:'api',          скоро:true}
];

var тариф = 'free';
var lang = 'en';
var ddOpen = false;
var пер = 'month';

function TR(){ return LANGS[BASE[lang] || lang] || LANGS.en || {}; }

function парам(имя){
  var m = new RegExp('[?&]' + имя + '=([^&]*)').exec(location.search || '');
  return m ? decodeURIComponent(m[1]) : '';
}

function угадатьЯзык(){
  var сп = (navigator.languages && navigator.languages.length)
           ? navigator.languages : [navigator.language || 'en'];
  for (var i = 0; i < сп.length; i++) {
    var м = String(сп[i]);
    for (var j = 0; j < LANG_LIST.length; j++)
      if (LANG_LIST[j].toLowerCase() === м.toLowerCase()) return LANG_LIST[j];
    var баз = м.split('-')[0].toLowerCase();
    if (LANG_LIST.indexOf(баз) >= 0) return баз;
    if (баз === 'be' || баз === 'kk') return 'ru';
  }
  return 'en';
}

function деньги(ч){
  var н = Number(ч) || 0;
  return '$' + (Math.abs(н - Math.round(н)) < 0.005
                ? String(Math.round(н)) : н.toFixed(2));
}

/* ── Язык ── */
function крутить(){
  ddOpen = !ddOpen;
  document.getElementById('ldd').classList.toggle('open', ddOpen);
}
document.addEventListener('click', function(){
  if (ddOpen) { ddOpen = false; document.getElementById('ldd').classList.remove('open'); }
});

function списокЯзыков(){
  var m = document.getElementById('ldm');
  m.innerHTML = '';
  for (var i = 0; i < LANG_LIST.length; i++) {
    var l = LANG_LIST[i];
    var b = document.createElement('button');
    b.id = 'lo-' + l;
    b.innerHTML = '<span class="lfi">' + (FLAGS[l] || '') + '</span><span></span>';
    b.lastChild.textContent = NAMES[l] || l;
    b.onclick = (function(x){ return function(e){
      e.stopPropagation();
      ddOpen = false; document.getElementById('ldd').classList.remove('open');
      поставитьЯзык(x);
    }; })(l);
    m.appendChild(b);
  }
}

function поставитьЯзык(l){
  if (LANG_LIST.indexOf(l) < 0) l = 'en';
  lang = l;
  /* Арабский пишется справа налево — иначе строки разъезжаются. */
  document.documentElement.setAttribute('dir', (BASE[l] || l) === 'ar' ? 'rtl' : 'ltr');
  document.documentElement.setAttribute('lang', l);
  var ф = document.getElementById('lflag'), к = document.getElementById('lcode');
  if (ф) ф.innerHTML = FLAGS[l] || '🌐';
  if (к) к.textContent = CODES[l] || l.toUpperCase();
  for (var i = 0; i < LANG_LIST.length; i++) {
    var э = document.getElementById('lo-' + LANG_LIST[i]);
    if (э) э.classList.toggle('cur', LANG_LIST[i] === l);
  }
  /* Выбор языка общий с титульной: там он лежит в той же памяти. */
  try { localStorage.setItem('cw_lang', l); } catch (e) {}
  нарисовать();
}

function период(п){
  пер = (п === 'year') ? 'year' : 'month';
  нарисовать();
}

/* ── Отрисовка ── */
function нарисовать(){
  var т = TR();
  var п = (ДАННЫЕ.plans || {})[тариф] || (ЗАПАС.plans[тариф] || {});
  var н = {free:'1', silver:'2', gold:'3'}[тариф];

  document.title = 'CubeWorld · ' + (т['t' + н + 't'] || тариф);
  document.getElementById('kick').textContent = т.tsub || 'Subscription';
  var зн = document.getElementById('badge');
  зн.className = 'badge ' + тариф;
  зн.textContent = т['t' + н + 'b'] || '';
  document.getElementById('title').textContent = т['t' + н + 't'] || '';
  document.getElementById('note').textContent = т.tnote || '';

  // Закладки
  var tb = document.getElementById('tabs');
  tb.innerHTML = '';
  var пор = ДАННЫЕ.order || ЗАПАС.order;
  for (var i = 0; i < пор.length; i++) {
    var имя = пор[i];
    var нн = {free:'1', silver:'2', gold:'3'}[имя];
    if (!нн) continue;
    var a = document.createElement('a');
    a.className = 'tab' + (имя === тариф ? ' cur' : '');
    a.href = 'tariff.html?p=' + имя + '&lang=' + encodeURIComponent(lang);
    a.textContent = т['t' + нн + 't'] || имя;
    tb.appendChild(a);
  }

  // Цена и период
  var цена = п[пер];
  var платный = Number(п.month) > 0 || Number(п.year) > 0;
  document.getElementById('price').textContent =
    платный ? деньги(цена) : (т.tfr || 'free');
  document.getElementById('unit').textContent = платный
    ? (пер === 'year' ? (т.tyr || '/yr') : (т.tmo || '/mo')) : '';
  document.getElementById('per').style.display = платный ? 'flex' : 'none';
  document.getElementById('b-month').textContent = т.tpm || 'Monthly';
  document.getElementById('b-year').textContent = т.tpy || 'Yearly';
  document.getElementById('b-month').className = (пер === 'month' ? 'cur' : '');
  document.getElementById('b-year').className = (пер === 'year' ? 'cur' : '');
  var эк = document.getElementById('save');
  var мес = Number(п.month) || 0, год = Number(п.year) || 0;
  if (платный && пер === 'year' && мес > 0 && год > 0 && год < мес * 12) {
    эк.textContent = (т.tsave || 'save') + ' ' +
                     Math.round((1 - год / (мес * 12)) * 100) + '%';
  } else { эк.textContent = ''; }

  // Три списка: входит · скоро · не входит
  var группы = {
    in:   {узел: document.getElementById('g-in'),   имя: т.tin  || 'Included'},
    soon: {узел: document.getElementById('g-soon'), имя: т.tsoon || 'Coming soon'},
    out:  {узел: document.getElementById('g-out'),  имя: т.tout || 'Not included'}
  };
  var строки = {in: [], soon: [], out: []};

  // Кубы — первой строкой: это и есть главный размер тарифа.
  строки.in.push((т.tcubes || 'Your own cubes') + ': ' + (п.cubes || 0));

  for (var j = 0; j < ПУНКТЫ.length; j++) {
    var пт = ПУНКТЫ[j];
    var подпись = т[пт.к] || пт.к;
    if (пт.поле === null) { строки.in.push(подпись); continue; }
    var есть = !!п[пт.поле];
    if (!есть) { строки.out.push(подпись); }
    else if (пт.скоро) { строки.soon.push(подпись); }
    else { строки.in.push(подпись); }
  }

  var знак = {in: '✓', soon: '⏳', out: '✕'};
  var имена = ['in', 'soon', 'out'];
  for (var k = 0; k < имена.length; k++) {
    var г = группы[имена[k]], сп = строки[имена[k]];
    г.узел.innerHTML = '';
    if (!сп.length) { г.узел.style.display = 'none'; continue; }
    г.узел.style.display = 'block';
    var h2 = document.createElement('h2');
    h2.textContent = г.имя;
    г.узел.appendChild(h2);
    for (var m2 = 0; m2 < сп.length; m2++) {
      var r = document.createElement('div');
      r.className = 'row ' + имена[k];
      var s1 = document.createElement('span');
      s1.className = 'mk'; s1.textContent = знак[имена[k]];
      var s2 = document.createElement('span');
      s2.textContent = сп[m2];
      r.appendChild(s1); r.appendChild(s2);
      г.узел.appendChild(r);
    }
    if (имена[k] === 'soon') {
      var пз = document.createElement('p');
      пз.className = 'soonnote';
      пз.textContent = т.tsoond || '';
      г.узел.appendChild(пз);
    }
  }

  /* Ключ всегда бесплатный: тариф включается уже внутри приложения,
     поэтому кнопка у всех трёх ведёт на выдачу ключа. */
  var cta = document.getElementById('cta');
  cta.textContent = т.tget || 'Get key ›';
  cta.href = 'index.html?get=free';
  document.getElementById('pay').textContent = платный ? (т.tpay || '') : '';
  document.getElementById('back').textContent = '← ' + (т.tall || 'All plans');
}

(function начало(){
  var p = парам('p').toLowerCase();
  тариф = (['free','silver','gold'].indexOf(p) >= 0) ? p : 'free';

  var l = парам('lang');
  if (LANG_LIST.indexOf(l) < 0) {
    try { l = localStorage.getItem('cw_lang') || ''; } catch (e) { l = ''; }
  }
  if (LANG_LIST.indexOf(l) < 0) l = угадатьЯзык();

  списокЯзыков();
  поставитьЯзык(l);

  /* Цены и права — с сервера. Не ответил — остаёмся на ЗАПАС:
     страница уже нарисована и не ждёт сети. */
  try {
    fetch(API + '/plans').then(function(r){ return r.json(); }).then(function(д){
      if (!д || !д.plans) return;
      ДАННЫЕ = д;
      нарисовать();
    }).catch(function(){});
  } catch (e) {}
})();
</script>
</body>
</html>
