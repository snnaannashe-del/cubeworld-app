<!doctype html>
<html lang="ru" data-тема-замок="тёмная">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- Айфон: страница заходит ПОД полоску с часами, и красит это место
     наша же шапка — она держит под него env(safe-area-inset-top).
     Тёмная тема — полоска тёмная, светлая — светлая, камера — сквозь
     неё видно картинку. Метка обязана стоять в самой странице: iOS
     читает её один раз, когда значок добавляют на экран. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Тарифы · CubeWorld</title>
<link rel="icon" href="icons/favicon.svg?v=20261128-533">
<link rel="stylesheet" href="shared/style.css?v=20261128-533">
<link rel="stylesheet" href="shared/window.css?v=20261128-533">
<link rel="stylesheet" href="shared/lang.css?v=20261128-533">
<link rel="stylesheet" href="shared/ключ-окно.css?v=20261128-533">
<script src="shared/theme.js?v=20261128-533"></script>
<!--
  ТАРИФЫ. Промежуточная страница между титулкой и входом.

  Открывается как tariff.html?p=free (или silver / gold), язык можно
  задать ссылкой: &lang=ru.

  Что здесь важно:
    весь список «входит / не входит» строится ИЗ ОТВЕТА СЕРВЕРА (/plans),
      а не из разметки. Раньше галочки были проставлены руками в двух
      местах — на титулке и здесь, — и расходились с тем, что сервер
      на самом деле разрешает;
    слова берутся из общего словаря (shared/words.js), 16 языков;
    кнопка «Получить ключ» доводит до конца: заводит ключ, показывает
      его один раз и пускает в мир.
-->
<style>
/* ── СТРАНИЦА ТАРИФА — НА ОДИН ЭКРАН ──
   Сделана на основе титулки: та же шапка с крутящимся кубом, та же
   кнопка, тот же звёздный фон. Всё помещается в одно окно: прокрутки
   нет ни на 1440×900, ни на 1280×800.

   Прежде страница была в один столбец — заглавие, коробка цены на треть
   экрана, потом четырнадцать строк «входит / не входит» в размер
   заголовка. До списка «не входит» приходилось листать, а чтобы
   сравнить его с «входит», листать обратно. Теперь это две колонки
   рядом: слева цена и кнопка, справа обе половины списка. */
.рама{ background:#020211; position:fixed; }
.рама-прокрутка{ position:relative; }
#небо{ position:absolute; inset:0; z-index:0; pointer-events:none; }
.лист{ position:relative; z-index:1; max-width:1120px; margin:0 auto;
  padding:0 20px 19px; min-height:100%;
  display:flex; flex-direction:column; }

/* ── шапка как на титулке ────────────────────────────────────────── */
.шапка{ display:flex; align-items:center; justify-content:space-between;
  padding:8px 20px; margin:0 -20px;
  border-bottom:1px solid rgba(255,255,255,.07);
  background:rgba(4,5,20,.9); backdrop-filter:blur(12px); }
.знак{ display:flex; align-items:center; gap:10px; cursor:pointer;
  background:none; border:none; padding:0; }
/* «Назад» — стрелка в правом верхнем углу рамки. Своего места в потоке
   не занимает: стоит поверх, как крестик у окна. */
.назад{ position:absolute; top:10px; right:12px; z-index:2;
  display:inline-flex; align-items:center; justify-content:center;
  width:30px; height:30px; border-radius:50%;
  background:none; border:none; cursor:pointer; color:var(--текст3); }
.назад:hover{ color:var(--текст); background:rgba(255,255,255,.06); }
.знак .слово{ font-size:1.1333rem; font-weight:700; letter-spacing:-.3px;
  color:var(--текст); }
.знак .слово span{ color:#0095F6; }
#знак-куб{ width:36px; height:36px; display:block; }
.зн{ display:inline-flex; align-items:center; line-height:0; }

/* ── тело: всё, что между шапкой и нижним краем ──────────────────── */
.тело{ flex:1; display:flex; flex-direction:column;
  justify-content:safe center; gap:clamp(14px,2.4vh,26px);
  padding:clamp(8px,1.6vh,20px) 0; }

/* ── переключатель тарифов ───────────────────────────────────────── */
.закладки{ display:flex; justify-content:center; gap:10px; }
.закладки button{
  padding:9px 26px; font-size:0.9333rem; font-weight:600; cursor:pointer;
  color:var(--текст2); border-radius:var(--радиус-круг);
  background:rgba(255,255,255,.03); border:1px solid var(--край);
  transition:border-color .15s, color .15s, background .15s;
}
.закладки button:hover{ color:var(--текст); border-color:var(--край2); }
/* Каждая закладка своего цвета — того же, каким обведена её рамка:
   ВИП зелёная, Сильвер синяя, Голд золотая. Один синий на все три не
   говорил ничего: нажал «Голд», а кнопка того же цвета, что и рамка
   Сильвера. */
.закладки button.free   { color:#63dc78; border-color:rgba(99,220,120,.3); }
.закладки button.silver { color:#40c4ff; border-color:rgba(74,158,255,.3); }
.закладки button.gold   { color:#fbbf24; border-color:rgba(251,191,36,.3); }
.закладки button.free:hover   { border-color:rgba(99,220,120,.65); }
.закладки button.silver:hover { border-color:rgba(74,158,255,.65); }
.закладки button.gold:hover   { border-color:rgba(251,191,36,.65); }
/* Выбранная — та же краска, только налита внутрь, как у кнопки входа. */
.закладки button.выбран{ color:#fff; }
.закладки button.выбран.free{
  border-color:rgba(99,220,120,.65); background:rgba(99,220,120,.15); }
.закладки button.выбран.silver{
  border-color:rgba(74,158,255,.65); background:rgba(74,158,255,.15); }
.закладки button.выбран.gold{
  border-color:rgba(251,191,36,.65); background:rgba(251,191,36,.15); }

/* ── две колонки: цена слева, список справа ──────────────────────── */
/* ── РАМКА ТАРИФА ──
   Стоячая плитка того же сложения, что карточки на титулке, и в ней
   весь тариф: бирка, цена, выбор срока, список «входит» и кнопка.
   Высота — по содержимому: соотношения 9:16 здесь больше нет, иначе
   у бесплатного с шестью строками внутри оставалась бы ладонь пустоты. */
.карточка{ position:relative;
  width:clamp(280px,25vw,350px);
  margin:0 auto; display:flex; flex-direction:column;
  gap:clamp(10px,1.4vh,16px);
  background:rgba(255,255,255,.035); border:1px solid var(--край);
  border-radius:20px; padding:clamp(16px,2.2vh,26px) clamp(16px,1.6vw,24px); }
.карточка.free{ border-color:rgba(99,220,120,.3); }
.карточка.silver{ border-color:rgba(74,158,255,.3); }
.карточка.gold{ border-color:rgba(251,191,36,.3); }

/* Верх рамки отделён полоской — он читается как шапка блока, а не как
   первая строка списка. */
.шапка-карточки{ flex:0 0 auto; padding-bottom:clamp(8px,1.4vh,14px);
  border-bottom:1px solid var(--край); }
.значок-тарифа{ line-height:0; margin-bottom:8px; color:var(--жёлтый); }
.карточка.free .значок-тарифа{ color:#63dc78; }
.карточка.silver .значок-тарифа{ color:#40c4ff; }
.бирка-тарифа{ font-size:0.7333rem; letter-spacing:.2em; text-transform:uppercase;
  font-weight:700; color:var(--жёлтый); margin-bottom:4px; }
.бирка-тарифа.free{ color:#63dc78; }
.бирка-тарифа.silver{ color:#40c4ff; }

/* Цена — крупное число и срок рядом, без второй коробки внутри рамки. */
.короб-цены{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
.короб-цены .значение{ font-size:clamp(26px,3.6vh,38px); font-weight:800;
  letter-spacing:-.03em; line-height:1.05; }
.короб-цены .за{ color:var(--текст3); font-size:0.8667rem; }

.срок-выбор{ display:inline-flex; gap:4px; padding:3px; margin-top:8px;
  background:var(--поле); border:1px solid var(--край);
  border-radius:var(--радиус-круг); }
.срок-выбор button{ border:none; background:none; cursor:pointer;
  color:var(--текст2); font-size:0.7667rem; font-weight:600;
  padding:5px 12px; border-radius:var(--радиус-круг); white-space:nowrap; }
.срок-выбор button.выбран{ background:var(--край2); color:var(--текст); }
/* «−28%» без слова «экономия»: в узкой рамке оно переносилось и
   разрывало кнопку надвое. */
.срок-выбор .выгода{ color:var(--зелёный); font-size:0.7rem; margin-inline-start:5px;
  white-space:nowrap; }

/* Списки занимают всё, что осталось между ценой и кнопкой. Строки
   поджимаются вместе с высотой окна — у голда их четырнадцать. */
.списки{ display:flex; flex-direction:column; }
.раздел{ font-size:0.6667rem; letter-spacing:.2em; text-transform:uppercase;
  color:var(--текст3); margin:clamp(4px,0.7vh,9px) 0 2px; }
.раздел:first-child{ margin-top:0; }
.строка{ display:flex; align-items:center; gap:8px;
  padding:clamp(2px,0.5vh,5px) 0;
  border-bottom:1px solid rgba(255,255,255,.05);
  font-size:clamp(12px,1.55vh,14px); line-height:1.25; }
.строка:last-child{ border-bottom:none; }
.строка .знак{ width:13px; flex:0 0 13px; line-height:0; color:var(--зелёный); }
.строка.нет{ color:var(--текст3); }
.строка.нет .знак{ color:var(--текст3); }

.низ-карточки{ flex:0 0 auto; }
/* Кнопка — та же, что на титулке (числа из боевой .btn-cta), во всю
   ширину рамки. */
.кн-взять{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  width:100%; padding:clamp(10px,1.5vh,14px) 18px; font-size:0.9333rem;
  font-weight:700; letter-spacing:.3px; white-space:nowrap;
  cursor:pointer; color:#fff; border-radius:24px;
  border:1px solid rgba(0,149,246,.65); background:rgba(0,149,246,.15);
  transition:background .2s, border-color .2s;
}
.кн-взять:hover{ background:rgba(0,149,246,.32);
  border-color:rgba(0,149,246,.95); }
.кн-взять:disabled{ opacity:.5; cursor:default; }
.весть{ min-height:0; font-size:0.8rem; margin-top:6px; }
.весть:empty{ margin-top:0; }
.весть.плохо{ color:var(--красный); }
.весть.ждём{ color:var(--текст3); }
.весть.хорошо{ color:var(--зелёный); }

/* ── ОКНО С ВЫДАННЫМ КЛЮЧОМ ──
   Та же рамка, что на титулке: по содержимому, без пустоты, значки
   «копировать» и «закрыть» в правом верхнем углу. */
/* Ключ показывается НЕ модалкой поверх затемнения, а на том же месте,
   где стояла рамка тарифа: в той же вселенной, с той же шапкой и тем же
   звёздным небом — ровно как на титулке. Затемнять полстраницы ради
   окна, которое и так одно, незачем. */
.подложка{ display:none; justify-content:center; }
.подложка.видно{ display:flex; }
/* Пока показан ключ, рамка тарифа и закладки уходят: на их место встаёт он. */
.тело.ключ-открыт > .карточка,
.тело.ключ-открыт > .закладки{ display:none; }

.спрятано{ display:none; }

/* Низкое окно: строк у голда четырнадцать, и в рамке 9:16 при высоте
   окна меньше 760 точек они не помещаются обычным шагом. Ужимаем
   промежутки и поля строк — размер букв при этом считается от высоты
   окна и так уже уменьшился. */
@media (max-height:760px){
  .карточка{ gap:6px; padding:14px 16px; }
  .строка{ padding:1px 0; }
  .раздел{ margin:4px 0 1px; }
  .срок-выбор{ margin-top:5px; }
  .срок-выбор button{ padding:4px 10px; }
}

/* На телефоне рамка 9:16 шире экрана не бывает: там ширину задаёт
   экран, а высота считается из неё. */
@media (max-width:560px){
  .карточка{ height:auto; width:100%; max-width:420px; aspect-ratio:auto;
    padding:18px; }
  .закладки{ flex-wrap:wrap; }
  .закладки button{ padding:8px 16px; font-size:0.8667rem; }
  .тело{ justify-content:flex-start; }
}
</style>
</head>
<body class="в-раме">
<div class="рама">
<canvas id="небо"></canvas>

<div class="рама-прокрутка">

<div class="лист">

  <div class="шапка">
    <!-- Куб с названием — ссылка на главную, как было. Кнопка «Назад»
         переехала внутрь рамки тарифа. -->
    <button class="знак" id="кн-знак">
      <canvas id="знак-куб" width="36" height="36"></canvas>
      <div class="слово">Cube<span>World</span></div>
    </button>
    <div class="язык">
      <button class="язык-кнопка" id="язык-кнопка">
        <span id="язык-код">RU</span>
        <span class="уголок зн" data-знак="стрелка" data-размер="12"></span>
      </button>
      <div class="язык-список" id="язык-список"></div>
    </div>
  </div>

  <div class="тело">

    <!-- ВСЁ В ОДНОЙ РАМКЕ 9:16: бирка, цена, срок, оба списка и кнопка.
         Прежде рамка держала только цену с кнопкой, а списки стояли
         снаружи — рамка получалась ради кнопок, а не ради тарифа. -->
    <div class="карточка" id="карточка">
      <!-- «Назад» — одна наша стрелка в правом верхнем углу рамки.
           Слово убрано: стрелка в углу понятна и не отнимает строку. -->
      <button class="назад" id="кн-домой">
        <span class="зн" data-знак="стрелка" data-размер="17"></span>
      </button>

      <div class="шапка-карточки">
        <!-- Значок тарифа — тот же, что на карточке титулки: ключик,
             алмаз, медаль. Красится в цвет тарифа, как и бирка. -->
        <div class="значок-тарифа" id="значок-тарифа"></div>
        <div class="бирка-тарифа" id="бирка"></div>
        <div class="короб-цены">
          <div class="значение" id="цена">-</div>
          <div class="за" id="за-срок"></div>
        </div>
        <div id="срок-выбор-место"></div>
      </div>

      <div class="списки">
        <!-- Показываем только то, что входит. Список «не входит» убран:
             человеку нужен ответ «что я получу», а не перечень того,
             чего не получит, — и рамка стала вдвое ниже. -->
        <div class="раздел" id="раздел-входит" data-сл="tin"></div>
        <div class="список" id="входит"></div>
      </div>

      <div class="низ-карточки">
        <button class="кн-взять" id="кн-взять"></button>
        <div class="весть" id="весть"></div>
      </div>
    </div>

    <!-- Переключатель тарифов стоит под рамкой: сначала смотрят, что
         внутри, потом переходят к соседнему. -->
    <div class="закладки" id="закладки"></div>

    <!-- ─────────────────────── окно выданного ключа ─────────────────────
         Тот же вид, что на титулке: бирка, заголовок, черта, сам ключ и
         кнопка входа. Два значка в правом верхнем углу — копировать и
         закрыть. Строки «Этот ключ — ваша анонимная личность» и жёлтого
         предупреждения здесь нет: первая повторяла заголовок, вторая
         занимала треть окна. -->
    <!-- Окно выданного ключа строит shared/ключ-окно.js — то же самое,
         что на титулке. Здесь только место, куда его поставить. -->
    <div class="подложка" id="подложка"></div>

  </div>
</div>

</div>
</div>

<script>
'use strict';

var $ = function (и) { return document.getElementById(и); };

/* Значки в разметке — наши линии из shared/icons.js, как на титулке. */
CW.расставитьЗначки(document);

/* Куб у надписи и звёздное небо — общие, из shared/небо.js. */
CW.кубНадписи($('знак-куб'));

CW.небо($('небо'));

/* ═══════════════════════════════════════════════════════════════════════
   ЧТО ПОКАЗЫВАЕМ.
   Какой тариф и какой язык — из адреса: tariff.html?p=silver&lang=ru
   ═══════════════════════════════════════════════════════════════════════ */
var ДОВОДЫ = new URLSearchParams(location.search);

var ТАРИФ = (ДОВОДЫ.get('p') || ДОВОДЫ.get('план') || 'free').toLowerCase();
if (['free', 'silver', 'gold'].indexOf(ТАРИФ) < 0) ТАРИФ = 'free';

if (ДОВОДЫ.get('lang')) CW.язык(ДОВОДЫ.get('lang'));

var ПЛАНЫ = null;        /* придут с сервера */
var ПОРЯДОК = ['free', 'silver', 'gold'];
var СРОК = 'месяц';      /* или «год» */

/* Из чего состоит тариф. Слева — поле в ответе сервера, справа — ключ
   в словаре. null означает «есть у всех и всегда». */
var ЧЕРТЫ = [
  { поле: null,           слово: 'tcubes',     счёт: 'cubes' },
  { поле: null,           слово: 'fgames'     },
  { поле: null,           слово: 'fmap'       },
  { поле: null,           слово: 'ffeed'      },
  /* У платных тарифов строка читается «Маркетплейс продавец»:
     слово для них лежит отдельно, в «словоПлатно». */
  { поле: null,           слово: 'fmarket',   словоПлатно: 'fmarketsell',
    счётПлатно: 'listings_month' },
  { поле: null,           слово: 'fwallet'    },
  { поле: 'streams',      слово: 'fstream'    },
  { поле: 'music',        слово: 'fmusic'     },
  { поле: 'signals',      слово: 'fsignal'    },
  { поле: 'analytics',    слово: 'fanalytics' },
  { поле: 'files',        слово: 'ffiles'     },
  /* Чаевые и подарки: отправлять их — платная полка. Получать может
     любой, в том числе на ВИПе, и это написано в документах. */
  { поле: 'tips',         слово: 'ftips'      },
  /* Майнинг стоит у ВСЕХ, а не только у Голда.
     На карточке он висел в платной части, но в программе его никто не
     закрывает: полоса в «Заработать» считает минуты в сети любому. Платной
     остаётся доля в фонде наград — её и проверяет сервер. Обещание на
     карточке должно совпадать с тем, что делает код. */
  { поле: null,           слово: 'fmining'    },
  /* «Рейтинг» убран с карточки: за ним в программе не стояло ничего, а
     обещание в оплаченном тарифе должно что-то значить. Вернём строку,
     когда возможность будет написана. */
  { поле: 'space',        слово: 'fspace',    счёт: 'gb',   хвост: 'ГБ' },
  { поле: 'signals',      слово: 'fsigmonth', счёт: 'signals_month' }
];

/* Язык — общий выбор из shared/lang.js: тот же список, та же кнопка,
   что на титулке. Здесь только сказано, что перерисовать после смены. */
CW.выборЯзыка.подключить({
  /* Это имена узлов в разметке, а не фразы: через Т() их
     пропускать нельзя — перевод сломал бы поиск узла. */
  кнопка: 'язык-кнопка', список: 'язык-список', код: 'язык-код',
  после: function () { нарисоватьВсё(); CW.ключОкно.обновить(); }
});


/* ═══════════════════════════════════════════════════════════════════════
   ОТРИСОВКА. Одно место, которое строит страницу. Другого нет.
   ═══════════════════════════════════════════════════════════════════════ */
function нарисоватьВсё() {
  /* Код языка в кнопке, lang и направление письма ставит shared/lang.js —
     это свойства языка, а не этой страницы. */
  CW.выборЯзыка.обновить();
  CW.перевести(document);
  закладки();
  заглавие();
  цена();
  черты();
  кнопка();
}

function бирочноеСлово(имя) {
  return CW.сл({ free: 't1b', silver: 't2b', gold: 't3b' }[имя]);
}
function имяТарифа(имя) {
  return CW.сл({ free: 't1t', silver: 't2t', gold: 't3t' }[имя]);
}

function закладки() {
  var где = $('закладки');
  где.innerHTML = '';
  ПОРЯДОК.forEach(function (имя) {
    var б = document.createElement('button');
    б.textContent = имяТарифа(имя);
    /* Имя тарифа классом — по нему закладка и красится своим цветом. */
    б.className = имя + (имя === ТАРИФ ? ' выбран' : '');
    б.onclick = function () {
      ТАРИФ = имя;
      /* Адрес меняем без перезагрузки: вернуться назад кнопкой браузера
         всё равно можно. */
      history.replaceState(null, '', 'tariff.html?p=' + имя);
      нарисоватьВсё();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };
    где.appendChild(б);
  });
}

function заглавие() {
  var б = $('бирка');
  б.textContent = бирочноеСлово(ТАРИФ);
  б.className = 'бирка-тарифа ' + ТАРИФ;
  /* Имя тарифа крупным заголовком убрано — оно повторяло бирку. Там,
     где оно всё-таки нужно одному человеку, в заголовке окна, оно
     осталось. Рамка карточки красится по тарифу. */
  $('карточка').className = 'карточка ' + ТАРИФ;
  $('значок-тарифа').innerHTML = CW.значок(
    { free: 'ключик', silver: 'алмаз', gold: 'медаль' }[ТАРИФ], 24);
  document.title = имяТарифа(ТАРИФ) + ' · CubeWorld';
}

function цена() {
  var место = $('срок-выбор-место');
  место.innerHTML = '';

  if (!ПЛАНЫ || !ПЛАНЫ[ТАРИФ]) {
    $('цена').textContent = '-';
    $('за-срок').textContent = '';
    return;
  }

  var п = ПЛАНЫ[ТАРИФ];

  /* Бесплатный: ни выбора срока, ни суммы. */
  if (!п.month) {
    $('цена').textContent = CW.сл('tfr');
    $('за-срок').textContent = '';
    return;
  }

  /* Платный: месяц или год. Выгоду считаем, а не пишем руками. */
  if (п.year) {
    var коробка = document.createElement('div');
    коробка.className = 'срок-выбор';

    [['месяц', 'tpm'], ['год', 'tpy']].forEach(function (пара) {
      var б = document.createElement('button');
      б.textContent = CW.сл(пара[1]);
      if (пара[0] === СРОК) б.className = 'выбран';

      if (пара[0] === 'год') {
        /* Выгода считается по тем же числам, что показаны: по CUBE.
           Иначе на карточке стояло бы «120 CUBE вместо 168», а процент
           был бы посчитан от долларов — и он бы с ними не сходился. */
        var полныйГод = п.month_cube * 12;
        var выгода = Math.round((1 - п.year_cube / полныйГод) * 100);
        if (выгода > 0) {
          var в = document.createElement('span');
          в.className = 'выгода';
          /* Только «−28%»: слово «экономия» рядом ломало кнопку на две
             строки в узкой карточке, а знак минус и так всё говорит. */
          в.textContent = '−' + выгода + '%';
          б.appendChild(в);
        }
      }

      б.onclick = function () { СРОК = пара[0]; цена(); };
      коробка.appendChild(б);
    });
    место.appendChild(коробка);
  }

  /* Цена говорится в CUBE, а не в долларах. Доллар остался внутренней
     величиной площадки: по нему выставляется счёт платёжного провайдера
     и считается выгода года. На витрине его нет — там одна валюта,
     своя, и человеку не приходится держать в голове две. */
  var сумма = (СРОК === 'год' && п.year_cube) ? п.year_cube : п.month_cube;
  $('цена').textContent = сумма + ' CUBE';
  $('за-срок').textContent = CW.сл(СРОК === 'год' ? 'tyr' : 'tmo');
}

function черты() {
  var да = $('входит');
  да.innerHTML = '';

  if (!ПЛАНЫ || !ПЛАНЫ[ТАРИФ]) return;
  var п = ПЛАНЫ[ТАРИФ];

  ЧЕРТЫ.forEach(function (ч) {
    var есть = (ч.поле === null) ? true : !!п[ч.поле];
    if (!есть) return;          /* чего нет в тарифе — того и не рисуем */

    /* Платный тариф может называть ту же черту иначе — например
       «Маркетплейс продавец» вместо просто «Маркетплейс». Платным
       считаем тот, у кого есть цена за месяц. */
    var текст = CW.сл((ч.словоПлатно && п.month) ? ч.словоПлатно : ч.слово);
    /* «счётПлатно» — число, которое имеет смысл только у платного:
       на бесплатном вышло бы «Marketplace: 0», а ноль объявлений — это
       не свойство строки, это её отсутствие. */
    var счёт = (ч.счётПлатно && п.month) ? ч.счётПлатно : ч.счёт;
    if (счёт && п[счёт] != null) {
      текст += ': ' + п[счёт] + (ч.хвост ? ' ' + CW.сл('tgb') : '');
    }

    var с = document.createElement('div');
    с.className = 'строка да';
    /* Галочка и крестик — наши линии, а не знаки из шрифта: в разных
       системах ✓ и ✕ рисуются по-разному и разной толщиной. */
    с.innerHTML = '<span class="знак">' + CW.значок('галка', 14) + '</span>'
                + '<span>' + CW.безопасно(текст) + '</span>';
    да.appendChild(с);
  });

  /* Если тариф вдруг не даст ничего, заголовок «Входит» тоже прячем —
     заголовок над пустотой хуже, чем его отсутствие. */
  $('раздел-входит').style.display = да.children.length ? '' : 'none';
}

function кнопка() {
  var б = $('кн-взять');
  б.textContent = CW.сл(ТАРИФ === 'free' ? 'gk' : 'tget');
  б.disabled = false;
  весть('весть', '');
}

function весть(куда, текст, вид) {
  var в = $(куда);
  в.textContent = текст || '';
  в.className = 'весть' + (вид ? ' ' + вид : '');
}

/* ═══════════════════════════════════════════════════════════════════════
   ТАРИФЫ: СВОЯ ТАБЛИЦА И ТАБЛИЦА С СЕРВЕРА

   Витрина не должна ждать выкладки сервера. Пока на Render лежит старый
   database.py, он отвечает по-старому: десять кубов у Сильвера, ни
   музыки, ни создания файлов. Страница показывала это и выглядела
   враньём, хотя в коде всё уже исправлено.

   Поэтому здесь лежит своя таблица — ровно та же, что в ТАРИФЫ на
   сервере. Ответ сервера принимаем целиком только если он НОВЫЙ: это
   видно по полю music, которого у старого нет. Старый ответ берём лишь
   ради цен и порядка, а числа и черты показываем свои. Выложишь сервер —
   и он снова главный, менять тут ничего не придётся.
   ═══════════════════════════════════════════════════════════════════════ */
var СВОИ_ПЛАНЫ = {
  free:   { cubes: 3,  month: 0,     year: 0,
            streams:false, music:false, files:false, mining:false,
            rating:false, space:false, signals:false, analytics:false },
  silver: { cubes: 11, month: 6.99,  year: 59.99,
            streams:true,  music:true,  files:false, mining:false,
            rating:false, space:false, signals:true,  analytics:true },
  gold:   { cubes: 33, month: 14.99, year: 125.99,
            streams:true,  music:true,  files:true,  mining:true,
            rating:true,  space:true,  signals:true,  analytics:true }
};
ПЛАНЫ = СВОИ_ПЛАНЫ;

CW.спросить('/plans', { тихо: true, сроком: 14000 }).then(function (д) {
  if (!д || !д.plans) return;
  var новый = д.plans.silver && ('music' in д.plans.silver);
  if (новый) {
    ПЛАНЫ = д.plans;
  } else {
    /* Старый сервер: цены у него живые, их и берём, остальное своё. */
    Object.keys(СВОИ_ПЛАНЫ).forEach(function (имя) {
      var с = д.plans[имя];
      if (!с) return;
      if (typeof с.month === 'number') СВОИ_ПЛАНЫ[имя].month = с.month;
      if (typeof с.year  === 'number') СВОИ_ПЛАНЫ[имя].year  = с.year;
    });
  }
  if (Array.isArray(д.order) && д.order.length) ПОРЯДОК = д.order;
  нарисоватьВсё();
}).catch(function () {
  /* Сети нет — рисуем по своей таблице, без красной вести на весь экран. */
  нарисоватьВсё();
});

/* ═══════════════════════════════════════════════════════════════════════
   ВХОД. Бесплатный тариф доводит до конца прямо здесь: заводим ключ,
   показываем один раз и пускаем в мир.
   ═══════════════════════════════════════════════════════════════════════ */
$('кн-взять').onclick = function () {
  /* Уже вошли — незачем заводить второй ключ. */
  if (CW.вошли()) { CW.уйти('world.html'); return; }

  if (ТАРИФ !== 'free') {
    /* Платные тарифы сервер пока не требует (enforce = false), и
       платёж здесь не изображаем. Говорим как есть. */
    весть('весть', CW.сл('mSoon'), 'ждём');
    return;
  }

  завести();
};

/* ── ОКНО КЛЮЧА ──
   Само окно — общее, из shared/ключ-окно.js: та же рамка, что на
   титулке. Страница даёт ему место (.подложка) и говорит, что делать
   по стрелке «Назад»: вернуть карточку тарифа. */
CW.ключОкно.собрать($('подложка'), { назад: закрытьКлюч });

function завести() {
  $('подложка').classList.add('видно');
  document.querySelector('.тело').classList.add('ключ-открыт');
  CW.ключОкно.завести();
}

function закрытьКлюч() {
  $('подложка').classList.remove('видно');
  document.querySelector('.тело').classList.remove('ключ-открыт');
}

/* ── ЩЕЛЧОК МИМО РАМКИ ──
   Нажали рядом с рамкой тарифа, по пустому небу — уходим на главную,
   как по стрелке в углу. Внутри рамки, по закладкам и по шапке щелчок
   ничего не делает: это свои кнопки.

   Пока показан выданный ключ, правило выключено нарочно. Ключ виден один
   раз и восстановлению не подлежит; закрыть его случайным промахом мимо
   окна — значит потерять аккаунт. Его закрывает только стрелка. */
document.addEventListener('click', function (е) {
  if ($('подложка').classList.contains('видно')) return;
  var ц = е.target;
  if (ц.closest && (ц.closest('.карточка') || ц.closest('.закладки')
                 || ц.closest('.шапка'))) return;
  CW.уйти('index.html');
}, true);   /* перехват, а не всплытие: см. ниже */

/* true в конце — это ЛОВЛЯ (capture), и без неё правило ломалось на
   закладках. Нажатие по закладке перерисовывает весь ряд: кнопку, по
   которой нажали, удаляют из страницы прямо в её же обработчике. Пока
   событие всплывало до документа, этой кнопки уже не существовало,
   closest('.закладки') ничего не находил — и щелчок по закладке уводил
   на главную. В ловле мы смотрим на кнопку раньше, чем её успевают
   убрать. */

$('кн-знак').onclick  = function () { CW.уйти('index.html'); };
$('кн-домой').onclick = function () { CW.уйти('index.html'); };
/* Отдельной кнопки «Все тарифы» больше нет: три закладки наверху и
   есть все тарифы, а вторая дорога к ним — лишняя строка на экране. */

нарисоватьВсё();
</script>
</body>
</html>
